# ===========================================================================
# behavior.yml
# oculus's own configuration, its thresholds and horizons: the soft limits an audit warns on, how long before a feed counts as stale, how far ahead each kind of date is shown, and the two subsystem cadences. The source roots and the editor language of each file extension live in sources.yml. Merged by loadConfig().
# ===========================================================================


# Manifest readability soft-limits (chars) for the audit warnings.
read_limits: { status.line: 220, next: 300, latest: 200, eli5: 360, results: 300 }


# The session detail meter measures the last turn against this token window unless the transcript names one.
context_window: 1000000

# Labels for subscription tier identifiers reported by supported command-line agents.
usage_tiers:
  default_claude_max_20x: "Max 20x"
  default_claude_max_5x: "Max 5x"
  default_claude_pro: "Pro"
  prolite: "Plus"

# Hidden usage sessions refresh each account's cached figures on this cadence and model.
usage_refresh_min: 10
usage_refresh_model: "haiku"

# Domains expected to have a dataset. Oculus reports projects in these domains without a Data section.
data_domains: [heart, liver, liverfl, liversurv, immune, brain, brainbci]


# Collection-entry statuses that wait on someone else, so the audit asks for a date to track them by.
waiting_status: [submitted, pending, under review, under-review]


# Audit findings the reader has parked. Each entry is a finding's signature, the twelve hex characters the Audit view's mute control writes here; the finding stays true and is drawn in the muted section.
audit_ignore: []


# A manifest is stale when its `updated` date trails the newest project content by this many days.
stale_lag_days: 1


# The Focus refresh strip prompts for live feeds older than these numbers of days. A feed not listed here is never prompted for.
refresh_stale_days:
  litwatch: 14  # /research-cockpit litwatch (meta.last_run in literature-radar.yml)
  inbox: 2  # /research-cockpit inbox (the triage notes under `mail_dir`)
  scout: 7  # /research-cockpit scout (newest meta.log date in position-leads.yml)


# Look-ahead windows for each deadline class on the Focus strip.
deadline_horizon_days: 90  # your project-manifest `deadline:` + talks / teaching (default 90)

leads_horizon_days: 21  # academic-position-lead deadlines from position-leads.yml (default 21)

conf_horizon_months: 1  # venues.yml conference deadlines, in whole months ahead (default 1 = this/next)

leads_badge_days: 14         # amber count badge on Position Leads, leads due within N days (default 14)


venue_conc_warn: 4  # "venue load" Focus nudge when >= N in-flight papers target one venue

linkedin_cadence_days: 30   # nudge/red badge when it's been longer than this since the last post


# === Per-project file finder ================================================
# Project cards index the newest matching files up to `max_per_project`; `enabled: false` disables it.
file_index:
  enabled: true
  max_per_project: 400
  ext: [".pdf", ".tex", ".bib", ".md", ".yml", ".yaml", ".py", ".sh", ".slurm", ".ipynb",
        ".csv", ".json", ".png", ".jpg", ".svg", ".txt", ".docx", ".xlsx", ".pptx"]


# === Served mode: live SLURM poller and in-page chat =========================
# Live HPC polling cadences are minutes. `prewarm: false` defers finished-job log resolution.
# `resource` is the key of a cluster entry of registries/resources.yml, whose `host` is the ssh alias the poller uses.
slurm:
  resource: utwente
  days: 3
  poll_min: 20
  quota_min: 60
  prewarm: true

# The Processes view lists the local processes whose program is one of these names, beside oculus's own terminals.
processes:
  patterns: [python3, codex, claude, node, latexmk]

chat:
  model: "opus"

# The read-only calendar connector: the poll cadence in minutes and the calendar window in days.
calendar:
  poll_min: 15
  days_back: 31
  days_ahead: 62


# === Mail connector =========================================================
# How often the inbox plate is read, and how many threads each of the three plate signals is read.
mail:
  poll_min: 10
  per_signal: 25


# === Hook push notifications ================================================
# Hook event names that trigger macOS notifications and their per-session repeat interval.
notify:
  enabled: true
  events: [permission_prompt, idle_prompt, stop]
  quiet_seconds: 3


# === The source editor ======================================================
# The editor colours a file by running its grammar over the text in the page as it is typed, so a file larger than this many kilobytes opens as plaintext instead; the read-only code window, painted once, colours every size.
# The other keys are VS Code's editor settings of the same names (editor.tabSize, editor.insertSpaces, editor.wordWrap, editor.minimap.enabled, editor.renderWhitespace, editor.stickyScroll.enabled); languages holds the records VS Code's per-language settings give, by the editor's language name, and a repository's .oculus/settings.yml overrides them for its files.
editor:
  paint_limit_kb: 20480
  tab_size: 4
  insert_spaces: true
  word_wrap: 'off'
  minimap: true
  render_whitespace: selection
  sticky_scroll: true
  languages:
    makefile: { insert_spaces: false }
    markdown: { word_wrap: 'on' }
    yaml: { tab_size: 2 }


# === LaTeX ==================================================================
# What saving a .tex file does: on_save builds the main file the saved file belongs to, without showing the build; never does not build. Any other value counts as on_save.
# formatter is the program Format Document runs on a .tex file: none, latexindent, tex-fmt or badness. Each *_path names where that program is; empty finds it on PATH.
latex:
  auto_build: on_save
  formatter: none
  latexindent_path: ''
  tex_fmt_path: ''
  badness_path: ''


# === Writes =================================================================
# How long a save waits for the server's answer before it is given up and its form says so, in seconds.
writes:
  timeout_seconds: 30


# === Scratch notes ==========================================================
# How long a note waits after the last keystroke before it is written, in milliseconds.
notes:
  autosave_ms: 800


# === The change log =========================================================
# Every write that changed something is recorded in ~/.oculus/changes.jsonl, or wherever local.yml's `changes` key puts it. `keep` is how many changes the file holds; it is rewritten down to that number once it has grown past twice it.
changes:
  keep: 500


# === The Files view =========================================================
# Whether moving a file or folder to the Trash asks first, as VS Code's explorer.confirmDelete. A permanent delete always asks. The question's "Do not ask me again" box writes false here.
files:
  confirm_delete: true


# === The git panel ==========================================================
# The Changes view asks this model for a suggested commit message. Empty uses the command-line default.
# The minutes between two automatic fetches of every repository with a remote, 0 for none.
git:
  message_model: ""
  autofetch_minutes: 0


# === Search across files ====================================================
# The Search view runs ripgrep over one served root or all of them. `max_hits` is how many hits one answer carries before it says it was cut; `timeout_s` is how long one root's search is given.
search:
  max_hits: 500
  timeout_s: 10

# === Literature search ======================================================
# The Literature search view asks every source toggled on for one page of hits. `timeout_s` is how many seconds one source is given; `per_source` is how many hits one page asks of each source; `cache_min` is how many minutes an answer is kept for the same request, 0 for none.
literature:
  timeout_s: 20
  per_source: 25
  cache_min: 30

# === Open in its program ====================================================
# Each extension a file may carry to be handed to a program on this machine, with the bundle id of the one application it opens in. A file of any other extension, and a listed file with an execute bit or marked as a Finder alias, is refused; a folder is shown in Finder rather than opened. Read again at every request.
open:
  program_ext:
    ".docx": com.microsoft.Word
    ".doc": com.microsoft.Word
    ".xlsx": com.microsoft.Excel
    ".xls": com.microsoft.Excel
    ".pptx": com.microsoft.Powerpoint
    ".ppt": com.microsoft.Powerpoint
    ".rtf": com.apple.TextEdit
    ".pages": com.apple.iWork.Pages
    ".numbers": com.apple.iWork.Numbers
    ".key": com.apple.iWork.Keynote


# === Apps ===================================================================
# An app is a folder of web files that oculus finds while it runs and draws in a sandboxed frame once the reader has approved it (DESIGN.md, "Apps added while oculus runs"). These are the limits an app's frame is held to and the folders `open` never reaches for an app.
apps:
  # Seconds a frame is given to complete the bridge handshake before it is drawn as failed to load.
  connect_timeout_s: 10
  # Kilobytes of one tab's saved state that `setState` accepts.
  state_max_kb: 64
  # Kilobytes of an app's store that `setStore` accepts and `getStore` reads.
  store_max_kb: 256
  # Writes, `setStore` included, that pass per frame per minute.
  writes_per_min: 30
  # Calls of `open` that pass per frame per minute.
  opens_per_min: 30
  # Key events per second the page takes from a frame.
  keys_per_s: 20
  # Files an app's folder may hold.
  max_files: 500
  # Megabytes an app's files may total.
  max_mb: 20
  # Folders, each relative to a root and applied to every root, that `open({ file })` never reaches for an app, compared by segment and without regard to letter case. A key that is missing or is not a list of folder paths closes every file.
  closed_paths: [secrets]
