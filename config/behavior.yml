# ===========================================================================
# behavior.yml
# oculus's own configuration, its thresholds and horizons: the soft limits an audit warns on, how long before a feed counts as stale, how far ahead each kind of date is shown, and the two subsystem cadences. Source roots and permitted file extensions live in sources.yml. Merged by loadConfig().
# ===========================================================================


# Manifest readability soft-limits (chars) for the audit warnings.
read_limits: { status.line: 220, next: 300, latest: 200, eli5: 360, results: 300 }


# Hand-triggered feed staleness nudges (days).
stale_days: { litwatch: 14, inbox: 10, scout: 7, audit: 7 }


# The session detail meter measures the last turn against this token window unless the transcript names one.
context_window: 1000000

# Labels for subscription tier identifiers reported by supported command-line agents.
usage_tiers:
  default_claude_max_20x: "Max 20x"
  default_claude_max_5x: "Max 5x"
  default_claude_pro: "Pro"
  prolite: "Plus"

# Hidden usage sessions refresh each account's cached figures on this cadence and model.
usage_refresh_min: 10
usage_refresh_model: "haiku"

# Domains expected to have a dataset. Oculus reports projects in these domains without a Data section.
data_domains: [heart, liver, liverfl, liversurv, immune, brain, brainbci]


# Collection-entry statuses that wait on someone else, so the audit asks for a date to track them by.
waiting_status: [submitted, pending, under review, under-review]


# Audit findings the reader has parked. Each entry is a finding's signature, the twelve hex characters the Audit view's mute control writes here; the finding stays true and is drawn in the muted section.
audit_ignore: []


# A manifest is stale when its `updated` date trails the newest project content by this many days.
stale_lag_days: 1


# The Focus refresh strip prompts for live feeds older than these numbers of days.
refresh_stale_days:
  litwatch: 14  # /research-cockpit litwatch (meta.last_run in literature-radar.yml)
  inbox: 2  # /research-cockpit inbox (the triage notes under `mail_dir`)
  scout: 7  # /research-cockpit scout (newest meta.log date in position-leads.yml)


# Look-ahead windows for each deadline class on the Focus strip.
deadline_horizon_days: 90  # your project-manifest `deadline:` + talks / teaching (default 90)

leads_horizon_days: 21  # academic-position-lead deadlines from position-leads.yml (default 21)

conf_horizon_months: 1  # venues.yml conference deadlines, in whole months ahead (default 1 = this/next)

leads_badge_days: 14         # amber count badge on Position Leads, leads due within N days (default 14)


venue_conc_warn: 4  # "venue load" Focus nudge when >= N in-flight papers target one venue

linkedin_cadence_days: 30   # nudge/red badge when it's been longer than this since the last post


# === Per-project file finder ================================================
# Project cards index the newest matching files up to `max_per_project`; `enabled: false` disables it.
file_index:
  enabled: true
  max_per_project: 400
  ext: [".pdf", ".tex", ".bib", ".md", ".yml", ".yaml", ".py", ".sh", ".slurm", ".ipynb",
        ".csv", ".json", ".png", ".jpg", ".svg", ".txt", ".docx", ".xlsx", ".pptx"]


# === Served mode: live SLURM poller and in-page chat =========================
# Live HPC polling cadences are minutes. `prewarm: false` defers finished-job log resolution.
slurm:
  host: utwente
  days: 3
  poll_min: 20
  quota_min: 60
  prewarm: true

chat:
  model: "opus"

tasks:
  # The four update tasks start as ordinary Claude sessions, so a permission prompt is answered by the reader in the terminal pane. `true` starts them with --dangerously-skip-permissions instead, which runs them unattended; the update tray then asks for a confirmation before each task.
  skip_permissions: false

# The read-only calendar connector: the poll cadence in minutes and the agenda window in days.
calendar:
  poll_min: 15
  days_back: 1
  days_ahead: 14


# === Mail connector =========================================================
# How often the inbox plate is read, and how many threads each of the three plate signals is read.
mail:
  poll_min: 10
  per_signal: 25


# === Hook push notifications ================================================
# Hook event names that trigger macOS notifications and their per-session repeat interval.
notify:
  enabled: true
  events: [permission_prompt, idle_prompt, stop]
  quiet_seconds: 3


# === The source editor ======================================================
# The editor's mirror is painted again on every keystroke, so a file larger than this many kilobytes is written over plain escaped text instead; the read-only code window, painted once, colours every size.
editor:
  paint_limit_kb: 64


# === Writes =================================================================
# How long a save waits for the server's answer before it is given up and its form says so, in seconds.
writes:
  timeout_seconds: 30


# === Scratch notes ==========================================================
# How long a note waits after the last keystroke before it is written, in milliseconds.
notes:
  autosave_ms: 800


# === The change log =========================================================
# Every write that changed something is recorded in ~/.oculus/changes.jsonl, or wherever local.yml's `changes` key puts it. `keep` is how many changes the file holds; it is rewritten down to that number once it has grown past twice it.
changes:
  keep: 500


# === The git panel ==========================================================
# The Changes view asks this model for a suggested commit message. Empty uses the command-line default.
git:
  message_model: ""


# === Search across files ====================================================
# The Search view runs ripgrep over one served root or all of them. `max_hits` is how many hits one answer carries before it says it was cut; `timeout_s` is how long one root's search is given.
search:
  max_hits: 500
  timeout_s: 10

# === Open in its program ====================================================
# Each extension a file may carry to be handed to a program on this machine, with the bundle id of the one application it opens in. A file of any other extension, and a listed file with an execute bit or marked as a Finder alias, is refused; a folder is shown in Finder rather than opened. Read again at every request.
open:
  program_ext:
    ".docx": com.microsoft.Word
    ".doc": com.microsoft.Word
    ".xlsx": com.microsoft.Excel
    ".xls": com.microsoft.Excel
    ".pptx": com.microsoft.Powerpoint
    ".ppt": com.microsoft.Powerpoint
    ".rtf": com.apple.TextEdit
    ".pages": com.apple.iWork.Pages
    ".numbers": com.apple.iWork.Numbers
    ".key": com.apple.iWork.Keynote
