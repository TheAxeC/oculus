# ===========================================================================
# manifest-schema.yml
# oculus's own configuration - the project.yml edit form as data: which fields there are, what each
# one is called, which widget edits it, which section it sits in, and where a widget's choices come
# from. Merged with the other config/*.yml by loadConfig(); `manifest_schema` is its top-level key.
# ===========================================================================


# The form. `sections:` names the seven groups, in the order they are drawn; a field's `section:` is
# one of those names. `type:` is the widget:
#   readonly  shown, never written (id and tier are the folder's; `type` is the tier's on a flat scan
#             rule, and the write refuses all three)
#   text      one line | textarea several lines | lines one list item per line
#   select    one of a list | chips several of a list, with a filter | tags several free strings
#   date      an ISO date | checkbox a flag | keymap a map the form does not write
# `from:` names where the choices come from: a registry (venues, programs, funding, datasets,
# domains), the `collaborations` collection, `projects`, or a vocabulary key of vocab.yml
# (type_order, status_legend, focus_lanes, priority_levels). `options:` is a literal list instead.
manifest_schema:
  sections:
    Core: Core
    Content: Content
    Connections: Connections
    Dates: Dates
    "Deposit & compute": "Deposit & compute"
    "Archive (archive tier)": "Archive (archive tier)"
    "Overrides (rare)": "Overrides (rare)"
  fields:
    id:            { label: "id", type: readonly, section: Core, help: "the folder name - rename = a folder move, not a form edit" }
    tier:          { label: "Tier", type: readonly, section: Core, help: "projects / software / archive / coauthor - set by the folder it lives in (a move, not a form edit)" }
    type:          { label: "Type / outcome", type: select, from: type_order, section: Core, help: "archive/coauthor: the outcome (published, nogo, dropped, ...); projects: the folder tier (active/manuscript/idea); software: software - don't change it here" }
    short:         { label: "Short handle", type: text, section: Core }
    title:         { label: "Title", type: text, section: Core }
    lead:          { label: "Lead (first author)", type: text, section: Core }
    authors:       { label: "Authors", type: tags, section: Core, help: "full list (free text - people, not a registry)" }
    "status.chips": { label: "Status chips", type: chips, from: status_legend, section: Core }
    "status.line": { label: "Status line", type: text, section: Core, help: "the short human glance (not a narrative)" }
    focus:         { label: "Focus lane", type: select, from: focus_lanes, section: Core }
    priority:      { label: "Priority", type: select, from: priority_levels, section: Core, help: "optional per-card flame badge (High/Med/Low); a glance marker, does not reorder cards" }
    pin:           { label: "Pin to top", type: checkbox, section: Core, help: "float this project to the top of its board tab (Projects / Archive / Coauthor); does not override facet/search filters" }
    venue_id:      { label: "Venue", type: select, from: venues, section: Core }
    year:          { label: "Year", type: text, section: Core }
    eli5:          { label: "ELI5", type: textarea, section: Content }
    next:          { label: "Next", type: textarea, section: Content }
    latest:        { label: "Latest", type: textarea, section: Content }
    results:       { label: "Results", type: lines, section: Content, help: "one claimable headline per line - NO nulls" }
    ideas:         { label: "Ideas", type: lines, section: Content, help: "one avenue per line" }
    domain:        { label: "Domain", type: select, from: domains, section: Connections }
    program:       { label: "Research lines", type: chips, from: programs, section: Connections, help: "programs.yml keys" }
    funding:       { label: "Funding", type: chips, from: funding, section: Connections, help: "funding.yml keys (multiple allowed)" }
    collaborators: { label: "Collaborators", type: chips, from: collaborations, section: Connections, help: "collaborations.yml keys (multiple allowed)" }
    "waiting-on":  { label: "Waiting on", type: tags, section: Connections, help: "collaborations.yml keys or project ids" }
    related:       { label: "Related projects", type: chips, from: projects, section: Connections, help: "project ids" }
    datasets:      { label: "Datasets", type: chips, from: datasets, section: Connections, help: "data.yml keys" }
    deadline:      { label: "Deadline", type: date, section: Dates }
    "followup.do": { label: "Follow-up: do", type: textarea, section: Dates, help: "a standing 'do this later' note" }
    "followup.after": { label: "Follow-up: not until", type: date, section: Dates, help: "optional - hide the note until this date passes" }
    snooze:        { label: "Snooze until", type: date, section: Dates, help: "hide its date from the ticker; clear to un-snooze" }
    "code_availability.status": { label: "Code deposit", type: select, options: [none, review-anon, deposited], section: "Deposit & compute" }
    "code_availability.date": { label: "Deposit date", type: date, section: "Deposit & compute", help: "when the code was deposited (auto-stamped by deposit.py --create)" }
    "code_availability.url": { label: "Deposit URL", type: text, section: "Deposit & compute" }
    "code_availability.doi": { label: "Deposit DOI", type: text, section: "Deposit & compute" }
    "code_availability.repo": { label: "Repo name", type: text, section: "Deposit & compute", help: "clean public kebab, e.g. cirrhosis-competing-risks" }
    "code_availability.description": { label: "Repo description", type: textarea, section: "Deposit & compute" }
    "code_availability.homepage": { label: "Repo homepage", type: text, section: "Deposit & compute" }
    "code_availability.topics": { label: "Repo topics", type: tags, section: "Deposit & compute", help: "GitHub topics (free text)" }
    "code_availability.visibility": { label: "Repo visibility", type: select, options: [public, private], section: "Deposit & compute" }
    compute:       { label: "Compute", type: select, options: [hpc, local], section: "Deposit & compute" }
    "reproduced.date": { label: "Reproduced (date)", type: date, section: "Deposit & compute", help: "the date the full pipeline was last re-run to regenerate the committed numbers" }
    "reproduced.note": { label: "Reproduced (note)", type: textarea, section: "Deposit & compute", help: "what was re-run + any caveat (e.g. needs a GPU cluster / credentialed data)" }
    outcome:       { label: "Outcome (citation / why-not)", type: textarea, section: "Archive (archive tier)" }
    doi:           { label: "DOI", type: text, section: "Archive (archive tier)" }
    paths:         { label: "Path overrides", type: keymap, section: "Overrides (rare)", help: "non-canonical doc locations - the escape hatch" }
    subtasks:      { label: "Subtasks", type: keymap, section: Dates, help: "a checklist of { do, deadline, done, snooze } lines, the same mechanism as on a collection entry; edited by its own control, never by this form" }
