# ===========================================================================
# manifest-schema.yml
# Part of the split cockpit config - merged by cockpit.config.load_config() (cockpit.yml + config/*.yml).
# ===========================================================================


# Manifest edit-form text (served mode). The field STRUCTURE (which fields, their widget type, dynamic
# registry options) + the --selftest completeness gate live in cockpit/schema.py; the WORDS are here and
# overlay onto it by field name. `sections:` optionally remaps a section's display name (identity by default).
manifest_schema:
  sections:
    Core: Core
    Content: Content
    Connections: Connections
    Dates: Dates
    "Deposit & compute": "Deposit & compute"
    "Archive (archive tier)": "Archive (archive tier)"
    "Overrides (rare)": "Overrides (rare)"
  fields:
    id:            { label: "id", help: "the folder name - rename = a folder move, not a form edit" }
    tier:          { label: "Tier", help: "projects / archive / coauthor - set by the folder it lives in (a move, not a form edit)" }
    type:          { label: "Type / outcome", help: "archive/coauthor: the outcome (published, nogo, dropped, ...); projects: the folder tier (active/manuscript/idea) - don't change it here" }
    short:         { label: "Short handle" }
    title:         { label: "Title" }
    lead:          { label: "Lead (first author)" }
    authors:       { label: "Authors", help: "full list (free text - people, not a registry)" }
    "status.chips": { label: "Status chips" }
    "status.line": { label: "Status line", help: "the short human glance (not a narrative)" }
    focus:         { label: "Focus lane" }
    priority:      { label: "Priority", help: "optional per-card flame badge (High/Med/Low); a glance marker, does not reorder cards" }
    pin:           { label: "Pin to top", help: "float this project to the top of its board tab (Projects / Archive / Coauthor); does not override facet/search filters" }
    venue_id:      { label: "Venue" }
    year:          { label: "Year" }
    eli5:          { label: "ELI5" }
    next:          { label: "Next" }
    latest:        { label: "Latest" }
    results:       { label: "Results", help: "one claimable headline per line - NO nulls" }
    ideas:         { label: "Ideas", help: "one avenue per line" }
    domain:        { label: "Domain" }
    program:       { label: "Research lines", help: "programs.yml keys" }
    funding:       { label: "Funding", help: "funding.yml keys (multiple allowed)" }
    collaborators: { label: "Collaborators", help: "collaborations.yml keys (multiple allowed)" }
    "waiting-on":  { label: "Waiting on", help: "who this is blocked on before it moves - collaborations.yml keys (resolved to names) or free-text names; may or may not be collaborators" }
    related:       { label: "Related projects", help: "project ids" }
    datasets:      { label: "Datasets", help: "data.yml keys" }
    deadline:      { label: "Deadline" }
    "followup.do": { label: "Follow-up: do", help: "a standing 'do this later' note" }
    "followup.after": { label: "Follow-up: not until", help: "optional - hide the note until this date passes" }
    snooze:        { label: "Snooze until", help: "hide its date from the ticker; clear to un-snooze" }
    "code_availability.status": { label: "Code deposit" }
    "code_availability.date": { label: "Deposit date", help: "when the code was deposited (auto-stamped by deposit.py --create)" }
    "code_availability.url": { label: "Deposit URL" }
    "code_availability.doi": { label: "Deposit DOI" }
    "code_availability.repo": { label: "Repo name", help: "clean public kebab, e.g. cirrhosis-competing-risks" }
    "code_availability.description": { label: "Repo description" }
    "code_availability.homepage": { label: "Repo homepage" }
    "code_availability.topics": { label: "Repo topics", help: "GitHub topics (free text)" }
    "code_availability.visibility": { label: "Repo visibility" }
    compute:       { label: "Compute" }
    "reproduced.date": { label: "Reproduced (date)", help: "the date the full pipeline was last re-run to regenerate the committed numbers" }
    "reproduced.note": { label: "Reproduced (note)", help: "what was re-run + any caveat (e.g. needs a GPU cluster / credentialed data)" }
    outcome:       { label: "Outcome (citation / why-not)" }
    doi:           { label: "DOI" }
    paths:         { label: "Path overrides", help: "non-canonical doc locations - the escape hatch" }
