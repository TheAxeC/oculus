  fetch:                       # neofetch-style panel at the top of the Focus board (terminal themes only).
    # A fetch block is a LOGO next to `key: value` lines, in a window - not a chart, and not squeezed into
    # the header bar. The logo is an isometric block-term core; keep it here so the .py stays free of art.
    # NOTE: in a YAML block scalar the FIRST line fixes the indentation, so the art's least-indented line
    # must come first - anything further left later would end the block and break the whole file.
    logo: |-
      +--------+
      |        |\
      |  [##]  | \
      |        |  +
      +--------+  |
       \        \ |
        \        \|
         +--------+
    titlebar: "axel@research"
