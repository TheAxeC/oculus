# ===========================================================================
# text.yml
# Part of the split cockpit config - merged by cockpit.config.load_config() (cockpit.yml + config/*.yml).
# ===========================================================================
# === UI-string catalog ======================================================
# Every human-readable string the engine renders lives here (mirrors `glyphs:`). The Python side reads it
# as `T("group.key")` (see cockpit/config.py `_Text`); the `text.js.*` subtree is serialized into the
# #ckstrings blob and read by `CK.t("group.key")` in the client JS. Placeholders `{0}`/`{1}` are filled
# with the call args. A key referenced by a template but missing here FAILS `--selftest` (strict lookup).
# Edit the words HERE, not in the .py / .js. (Populated incrementally; empty groups are harmless.)
text:
  # strings read by the client JS via CK.t("group.key") - flattened into the #ckstrings blob (page.py).
  # Emoji / glyphs are fine here (cockpit surface); {0}/{1} are CK.t interpolation args. Preserve verbatim.
  js:
