# The line icon each glyph name is drawn as. One row per name in the `glyphs:` map of config/catalogs/glyphs.yml.

# A value is a file name in the icon package, `<name>.svg` under lucide-static/icons, and the server refuses a row that names no such file. The vocabulary and this map are checked against each other at config load, so a glyph name added there without a row here is reported rather than drawn blank. The ASCII stand-ins of config/catalogs/glyphs.yml are what a terminal theme draws instead; nothing here.
