    # controls + actions
    refresh: refresh-cw
    biennial: repeat
    expand: plus-circle
    collapse: minus-circle
    darkmode: contrast
    theme_base: sun-moon
    theme_rice: square-terminal
    crt: scan-line
    wallpaper: image
    icons: type
    launch: external-link
    open_program: app-window
    copy: copy
    goto: corner-down-right
    note_back: undo-2
    current_month: calendar-check
