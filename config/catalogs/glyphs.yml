# Oculus glyph vocabulary: every name a component draws, with the ASCII stand-in a terminal theme draws in its place.


# A name is drawn as the line icon config/catalogs/icons.yml maps it to; the value here is the text drawn instead while the ASCII mode is in force, and the words a caller puts a glyph into. Every value is printable ASCII.
glyphs:
  # controls + actions
  refresh: "(r)"
  biennial: "(r)"
  expand: "[+]"
  collapse: "[-]"
  theme_base: "(o)"
  theme_rice: "<>"
  launch: "^"
  open_program: "[o]"
  open_preview: "[v]"
  preview_side: "[>]"
  submit_job: "[>]"
  copy: "[c]"
  goto: ">>"
  replace: "[r]"
  replace_all: "[R]"
  note_back: "<<"
  current_month: "|"
  arrow_to: "->"
