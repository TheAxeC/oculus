# ===========================================================================
# catalogs/options.yml
# Every option of every config file, described once: what it does and what changing it changes, its `default` (the value the Settings view's Reset writes and its Modified filter compares with, and, for a setting src/lib/data/sources/config/settings.ts reads, the value used when the key is missing or wrong), the heading and section the Settings view lists it under, and the control it is set with. Merged with the other catalogs by loadConfig(), so its one top-level key, `options:`, is read through catalogOf() in src/lib/data/sources/config/catalog/options.ts, and optionFindings() in option-findings.ts reports an entry it cannot read. tests/checks/config/config.test.ts reads the shipped catalog with no finding, and tests/data/sources/config/settings.test.ts reads every shipped default of a setting through its reader (case 'answers the shipped default for each setting the shipped file gets wrong, and reads every shipped default').
# ===========================================================================

# Shape. `options:` maps a config file name (appearance.yml, behavior.yml, layout.yml, present.yml, sources.yml, and local.yml for the machine's own keys) to a map of dotted key path to an entry.
# An option is a leaf of its file: a scalar, a null or a list. A map is walked into, so `slurm.poll_min` is the key path of `poll_min` under `slurm`, and a list is one option, set as a whole.
# A family is a list of records, or a map whose keys are names the data or the reader chooses (page names, tier names, field names, project types, tag names, file extensions, theme names) rather than names oculus reads. A family is one entry whose `fields` describe the record once; every other leaf is an option.
# Every entry outside local.yml holds `help`, `heading` (the subject it is listed under: appearance, editor, terminal, sessions, cluster, boards, rail, presentation, sources, calendar or apps; HEADINGS in options.ts), `section` (the group inside the heading) and, for a leaf, `default` (the value Reset writes and Modified compares with, and, for a setting src/lib/data/sources/config/settings.ts reads, the value used when the key is missing or wrong) and `control`. A local.yml entry holds `help` and `section`, is listed under This machine with the value in force, and holds `control` where the key takes a number or a choice, and `fields` for a list of records, so the editor checks the file's keys and values by the entry.
# The controls are toggle, number, text, long (a text area), choice, multi (several words of a list), list (one text box per item), glyph (a name of catalogs/glyphs.yml), hue (a palette hue name), colour (a palette hex, drawn as its hue), folder and file (a path inside the hub, offered from the files there), path (an absolute or ~/ path), parked (a list whose items can only be removed) and, in a family field, records (a nested list of records described by its own `fields`).
# A choice or multi names its words in `options`, or the list they come from in `from` (one source, or a list of sources offered together; SOURCES in options.ts), or for a field in `from: { field, sources }` the source another field of the record names. On a text, `from` names the source a text box suggests from and the value is not held to it; `empty: true` adds the empty value to a choice or path, and `empty: <words>` does the same and gives the words the choice draws for its empty item; `min` and `max` bound a number; `slots` names the fixed items of a list; `items: number` makes a list's items numbers; `whole: true` holds a number, or each item of a list of numbers, to a whole number; `form` holds a text, or each item of a list, to one of the forms of FORMS in options.ts: `program` (no slash or white space), `extension` (a dot and one segment) or `bundle_id` (two or more dot-separated segments of letters, digits and dashes); `joined: true` writes a multi as one text separated by spaces; `allow_missing` lets a folder or file be absent, always (true) or while the named toggle field of the record is true.
# A family's entry holds `help` and `fields`, and `holds: lists` when it is a map whose every key holds a list: a list of records (`tab_rollup`), or for a key/value family (fields `key` and `value`) a list of values (`languages`); a family without it is refused a key that holds a list, whatever the file holds at the time. A field is its help line alone (a text box) or a map of `help`, `control` and the keys above.
# A value outside its control, `min`, `max` or `options` is wrong by one rule, src/lib/data/sources/config/catalog/value-rule.ts: the Settings view refuses it before the write, the server's write refuses it, and one written by hand is a finding naming the file and the key while the reader uses the `default`.
options:
    appearance.yml:
        themes:
            heading: appearance
            section: Themes
            help: The UI themes of the theme picker, in picker order. A row with no name, or repeating a name an earlier row gave, is dropped.
            fields:
                name: the name the viewer's choice is saved under
                class:
                    help: the classes put on the page body, empty for the light theme
                    control: multi
                    from: theme_classes
                    joined: true
                glyph:
                    help: the glyph name drawn before the label
                    control: glyph
                label: the words the picker shows, the name when the row has none
        terminal.font_px:
            heading: terminal
            section: Display and keys
            help: Text size of the terminal grid in CSS pixels. The grid paints its own text and cannot inherit the page's size; a value is clamped to 6 to 40. Leaving the key out makes the terminal follow the theme's --fs-md token.
            default: 12.5
            control: number
            min: 6
            max: 40
        terminal.mac_option_is_meta:
            heading: terminal
            section: Display and keys
            help: Whether the Option key sends Meta on macOS, so Option+B and Option+F move by word in a shell. false types the characters Option makes, such as the accented letters of the US-International layout. A value that is not true or false counts as false.
            default: false
            control: toggle
        terminal.copy_on_selection:
            heading: terminal
            section: Display and keys
            help: 'Whether a selection in the terminal grid is copied to the clipboard as soon as it is made, which includes Select All. false copies only when asked: Copy, Copy as HTML or the copy key. A value that is not true or false counts as false.'
            default: false
            control: toggle
        terminal.cursor_style:
            heading: terminal
            section: Display and keys
            help: The shape of the terminal grid's cursor. block fills the cell, line draws a thin bar, underline draws a line under the cell. Any other value counts as block.
            default: block
            control: choice
            options: [block, line, underline]
        terminal.cursor_blinking:
            heading: terminal
            section: Display and keys
            help: Whether the terminal grid's cursor blinks. false keeps it steady. A value that is not true or false counts as false.
            default: false
            control: toggle
        wallpaper.image:
            heading: appearance
            section: Wallpaper
            help: "The wallpaper: a hub name and a file name joined by a slash (lab/photo.jpg), the file being in that hub's wallpaper folder, or random for one image of any hub kept until the server restarts. Empty shows no wallpaper. The picker under the wallpaper rows writes this key into the primary hub's own .oculus/config/appearance.yml."
            default: ''
            control: text
        wallpaper.dim:
            heading: appearance
            section: Wallpaper
            help: How far the image is darkened, from 0 (the raw image) to 1 (fully hidden); a value is clamped to that range. Busy images want 0.7 to 0.85.
            default: 0.72
            control: number
            min: 0
            max: 1
        wallpaper.blur:
            heading: appearance
            section: Wallpaper
            help: Blur of the image itself in pixels, from 0 (sharp) to 64. Raise it only for a busy picture.
            default: 0
            control: number
            min: 0
            max: 64
        wallpaper.themes:
            heading: appearance
            section: Wallpaper
            help: Which UI themes show the wallpaper. rice shows it on the terminal-style themes only, all shows it on the light and dark themes too. Any other value counts as rice.
            default: rice
            control: choice
            options: [rice, all]
        wallpaper.panel_opacity:
            heading: appearance
            section: Wallpaper
            help: How solid the panels stay over the image, from 0 to 1 (1 is opaque); a value is clamped to that range. The value is applied as a whole percentage.
            default: 0.76
            control: number
            min: 0
            max: 1
        wallpaper.popover_opacity:
            heading: appearance
            section: Wallpaper
            help: How solid dropdowns and popovers are, from 0 to 1. They float over a panel, so at the panel's own opacity they would be read through two translucent layers. Leaving the key out sets it three quarters of the way from panel_opacity to solid.
            default: 0.97
            control: number
            min: 0
            max: 1
        wallpaper.panel_blur:
            heading: appearance
            section: Wallpaper
            help: Backdrop blur behind each panel in pixels, from 0 to 64. It keeps text crisp without smearing the image.
            default: 2
            control: number
            min: 0
            max: 64
        crt.default:
            heading: appearance
            section: CRT overlay
            help: Whether the CRT overlay (scanlines and vignette, cosmetic only) is on in a browser that has never been told otherwise. The CRT row under This browser in the Settings view saves the viewer's own choice, which takes over.
            default: false
            control: toggle
        code_theme:
            heading: appearance
            section: Code theme
            help: How the editors colour code. tokens takes the syntax colours from the UI theme's own code tokens (a VS Code UI theme brings its own TextMate rules). The class name of any of the 19 VS Code themes (for example vscode-dark-2026 or vscode-light-modern) takes that theme's TextMate rules under any UI theme, and the id of any theme Shiki bundles (for example dark-plus, github-light or nord) takes that theme's syntax colours; in both the editor's background and chrome stay on the UI theme. A value that is none of these is reported as a finding and read as tokens. The Code theme row under This browser in the Settings view saves the viewer's own choice, which takes over.
            default: tokens
            control: choice
            from: code_themes
        file_icons:
            heading: appearance
            section: File icons
            help: The file icon theme. seti draws the icons of VS Code's default theme. The icon theme of an approved, enabled app is saved as its app's view id, a slash and the theme's id with that id percent-encoded; it draws that theme's icons in the Files view, the tabs, Cmd-K and the diff headers. A value naming no such theme, because its app is unapproved, disabled, removed or changed, is reported as a finding and read as seti. The :file-icons command in Cmd-K writes this key.
            default: seti
            control: choice
            from: file_icon_themes
        show_tabs:
            heading: appearance
            section: Pane tabs
            help: How many tabs the top row of a pane draws. multiple draws every tab, single draws the active tab alone, none draws no tab and keeps a title row that holds the pane's actions. Any other value counts as multiple. The Tab Bar submenu of a pane strip's right-click menu writes this key.
            default: multiple
            control: choice
            options: [multiple, single, none]
        editor_actions:
            heading: appearance
            section: Pane tabs
            help: Where a pane draws its Split Right button and its pane menu. strip draws them at the right end of the top row, hidden draws neither; the pane menu stays reachable by a right click on the strip or on an empty pane. Any other value counts as strip. The Editor Actions Position submenu of a pane strip's right-click menu writes this key.
            default: strip
            control: choice
            options: [strip, hidden]
        wrap_tabs:
            heading: appearance
            section: Pane tabs
            help: Whether the tabs of a pane wrap onto more rows when they do not fit, instead of scrolling along one row. It applies only while show_tabs is multiple. Any value that is not true counts as false.
            default: false
            control: toggle
    behavior.yml:
        read_limits:
            heading: boards
            section: Audit checks
            help: Soft limits, in characters, for the audit's readability warnings. A manifest field longer than its limit earns a finding, and a field with no limit here is not checked.
            fields:
                key:
                    help: the manifest field, status.line, next, latest or eli5, or results for each entry of the results list
                    control: choice
                    options: [status.line, next, latest, eli5, results]
                value:
                    help: the most characters the field may hold before it earns a finding
                    control: number
        data_domains:
            heading: boards
            section: Audit checks
            help: Domains expected to have a dataset. The audit reports an active project in one of these domains that has no datasets entry. This is a setting of the hub, kept in the hub's .oculus/config/behavior.yml, and a hub that sets none expects no dataset.
            default: []
            control: multi
            from: domains
        waiting_status:
            heading: boards
            section: Audit checks
            help: Collection-entry statuses that wait on someone else, compared without regard to case. The audit asks for a date on an entry in one of them, so that it can be tracked.
            default: [submitted, pending, under review, under-review]
            control: multi
            from: entry_statuses
        audit_ignore:
            heading: boards
            section: Audit checks
            help: The finding signatures the reader has parked, each the twelve hex characters the Audit view's mute control writes here. A parked finding stays true and is drawn in the muted section.
            default: []
            control: parked
        stale_lag_days:
            heading: boards
            section: Audit checks
            help: How many days a project's manifest `updated` date may trail the newest content of the project before the audit and the Focus board call the manifest behind.
            default: 1
            control: number
        context_window:
            heading: sessions
            section: Session meter
            help: The token window the session detail meter measures the last turn against, unless the transcript names its own window. A value that is not above zero leaves the meter without a window.
            default: 1000000
            control: number
        usage_tiers:
            heading: sessions
            section: Usage figures
            help: The words shown for the subscription tier ids that the supported command-line agents report.
            fields:
                key:
                    help: a tier id as the agent reports it
                    control: text
                    from: usage_tiers
                value: the words shown for that tier
        usage_refresh_min:
            heading: sessions
            section: Usage figures
            help: Minutes between refreshes of each account's cached usage figures, which hidden usage sessions make. The Usage view reads the same number as its cadence.
            default: 10
            control: number
            min: 1
            max: 35791
        usage_refresh_model:
            heading: sessions
            section: Usage figures
            help: The model the hidden usage sessions are started with, passed to the Claude command line as --model.
            default: haiku
            control: choice
            from: models
        refresh_stale_days.litwatch:
            heading: boards
            section: Thresholds and horizons
            help: Days after which the Focus refresh strip prompts to refresh the literature radar, counted from meta.last_run of the radar file. A radar that has never run is prompted for while this key is present. Removing the key stops the prompt for this feed.
            default: 14
            control: number
        refresh_stale_days.inbox:
            heading: boards
            section: Thresholds and horizons
            help: Days after which the Focus refresh strip prompts to triage the inbox again, counted from the run date the triage skill writes at the top of triage.json under mail_dir. A note that the page's triage action writes keeps that date, so it does not reset the count, and with no run date there is no prompt. Removing the key stops the prompt for this feed.
            default: 2
            control: number
        refresh_stale_days.scout:
            heading: boards
            section: Thresholds and horizons
            help: Days after which the Focus refresh strip prompts to run the position scout again, counted from the newest meta.log date of the position-leads file. A scout that has never run gives no prompt. Removing the key stops the prompt for this feed.
            default: 7
            control: number
        deadline_horizon_days:
            heading: boards
            section: Thresholds and horizons
            help: How many days ahead the week's ticker lists a dated item, among them a project's submission deadline, a funding scheme's deadline, a conference call with an exact date, and the dated entries of talks, teaching, tasks, positions and joint work.
            default: 90
            control: number
        leads_horizon_days:
            heading: boards
            section: Thresholds and horizons
            help: How many days ahead the week's ticker lists the deadline of an open position lead from the position-leads file.
            default: 21
            control: number
        conf_horizon_months:
            heading: boards
            section: Thresholds and horizons
            help: How many whole months ahead the week's ticker lists a conference call that has a usual month but no exact date. 1 lists this month and the next.
            default: 1
            control: number
        leads_badge_days:
            heading: boards
            section: Thresholds and horizons
            help: Position Leads counts an open lead whose deadline falls from today through this many days ahead in the count badge of its rail entry.
            default: 14
            control: number
        venue_conc_warn:
            heading: boards
            section: Thresholds and horizons
            help: The number of in-flight papers aimed at one venue at which the Focus board raises its venue load line and the board statistics flag the venue.
            default: 4
            control: number
        linkedin_cadence_days:
            heading: boards
            section: Thresholds and horizons
            help: Days since the newest LinkedIn post beyond which the Focus board raises its LinkedIn line and the LinkedIn rail entry shows its red mark.
            default: 30
            control: number
        file_index.enabled:
            heading: boards
            section: File finder
            help: Whether project cards list the project's files. false turns the file finder off.
            default: true
            control: toggle
        file_index.max_per_project:
            heading: boards
            section: File finder
            help: How many files the finder lists for one project, the newest first. A value that is not a number above zero means 400.
            default: 400
            control: number
        file_index.ext:
            heading: boards
            section: File finder
            help: The extensions, each with its dot, of the files the finder lists, compared in lower case. An empty list means the built-in list of common document and code extensions.
            default:
                [
                    .pdf,
                    .tex,
                    .bib,
                    .md,
                    .yml,
                    .yaml,
                    .py,
                    .sh,
                    .slurm,
                    .ipynb,
                    .csv,
                    .json,
                    .png,
                    .jpg,
                    .svg,
                    .txt,
                    .docx,
                    .xlsx,
                    .pptx
                ]
            control: list
        slurm.resource:
            heading: cluster
            section: Slurm
            help: "The cluster the Live HPC poller queries: the key of a cluster entry of registries/resources.yml, whose host is the ssh alias. This is a setting of the hub, kept in the hub's .oculus/config/behavior.yml. The machine's own hpc_host in local.yml takes precedence. Empty sets no cluster, and the HPC view says so and polls nothing. A key that names no cluster with a host shows why in the HPC view."
            default: ''
            control: choice
            empty: no cluster
            from: clusters
        slurm.days:
            heading: cluster
            section: Slurm
            help: How many days back the Live HPC poll asks the scheduler's accounting for finished jobs, and for the job working directories of the log prewarm.
            default: 3
            control: number
            min: 0
            max: 3650
            whole: true
        slurm.poll_min:
            heading: cluster
            section: Slurm
            help: Minutes between two Live HPC polls of the job queue.
            default: 20
            control: number
            min: 1
            max: 35791
        slurm.quota_min:
            heading: cluster
            section: Slurm
            help: Minutes between two reads of the cluster's disk quota.
            default: 60
            control: number
            min: 1
            max: 35791
        slurm.prewarm:
            heading: cluster
            section: Slurm
            help: Whether the poller resolves the log paths of finished jobs behind the page, so that opening a log is quick. false defers that resolution.
            default: true
            control: toggle
        processes.patterns:
            heading: terminal
            section: Processes
            help: The program names the Processes view lists beside oculus's own terminals. A name matches a process whose program, or whose first argument, has that file name.
            default: [python3, codex, claude, node, latexmk]
            control: list
            form: program
        chat.model:
            heading: sessions
            section: In-page chat
            help: The model an in-page chat session is started with, passed to the Claude command line. Empty leaves the choice to the command line.
            default: opus
            control: choice
            from: models
            empty: the command line chooses the model
        calendar.poll_min:
            heading: calendar
            section: Calendar reads
            help: Minutes between two reads of the calendar accounts.
            default: 15
            control: number
            min: 1
            max: 35791
        calendar.days_back:
            heading: calendar
            section: Calendar reads
            help: How many days before now the calendar window opens.
            default: 31
            control: number
            min: 0
            max: 3650
            whole: true
        calendar.days_ahead:
            heading: calendar
            section: Calendar reads
            help: How many days after now the calendar window closes.
            default: 62
            control: number
            min: 0
            max: 3650
            whole: true
        mail.poll_min:
            heading: calendar
            section: Mail reads
            help: Minutes between two reads of the inbox plate.
            default: 10
            control: number
            min: 1
            max: 35791
        mail.per_signal:
            heading: calendar
            section: Mail reads
            help: How many threads each of the plate's three signals is read at most.
            default: 25
            control: number
            min: 1
            max: 500
            whole: true
        notify.enabled:
            heading: sessions
            section: Notifications
            help: Whether a hook event of a Claude session pushes a macOS notification.
            default: true
            control: toggle
        notify.events:
            heading: sessions
            section: Notifications
            help: The hook events that push a notification. A name is the notification type of a Notification event, or stop for a Stop event. An entry that is not text is dropped.
            default: [permission_prompt, idle_prompt, stop]
            control: multi
            options: [permission_prompt, idle_prompt, stop]
        notify.quiet_seconds:
            heading: sessions
            section: Notifications
            help: Seconds during which a session's repeat of a notification is suppressed after one was pushed.
            default: 3
            control: number
        editor.paint_limit_kb:
            heading: editor
            section: Source editor
            help: Size in kilobytes above which the source editor opens a file as plaintext. The editor colours a file by running its grammar over the text in the page as it is typed, and the read-only code window, painted once, colours every size.
            default: 20480
            control: number
            min: 1
        editor.tab_size:
            heading: editor
            section: Source editor
            help: The width of one step of indentation, from 1 to 8, VS Code's editor.tabSize. A file that indents with spaces keeps the step it is written with; this is the width for a file with no indented line and for a file indented with tabs. A language's record in editor.languages, or a repository's .oculus/settings.yml, overrides it.
            default: 4
            control: number
            min: 1
            max: 8
            whole: true
        editor.insert_spaces:
            heading: editor
            section: Source editor
            help: Whether a file with no indented line is indented with spaces (true) or a tab (false), VS Code's editor.insertSpaces. A file that already indents keeps its own. A language's record in editor.languages, or a repository's .oculus/settings.yml, overrides it.
            default: true
            control: toggle
        editor.word_wrap:
            heading: editor
            section: Source editor
            help: How the editor wraps a long line, VS Code's editor.wordWrap. off never wraps, on wraps at the width of the editor, wordWrapColumn wraps at column 80, and bounded wraps at the smaller of the editor's width and column 80. Alt+Z in a source tab switches the wrap of that tab. A language's record in editor.languages, or a repository's .oculus/settings.yml, overrides it.
            default: 'off'
            control: choice
            options: ['off', 'on', wordWrapColumn, bounded]
        editor.minimap:
            heading: editor
            section: Source editor
            help: Whether the source editor draws the minimap, the overview of the file at its right edge, VS Code's editor.minimap.enabled. The diff editor draws its minimap as Monaco does.
            default: true
            control: toggle
        editor.render_whitespace:
            heading: editor
            section: Source editor
            help: Which spaces and tabs the editor draws as marks, VS Code's editor.renderWhitespace. none draws none, boundary draws all but single spaces between words, selection draws them inside a selection, trailing draws the ones at the end of a line, and all draws every one.
            default: selection
            control: choice
            options: [none, boundary, selection, trailing, all]
        editor.sticky_scroll:
            heading: editor
            section: Source editor
            help: Whether the editor keeps the headings and blocks that contain the first visible line at the top of the view, VS Code's editor.stickyScroll.enabled. The structure comes from the headings of a Markdown or LaTeX file, from the language service of TypeScript, JavaScript, JSON, CSS, SCSS, Less and HTML, from the symbols pyright, clangd and yaml-language-server answer for a Python, C, C++ or YAML file they serve, and from the braces of Java, Dart, R and Rite, and of C and C++ while no language server serves the file.
            default: true
            control: toggle
        editor.autosave:
            heading: editor
            section: Source editor
            help: 'off: An editor with changes is never automatically saved. after_delay: An editor with changes is automatically saved after the configured editor.autosave_delay_ms. on_focus_change: An editor with changes is automatically saved when the editor loses focus, and every such editor is saved when the page loses focus.'
            default: 'off'
            control: choice
            options: ['off', after_delay, on_focus_change]
        editor.autosave_delay_ms:
            heading: editor
            section: Source editor
            help: Controls the delay in milliseconds after which an editor with unsaved changes is saved automatically. Only applies when editor.autosave is set to after_delay.
            default: 1000
            control: number
            min: 0
            whole: true
        editor.trim_trailing_whitespace:
            heading: editor
            section: Source editor
            help: When enabled, will trim trailing whitespace when saving a file.
            default: false
            control: toggle
        editor.final_newline:
            heading: editor
            section: Source editor
            help: When enabled, a save ends a last line of text with one line ending and takes off the empty lines after the last line that holds any character.
            default: false
            control: toggle
        editor.languages:
            heading: editor
            section: Source editor
            help: The editor options of a language, by the editor's language name, as VS Code's per-language settings give them. A record sets any of the fields below for the files of that language and overrides the global key of the same name; a repository's .oculus/settings.yml has a languages key of the same records that overrides these for the files of that repository. A language the editor does not colour, a field not listed and a value outside its words or range are not read and are listed in the Findings view.
            fields:
                key:
                    help: the language's name as the editor and the status bar show it
                    control: choice
                    from: languages
                tab_size:
                    help: the width of one step of indentation, a whole number from 1 to 8
                    control: number
                    min: 1
                    max: 8
                    whole: true
                insert_spaces:
                    help: true indents a file with no indented line with spaces, false with a tab
                    control: toggle
                word_wrap:
                    help: off, on, wordWrapColumn or bounded
                    control: choice
                    options: ['off', 'on', wordWrapColumn, bounded]
                rulers:
                    help: the columns that draw a vertical line, a list of whole numbers
                    control: list
                    items: number
                    min: 1
                    whole: true
                format_on_save:
                    help: true formats the document with the language server before each save, false saves it as typed; a language whose server does not format, Python among them, saves as typed either way
                    control: toggle
                trim_trailing_whitespace:
                    help: When enabled, will trim trailing whitespace when saving a file.
                    control: toggle
                final_newline:
                    help: When enabled, a save ends a last line of text with one line ending and takes off the empty lines after the last line that holds any character.
                    control: toggle
        latex.auto_build:
            heading: editor
            section: LaTeX
            help: When a main file is built without being asked. on_file_change builds it when any file it includes changes on disk, whoever wrote the file (the editor, an agent, git), for the main files of the open LaTeX tabs and of the PDFs they build. on_save builds the main file the saved file belongs to when the file is saved in the editor. never builds only when asked. A build is in the background, and its errors and warnings reach the editor as markers when it ends.
            default: on_file_change
            control: choice
            options: [on_file_change, on_save, never]
        latex.auto_build_interval_ms:
            heading: editor
            section: LaTeX
            help: The shortest time, in milliseconds, between the starts of two automatic builds of one main file. A change that comes while a build runs gives one build after it.
            default: 1000
            control: number
            min: 1
            whole: true
        latex.recipe_default:
            heading: editor
            section: LaTeX
            help: The recipe a build uses when the file names none and the reader asked for none. first is the first recipe of latex.recipes and last_used is the one the reader last asked for with Build with Recipe.
            default: first
            control: choice
            options: [first, last_used]
        latex.out_dir:
            heading: editor
            section: LaTeX
            help: The folder a build writes the PDF, the log and the SyncTeX file to. %DIR% is the main file's own folder; any other value is a folder resolved from the main file's folder, which must stay under the served root.
            default: '%DIR%'
            control: text
        latex.aux_dir:
            heading: editor
            section: LaTeX
            help: The folder a build writes its auxiliary files to. %OUTDIR% is the output folder; any other value is resolved as latex.out_dir is.
            default: '%OUTDIR%'
            control: text
        latex.clean_and_retry:
            heading: editor
            section: LaTeX
            help: true cleans the auxiliary files and builds once more after a build that ended in an error, as LaTeX Workshop does; a build the reader stopped is not retried.
            default: true
            control: toggle
        latex.auto_clean:
            heading: editor
            section: LaTeX
            help: Whether Clean runs after a build, by how the build ended. never does not clean; on_failed, on_succeeded and on_built clean after a failed build, a successful one, or either.
            default: never
            control: choice
            options: [never, on_failed, on_succeeded, on_built]
        latex.synctex_path:
            heading: editor
            section: LaTeX
            help: Where the synctex program is, which finds the PDF position of a source line and the source line of a PDF click. Empty finds it on PATH.
            default: ''
            control: path
            empty: true
        latex.reverse_synctex:
            heading: editor
            section: LaTeX
            help: The click on a page of the PDF that opens the source at that place. ctrl_click is Cmd, or Ctrl, and a click; double_click is a double click. Any other click selects text and follows links.
            default: ctrl_click
            control: choice
            options: [ctrl_click, double_click]
        latex.texcount_autorun:
            heading: editor
            section: LaTeX
            help: on_save counts the words of the main file after each save of a LaTeX file, so the status bar's tooltip has the number; never counts only when asked.
            default: never
            control: choice
            options: [never, on_save]
        latex.context_menu:
            heading: editor
            section: LaTeX
            help: true adds Build and SyncTeX from Cursor to the editor's right-click menu of a LaTeX file.
            default: false
            control: toggle
        latex.unimath_symbols:
            heading: editor
            section: LaTeX
            help: Offer the Unicode math symbols in LaTeX completion, each with its glyph.
            default: false
            control: toggle
        latex.includegraphics_preview:
            heading: editor
            section: LaTeX
            help: 'Show the picture beside a file suggested inside \includegraphics.'
            default: true
            control: toggle
        latex.recipes:
            heading: editor
            section: LaTeX
            help: The recipes a build can run, each a name and the tools it chains in order. A recipe whose name an earlier recipe took, one with no name, one that names no tool and one that names a tool latex.tools does not hold is not read and is listed in the Findings view.
            fields:
                name: the name the build asks for, which a % !LW recipe = <name> comment also names
                tools:
                    help: the names of the tools the recipe runs one after the other
                    control: list
        latex.tools:
            heading: editor
            section: LaTeX
            help: The tools recipes chain, each a program and its arguments. An argument may hold the placeholders %DOC%, %DOC_EXT%, %DOCFILE%, %DOCFILE_EXT%, %DIR%, %OUTDIR% and %AUXDIR%. A tool whose name an earlier tool took, or that has no name or no program, is not read and is listed in the Findings view.
            fields:
                name: the name recipes call the tool by
                command: the program, found on PATH
                args:
                    help: the arguments, one per item
                    control: list
        latex.formatter:
            heading: editor
            section: LaTeX
            help: The program Format Document runs on a .tex file, as LaTeX Workshop's latex-workshop.formatting.latex offers them. latexindent comes with TeX Live and MacTeX, tex-fmt and badness are installed on their own. none formats nothing and says so. The program reads the text and writes the formatted text back, with no shell and a 20 second limit.
            default: none
            control: choice
            options: [none, latexindent, tex-fmt, badness]
        latex.latexindent_path:
            heading: editor
            section: LaTeX
            help: Where latexindent is, when latex.formatter is latexindent. Empty finds it on PATH.
            default: ''
            control: path
            empty: true
        latex.tex_fmt_path:
            heading: editor
            section: LaTeX
            help: Where tex-fmt is, when latex.formatter is tex-fmt. Empty finds it on PATH.
            default: ''
            control: path
            empty: true
        latex.badness_path:
            heading: editor
            section: LaTeX
            help: Where badness is, when latex.formatter is badness. Empty finds it on PATH.
            default: ''
            control: path
            empty: true
        latex.texlab_path:
            heading: editor
            section: LaTeX
            help: 'The texlab program the LaTeX language server runs. Empty: texlab on the PATH oculus was started with.'
            default: ''
            control: path
            empty: true
        lint.chktex:
            heading: editor
            section: Linting
            help: true runs ChkTeX on a .tex or .latex file when it is saved and when a tab of it with no unsaved text opens, and shows its findings in the editor and the Problems view.
            default: true
            control: toggle
        lint.ruff:
            heading: editor
            section: Linting
            help: true runs Ruff on a .py or .pyi file when it is saved and when a tab of it with no unsaved text opens, and shows its findings in the editor and the Problems view.
            default: true
            control: toggle
        lint.eslint:
            heading: editor
            section: Linting
            help: true runs the ESLint of the repository on a TypeScript, JavaScript or Svelte file under an eslint.config.* file, after the configuration is approved in the palette (:eslint-config), and shows its findings in the editor and the Problems view.
            default: true
            control: toggle
        lint.shellcheck:
            heading: editor
            section: Linting
            help: true runs ShellCheck on a .sh, .bash or .slurm file when it is saved and when a tab of it with no unsaved text opens, and shows its findings in the editor and the Problems view.
            default: true
            control: toggle
        lint.writing:
            heading: editor
            section: Linting
            help: true marks, in a Markdown or YAML file and in the comments of a code file, each character the hub's writing rules ban (em and en dashes, curly quotes, the ellipsis, arrows, the non-breaking space) and each Markdown paragraph broken across lines, in the editor and the Problems view, with a quick fix where the fix is exact. It runs no program.
            default: true
            control: toggle
        lint.chktex_path:
            heading: editor
            section: Linting
            help: 'Where ChkTeX is: an absolute path or one that starts with ~. Empty: ChkTeX on the PATH oculus was started with. A named path that cannot be used is reported as not found, and the PATH is not tried in its place.'
            default: ''
            control: path
            empty: true
        lint.ruff_path:
            heading: editor
            section: Linting
            help: 'Where Ruff is: an absolute path or one that starts with ~. Empty: Ruff on the PATH oculus was started with. A named path that cannot be used is reported as not found, and the PATH is not tried in its place.'
            default: ''
            control: path
            empty: true
        lint.shellcheck_path:
            heading: editor
            section: Linting
            help: 'Where ShellCheck is: an absolute path or one that starts with ~. Empty: ShellCheck on the PATH oculus was started with. A named path that cannot be used is reported as not found, and the PATH is not tried in its place.'
            default: ''
            control: path
            empty: true
        lint.chktex_args:
            heading: editor
            section: Linting
            help: The arguments ChkTeX runs with, as LaTeX Workshop's latex-workshop.linting.chktex.exec.args offers them. oculus adds the output format, -I0 and the .chktexrc it finds beside the file or in the root.
            default: [-wall, -n22, -n30, -e16, -q]
            control: list
        lint.writing_skip:
            heading: editor
            section: Linting
            help: The globs of the files the writing rules leave alone, matched against the path from the file's root (a glob without a slash also matches a file name). A skipped file has no marks and no linter item. A file named glyphs.yml is skipped whatever this holds.
            default:
                [
                    '.agents/**',
                    '.claude/**',
                    '**/vendor/**',
                    '**/third_party/**',
                    '**/bttrlib/**',
                    '**/notes/thesis/**',
                    '**/manuscript/**/*.tex',
                    '**/manuscript/**/*.bib',
                    '**/*_AUTO.md',
                    '**/STATUS.md',
                    feeds/literature-radar.yml,
                    feeds/position-leads.yml,
                    tools/oculus/.scratch/migration/plan.md,
                    tools/oculus/.scratch/migration/agents/guarded.md
                ]
            control: list
        lint.writing_glyphs:
            heading: editor
            section: Linting
            help: The globs of the files that draw arrows as icons. The writing rules mark every banned character in them but arrows.
            default:
                [
                    tools/cockpit/data/**,
                    tools/cockpit/dummy/data/**,
                    tools/cockpit/templates/**,
                    tools/cockpit/assets/**,
                    tools/cockpit/README.md,
                    tools/cockpit/DESIGN.md,
                    tools/cockpit/ARCHITECTURE.md,
                    tools/cockpit/CLAUDE.md,
                    tools/present/assets/**,
                    registries/*.yml,
                    funding/funding.yml,
                    network/*.yml,
                    applications/applications.yml,
                    education/education.yml,
                    tasks/tasks.yml,
                    '**/project.yml'
                ]
            control: list
        writes.timeout_seconds:
            heading: editor
            section: Saving
            help: Seconds a save waits for the server's answer before it is given up and its form says so. A value that is not above zero makes a save wait as long as the request does.
            default: 30
            control: number
        notes.autosave_ms:
            heading: editor
            section: Notes
            help: Milliseconds a scratch note waits after the last keystroke before it is written.
            default: 800
            control: number
        changes.keep:
            heading: editor
            section: Change log
            help: How many changes the change log holds. Every write that changed something is recorded in ~/.oculus/changes.jsonl, or where the changes key of local.yml puts it, and the file is rewritten down to this number once it has grown past twice it.
            default: 500
            control: number
            min: 1
            whole: true
        files.confirm_delete:
            heading: editor
            section: Files
            help: Whether moving a file or folder to the Trash in the Files view asks first, as VS Code's explorer.confirmDelete. A permanent delete always asks. The question's "Do not ask me again" box writes false here.
            default: true
            control: toggle
        git.message_model:
            heading: editor
            section: Git
            help: The model the Changes section of the Session view asks for a suggested commit message. Empty uses the command line's own default model.
            default: ''
            control: choice
            from: models
            empty: the command line's own default model
        git.autofetch_minutes:
            heading: editor
            section: Git
            help: Minutes between two automatic git fetch --prune of every repository oculus shows that has a remote, as VS Code's auto fetch. 0, the default, fetches only when Fetch is pressed; nothing else reaches a remote unasked. It is read again within a minute of a change.
            default: 0
            control: number
            min: 0
            max: 35791
            whole: true
        search.max_hits:
            heading: editor
            section: Search
            help: How many hits one answer of the Search view carries before it says it was cut.
            default: 500
            control: number
            min: 1
            whole: true
        search.timeout_s:
            heading: editor
            section: Search
            help: Seconds one root's ripgrep search, or its list of file names, is given.
            default: 10
            control: number
            min: 1
        search.max_names:
            heading: editor
            section: Search
            help: How many file names the palette's file mode lists in all before it says the list was cut.
            default: 100000
            control: number
            min: 1
            whole: true
        literature.timeout_s:
            heading: editor
            section: Literature search
            help: Seconds one source of the Literature search is given to answer a request. A source that has not answered by then shows that it gave no answer in time.
            default: 20
            control: number
            min: 1
            max: 120
            whole: true
        literature.per_source:
            heading: editor
            section: Literature search
            help: How many hits one page of the Literature search asks of each source. Semantic Scholar takes at most 100 and Web of Science at most 50, so a larger page is cut to what the source takes.
            default: 25
            control: number
            min: 1
            max: 100
            whole: true
        literature.cache_min:
            heading: editor
            section: Literature search
            help: Minutes the server keeps a source's answer for the same request, so a search run again, or a source switched off and on, is not asked a second time. 0 keeps nothing.
            default: 30
            control: number
            min: 0
            max: 1440
            whole: true
        open.program_ext:
            heading: editor
            section: Opening in programs
            help: The extensions a file may carry to be handed to a program on this machine, each with the bundle id of the one application it opens in. A file of any other extension, and a listed file with an execute bit or marked as a Finder alias, is refused, and a folder is shown in Finder rather than opened. Read again at every request.
            fields:
                key:
                    help: an extension with its dot, compared in lower case
                    control: text
                    form: extension
                value:
                    help: the bundle id of the application that opens it
                    control: text
                    form: bundle_id
                    from: bundle_ids
        apps.connect_timeout_s:
            heading: apps
            section: App limits
            help: Seconds an app's frame is given to complete the bridge handshake before it is drawn as failed to load.
            default: 10
            control: number
            min: 1
            max: 2147483
            whole: true
        apps.state_max_kb:
            heading: apps
            section: App limits
            help: Kilobytes of one tab's saved state that an app's `setState` accepts.
            default: 64
            control: number
            min: 1
            whole: true
        apps.store_max_kb:
            heading: apps
            section: App limits
            help: Kilobytes of an app's store that `setStore` accepts and `getStore` reads.
            default: 256
            control: number
            min: 1
            whole: true
        apps.writes_per_min:
            heading: apps
            section: App limits
            help: How many writes, `setStore` included, one frame or one host may send in a minute; a host's store updates, a secret's stores and deletes and a custom editor's saves count here.
            default: 30
            control: number
            min: 1
            whole: true
        apps.opens_per_min:
            heading: apps
            section: App limits
            help: How many calls of `open`, `commands.run`, `commands.execute` and `createPanel` one frame may send in a minute, and of `executeCommand` one host.
            default: 30
            control: number
            min: 1
            whole: true
        apps.messages_per_min:
            heading: apps
            section: App limits
            help: How many calls of `sendToPage` and of the `ui` calls (messages, quick pick, input box, progress) one host or frame may make in a minute.
            default: 600
            control: number
            min: 1
            whole: true
        apps.keys_per_s:
            heading: apps
            section: App limits
            help: How many key events per second the page takes from one frame.
            default: 20
            control: number
            min: 1
            whole: true
        apps.max_files:
            heading: apps
            section: App limits
            help: How many files an app's folder may hold before the app is refused.
            default: 500
            control: number
            min: 1
            whole: true
        apps.max_mb:
            heading: apps
            section: App limits
            help: How many megabytes an app's files may total before the app is refused, and the most a custom editor reads or saves in one file.
            default: 20
            control: number
            min: 1
            whole: true
        apps.host_output_kb:
            heading: apps
            section: App limits
            help: How many kilobytes of a host's output are kept, beside the last 1000 lines.
            default: 256
            control: number
            min: 1
            whole: true
        apps.host_stop_seconds:
            heading: apps
            section: App limits
            help: How many seconds a host's `deactivate` is given to settle before the host is sent SIGTERM.
            default: 5
            control: number
            min: 1
            whole: true
        apps.scan_entries:
            heading: apps
            section: App limits
            help: How many entries per root a `workspaceContains` look and a `readDirectory` read at most.
            default: 10000
            control: number
            min: 1
            whole: true
        apps.closed_paths:
            heading: apps
            section: Closed folders
            help: The folders, each relative to a root and applied to every root, that an app's `open({ file })` and custom editor never reach, compared by segment and without regard to letter case. A key that is missing or is not a list of folder paths closes every file.
            default: [secrets]
            control: list
    layout.yml:
        rail:
            heading: rail
            section: Rail buttons
            help: The rail's pages, one button per page, drawn in this order with the digits 1 to 9 showing the first nine. A page key named twice, or naming no arrangement, draws no second button and is a finding. The Settings view edits this list.
            fields:
                label: the words of the button
                glyph:
                    help: a glyph name of catalogs/glyphs.yml
                    control: glyph
                page:
                    help: a key of arrangements, which is what the page is first made from and what the saved page stays tied to
                    control: choice
                    from: arrangements
        nav_groups:
            heading: rail
            section: View catalogue
            help: The view catalogue's groups, in the order the Views view lists them. A group with no registered views is not listed.
            fields:
                key:
                    help: the page key of a rail entry, which is the key of the group
                    control: choice
                    from: rail_pages
                label: the words of the group heading
                glyph:
                    help: the heading's glyph name, one that no view of the group carries
                    control: glyph
                chord:
                    help: the one-letter keyboard prefix of the group, then a digit for the entry's place in the group
                    control: choice
                    options:
                        [
                            a,
                            b,
                            c,
                            d,
                            e,
                            f,
                            g,
                            h,
                            i,
                            j,
                            k,
                            l,
                            m,
                            n,
                            o,
                            p,
                            q,
                            r,
                            s,
                            t,
                            u,
                            v,
                            w,
                            x,
                            y,
                            z
                        ]
        direct_chord:
            heading: rail
            section: View catalogue
            help: The one lowercase letter that reaches, with a digit after it, the views of groups that name no chord and the views no group holds. A value that is not one lowercase letter means no such prefix.
            default: v
            control: choice
            options: [a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p, q, r, s, t, u, v, w, x, y, z]
            empty: no prefix
        arrangements:
            heading: rail
            section: Page layouts
            help: What each rail page is first made from, and what Reset gives it back. After the first press the page is the one the reader arranged, kept in the saved layout. An arrangement that does not add up makes no page.
            fields:
                key: a page key that a rail entry names
                root: the page's one layout tree, a split of dir, sizes and children or a pane of view, where view is one view id or a list of tabs and a tab may be a view id or a view with its own state
        workbench:
            heading: rail
            section: Page layouts
            help: What every workbench page is made from, and what its Reset layout gives back. A workbench is a page that belongs to one folder, and each of its tabs is given the folder when the page is made. It is the shape of one entry of the page layouts, and no rail entry can name it. A layout that does not add up makes no workbench.
            fields:
                root: the workbench page's one layout tree, a split of dir, sizes and children or a pane of view, where view is one view id or a list of tabs and a tab may be a view id or a view with its own state
        floats:
            heading: rail
            section: Floats
            help: The floats a browser with no saved layout starts with, and what Reset all pages gives back. A float is a pane over every page, docked on an edge of the window or free. After the first load the floats are the reader's own, kept in the saved layout. An entry that does not add up is left out and the rest kept, and of two entries docked on one edge the first stays.
            fields:
                view:
                    help: one view id or a list of tabs, as an arrangement's pane takes it
                    control: multi
                    from: views
                dock:
                    help: left, right or bottom, for a float docked on that edge of the window
                    control: choice
                    options: [left, right, bottom]
                size:
                    help: for a docked float, its share of the window's width, or of its height for bottom, from 0.1 to 0.6
                    control: number
                    min: 0.1
                    max: 0.6
                x:
                    help: for a free float, its left edge as a fraction of the window's width
                    control: number
                    min: 0
                    max: 1
                y:
                    help: for a free float, its top edge as a fraction of the window's height
                    control: number
                    min: 0
                    max: 1
                w:
                    help: for a free float, its width as a fraction of the window's width, at least 0.1
                    control: number
                    min: 0.1
                    max: 1
                h:
                    help: for a free float, its height as a fraction of the window's height, at least 0.1
                    control: number
                    min: 0.1
                    max: 1
        docs:
            heading: rail
            section: View catalogue
            help: Hub documents listed in the view catalogue. Each is one entry inside its group, listed after the group's views, and opens the doc view. An entry that is not three non-empty strings is dropped, and a path with no file there draws the view's own missing line. This is a setting of the hub, kept in the hub's .oculus/config/layout.yml; the engine's list is empty.
            fields:
                label: the words of the tab
                path:
                    help: the document's path relative to the research hub
                    control: file
                    allow_missing: true
                group:
                    help: a key of nav_groups
                    control: choice
                    from: nav_groups
        board.cols_project:
            heading: boards
            section: Board columns and search
            help: The list-view column headings of the Projects and Personal boards, written in the order of the fixed columns title, authors, venue, status, focus and next. A column with no heading here shows its cell name.
            default: [Project, Authors, Venue, Status, Focus, Next]
            control: list
            slots: [title, authors, venue, status, focus, next]
        board.cols_archive:
            heading: boards
            section: Board columns and search
            help: The list-view column headings of the Archive and Coauthor boards, written in the order of the fixed columns title, authors, venue, domain, pillar and funding. A column with no heading here shows its cell name.
            default: [Paper, Authors, Venue, Domain, Pillar, Funding]
            control: list
            slots: [title, authors, venue, domain, pillar, funding]
        board.cols_software:
            heading: boards
            section: Board columns and search
            help: The list-view column headings of the Software board, written in the order of the fixed columns title, authors, venue, domain, pillar and funding. A column with no heading here shows its cell name.
            default: [Software, Authors, Venue, Domain, Pillar, Funding]
            control: list
            slots: [title, authors, venue, domain, pillar, funding]
        board.search.projects:
            heading: boards
            section: Board columns and search
            help: The placeholder of the Projects board's search box.
            default: Search title | eli5 | results | ideas | doc text ...
            control: text
        board.search.personal:
            heading: boards
            section: Board columns and search
            help: The placeholder of the Personal board's search box.
            default: Search personal | title | eli5 | next | doc text ...
            control: text
        board.search.archive:
            heading: boards
            section: Board columns and search
            help: The placeholder of the Archive board's search box.
            default: Search archive | title | eli5 | outcome | doc text ...
            control: text
        board.search.coauthor:
            heading: boards
            section: Board columns and search
            help: The placeholder of the Coauthor board's search box.
            default: Search coauthor | title | eli5 | outcome | doc text ...
            control: text
        board.search.software:
            heading: boards
            section: Board columns and search
            help: The placeholder of the Software board's search box.
            default: Search software | title | eli5 | tags | doc text ...
            control: text
        tab_split:
            heading: boards
            section: Tab badges
            help: The colours of the count split on the Projects tab button, one cell per project type. A type with no colour here, or one that is not a lowercase hue name, draws in the unknown tone.
            fields:
                key:
                    help: a project type, active or idea
                    control: choice
                    options: [active, idea]
                value:
                    help: the palette hue name the type's count wears
                    control: hue
        tab_rollup:
            heading: boards
            section: Tab badges
            help: The count buckets of each board. The Personal, Archive and Coauthor tab buttons draw their counts split by bucket, and the category facet of a board's filter takes the bucket's colour. Buckets are mutually exclusive, and a card lands in the first bucket whose keys its type or one of its status chips matches.
            holds: lists
            fields:
                key:
                    help: a board id, projects, personal, archive, coauthor or software
                    control: choice
                    options: [projects, personal, archive, coauthor, software]
                label: the words of the bucket, which also give its id
                keys:
                    help: the project types and status chips the bucket counts
                    control: multi
                    from: [status_chips, project_types]
                color:
                    help: the colour of the bucket's count
                    control: colour
        nav_live:
            heading: boards
            section: Tab badges
            help: The live count badges on collection tabs. The badge counts the entries whose status matches, in the colour of that status unless a tone forces an urgency class.
            fields:
                key:
                    help: a collection key
                    control: choice
                    from: collections
                match:
                    help: the entry statuses that count, compared without regard to case
                    control: multi
                    from: entry_statuses
                label: the tooltip word for the count
                tone:
                    help: an urgency class, red, amber or green, used where a count means act
                    control: choice
                    options: [red, amber, green]
        focus_label_mode:
            heading: boards
            section: Project labels
            help: How the Focus board's lane cards and the week's ticker lines name a project. short draws the manifest's short name and the full title where there is none, full always draws the full title. Any other value counts as short. The project tab opened from a card and the quick-add picker keep the short name. A lane card shows the full title on hover; a ticker line has no hover title.
            default: short
            control: choice
            options: [short, full]
        project_label_mode:
            heading: boards
            section: Project labels
            help: How the Projects, Personal and Software boards name a project when they open. short draws the manifest's short name and the full title where there is none, full always draws the full title. Any other value counts as short. The board's Aa toggle overrides it for the viewer.
            default: short
            control: choice
            options: [short, full]
        archive_label_mode:
            heading: boards
            section: Project labels
            help: How the Archive and Coauthor boards name a project when they open. short draws the manifest's short name and the full title where there is none, full always draws the full title. Any other value counts as short. The board's Aa toggle overrides it for the viewer.
            default: short
            control: choice
            options: [short, full]
        map_label_mode:
            heading: boards
            section: Project labels
            help: How the Map names a project node. short draws the manifest's short name and the full title where there is none, full always draws the full title. Any other value counts as short.
            default: short
            control: choice
            options: [short, full]
    present.yml:
        defaults.tag_tones:
            heading: presentation
            section: Status chips
            help: The hue each tag class of a project slide wears.
            fields:
                key:
                    help: a slide tag class
                    control: choice
                    from: slide_tags
                value:
                    help: a palette hue name
                    control: hue
    sources.yml:
        portfolio_deck:
            heading: sources
            section: Portfolio deck
            help: The folder, relative to the hub, of the portfolio deck, the deck the Present view opens when a pane names none. It holds a present.yml and the Markdown slide files. A folder that is not there leaves the Present view with nothing to draw and says so.
            default: deck
            control: folder
        scan:
            heading: sources
            section: Project scan
            help: Where to find projects, with paths relative to the hub. A project is any folder that holds a project.yml, at any depth under the rule's dir; the walk stops at a project and does not enter a dot folder, node_modules or a symbolic link, and a project's tier and type are the manifest's own tier and type lines, not the folder's. When a project lies deeper than one level, the first folder under the rule's dir is its category. A rule with no dir is a finding, so is a key other than dir and optional, and a folder that is not there is a finding unless the rule is optional.
            fields:
                dir:
                    help: the folder scanned, relative to the hub
                    control: folder
                    allow_missing: optional
                optional:
                    help: true when a hub without the folder reports nothing
                    control: toggle
        new_project_dir:
            heading: sources
            section: Project scan
            help: The folder a new project is made in, for each tier. The New project form of a board offers it in its Folder field, and an app's new-project write with no folder uses it. A folder must be a scan folder or lie under one, so the project is read once made; an entry for a word that is not a tier, or one that names a folder outside the scan, is a finding. A tier with no entry has no folder to offer and its form asks for one. This is a setting of the hub kept in the hub's .oculus/config/sources.yml; the engine's map is empty.
            fields:
                key:
                    help: the tier the folder is for, projects, coauthor, archive or personal
                    control: choice
                    options: [projects, coauthor, archive, personal]
                value:
                    help: the folder new projects of the tier are made in, relative to the hub
                    control: folder
                    allow_missing: optional
        languages:
            heading: editor
            section: File languages
            help: The language each file opens in, for its colours, its comment keys and the status bar. A file's language is the first match of its whole name lowercased, then of its extension lowercased, so a file called CMakeLists.txt is CMake before its .txt is read; a file no entry matches opens as plain text, a dotfile such as .bashrc included, since it has no extension. A language the editor does not colour is refused, and so is an entry that is not an extension with its dot or a file name without a slash; two languages that claim one ending keep the first in the file.
            holds: lists
            fields:
                key:
                    help: the language's name as the editor and the status bar show it
                    control: choice
                    from: languages
                value:
                    help: the extensions (with their dot) and whole file names of that language
                    control: list
        venues_file:
            heading: sources
            section: Registry and feed files
            help: The venue catalogue, journals and conferences, that the Venues tab and the venue audit read.
            default: registries/venues.yml
            control: file
        datasets_file:
            heading: sources
            section: Registry and feed files
            help: The dataset registry that the Data tab reads, with the provenance and recovery recipe of each dataset.
            default: registries/data.yml
            control: file
        pillars_file:
            heading: sources
            section: Registry and feed files
            help: The pillars registry that the Pillars tab reads. A project's pillar is matched to its keys.
            default: registries/pillars.yml
            control: file
        domains_file:
            heading: sources
            section: Registry and feed files
            help: The domains registry that the Domains tab reads. A project's domain is matched to its keys.
            default: registries/domains.yml
            control: file
        people_file:
            heading: sources
            section: Registry and feed files
            help: The people registry, one entry per human the hub names, that a project's collaborators and waiting-on, a joint-work entry's person and the Person view read. Exactly one entry carries self, the hub's owner.
            default: registries/people.yml
            control: file
        organisations_file:
            heading: sources
            section: Registry and feed files
            help: The organisations registry, the universities, hospitals, funders and companies that a person's affiliations and a funding scheme's funder point at.
            default: registries/organisations.yml
            control: file
        resources_file:
            heading: sources
            section: Registry and feed files
            help: "The resources registry, the clusters, machines and storage a project's compute: and slurm.resource name."
            default: registries/resources.yml
            control: file
        collections:
            heading: sources
            section: Collections
            help: The collection tabs, each a generic card list from one YAML file. An entry needs a key and a file, and two entries with one key are a finding, the later file winning. Each key except venues, datasets, pillars, domains and data also becomes a collection view.
            fields:
                key: the collection's key, which the view and the entries' cross-links use
                file:
                    help: the YAML file of the collection, relative to the hub
                    control: file
        leads_file:
            heading: sources
            section: Registry and feed files
            help: The position scout's YAML that the Position Leads view reads as cards. Its search specification belongs to the research-cockpit skill.
            default: feeds/position-leads.yml
            control: file
        radar_file:
            heading: sources
            section: Registry and feed files
            help: The literature scout's accumulated radar that the Lit Watch view reads. The refresh workflow deduplicates by URL and appends entries.
            default: feeds/literature-radar.yml
            control: file
        publications_file:
            heading: sources
            section: Registry and feed files
            help: The public website's publications feed, cross-checked in the Audit view for missing, leaked, wrong-section and untracked entries. Empty names no file, and the check is skipped, as it is when the file is not checked out. This is a setting of the hub, kept in the hub's .oculus/config/sources.yml.
            default: ''
            control: file
            empty: true
            allow_missing: true
        linkedin_dir:
            heading: sources
            section: Registry and feed files
            help: The folder of the LinkedIn posts pipeline on the website, where a numbered file is posted and an xx- file is an idea. Empty names no folder, and the LinkedIn view says so. This is a setting of the hub, kept in the hub's .oculus/config/sources.yml.
            default: ''
            control: folder
            empty: true
        career_file:
            heading: sources
            section: Registry and feed files
            help: The career strategy file, whose order of work, hosts, eligibility and dropped routes surface on the Focus board's Career strategy panel. The per-scheme statements surface on the Funding tab.
            default: registries/career.yml
            control: file
        memories_dir:
            heading: sources
            section: Folders
            help: The folder of this hub's photo wall, relative to the hub and inside it. Every .jpg, .jpeg, .png and .webp in it is a tile of the Memories view, and the view's add control puts new pictures in the primary hub's folder, else in the first hub's when the workspace has no primary. A value outside the hub is a finding and the standard folder is used. This is a setting of the hub, kept in its .oculus/config/sources.yml.
            default: .oculus/memories
            control: folder
            allow_missing: true
        wallpaper_dir:
            heading: sources
            section: Folders
            help: The folder of this hub's wallpaper images, relative to the hub and inside it. The wallpaper.image key names one of them as the hub's name and the file's name joined by a slash, and the picker in the Settings view lists every hub's folder. A value outside the hub is a finding and the standard folder is used. This is a setting of the hub, kept in its .oculus/config/sources.yml.
            default: .oculus/wallpaper
            control: folder
            allow_missing: true
        repository_scan_depth:
            heading: sources
            section: Folders
            help: How many folder levels below each folder of the open workspace the Repositories view looks for repositories, so a folder of clones lists each clone. 0 lists only the folders themselves. A change is read again at once.
            default: 1
            control: number
            min: 0
            max: 3
            whole: true
    local.yml:
        port:
            section: Server
            control: number
            whole: true
            help: The port the oculus server listens on, bound to 127.0.0.1. It must be a whole number. Without it the port is 8790. Only the primary hub's file sets it, and it is read when the server starts, so a restart takes a change.
        hpc_host:
            section: HPC host
            help: This machine's ssh alias for the Live HPC view. It takes precedence over the host of the cluster that slurm.resource of behavior.yml names. A change is read again at once.
        sessions_cache:
            section: Sessions
            help: Where the session layer keeps its byte-offset cache. Without it the file is ~/.oculus/transcript-cache.json. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        sessions_overrides:
            section: Sessions
            help: Where the per-session overrides live. Without it the file is ~/.oculus/sessions.json. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        bookmarks:
            section: Saved files
            help: Where the reader's own bookmarks live. Without it the file is .oculus/bookmarks.yml in the primary hub. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        notes:
            section: Saved files
            help: Where the scratch notes live. Without it the folder is .oculus/notes in the primary hub. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        changes:
            section: Saved files
            help: Where the change log lives. Without it the file is ~/.oculus/changes.jsonl. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        history:
            section: Saved files
            help: Where the local history lives, one folder per file with a copy of the file as it was before each save and before each delete. Up to 50 copies of a save are kept per file, none of a file over 256 KB, and a delete keeps the content of a file up to 5 MB, the newest 50 such copies over all files. Without it the folder is ~/.oculus/history. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        approvals:
            section: Saved files
            help: 'Where the approvals live: the project commands and debug launches, apps, interpreters and Svelte configurations a reader approved, each under a key made from its text. Without it the file is ~/.oculus/approvals.json, mode 0600, in ~/.oculus, which each write makes mode 0700 when it is looser; a file named here leaves the mode of its folder as it is. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.'
        lsp:
            section: Saved files
            help: Where the language servers keep this machine's state, a folder per served root named by a hash of the root's real path, holding the index clangd writes there instead of into the repository, and choices.json, the interpreter and the compile database chosen for each repository. Without it the folder is ~/.oculus/lsp. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change ends every language server, and each starts again on its next document under the new folder; the old folder is left as it was.
        schedules:
            section: Saved files
            help: Where the schedules live, the entries the update tray's Schedules section lists and a reader may write by hand. Without it the file is .oculus/schedules.yml in the primary hub. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        schedule_record:
            section: Saved files
            help: Where the schedules' run record lives, each schedule's latest runs and the last due time it handled. Without it the file is ~/.oculus/schedule.json, mode 0600 when oculus creates it. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        claude_bin:
            section: Programs
            help: The Claude command line that the chat terminals, the worktree agents, the usage refresh, the update tasks, the prompts of schedules and the suggested commit messages are started with, an absolute path or a name resolved on PATH. Without it the name is claude. A change is read again at once.
        open_bin:
            section: Programs
            help: The program that an https address is handed to, such as a provider's consent page, an event or a thread at its provider. Without it the address goes to macOS's /usr/bin/open. A change is read again at once.
        rite_dap_bin:
            section: Programs
            help: The rite debug adapter that the Debug view starts, rite_dap of a cathedra build, an absolute path, a path under ~/ or a name resolved on PATH. Without it the name is rite_dap. A change is read again at once.
        accounts:
            section: Usage accounts
            help: The Claude and Codex configuration folders that the Usage view reads, a list of tool (claude or codex), dir and label. The rows of every hub's file are read together, each marked with its hub. Without a row in any hub's file the two default folders, ~/.claude and ~/.codex, are read. A Claude label must stay unique once reduced to lowercase letters, digits and dashes across the hubs; a later repeat is left out with a finding. A change is read again at once.
            fields:
                tool:
                    help: claude or codex, the tool whose folder this is
                    control: choice
                    options: [claude, codex]
                dir: the configuration folder the Usage view reads, an absolute path, a path under ~/ or one relative to the folder of the hub that holds this file
                label: the words the Usage view shows the account under
        calendars:
            section: Calendar accounts
            help: The calendar accounts that the Calendar view reads, a list of provider (google, microsoft or ics) and label. The label is lowercase letters, digits and dashes and is unique per provider. The rows of every hub's file are read together, each marked with its hub. Without it no calendar is read. A change is read again at once.
            fields:
                provider:
                    help: google, microsoft or ics, the service the calendar is read from
                    control: choice
                    options: [google, microsoft, ics]
                label: the account's name, lowercase letters, digits and dashes, unique per provider
        calendar_dir:
            section: Calendar accounts
            help: Where the per-account calendar credential files live. Without it the folder is ~/.oculus/calendar. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        mail:
            section: Mail accounts
            help: The mail accounts that the Inbox view reads, a list of provider (google or microsoft) and label. The label is lowercase letters, digits and dashes and is unique per provider. The rows of every hub's file are read together, each marked with its hub. Without it no mail is read. A change is read again at once.
            fields:
                provider:
                    help: google or microsoft, the service the mail is read from
                    control: choice
                    options: [google, microsoft]
                label: the account's name, lowercase letters, digits and dashes, unique per provider
        mail_dir:
            section: Mail accounts
            help: Where the per-account mail credential files and the triage notes live. Without it the folder is ~/.oculus/mail. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
        literature.wos_key:
            section: Literature search
            help: Under `literature:`, the Web of Science Starter API key. Without it the Web of Science toggle of the Literature search is switched off. A change is read again at the next search.
        literature.scopus_key:
            section: Literature search
            help: Under `literature:`, the Elsevier API key for Scopus. Without it the Scopus toggle of the Literature search is switched off. A change is read again at the next search.
        literature.scopus_insttoken:
            section: Literature search
            help: Under `literature:`, the Elsevier institutional token that goes with the Scopus key, sent when the key needs one. A change is read again at the next search.
        literature.openalex_key:
            section: Literature search
            help: Under `literature:`, an OpenAlex API key. Without it OpenAlex allows about 100 searches a day. A change is read again at the next search.
        literature.semantic_scholar_key:
            section: Literature search
            help: Under `literature:`, a Semantic Scholar API key. Without it Semantic Scholar often answers that too many requests were made. A change is read again at the next search.
        literature.ncbi_key:
            section: Literature search
            help: Under `literature:`, an NCBI API key, which lets PubMed answer more requests a second. A change is read again at the next search.
        literature.mailto:
            section: Literature search
            help: Under `literature:`, the contact address that OpenAlex, Crossref and NCBI ask callers to send with a request. A change is read again at the next search.
        apps_dir:
            section: Apps
            help: Where the machine's apps live, one folder of web files per app. Without it the folder is .oculus/apps in the primary hub, which the hub's owner writes and a git pull into the hub writes too; an app kept approved stays approved through a change to any of its files but app.yml, a pulled change included, while the server runs. A value of ~ or one starting with ~/ is under the home folder, and any other relative value is resolved against the folder of the hub that holds this file. A change is read again at once.
