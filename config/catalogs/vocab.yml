# The stages a project's work is at, keyed by the manifest's `stage`, in the order a board's slices, the Map and the project form list stages in: the idea group (nascent, scoping), the in-flight group (de-risking to revision) and the done group (published to stopped). `label` is the words the stage is drawn with on a card, the Present view's idea cards and the form, `icon` the glyph name a chip of the stage carries (a key of glyphs.yml), and `color` the colour of a project at the stage wherever it is drawn (its board card, the Map, the Present view's project chip). The flags say what a stage decides, each compared with the manifest's `stage` as written (`hasWord`), and a stage without a flag is not one of them:
# - `idea`: the idea group: the cross-link group of ideas, and the Focus board's unplaced projects, which list a project of any tier at such a stage that no lane takes. The Idea lane holds only `nascent`.
# - `live`: the in-flight group: the audit's rules over in-flight work (results, datasets, the ELI5), the Focus board's unplaced projects and manifests behind, a pillar card's in-flight count and tier strip, a venue's concentration marker and the Funding tab's card of unfunded work.
# - `terminal`: the done group, a done or closed outcome: the cross-link group of done projects, the boards that take or leave out done work by it (`stages: { flags: [terminal] }` in layout.yml), quick add, which offers no such project, and the Focus chip lanes, which hold none; the audit lists such a project that carries a chip of a chip lane.
# - `dead`: a dead outcome, written as a whole number from 1 that is the stage's place in the Pillars view's Archival band, whose groups go in that order. The `dead-ends` row of `categories:` below takes these stages, and the cross-link groups leave a project at such a stage out.
# - `on_map`: a stage that keeps a Pillars or Domains card awake: a card none of whose members is at such a stage is dormant.
# - `placed`: a stage that has a venue, so the audit asks for one.
# - `public`, `negative`, `dead_end`: the publication kind a stage gives in the audit of the website's publications, whose sections are the rows of `audit.website.kinds` in the hub's .oculus/config.yml.
# - `pauses_countdown`: a stage that stops a card's and a lane's countdown, and that the Focus board's awaiting box counts as submitted work held at its venue.
# - `deadline_met`: a stage that ends a project's own deadline, which then leaves the deadline radar.
# - `new_idea`: the stage a new idea is made with; the first such stage is written, and with none the new manifest names no stage.
stages:
  nascent:      { label: "nascent (concept)", icon: white, color: "#7c5cff", idea: true, on_map: true, new_idea: true }
  scoping:      { label: "scoping (lit-check and framing)", icon: yellow, color: "#0891b2", idea: true, on_map: true }
  de-risking:   { label: "de-risking (feasibility experiment)", icon: blue, color: "#16a34a", live: true, on_map: true }
  exploring:    { label: exploring, icon: orange, color: "#f59e0b", live: true, on_map: true }
  in-prep:      { label: "in preparation", icon: writing, color: "#a16207", live: true, on_map: true, placed: true, public: true }
  building:     { label: building, icon: active, color: "#d4a017", live: true, on_map: true }
  submit-ready: { label: "submit-ready", icon: green, color: "#ea580c", live: true, on_map: true, placed: true, public: true }
  submitted:    { label: "submitted / under review", icon: brown, color: "#0ea5e9", live: true, on_map: true, placed: true, public: true, pauses_countdown: true, deadline_met: true }
  revision:     { label: "major revision (back with the authors)", icon: orange_square, color: "#b45309", live: true, on_map: true, placed: true, public: true }
  published:    { label: published, icon: done, color: "#16a34a", terminal: true, placed: true, public: true }
  released:     { label: released, icon: done, color: "#0d9488", terminal: true }
  failed:       { label: "failed (no-go or disproved)", icon: cross_box, color: "#dc2626", dead: 1, terminal: true, negative: true }
  stopped:      { label: "stopped (dropped or abandoned)", icon: trash, color: "#9ca3af", dead: 2, terminal: true, dead_end: true }


# The form of a project's output, keyed by the manifest's single `form`, in the order the project form offers them. A form is drawn after the stage on a card, with its `label` and its `icon` (a key of glyphs.yml); a board's `forms:` in layout.yml and a row of `categories:` below may name it, and so may a row of `audit.website.kinds` in the hub's .oculus/config.yml. A software project has no form: its tier says what it is.
forms:
  journal:     { label: "journal article", icon: journals }
  conference:  { label: "conference paper", icon: conference }
  thesis:      { label: thesis, icon: book }
  abstract:    { label: "extended abstract", icon: page }
  poster:      { label: poster, icon: poster }
  tech-report: { label: "tech report (not peer-reviewed)", icon: paper }


# The chips a project's manifest picks for its `status.chips`, the situation of the work, in the order the project form offers them. A chip is drawn on a card after the stage and the form, with its `label` and its `icon` (a key of glyphs.yml); a chip carries no colour. A stage word or a form written as a chip is a finding of the hub check, since each has its own field. The one flag, and a chip without it is not one:
# - `blocked`: a chip the Focus board's awaiting box counts as blocked and a project board counts in the red badge of its Situation button, which the wait line of a board card and of a lane card says, and which flags the cross-link group of in-flight projects it is in; a project's chips are compared as written (`anyWord`).
chips:
  blocked:          { label: "blocked (external)", icon: purple, blocked: true }
  parked:           { label: "parked (not being worked)", icon: black }
  results-in:       { label: "results in, not written up", icon: white }
  admin-prep:       { label: "admin/prep", icon: yellow }
  numbers-to-run:   { label: "numbers still to run", icon: blue }
  ai-tells:         { label: "AI-writing tells", icon: red }


# The statuses a collection entry's `status` takes, each with the `color` it is drawn in, and the flags that say what a status decides; a status the list does not hold is a finding naming the closest word when that word is within half the written status's length in single-letter changes, rounded down. Each line says how the code compares a status with the flag: `wordFlag` trims an entry's status and puts it in lower case:
# - `closes_deadline`: the status ends an entry's deadline on the deadline radar; compared trimmed and in lower case (`wordFlag`).
# - `deadline_met`: the status ends a funding entry's or another entry's own deadline, so it leaves the deadline radar, and a funding entry carrying it is listed in the Focus board's awaiting box; compared trimmed and in lower case (`wordFlag`).
# - `live_subtasks`: a status with `closes_deadline` under which an entry's subtasks and follow-up notes stay on the radar; compared trimmed and in lower case (`wordFlag`).
# - `waiting`: an entry waiting on someone else, which the audit asks a date to track by; the audit compares the entry's status in lower case, untrimmed.
# - `acknowledged`: a funding entry a manuscript acknowledges, so it needs a `statement`; the entry's status is compared as written.
# - `default_application`: the status of the Applications entry a Position Lead's apply control makes; the first such word is written, and nothing is compared with it.
# - `default_task`: the status of a task added from the palette; the first such word is written, and nothing is compared with it.
# - `obtained`: the status is funding obtained, which the career banner's track record counts; compared trimmed and in lower case (`wordFlag`).
statuses:
  submitted:     { color: "#b45309", deadline_met: true, waiting: true }
  revision:      { color: "#b45309" }
  accepted:      { color: "#2563eb", closes_deadline: true }
  published:     { color: "#0ea5e9", closes_deadline: true }
  in-prep:       { color: "#7c5cff" }
  dropped:       { color: "#ea580c", closes_deadline: true }
  exploring:     { color: "#7c5cff" }
  nascent:       { color: "#7c5cff" }
  scoping:       { color: "#0891b2" }
  de-risking:    { color: "#16a34a" }
  building:      { color: "#d4a017" }
  running:       { color: "#16a34a" }
  finished:      { color: "#0ea5e9", closes_deadline: true }
  paused:        { color: "#9ca3af" }
  # live and in flight, still on the deadline radar
  planned:       { color: "#7c5cff" }
  preparing:     { color: "#7c5cff" }
  draft:         { color: "#7c5cff" }
  pending:       { color: "#b45309", waiting: true }
  under-review:  { color: "#b45309", deadline_met: true, waiting: true }
  upcoming:      { color: "#b45309" }
  active:        { color: "#16a34a" }
  collaborator:  { color: "#0891b2" }
  todo:          { color: "#b45309", default_task: true }
  doing:         { color: "#16a34a" }
  # these statuses close an entry
  ongoing:       { color: "#16a34a", closes_deadline: true, live_subtasks: true }
  completed:     { color: "#0ea5e9", closes_deadline: true }
  done:          { color: "#0ea5e9", closes_deadline: true }
  awarded:       { color: "#16a34a", closes_deadline: true, acknowledged: true, obtained: true }
  granted:       { color: "#16a34a", closes_deadline: true, obtained: true }
  contributing:  { color: "#0891b2", closes_deadline: true, acknowledged: true }
  rejected:      { color: "#dc2626", closes_deadline: true }
  "not funded":  { color: "#dc2626", closes_deadline: true }
  declined:      { color: "#ea580c", closes_deadline: true }
  withdrawn:     { color: "#475569", closes_deadline: true }
  not-applied:   { color: "#9ca3af", closes_deadline: true, default_application: true }
  not-attending: { color: "#9ca3af", closes_deadline: true }
  cancelled:     { color: "#9ca3af", closes_deadline: true }
  past:          { color: "#9ca3af", closes_deadline: true }
  skipped:       { color: "#9ca3af", closes_deadline: true }
  passed:        { color: "#9ca3af", closes_deadline: true }
  ready:         { color: "#16a34a" }
  archived:      { color: "#9ca3af", closes_deadline: true }
  applied:       { color: "#0891b2", closes_deadline: true }


# The statuses a Position Lead's `status` takes, each with the `color` it is drawn in where it has one, and the flags that say what it decides; a status the list does not hold is a finding naming the closest word when that word is within half the written status's length in single-letter changes, rounded down. Every flag is compared trimmed and in lower case (`wordFlag`):
# - `lead_closed`: a Position Lead that is closed, counted and listed as done.
# - `lead_declined`: a Position Lead the reader declined, which the Leads view hides until asked; the first such word is what the decline control writes.
# - `lead_applied`: a Position Lead the reader applied to, which offers no apply control; the first such word is what the apply control writes.
# - `default_lead`: the status a new Position Lead gets and a reopened one goes back to, and the one status the decline control is offered on.
lead_statuses:
  declined:  { color: "#ea580c", lead_closed: true, lead_declined: true }
  applied:   { color: "#0891b2", lead_closed: true, lead_applied: true }
  closed:    { lead_closed: true }
  dismissed: { lead_closed: true, lead_declined: true }
  open:      { default_lead: true }


# Focus lanes form one lifecycle, grouped into current, parked and incubating work, with the Idea lane under them. A row's `icon` is the glyph name drawn before the lane's label on a project card and in the lane's heading on the Focus board (a key of glyphs.yml); a row naming none, or a name glyphs.yml lacks, is drawn with the glyph `focus`. A project sits on the first lane, in this order, whose `chips` holds one of the project's `status.chips` while its stage does not carry `terminal`, else on the first lane whose `stages` holds its `stage`, else on none; a row names `stages` or `chips` and never both, and a stage word is held by one row only. A move onto a lane with `stages` keeps the project's stage when the lane holds it and writes the lane's first stage otherwise, and takes off the chips of every lane with `chips`; a move onto a lane with `chips` adds the lane's first chip and takes off the chips of the other lanes with `chips`, leaving the stage as it is. The lanes of the cluster `idea` are drawn full width under the three clusters and take a project of any tier at a stage they list. With every cluster open and every Funding, Jobs and Teaching column drawn, a lane's colour differs by a CIEDE2000 of 10 or more, under every theme, from the header drawn next to it, the one stacked above or below it in the three-column layout, and the full-width Idea lane. A collapsed cluster or a column with nothing in it brings other headers together, and no choice of colours keeps all of those apart: ten of the pairs that touch only in such a layout are below 10 under at least one theme, among them Build and Teaching, which share teal in every theme, Backburner and Jobs, which share a grey, Funding and Revise, gold against amber, and Blocked above the Idea lane in mocha and everforest.
focus_lanes:
  - { key: run,        label: Run,        icon: live,    sub: "experiments / getting the numbers", color: "#16a34a", cluster: now,      stages: [exploring] }
  - { key: push,       label: Push,       icon: draft,   sub: "drafting toward first submission",  color: "#2563eb", cluster: now,      stages: [in-prep, submit-ready] }
  - { key: revise,     label: Revise,     icon: edit,    sub: "back from a venue (R&R or reject)",  color: "#b45309", cluster: now,      stages: [revision] }
  - { key: review,     label: Review,     icon: stale,   sub: "under peer review, hands off",       color: "#475569", cluster: parked,   stages: [submitted] }
  - { key: blocked,    label: Blocked,    icon: overdue, sub: "waiting on you / coauthor",          color: "#dc2626", cluster: parked,   chips: [blocked] }
  - { key: backburner, label: Backburner, icon: snooze,  sub: "deprioritized, not being worked",    color: "#9ca3af", cluster: parked,   chips: [parked] }
  - { key: scope,      label: Scope,      icon: compass, sub: "shaping + novelty check",            color: "#0e7490", cluster: incubate, stages: [scoping] }
  - { key: derisk,     label: De-risk,    icon: flag,    sub: "Tier-0 go / no-go pilot",            color: "#f59e0b", cluster: incubate, stages: [de-risking] }
  - { key: build,      label: Build,      icon: build,   sub: "strongest version -> manuscript",    color: "#0d9488", cluster: incubate, stages: [building] }
  - { key: idea,       label: Idea,       icon: idea,    sub: "ideas not started yet: drag onto a lane to start, or drop here to make it an idea again", color: "#b5638a", cluster: idea,     stages: [nascent] }


# Funding stages stacked inside the Focus Funding column (label / colour / the statuses each matches).
fund_stages:
  - { label: "In prep",   color: "#d4a017", statuses: [in-prep] }
  - { label: "Submitted", color: "#16a34a", statuses: [submitted, under-review] }
  - { label: "Planned",   color: "#0891b2", statuses: [planned] }

# Collection lane bars are independent of the stage colours inside Funding. The three hues follow the Idea lane above them and each other under the same distance rule as `focus_lanes`.
focus_lane_tones: { funding: gold, jobs: grey-d, teaching: teal }

# The colour of each filter group of a project board's bar, by the group, as a palette tone: the group's heading in the More list, and the dot, the fill and the Venue bar of a value with no colour of its own.
facet_tones:
  code: cyan
  compute: cyan
  dataset: cyan
  domain: teal
  form: pink
  funding: cyan
  hub: grey-d
  pillar: cyan
  reproduced: cyan
  role: blue
  sessions: cyan
  status: purple
  venue: amber
  year: slate


# The kinds of project a manifest's `tier` names, each with the words it is drawn with, in the order the project form offers them; `unmarked: true` leaves a tier off a Focus lane card's tags, on any number of tiers or none. A board takes projects by their tier (its `tier:` in layout.yml), and a new project whose form names no tier gets the first word.
tiers:
  research: { label: Research, unmarked: true }
  personal: { label: Personal }
  software: { label: Software }


# The tiers the audit's research rules leave alone (the results, datasets and ELI5 of work in flight, the venue, and every check the hub's `audit:` setting names: its required files and sections, its stage folders and the website's publications), and whose projects the Pillars view's Orphans card leaves out: `skip_tiers`.
research_audit: { skip_tiers: [personal] }


# The user's roles on a project or a collection entry, highest first. A row with `unmarked: true` is left off a Focus lane card's tags, on any number of rows or none. A row's `field` is a field of the record that lists people by their key: the user's role is the first row whose field holds the person the workspace setting `self` names, else the row without a field (`other`) when the record names people in any of these fields, and a record naming no one has no role. A board's `role:` in layout.yml names the roles it takes; a board, and a collection whose `schema:` declares one of the fields, draws a Role facet of every row, a Lead badge on a record whose `lead` holds the user and a Mine only toggle, which keeps a record whose fields hold the user or that names no one; a project board applies the toggle only where one of its projects is one the toggle does not keep, and draws it disabled elsewhere. With no `self`, no role is read.
roles:
  - { key: lead,         label: Lead,         field: lead, unmarked: true }
  - { key: supervisor,   label: Supervisor,   field: supervisors }
  - { key: collaborator, label: Collaborator, field: collaborators }
  - { key: other,        label: Other }


# The categories a project is filed under on every board, in order: a project's category is the first row whose `stages:` and `forms:` blocks it meets, each block with the lists `words` (one of the project's words is listed), `not_words` (none is), `flags` (its word carries one of the flags) and `not_flags` (it carries none), and a project no row holds has none. A board shows the rows that hold at least one of its projects, in this order: its sections, the slices of its bar and the counts of its tab. A row without `color` is drawn in the colour of the first stage of `stages:` its `stages:` block takes, and a row with neither is a finding. The flags:
# - `record`: the row is a record of the work's output.
# - `rail`: a board gives the rail the count of its projects in such rows, in the colour of the first such row.
# - `archival`: the Pillars view's Archival band, which groups these projects by the `dead` number of their stage; such a project is no real work, so a venue's use counts, the Orphans card and a pillar's and a domain's members leave it out.
categories:
  - { key: in-review,     label: "in review",     stages: { words: [submitted] }, record: true }
  - { key: in-flight,     label: "in flight",     stages: { flags: [live] }, record: true, rail: true }
  - { key: idea,          label: idea,            stages: { words: [nascent, scoping] } }
  - { key: publications,  label: publications,    stages: { words: [published] }, forms: { words: [journal, conference] }, color: "#db2777", record: true }
  - { key: other-outputs, label: "other outputs", stages: { words: [published] }, forms: { words: [thesis, abstract, poster, tech-report] }, color: "#9333ea", record: true }
  - { key: released,      label: released,        stages: { words: [released] } }
  - { key: dead-ends,     label: dead-ends,       stages: { flags: [dead] }, color: "#9ca3af", archival: true }


# Dataset access -> chip colour.
data_access: { open: "#16a34a", registration: "#b45309", credentialed: "#dc2626", private: "#475569" }


# Venue prestige tiers: the controlled vocabulary + colours for a venue's `tier:` (the venues registry). A curated JUDGMENT, NOT derived from JIF (so AAAI/TSP read flagship with no JIF, and a wide JIF band isn't flattened into one label). Order = ranking (best first). The venues schema's `tier` takes its options from the ASSIGNABLE keys here; the Pillars tab colours its tier spread from these. `unrated` is the computed fallback (no venue / no tier), `assignable: false` so it's not offered as a choice.
venue_categories: [journal, conference, thesis, meeting]
venue_tiers:
  - { key: flagship,   color: "#7c3aed", label: "flagship" }
  - { key: strong,     color: "#0d9488", label: "strong" }
  - { key: specialist, color: "#0891b2", label: "specialist" }
  - { key: unrated,    color: "#94a3b8", label: "unrated", assignable: false }

# Lit-Watch radar buckets: (key, glyph name, label, colour). New papers per project are classified into one of these; `glyph` is a `glyphs:` key. A bucket's label and colour are set here.
radar_buckets:
  - { key: preemption,    glyph: red,    label: "Pre-emption risk", color: "#dc2626" }
  - { key: idea,          glyph: purple, label: "Idea sparks",      color: "#7c5cff" }
  - { key: cite_baseline, glyph: green,  label: "Cite / baseline",  color: "#16a34a" }
  - { key: adjacent,      glyph: white,  label: "Adjacent",         color: "#94a3b8" }
