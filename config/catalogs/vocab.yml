# The stages a project's work is at, keyed by the manifest's `stage`, in the order every board splits its stage buttons by and the board statistics, the Map and the project form list stages in: the idea group (idea, nascent, scoping), the in-flight group (de-risking to accepted), the done group (published to abandoned) and paused, which is in none. `label` is the words the stage is drawn with on a card, the Present view's idea cards and the form, `icon` the glyph name a chip of the stage carries (a key of glyphs.yml), and `color` the colour of a project at the stage wherever it is drawn (its board card, the Map, the Present view's project chip). The flags say what a stage decides, each compared with the manifest's `stage` as written (`hasWord`), and a stage without a flag is not one of them:
# - `idea`: the idea group: the backlog of ideas on the Focus board and the cross-link group of ideas.
# - `live`: the in-flight group: the audit's rules over in-flight work (results, datasets, the ELI5), the Focus board's unplaced projects and manifests behind, a pillar card's in-flight count and tier strip, a venue's concentration marker and the Funding tab's card of unfunded work.
# - `terminal`: the done group, a done or closed outcome; no rule of oculus reads it.
# - `dead`: a dead or paused outcome, the only kind that is not real work, written as a whole number from 1 that is the stage's place in the Pillars view's Archival band, whose groups go in that order; a project at the stage on a tier carrying `finished` is left out of a pillar's and a domain's members, a venue's use counts and the cross-link groups. A stage with no number is real work, so a new in-flight stage never falls into Archival.
# - `archive_outcome`: a stage a project is archived with, and the name of its archive/<outcome>/ filing folder (the folder decides no tier or stage, only the project's category; the audit lists an archived project whose `stage:` differs from its folder).
# - `on_map`: a stage that keeps a Pillars or Domains card awake: a card none of whose members is at such a stage is dormant.
# - `placed`: a stage that has a venue, so the audit asks for one.
# - `standard`: the stages the audit holds to the one-README standard.
# - `public`, `negative`, `dead_end`: the publication kind a stage gives in the audit of the website's publications (`publication_kinds` below reads the stages and forms).
# - `submit_ready`: a stage the board statistics count as ready to go out.
# - `pauses_countdown`: a stage that stops a card's and a lane's countdown, and that the Focus board's awaiting box counts as submitted work held at its venue.
# - `deadline_met`: a stage that ends a project's own deadline, which then leaves the deadline radar.
# - `new_idea`: the stage a new idea is made with; the first such stage is written, and with none the new manifest names no stage.
# - `published`: the stage the audit expects only on a tier carrying `finished`.
stages:
  idea:         { label: idea, color: "#7c5cff", idea: true, on_map: true, standard: true }
  nascent:      { label: "nascent (concept)", icon: white, color: "#7c5cff", idea: true, on_map: true, standard: true, new_idea: true }
  scoping:      { label: "scoping (lit-check and framing)", icon: yellow, color: "#0891b2", idea: true, on_map: true, standard: true }
  de-risking:   { label: "de-risking (feasibility experiment)", icon: blue, color: "#16a34a", live: true, on_map: true, standard: true }
  exploring:    { label: exploring, icon: orange, color: "#f59e0b", live: true, on_map: true, standard: true }
  in-prep:      { label: "in preparation", icon: writing, color: "#a16207", live: true, on_map: true, standard: true, placed: true, public: true }
  building:     { label: building, icon: active, color: "#d4a017", live: true, on_map: true, standard: true }
  running:      { label: running, icon: live, color: "#16a34a", live: true, on_map: true, standard: true }
  active:       { label: active, color: "#ea580c", live: true, on_map: true, standard: true }
  submit-ready: { label: "submit-ready", icon: green, color: "#ea580c", live: true, on_map: true, standard: true, placed: true, public: true, submit_ready: true }
  submitted:    { label: "submitted / under review", icon: brown, color: "#0ea5e9", live: true, on_map: true, standard: true, placed: true, public: true, pauses_countdown: true, deadline_met: true }
  revision:     { label: "major revision (back with the authors)", icon: orange_square, color: "#b45309", live: true, on_map: true, standard: true, placed: true, public: true }
  accepted:     { label: "accepted (camera-ready pending)", icon: green_square, color: "#2563eb", live: true, on_map: true, standard: true, placed: true, public: true }
  published:    { label: published, icon: done, color: "#16a34a", terminal: true, archive_outcome: true, placed: true, public: true, published: true }
  paused:       { label: paused, icon: black, color: "#9ca3af", dead: 5 }
  finished:     { label: finished, icon: done, color: "#16a34a", terminal: true }
  archived:     { label: archived, color: "#16a34a", terminal: true }
  nogo:         { label: "no-go (failed gate)", icon: overdue, color: "#b45309", dead: 1, terminal: true, archive_outcome: true, negative: true }
  dropped:      { label: dropped, icon: trash, color: "#9ca3af", dead: 2, terminal: true, archive_outcome: true, dead_end: true }
  disproved:    { label: disproved, icon: cross_box, color: "#dc2626", dead: 3, terminal: true, archive_outcome: true, negative: true }
  abandoned:    { label: abandoned, icon: cross, color: "#6b7280", dead: 4, terminal: true, dead_end: true }


# The form of a project's output, keyed by the manifest's single `form`, in the order the project form offers them. A form is drawn after the stage on a card, with its `label` and its `icon` (a key of glyphs.yml); a board group may name it, and `publication_kinds` below reads it. A software project has no form: its tier says what it is.
forms:
  journal:     { label: "journal article", icon: journals }
  conference:  { label: "conference paper", icon: conference }
  thesis:      { label: thesis, icon: book }
  abstract:    { label: "extended abstract", icon: page }
  poster:      { label: poster, icon: poster }
  tech-report: { label: "tech report (not peer-reviewed)", icon: paper }


# The chips a project's manifest picks for its `status.chips`, the situation of the work and the author role, in the order the project form offers them. A chip is drawn on a card after the stage and the form, with its `label` and its `icon` (a key of glyphs.yml); a chip carries no colour. A stage word or a form written as a chip is a finding of the hub check, since each has its own field. The one flag, and a chip without it is not one:
# - `blocked`: a chip the Focus board's awaiting box counts as blocked, which the wait line of a card and a lane card says, and which flags the cross-link group of in-flight projects it is in; a project's chips are compared as written (`anyWord`).
chips:
  blocked:          { label: "blocked (external)", icon: purple, blocked: true }
  results-positive: { label: "positive result (pre-writeup)", icon: white }
  admin-prep:       { label: "admin/prep", icon: yellow }
  numbers-pending:  { label: "numbers pending", icon: blue }
  ai-tells:         { label: "AI-writing tells", icon: red }
  lead:             { label: "first author", icon: author }
  coauthor:         { label: "co-author", icon: collab }


# The statuses a collection entry's `status` takes, each with the `color` it is drawn in, and the flags that say what a status decides; a status the list does not hold is a finding naming the closest word. Each line says how the code compares a status with the flag: `wordFlag` trims an entry's status and puts it in lower case:
# - `closes_deadline`: the status ends an entry's deadline on the deadline radar; compared trimmed and in lower case (`wordFlag`).
# - `deadline_met`: the status ends a funding entry's or another entry's own deadline, so it leaves the deadline radar, and a funding entry carrying it is listed in the Focus board's awaiting box; compared trimmed and in lower case (`wordFlag`).
# - `live_subtasks`: a status with `closes_deadline` under which an entry's subtasks and follow-up notes stay on the radar; compared trimmed and in lower case (`wordFlag`).
# - `waiting`: an entry waiting on someone else, which the audit asks a date to track by; the audit compares the entry's status in lower case, untrimmed.
# - `acknowledged`: a funding entry a manuscript acknowledges, so it needs a `statement`; the entry's status is compared as written.
# - `default_application`: the status of the Applications entry a Position Lead's apply control makes; the first such word is written, and nothing is compared with it.
# - `default_task`: the status of a task added from the palette; the first such word is written, and nothing is compared with it.
statuses:
  submitted:     { color: "#b45309", deadline_met: true, waiting: true }
  revision:      { color: "#b45309" }
  accepted:      { color: "#2563eb", closes_deadline: true }
  published:     { color: "#0ea5e9", closes_deadline: true }
  in-prep:       { color: "#7c5cff" }
  dropped:       { color: "#ea580c", closes_deadline: true }
  exploring:     { color: "#7c5cff" }
  nascent:       { color: "#7c5cff" }
  scoping:       { color: "#0891b2" }
  de-risking:    { color: "#16a34a" }
  building:      { color: "#d4a017" }
  running:       { color: "#16a34a" }
  finished:      { color: "#0ea5e9", closes_deadline: true }
  paused:        { color: "#9ca3af" }
  # live and in flight, still on the deadline radar
  planned:       { color: "#7c5cff" }
  preparing:     { color: "#7c5cff" }
  draft:         { color: "#7c5cff" }
  pending:       { color: "#b45309", waiting: true }
  under-review:  { color: "#b45309", deadline_met: true, waiting: true }
  upcoming:      { color: "#b45309" }
  active:        { color: "#16a34a" }
  collaborator:  { color: "#0891b2" }
  todo:          { color: "#b45309", default_task: true }
  doing:         { color: "#16a34a" }
  # these statuses close an entry
  ongoing:       { color: "#16a34a", closes_deadline: true, live_subtasks: true }
  completed:     { color: "#0ea5e9", closes_deadline: true }
  done:          { color: "#0ea5e9", closes_deadline: true }
  awarded:       { color: "#16a34a", closes_deadline: true, acknowledged: true }
  granted:       { color: "#16a34a", closes_deadline: true }
  contributing:  { color: "#0891b2", closes_deadline: true, acknowledged: true }
  rejected:      { color: "#dc2626", closes_deadline: true }
  "not funded":  { color: "#dc2626", closes_deadline: true }
  declined:      { color: "#ea580c", closes_deadline: true }
  withdrawn:     { color: "#475569", closes_deadline: true }
  not-applied:   { color: "#9ca3af", closes_deadline: true, default_application: true }
  not-attending: { color: "#9ca3af", closes_deadline: true }
  cancelled:     { color: "#9ca3af", closes_deadline: true }
  past:          { color: "#9ca3af", closes_deadline: true }
  skipped:       { color: "#9ca3af", closes_deadline: true }
  passed:        { color: "#9ca3af", closes_deadline: true }
  ready:         { color: "#16a34a" }
  archived:      { color: "#9ca3af", closes_deadline: true }
  applied:       { color: "#0891b2", closes_deadline: true }


# The statuses a Position Lead's `status` takes, each with the `color` it is drawn in where it has one, and the flags that say what it decides; a status the list does not hold is a finding naming the closest word. Every flag is compared trimmed and in lower case (`wordFlag`):
# - `lead_closed`: a Position Lead that is closed, counted and listed as done.
# - `lead_declined`: a Position Lead the reader declined, which the Leads view hides until asked; the first such word is what the decline control writes.
# - `lead_applied`: a Position Lead the reader applied to, which offers no apply control; the first such word is what the apply control writes.
# - `default_lead`: the status a new Position Lead gets and a reopened one goes back to, and the one status the decline control is offered on.
lead_statuses:
  declined:  { color: "#ea580c", lead_closed: true, lead_declined: true }
  applied:   { color: "#0891b2", lead_closed: true, lead_applied: true }
  closed:    { lead_closed: true }
  dismissed: { lead_closed: true, lead_declined: true }
  open:      { default_lead: true }


# Focus lanes form one lifecycle, grouped into current, parked, and incubating work. With every cluster open and every Funding, Jobs and Teaching column drawn, a lane's colour differs by a CIEDE2000 of 10 or more, under every theme, from the header drawn next to it, the one stacked above or below it in the three-column layout, and the full-width Ideas lane; tests/checks/look/lane-distance.test.ts holds those pairs. A collapsed cluster or a column with nothing in it brings other headers together, and no choice of colours keeps all of those apart: ten of the pairs that touch only in such a layout are below 10 under at least one theme, among them Build and Teaching, which share teal in every theme, Backburner and Jobs, which share a grey, Funding and Revise, gold against amber, and Blocked above the Ideas lane in mocha and everforest.
focus_lanes:
  - { key: run,        label: Run,        sub: "experiments / getting the numbers", color: "#16a34a", cluster: now }
  - { key: push,       label: Push,       sub: "drafting toward first submission",  color: "#2563eb", cluster: now }
  - { key: revise,     label: Revise,     sub: "back from a venue (R&R or reject)",  color: "#b45309", cluster: now }
  - { key: review,     label: Review,     sub: "under peer review, hands off",       color: "#475569", cluster: parked }
  - { key: blocked,    label: Blocked,    sub: "waiting on you / coauthor",          color: "#dc2626", cluster: parked }
  - { key: backburner, label: Backburner, sub: "deprioritized, not being worked",    color: "#9ca3af", cluster: parked }
  - { key: scope,      label: Scope,      sub: "shaping + novelty check",            color: "#0e7490", cluster: incubate }
  - { key: derisk,     label: De-risk,    sub: "Tier-0 go / no-go pilot",            color: "#f59e0b", cluster: incubate }
  - { key: build,      label: Build,      sub: "strongest version -> manuscript",    color: "#0d9488", cluster: incubate }

# Holding is a backlog state, not a board lane. This colour is used by its header and focus pill.
holding_color: "#b5638a"


# Per-card priority controls the count badge; an unset priority draws none and does not change order.
priority_levels:
  - { key: high, label: High, flames: 3 }
  - { key: med,  label: Med,  flames: 2 }
  - { key: low,  label: Low,  flames: 1 }


# Funding stages stacked inside the Focus Funding column (label / colour / the statuses each matches).
fund_stages:
  - { label: "In prep",   color: "#d4a017", statuses: [in-prep] }
  - { label: "Submitted", color: "#16a34a", statuses: [submitted, under-review] }
  - { label: "Planned",   color: "#0891b2", statuses: [planned] }

# Collection lane bars are independent of the stage colours inside Funding. The three hues follow the Ideas lane above them and each other under the same distance rule as `focus_lanes`.
focus_lane_tones: { funding: gold, jobs: grey-d, teaching: teal }


# The project tiers whose decisions are flags, each read with the tier as the manifest writes it, and a tier without a flag is not one of them:
# - `finished`: finished or contributed work: the audit's rules over finished work, the cross-link group of finished projects, a venue's past papers, the Map's finished members.
# - `software`: software projects: a card's and a board's software line, and a board that offers no New project.
# - `main`: the research board's tier: the venue load of the Command Center and the Inbox, the manifests behind, the projects quick add writes to, and the tier a new project is made in when none is named.
# - `backlog`: a tier whose projects may sit in the Focus backlog (`focus: holding`), where a new project of the tier starts.
# - `personal`: projects the audit's research rules leave alone.
# - `outcome_folders`: a tier whose category folder is its project's outcome: the audit expects a project filed under a folder named by a stage carrying `archive_outcome` to be at that stage.
# - `stage_folders`: the category folders of a tier that name its project's stage, which the audit expects the project to be at.
tiers:
  projects: { main: true, backlog: true }
  personal: { backlog: true, personal: true }
  coauthor: { finished: true, stage_folders: [abandoned] }
  archive:  { finished: true, outcome_folders: true }
  software: { software: true }


# The section of the website's publication feed a project is expected in, for the audit of that feed: the first row whose `stages` holds the project's stage and whose `forms` holds its form gives its `kind`, the sections it may sit in; a row without `stages` or without `forms` places no condition on that side, so the last row catches every project.
publication_kinds:
  - { kind: [thesis],                forms: [thesis] }
  - { kind: [papers-in-review],      stages: [submitted, revision] }
  - { kind: [papers-in-preparation], stages: [in-prep, submit-ready] }
  - { kind: [abandoned-papers],      stages: [abandoned] }
  - { kind: [abstracts],             forms: [abstract] }
  - { kind: [posters],               forms: [poster] }
  - { kind: [conference],            forms: [conference] }
  - { kind: [journal, other-publications], forms: [journal] }
  - { kind: [abstracts, conference, journal, other-publications, posters, thesis] }


# The chip words the audit's status guardrails read: `author_chips`, one of which marks the author role on finished or contributed work.
lifecycle:
  author_chips: [lead, coauthor]


# Dataset access -> chip colour.
data_access: { open: "#16a34a", registration: "#b45309", credentialed: "#dc2626", private: "#475569" }


# Venue prestige tiers: the controlled vocabulary + colours for a venue's `tier:` (the venues registry). A curated JUDGMENT, NOT derived from JIF (so AAAI/TSP read flagship with no JIF, and a wide JIF band isn't flattened into one label). Order = ranking (best first). The venues schema's `tier` takes its options from the ASSIGNABLE keys here; the Pillars tab colours its tier spread from these. `unrated` is the computed fallback (no venue / no tier), `assignable: false` so it's not offered as a choice.
venue_categories: [journal, conference, thesis, meeting]
venue_tiers:
  - { key: flagship,   color: "#7c3aed", label: "flagship" }
  - { key: strong,     color: "#0d9488", label: "strong" }
  - { key: specialist, color: "#0891b2", label: "specialist" }
  - { key: unrated,    color: "#94a3b8", label: "unrated", assignable: false }

# Lit-Watch radar buckets: (key, glyph name, label, colour). New papers per project are classified into one of these; `glyph` is a `glyphs:` key. A bucket's label and colour are set here.
radar_buckets:
  - { key: preemption,    glyph: red,    label: "Pre-emption risk", color: "#dc2626" }
  - { key: idea,          glyph: purple, label: "Idea sparks",      color: "#7c5cff" }
  - { key: cite_baseline, glyph: green,  label: "Cite / baseline",  color: "#16a34a" }
  - { key: adjacent,      glyph: white,  label: "Adjacent",         color: "#94a3b8" }
