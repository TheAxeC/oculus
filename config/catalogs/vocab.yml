# ===========================================================================
# vocab.yml
# oculus's own configuration: the words of its vocabularies, their colours, and the flags that say what each word decides: the palette every hex maps onto, the project stages, forms and chips, the statuses of collection entries and of Position Leads, the project tiers, the user's roles, the categories a project is filed under, and the lane and bucket words the surfaces group by. A decision the code makes on a stage, a chip, a status, a role or a category is a flag on its word here or a list here or under `focus:` of behavior.yml, never a word written in the code. The research domains and the venue and dataset theme words are each hub's own, in its domains registry and in the themes field of its venues and data registries. Merged with the other configuration files by loadConfig().
# A hub lays its own vocabulary over these words in its .oculus/config.yml, every key of this file by its shape (src/lib/data/sources/config/merge/in-place.ts), and its records are read under the result: a map (palette, stages, forms, chips, statuses, lead_statuses, focus_lane_tones, ticker_categories, facet_tones, tiers, research_audit, data_access, and leads_fit, which oculus ships none of) merges by word, a word the hub names replacing oculus's row in oculus's place, a new word coming after oculus's words and `<word>: null` taking one out; `categories` merges by `key` the same way, `{ key: <key>, removed: true }` taking a row out; focus_clusters, focus_lanes, fund_stages, roles, venue_categories, venue_tiers and radar_buckets are replaced whole, since their order is their meaning; and the hub's `rail_color` replaces oculus's. A word a hub's values no longer give, taken out with `<word>: null` or left out of a list the hub replaces whole, is also taken out of every word list that names it (the categories' stage and form words, the Focus lanes' stages and chips and the words of their `move_writes`, the funding stages' statuses, the boards' tier and role, research_audit's skip_tiers): in oculus's own values a row left with no word stays and a single word becomes an empty list, and in a list the hub writes itself each such word is a finding naming the hub's file. A list drawn over the records of several hubs holds every hub's words, each once, the primary's first.
# ===========================================================================


