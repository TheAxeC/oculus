# ===========================================================================
# vocab.yml
# oculus's own configuration: the words of its vocabularies, their colours, and the flags that say what each word decides: the palette every hex maps onto, the project types, the status and chip words, the project tiers, and the lane and bucket words the surfaces group by. A decision the code makes on a type, a status, a chip or a tier is a flag on its word here or a list here or under `focus:` of behavior.yml, never a word written in the code. The research domains and the venue and dataset theme words are each hub's own, in its domains registry and in the themes field of its venues and data registries. Merged with the other configuration files by loadConfig().
# ===========================================================================


