# The project types, keyed by the manifest's `type`, in the order every board splits its type buttons by, the order a board, the Map and the board statistics list types in; a board shows the types its projects hold. `color` is the colour of a project's type wherever it is drawn (its board card, the Map, the Present view's project chip). The flags say what a type decides, each compared with the manifest's `type` as written (`hasWord`), and a type without a flag is not one of them:
# - `dead`: a dead or paused outcome, the only kind that is not real work, written as a whole number from 1 that is the type's place in the Pillars view's Archival band, whose groups go in that order; the type is left out of a pillar's and a domain's members. A type with no number is real work, so a new live type never falls into Archival.
# - `terminal`: a done or closed outcome, which the audit holds to no live chip.
# - `archive_outcome`: a `type:` a project is archived with, and the name of its archive/<outcome>/ filing folder (the folder decides no tier or type, only the project's category; the audit lists an archived project whose `type:` differs from its folder).
# - `live`: work in flight: the audit's rules over in-flight work, the cross-link group of in-flight projects, a venue's in-flight papers, the Map's in-flight members, the Focus lanes and the backlog.
# - `on_map`: a type the Map draws as a node of the portfolio.
# - `placed`: a type that has a venue, so the audit asks for one.
# - `standard`: the types of the projects tier the audit expects there.
# - `idea`: the backlog of ideas on the Focus board.
# - `public`, `negative`, `dead_end`: the publication kind a type gives in the audit of the website's publications (`publication_kinds` below reads them).
types:
  active:      { color: "#ea580c", live: true, on_map: true, standard: true }
  published:   { color: "#16a34a", terminal: true, archive_outcome: true, placed: true, public: true }
  submitted:   { color: "#0ea5e9", placed: true, public: true }
  in-prep:     { color: "#a16207" }
  paused:      { color: "#9ca3af", dead: 5 }
  idea:        { color: "#7c5cff", on_map: true, standard: true, idea: true }
  tech-report: { color: "#0891b2", terminal: true }
  software:    { color: "#0d9488", terminal: true }
  nogo:        { color: "#b45309", dead: 1, terminal: true, archive_outcome: true, negative: true }
  dropped:     { color: "#9ca3af", dead: 2, terminal: true, archive_outcome: true, dead_end: true }
  disproved:   { color: "#dc2626", dead: 3, terminal: true, archive_outcome: true, negative: true }
  abandoned:   { color: "#6b7280", dead: 4, terminal: true, dead_end: true }
  exploring:   { color: "#f59e0b" }
  phd:         { color: "#6366f1", terminal: true, archive_outcome: true, public: true }
  finished:    { color: "#16a34a" }
  archived:    { color: "#16a34a" }


# The status words, of a project's chips (its manifest's `status.chips`, which the manifests hold as the source of truth for status) and of a collection entry's `status`, each with what is drawn for it and what it decides. A chip is drawn with its `icon` and its `label`; a word with a `color` is a status an entry takes, drawn in that colour. The flags, and a word without a flag is not one of them; each line says how the code compares a word with the flag: `wordFlag` trims a collection entry's status and puts it in lower case, and the chip flags go through `anyWord`, which compares a project's chips as written:
# - `chip`: a status chip a manifest's `status.chips` picks from (the status legend), offered by the project form in this order.
# - `terminal`: the status ends a collection entry's deadline on the deadline radar; compared trimmed and in lower case (`wordFlag`).
# - `deadline_met`: the status ends a project's own deadline (a terminal chip alone does not); compared trimmed and in lower case (`wordFlag`).
# - `live_subtasks`: a terminal entry whose subtasks and follow-up notes still show on the radar; compared trimmed and in lower case (`wordFlag`).
# - `waiting`: an entry waiting on someone else, which the audit asks a date to track by; the audit compares the entry's status in lower case, untrimmed.
# - `acknowledged`: a funding entry a manuscript acknowledges, so it needs a `statement`; the entry's status is compared as written.
# - `lead_closed`: a Position Lead that is closed, counted and listed as done; compared trimmed and in lower case (`wordFlag`).
# - `lead_declined`: a Position Lead the reader declined, which the Leads view hides until asked; the first such word is what the decline control writes; compared trimmed and in lower case (`wordFlag`).
# - `lead_applied`: a Position Lead the reader applied to, which offers no apply control; the first such word is what the apply control writes; compared trimmed and in lower case (`wordFlag`).
# - `default_lead`: the status a new Position Lead gets and a reopened one goes back to, and the one status the decline control is offered on; compared trimmed and in lower case (`wordFlag`).
# - `default_application`: the status of the Applications entry a Position Lead's apply control makes; the first such word is written, and nothing is compared with it.
# - `default_task`: the status of a task added from the palette; the first such word is written, and nothing is compared with it.
# - `new_idea`: the chip a new idea is made with; the first such word is written, and nothing is compared with it.
# - `pauses_countdown`: a chip that stops a card's and a lane's countdown, and that the Focus board and the board statistics count as submitted work; a project's chips are compared as written (`anyWord`).
# - `blocked`: a chip the Focus board and the board statistics count as blocked, which also keeps a project out of the backlog; a project's chips are compared as written (`anyWord`).
# - `submit_ready`: a chip the board statistics count as ready to go out; a project's chips are compared as written (`anyWord`).
# - `published`: the chip the audit expects on a published project; a project's chips are compared as written.
statuses:
  submit-ready:     { chip: true, label: "submit-ready", icon: green, submit_ready: true }
  submitted:        { chip: true, label: "submitted / under review", icon: brown, color: "#b45309", deadline_met: true, waiting: true, pauses_countdown: true }
  revision:         { chip: true, label: "major revision (back with the authors)", icon: orange_square, color: "#b45309" }
  accepted:         { chip: true, label: "accepted (camera-ready pending)", icon: green_square, color: "#2563eb", terminal: true }
  published:        { chip: true, label: "published", icon: done, color: "#0ea5e9", terminal: true, published: true }
  in-prep:          { chip: true, label: "in preparation", icon: writing, color: "#7c5cff" }
  abandoned:        { chip: true, label: "abandoned", icon: cross }
  tech-report:      { chip: true, label: "tech report (not peer-reviewed)", icon: paper }
  software:         { chip: true, label: "software / framework (not a paper)", icon: published }
  coauthor:         { chip: true, label: "co-author", icon: collab }
  lead:             { chip: true, label: "first author", icon: author }
  phd:              { chip: true, label: "PhD thesis", icon: scout }
  nogo:             { chip: true, label: "no-go (failed gate)", icon: overdue }
  dropped:          { chip: true, label: "dropped", icon: trash, color: "#ea580c", terminal: true }
  disproved:        { chip: true, label: "disproved", icon: cross_box }
  results-positive: { chip: true, label: "positive result (pre-writeup)", icon: white }
  admin-prep:       { chip: true, label: "admin/prep", icon: yellow }
  numbers-pending:  { chip: true, label: "numbers pending", icon: blue }
  ai-tells:         { chip: true, label: "AI-writing tells", icon: red }
  blocked:          { chip: true, label: "blocked (external)", icon: purple, blocked: true }
  exploring:        { chip: true, label: "exploring", icon: orange, color: "#7c5cff" }
  nascent:          { chip: true, label: "nascent (concept)", icon: white, color: "#7c5cff", new_idea: true }
  scoping:          { chip: true, label: "scoping (lit-check and framing)", icon: yellow, color: "#0891b2" }
  de-risking:       { chip: true, label: "de-risking (feasibility experiment)", icon: blue, color: "#16a34a" }
  building:         { chip: true, label: "building", icon: active, color: "#d4a017" }
  running:          { chip: true, label: "running", icon: live, color: "#16a34a" }
  finished:         { chip: true, label: "finished", icon: done, color: "#0ea5e9", terminal: true }
  paused:           { chip: true, label: "paused", icon: black, color: "#9ca3af" }
  # publication-type chips (on published works), orthogonal to outcome and role; they feed the Status facet
  journal:          { chip: true, label: "journal article", icon: journals }
  conference:       { chip: true, label: "conference paper", icon: conference }
  thesis:           { chip: true, label: "thesis", icon: book }
  abstract:         { chip: true, label: "extended abstract", icon: page }
  poster:           { chip: true, label: "poster", icon: poster }
  # the statuses of collection entries: live and in flight (still on the deadline radar)
  planned:          { color: "#7c5cff" }
  "in prep":        { color: "#7c5cff" }
  preparing:        { color: "#7c5cff" }
  draft:            { color: "#7c5cff" }
  pending:          { color: "#b45309", waiting: true }
  under-review:     { color: "#b45309", deadline_met: true, waiting: true }
  "under review":   { color: "#b45309", deadline_met: true, waiting: true }
  upcoming:         { color: "#b45309" }
  active:           { color: "#16a34a" }
  collaborator:     { color: "#0891b2" }
  todo:             { color: "#b45309", default_task: true }
  doing:            { color: "#16a34a" }
  # these statuses close an entry, and only a status with deadline_met ends a project's deadline
  ongoing:          { color: "#16a34a", terminal: true, live_subtasks: true }
  completed:        { color: "#0ea5e9", terminal: true }
  done:             { color: "#0ea5e9", terminal: true }
  awarded:          { color: "#16a34a", terminal: true, acknowledged: true }
  granted:          { color: "#16a34a", terminal: true }
  contributing:     { color: "#0891b2", terminal: true, acknowledged: true }
  rejected:         { color: "#dc2626", terminal: true }
  "not funded":     { color: "#dc2626", terminal: true }
  declined:         { color: "#ea580c", terminal: true, lead_closed: true, lead_declined: true }
  withdrawn:        { color: "#475569", terminal: true }
  "not applied":    { color: "#9ca3af", terminal: true, default_application: true }
  not-applied:      { color: "#9ca3af", terminal: true }
  "not attending":  { color: "#9ca3af", terminal: true }
  not-attending:    { color: "#9ca3af", terminal: true }
  cancelled:        { color: "#9ca3af", terminal: true }
  canceled:         { color: "#9ca3af", terminal: true }
  past:             { color: "#9ca3af", terminal: true }
  skipped:          { color: "#9ca3af", terminal: true }
  passed:           { color: "#9ca3af", terminal: true }
  ready:            { color: "#16a34a" }
  archived:         { color: "#9ca3af", terminal: true }
  applied:          { color: "#0891b2", terminal: true, lead_closed: true, lead_applied: true }
  # the statuses of a Position Lead that no chip or collection entry takes
  closed:           { lead_closed: true }
  dismissed:        { lead_closed: true, lead_declined: true }
  open:             { default_lead: true }


# Focus lanes form one lifecycle, grouped into current, parked, and incubating work. With every cluster open and every Funding, Jobs and Teaching column drawn, a lane's colour differs by a CIEDE2000 of 10 or more, under every theme, from the header drawn next to it, the one stacked above or below it in the three-column layout, and the full-width Ideas lane; tests/checks/look/lane-distance.test.ts holds those pairs. A collapsed cluster or a column with nothing in it brings other headers together, and no choice of colours keeps all of those apart: ten of the pairs that touch only in such a layout are below 10 under at least one theme, among them Build and Teaching, which share teal in every theme, Backburner and Jobs, which share a grey, Funding and Revise, gold against amber, and Blocked above the Ideas lane in mocha and everforest.
focus_lanes:
  - { key: run,        label: Run,        sub: "experiments / getting the numbers", color: "#16a34a", cluster: now }
  - { key: push,       label: Push,       sub: "drafting toward first submission",  color: "#2563eb", cluster: now }
  - { key: revise,     label: Revise,     sub: "back from a venue (R&R or reject)",  color: "#b45309", cluster: now }
  - { key: review,     label: Review,     sub: "under peer review, hands off",       color: "#475569", cluster: parked }
  - { key: blocked,    label: Blocked,    sub: "waiting on you / coauthor",          color: "#dc2626", cluster: parked }
  - { key: backburner, label: Backburner, sub: "deprioritized, not being worked",    color: "#9ca3af", cluster: parked }
  - { key: scope,      label: Scope,      sub: "shaping + novelty check",            color: "#0e7490", cluster: incubate }
  - { key: derisk,     label: De-risk,    sub: "Tier-0 go / no-go pilot",            color: "#f59e0b", cluster: incubate }
  - { key: build,      label: Build,      sub: "strongest version -> manuscript",    color: "#0d9488", cluster: incubate }

# Holding is a backlog state, not a board lane. This colour is used by its header and focus pill.
holding_color: "#b5638a"


# Per-card priority controls the count badge; an unset priority draws none and does not change order.
priority_levels:
  - { key: high, label: High, flames: 3 }
  - { key: med,  label: Med,  flames: 2 }
  - { key: low,  label: Low,  flames: 1 }


# Funding stages stacked inside the Focus Funding column (label / colour / the statuses each matches).
fund_stages:
  - { label: "In prep",   color: "#d4a017", statuses: [in-prep, "in prep"] }
  - { label: "Submitted", color: "#16a34a", statuses: [submitted, under-review, "under review"] }
  - { label: "Planned",   color: "#0891b2", statuses: [planned] }

# Collection lane bars are independent of the stage colours inside Funding. The three hues follow the Ideas lane above them and each other under the same distance rule as `focus_lanes`.
focus_lane_tones: { funding: gold, jobs: grey-d, teaching: teal }


# The Archive's outcome categories, in the order the Archive groups them, which differs from the order of `types`.
archive_order: [published, submitted, in-prep, abandoned, nogo, dropped, disproved, tech-report, software, finished, archived]


# The project tiers whose decisions are flags, each read with the tier as the manifest writes it, and a tier without a flag is not one of them:
# - `finished`: finished or contributed work: the audit's rules over finished work, the cross-link group of finished projects, a venue's past papers, the Map's finished members.
# - `software`: software projects: a card's and a board's software line, and a board that offers no New project.
# - `main`: the research board's tier: the venue load of the Command Center and the Inbox, the manifests behind, the projects quick add writes to, and the tier a new project is made in when none is named.
# - `backlog`: a tier whose projects may sit in the Focus backlog (`focus: holding`), where a new project of the tier starts.
# - `personal`: projects the audit's research rules leave alone.
# - `outcome_folders`: a tier whose category folder is its project's outcome: the audit expects a project filed under a folder named by a type carrying `archive_outcome` to have that type.
# - `type_folders`: the category folders of a tier that name its project's type, which the audit expects the project to have.
tiers:
  projects: { main: true, backlog: true }
  personal: { backlog: true, personal: true }
  coauthor: { finished: true, type_folders: [abandoned] }
  archive:  { finished: true, outcome_folders: true }
  software: { software: true }


# The section of the website's publication feed a project is expected in, for the audit of that feed: the first row whose `types` holds the project's type and whose `chips` shares one of its status chips gives its `kind`, the sections it may sit in; a row without `types` or without `chips` places no condition on that side, so the last row catches every project.
publication_kinds:
  - { kind: [thesis],                types: [phd] }
  - { kind: [thesis],                chips: [thesis] }
  - { kind: [papers-in-review],      types: [submitted], chips: [submitted, revision] }
  - { kind: [papers-in-preparation], types: [submitted] }
  - { kind: [abandoned-papers],      types: [abandoned] }
  - { kind: [abstracts],             chips: [abstract] }
  - { kind: [posters],               chips: [poster] }
  - { kind: [conference],            chips: [conference] }
  - { kind: [journal, other-publications], chips: [journal] }
  - { kind: [abstracts, conference, journal, other-publications, posters, thesis] }


# Project lifecycle words the audit's status guardrails read. `live_chips` = in-flight chips a terminal project must not still carry; clear them when you archive, or the guardrail flags it. Which types are terminal or archive outcomes is a flag of `types` above.
lifecycle:
  live_chips: [submit-ready, submitted, revision, accepted, in-prep, blocked, numbers-pending, results-positive, admin-prep]
  author_chips: [lead, coauthor]   # one of these marks the author role on finished or contributed work
  contradictory_chips:             # chip pairs that cannot both be true; the audit reports a project carrying one pair
    - [submit-ready, submitted]
    - [submit-ready, blocked]
    - [submit-ready, numbers-pending]


# Dataset access -> chip colour.
data_access: { open: "#16a34a", registration: "#b45309", credentialed: "#dc2626", private: "#475569" }


# Venue prestige tiers: the controlled vocabulary + colours for a venue's `tier:` (the venues registry). A curated JUDGMENT, NOT derived from JIF (so AAAI/TSP read flagship with no JIF, and a wide JIF band isn't flattened into one label). Order = ranking (best first). The venues schema's `tier` takes its options from the ASSIGNABLE keys here; the Pillars tab colours its tier spread from these. `unrated` is the computed fallback (no venue / no tier), `assignable: false` so it's not offered as a choice.
venue_categories: [journal, conference, thesis, meeting]
venue_tiers:
  - { key: flagship,   color: "#7c3aed", label: "flagship" }
  - { key: strong,     color: "#0d9488", label: "strong" }
  - { key: specialist, color: "#0891b2", label: "specialist" }
  - { key: unrated,    color: "#94a3b8", label: "unrated", assignable: false }

# Lit-Watch radar buckets: (key, glyph name, label, colour). New papers per project are classified into one of these; `glyph` is a `glyphs:` key. A bucket's label and colour are set here.
radar_buckets:
  - { key: preemption,    glyph: red,    label: "Pre-emption risk", color: "#dc2626" }
  - { key: idea,          glyph: purple, label: "Idea sparks",      color: "#7c5cff" }
  - { key: cite_baseline, glyph: green,  label: "Cite / baseline",  color: "#16a34a" }
  - { key: adjacent,      glyph: white,  label: "Adjacent",         color: "#94a3b8" }
