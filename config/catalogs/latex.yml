# The editing tables of a LaTeX tab and of the TeX view's Math Symbols section: the `@` suggestions, the environments `\envname` completes, the chords of the formatting shortcuts, and the math symbol groups, with the notice of the project they come from. The reader is src/lib/data/sources/config/catalog/latex-tables.ts and the findings are worded by latex-editing.ts beside it; a row the reader cannot use (a missing prefix, body or source, a chord whose key is not one character, a text chord on `l`, `w` or `m`, whose second press the tab keeps for a command of its own) is left out with a finding and the rest are kept.
latex_editing:
    notice: >-
        The @ suggestions, the shortcut chords and the math symbols follow LaTeX Workshop 10.19.0 (MIT License, Copyright (c) 2016 James Yu).
    at:
        - { prefix: '@.', body: '\cdot', description: '\cdot' }
        - { prefix: '@8', body: '\infty', description: 'infinity symbol' }
        - { prefix: '@6', body: '\partial', description: 'partial derivative symbol' }
        - { prefix: '@/', body: '\frac{$1}{$2}$0', description: 'fraction' }
        - { prefix: '@%', body: '\frac{$1}{$2}$0', description: 'fraction' }
        - { prefix: '@^', body: '\hat{${1:${TM_SELECTED_TEXT}}}$0', description: 'hat' }
        - { prefix: '@_', body: '\bar{${1:${TM_SELECTED_TEXT}}}$0', description: 'bar' }
        - { prefix: '@@', body: '\circ', description: 'circ' }
        - { prefix: '@0', body: '^\circ', description: 'superscript circ' }
        - { prefix: '@;', body: '\dot{${1:${TM_SELECTED_TEXT}}}$0', description: 'dot' }
        - { prefix: '@:', body: '\ddot{${1:${TM_SELECTED_TEXT}}}$0', description: 'ddot' }
        - { prefix: '@=', body: '\equiv', description: 'equiv symbol' }
        - { prefix: '@*', body: '\times', description: 'times symbol' }
        - { prefix: '@<', body: '\leq', description: 'leq symbol' }
        - { prefix: '@>', body: '\geq', description: 'geq symbol' }
        - { prefix: '@2', body: '\sqrt{${1:${TM_SELECTED_TEXT}}}$0', description: 'sqrt command' }
        - { prefix: '@I', body: '\int_{$1}^{$2}$0', description: 'integral' }
        - { prefix: '@|', body: '\Big|', description: 'Big |' }
        - { prefix: '@+', body: '\bigcup', description: 'bigcup' }
        - { prefix: '@-', body: '\bigcap', description: 'bigcap' }
        - { prefix: '@,', body: '\nonumber', description: 'nonumber' }
