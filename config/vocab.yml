# ===========================================================================
# vocab.yml
# oculus's own configuration - words and their colours, and nothing else: the palette every hex maps
# onto, the research domains, the chip and status vocabularies, and the lane/tier/bucket words the
# surfaces group by. Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# === Palette tokens ========================================================
# Every hex an author writes in this config (theme colours, status colours, type colours) is mapped
# at BUILD time onto the CSS variable named here, wherever it lands in a `style="..."` attribute or
# in the stylesheet. That is what makes a theme possible: one override block in `assets/css/08-themes.css`
# recolours the whole cockpit, and nobody has to hunt inline styles. Write hex here, get a token there.
# The token names must exist in `:root` in `assets/css/01-base.css` - `--selftest` fails the build if one
# does not. Hexes NOT listed here are passed through untouched (a one-off colour stays a one-off colour).
palette:
  "#dc2626": c-red
  "#e2374d": c-crimson
  "#b91c1c": c-red-d
  "#c0392b": c-red-d
  "#f5b5b5": c-red-s
  "#fee2e2": c-red-bg
  "#fecaca": c-red-t
  "#fca5a5": c-red-t
  "#b45309": c-amber
  "#d97706": c-amber
  "#f5d98e": c-amber-s
  "#fef3c7": c-amber-bg
  "#a16207": c-gold
  "#b9890a": c-gold
  "#d9a406": c-gold
  "#d4a017": c-brass
  "#f59e0b": c-honey
  "#ea580c": c-orange
  "#16a34a": c-green
  "#1a9e54": c-green-d
  "#65a30d": c-lime
  "#0d9488": c-teal
  "#0891b2": c-cyan
  "#0e7490": c-cyan-d
  "#06b6d4": c-sky
  "#0ea5e9": c-sky
  "#2563eb": c-blue
  "#6366f1": c-indigo
  "#7c5cff": c-violet
  "#7c3aed": c-purple
  "#a21caf": c-magenta
  "#ec4899": c-pink
  "#db2777": c-rose
  "#b5638a": c-mauve
  "#64748b": muted
  "#94a3b8": muted
  "#9ca3af": c-grey
  "#6b7280": c-grey-d
  "#475569": c-slate

# The research domains: the colour and the label a project card carries, keyed by the `domain:` its
# manifest names. Called `themes:` in the cockpit; renamed here because the UI themes in
# appearance.yml are also themes and the two were told apart only by which file they sat in.
# Shared palette with tools/present/content/present.yml.
domains:
  heart:     { color: "#e2374d", label: "Cardiology | ECG" }
  liver:     { color: "#0d9488", label: "Hepatology | imaging" }
  liverfl:   { color: "#0d9488", label: "Hepatology | federated" }
  liversurv: { color: "#0d9488", label: "Hepatology | survival" }
  privacy:   { color: "#2563eb", label: "Privacy | vertical FL" }
  theory:    { color: "#2563eb", label: "Privacy | theory" }
  immune:    { color: "#7c5cff", label: "Immunology | federated" }
  method:    { color: "#ea580c", label: "Methods frontier" }
  brain:     { color: "#7c3aed", label: "Neuroscience | EEG" }
  brainbci:  { color: "#7c3aed", label: "Neuroscience | BCI" }
  cs:        { color: "#0891b2", label: "Computer Science" }
  meta:      { color: "#64748b", label: "Meta-science" }


# Project-card colours: by tier (type_color) or by archive outcome (arch_color).
type_color: { active: "#ea580c", manuscript: "#0d9488", idea: "#7c5cff", published: "#16a34a", submitted: "#0ea5e9", in-prep: "#a16207", tech-report: "#0891b2", software: "#7c3aed", abandoned: "#6b7280", nogo: "#b45309", dropped: "#9ca3af", disproved: "#dc2626", exploring: "#f59e0b", phd: "#6366f1" }

# Primary board button order: every tab (Projects / Archive / Coauthor) splits its first-class button row by `type`, in THIS order.
type_order: [active, manuscript, idea, published, submitted, in-prep, tech-report, software, nogo, dropped, disproved, abandoned, exploring, phd]


