# ===========================================================================
# vocab.yml
# oculus's own configuration - words and their colours, and nothing else: the palette every hex maps
# onto, the research domains, the chip and status vocabularies, and the lane/tier/bucket words the
# surfaces group by. Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# === Palette tokens ========================================================
# Every configured hex maps to the named CSS token. Unlisted hex values pass through unchanged.
palette:
  "#dc2626": c-red
  "#e2374d": c-crimson
  "#b91c1c": c-red-d
  "#c0392b": c-red-d
  "#f5b5b5": c-red-s
  "#fee2e2": c-red-bg
  "#fecaca": c-red-t
  "#fca5a5": c-red-t
  "#b45309": c-amber
  "#d97706": c-amber
  "#f5d98e": c-amber-s
  "#fef3c7": c-amber-bg
  "#a16207": c-gold
  "#b9890a": c-gold
  "#d9a406": c-gold
  "#d4a017": c-brass
  "#f59e0b": c-honey
  "#ea580c": c-orange
  "#16a34a": c-green
  "#1a9e54": c-green-d
  "#65a30d": c-lime
  "#0d9488": c-teal
  "#0891b2": c-cyan
  "#0e7490": c-cyan-d
  "#06b6d4": c-sky
  "#0ea5e9": c-sky
  "#2563eb": c-blue
  "#6366f1": c-indigo
  "#7c5cff": c-violet
  "#7c3aed": c-purple
  "#a21caf": c-magenta
  "#ec4899": c-pink
  "#db2777": c-rose
  "#b5638a": c-mauve
  "#64748b": muted
  "#94a3b8": muted
  "#9ca3af": c-grey
  "#6b7280": c-grey-d
