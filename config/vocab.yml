  - { key: revision,        icon: "🟧", label: "major revision (back with the authors)" }
  - { key: accepted,        icon: "🟩", label: "accepted (camera-ready pending)" }
  - { key: published,       icon: "✅", label: "published" }
  - { key: in-prep,         icon: "✍", label: "in preparation" }
  - { key: abandoned,       icon: "❌", label: "abandoned" }
  - { key: tech-report,     icon: "📄", label: "tech report (not peer-reviewed)" }
  - { key: software,        icon: "📦", label: "software / framework (not a paper)" }
  - { key: coauthor,        icon: "🤝", label: "co-author" }
  - { key: lead,            icon: "👤", label: "first author" }
  - { key: phd,             icon: "🎓", label: "PhD thesis" }
  - { key: nogo,            icon: "⛔", label: "no-go (failed gate)" }
  - { key: dropped,         icon: "🗑", label: "dropped" }
  - { key: disproved,       icon: "❎", label: "disproved" }
  - { key: results-positive, icon: "⚪", label: "positive result (pre-writeup)" }
  - { key: admin-prep,      icon: "🟡", label: "admin/prep" }
  - { key: numbers-pending, icon: "🔵", label: "numbers pending" }
