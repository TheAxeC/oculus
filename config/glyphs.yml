# Oculus glyph vocabulary and the ASCII stand-ins used by terminal themes.


# Every reader names an entry here, so characters stay out of source and ordinary config files.
glyphs:
  # controls + actions
  refresh: "⟳"
  biennial: "⟳"
  expand: "⊕"
  collapse: "⊖"
  darkmode: "◐"
  theme_base: "◐"
  theme_rice: "◆"
  crt: "▚"
  wallpaper: "▨"
  unicode: "◇"
  launch: "↗"
  copy: "⧉"
  goto: "↪"
  note_back: "↺"
  current_month: "▍"
  # the Venues deadline sparkline ramp, low to high - indexed as a STRING (G.spark_blocks[i]), so the
  # leading space is the zero level and must stay. Kept here because .py source is ASCII-only.
  spark_blocks: " ▁▂▃▅▆▇"
  arrow_to: "→"
  bullet: "•"
  edit: "✎"
  star: "★"
  draft: "✏"
  chat: "💬"
  clear: "🧹"
  dismiss: "✕"
  cmd: "⌘"
  cards: "▦"
  list: "☰"
  disclosure: "▾"
  now: "▶"
  # status + markers
  check: "✓"
  done: "✅"
  fail: "✗"
  cross: "❌"
  bang: "!"
  warn: "⚠"
  overdue: "⛔"
  attention: "❗"
  flag: "⚑"
  pin: "📌"
  lock: "🔒"
  question: "❓"
  reply: "✱"
  info: "ℹ"
  # tab / section icons
  focus: "🎯"
  data: "⬢"
  venue: "◇"
  funding: "◈"
  pillar: "▢"
  code: "💻"
  changes: "🔀"
