# ===========================================================================
# glyphs.yml
# Part of the split cockpit config - merged by cockpit.config.load_config() (cockpit.yml + config/*.yml).
# ===========================================================================


# === Icon vocabulary ========================================================
# The cockpit's glyph set, in ONE place. build.py references these by name (G.refresh, G.focus, ...) so
# build.py source stays ASCII. Edit an icon here and it changes everywhere it renders. (status_legend and
# collections above carry their own icons.)
glyphs:
  # controls + actions
  refresh: "⟳"
  biennial: "⟳"
  expand: "⊕"
  collapse: "⊖"
  darkmode: "◐"
  launch: "↗"
  copy: "⧉"
  goto: "↪"
  note_back: "↺"
  current_month: "▍"
  # the Venues deadline sparkline ramp, low to high - indexed as a STRING (G.spark_blocks[i]), so the
  # leading space is the zero level and must stay. Kept here because .py source is ASCII-only.
  spark_blocks: " ▁▂▃▅▆▇"
  arrow_to: "→"
  bullet: "•"
  edit: "✎"
  draft: "✏"
  chat: "💬"
  clear: "🧹"
  dismiss: "✕"
  cmd: "⌘"
  cards: "▦"
  list: "☰"
  disclosure: "▾"
  now: "▶"
  # status + markers
  check: "✓"
  done: "✅"
  fail: "✗"
  cross: "❌"
  bang: "!"
  warn: "⚠"
  overdue: "⛔"
  attention: "❗"
  flag: "⚑"
  pin: "📌"
  lock: "🔒"
  question: "❓"
  reply: "✱"
  # tab / section icons
  focus: "🎯"
  data: "⬢"
  venue: "◇"
  funding: "◈"
  program: "▢"
  code: "💻"
  published: "📦"
  archived: "🗂"
  litwatch: "🔭"
  scout: "🎓"
  audit: "🔍"
  teaching: "🏫"
  followup: "🔔"
  paper: "📄"
  events: "🗓"
  collab: "🤝"
  hpc: "🖥"
  live: "⚡"
  inbox: "📨"
  memories: "🖼"
  linkedin: "✍"
  coin: "🪙"
  author: "👤"
  folder: "📁"
  link: "🔗"
  journals: "📰"
  conference: "🎤"
  venue_dist: "📚"
  refresh_live: "🔄"
  # state dots / shapes
  grip: "⠿"
  active: "📍"
  idea: "💡"
  stale: "⏳"
  deadline: "⏰"
  timing: "⏱"
  spark: "✦"
  circle_empty: "○"
  circle_filled: "●"
  square_filled: "■"
  # radar / status colors
  red: "🔴"
  purple: "🟣"
  green: "🟢"
  white: "⚪"
  fire: "🔥"     # per-card priority badge (repeated by flame count)
  checkbox_on: "☑"
  checkbox_off: "☐"
  email: "✉"
  tasks: "🧷"
  snooze: "💤"
  sent: "📨"
  writing: "✍"
  x_mark: "✗"
  # the three things a terminal pane runs (oculus O18); each character is already in `ascii:` above.
  terminal_claude: "✦"
  terminal_codex: "◇"
  terminal_shell: "▶"
  # circled section numbers (inbox)


# === ASCII stand-ins (terminal themes) ======================================
# The rice themes swap every glyph below for its ASCII stand-in, client-side (02-views.js walks text
# nodes; attributes and scripts are untouched, and the original text is kept so switching back is exact).
# A screenshot with an emoji in it is not a terminal screenshot - this is what makes the look hold.
# Keyed by the CHARACTER, not the name, so it also covers icons that come from elsewhere: the status
# chips in `vocab.yml`, the collection icons in `layout.yml`, an emoji typed into a manifest.
# Keep them SHORT (1-3 columns). A glyph with no entry here simply stays as it is.
ascii:
  # controls + actions
  "⟳": "(r)"
  "⊕": "[+]"
  "⊖": "[-]"
  "◐": "(o)"
  "↗": "^"
  "⧉": "[c]"
  "↪": ">>"
  "↺": "<<"
  "▍": "|"
  "→": "->"
  "•": "*"
  "✎": "[e]"
  "✏": "[e]"
  "💬": "(@)"
  "🧹": "[~]"
  "✕": "x"
  "⌘": "^"
  "▦": "[#]"
  "☰": "==="
  "▾": "v"
  "▶": ">"
  "🔄": "(r)"
  # status + markers
  "✓": "+"
  "✅": "[+]"
  "✗": "x"
  "❌": "[x]"
  "❎": "[-]"
  "⚠": "/!\\"
  "⛔": "(!)"
  "❗": "!"
  "⚑": "|>"
  "📌": "[p]"
  "🔒": "[L]"
  "❓": "?"
  "✱": "*"
  # tab / section icons
  "🎯": "[@]"
  "⬢": "<#>"
  "◇": "<>"
  "◈": "<*>"
  "▢": "[ ]"
  "▣": "[#]"
  "▤": "[=]"
  "§": "S"
  "💻": "[_]"
  "📦": "[=]"
  "🗂": "[/]"
  "🔭": "(>)"
  "🎓": "[^]"
  "🔍": "(?)"
  "🔔": "(b)"
  "📄": "[d]"
  "📃": "[p]"
  "📘": "[b]"
  "🪧": "[P]"
  "🗓": "[::]"
  "🤝": "><"
  "🏫": "[T]"
  "🖥": "[:]"
  "⚡": "~"
  "📨": "[m]"
  "✉": "[m]"
  "🖼": "[i]"
  "✍": "[w]"
  "🪙": "($)"
  "👤": "(u)"
  "📁": "[f]"
