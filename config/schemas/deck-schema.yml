# ===========================================================================
# deck-schema.yml
# oculus's own configuration - the keys of a deck's `present.yml`, as the hub's `schema:` blocks write
# them. It governs `deck/present.yml` and every project's `present/present.yml`. oculus turns it into
# a JSON Schema, so the YAML editor completes the keys, shows each help line and marks a key the
# deck reader does not read. A group's `slides:` are project ids, checked against the projects like
# any reference and followed as links; the values of `order:` are not looked into: the deck reader
# reports a group or an entry it cannot read, with the key it is about.
# Merged with the other config/*.yml by loadConfig(); `deck_schema` is its top-level key.
# ===========================================================================

deck_schema:
  - field: deck
    type: records
    help: "The deck's own facts."
    fields:
      - { field: title, type: text, help: "The title shown on the first slide and in the deck list." }
  - field: defaults
    type: records
    help: "Values the slides of this deck take when they name none."
    fields:
      - { field: tag_tones, type: raw, help: "A map from a slide tag to the name of the hue its chip wears." }
  - field: groups
    type: records
    map: true
    help: "A map from a group name to its find rule, its sort, whether it discovers further decks and its slides."
    fields:
      - { field: find, type: raw, help: "Which project folders the group finds: their folder globs, the tiers and the statuses they may have." }
      - { field: sort, type: text, help: "How the found decks are ordered: folder or title." }
      - { field: discover, type: checkbox, help: "Whether the group also takes the decks it finds beyond the slides it names." }
      - { field: slides, type: tags, from: projects, help: "The projects whose decks the group shows, in order, each named by its project id." }
  - { field: order, type: raw, help: "The slides in the order they are shown: a slide file name, a group of slides, or a summary or a grid of a group." }
