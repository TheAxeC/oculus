# ===========================================================================
# manifest-schema.yml
# oculus's own configuration, the project.yml edit form as data: which fields there are, what each one is called, which widget edits it, which section it sits in, and where a widget's choices come from. Merged with oculus's other config files by loadConfig(); its top-level keys are `manifest_schema`, `groups`, the help lines of the maps its dotted fields lie in, and `manifest_fields`, the fields a hub adds to the form of its own projects.
# ===========================================================================


# The form. `sections:` is the one ordered list of the editor's groups for every record, in the order they are drawn; a group that holds no field is not drawn. A field's `section:` here is one of those names, and a `schema:` row of a data file takes any name. `type:` is the widget:
#   readonly  shown, never written by the form (`id` is the folder's name, and the write refuses it;
#             `code_availability.review_link` is written by the Zenodo deposit alone)
#   text      one line | textarea several lines | lines one list item per line
#   select    one of a list | chips several of a list, with a filter | tags several free strings
#   date      an ISO date | checkbox a flag | keymap a map the form does not write
#   rows      a list of rows of the text fields its `fields:` names, each drawn as a card
# `primary_key: true` marks the field a project is addressed by, its id: no write sets it, and a
# reference to a project stores it. `display:` ranks the fields a reference to a project shows,
# the filled field of the lowest rank first (`short`, else `title`), the id when neither is filled.
# `foreign_key:` names where the choices come from: a collection by its key in the hub's
# `collections:` list (venues, pillars, funding, data, domains, people, resources), `projects`, or
# a list of vocab.yml written `vocab.<key>` (vocab.tiers, vocab.stages, vocab.forms, vocab.chips),
# or `vocab.<key>.<field>` for the keys of a map whose row carries that field as true
# (vocab.statuses.acknowledged, the funding statuses a manuscript acknowledges). A value stored is
# the primary key of the entry it names, shown by that collection's `display:` fields. A list of
# targets offers their keys together (`waiting-on` takes people and projects). Each value of a
# `foreign_key` field is a link in the YAML editor: it opens the entry it names, lists the other
# files that name it and renames it everywhere.
# `options:` is a literal list, and a select takes both. Every field has a `help:` line: the form
# shows it and the YAML editor shows it on hover. oculus turns this file into the JSON Schema
# of every project.yml, so a key not named here is marked in the editor and is a finding.
manifest_schema:
  sections:
    Core: Core
    Indexing: Indexing
    Content: Content
    Connections: Connections
    Dates: Dates
    Recovery: Recovery
    "Deposit & compute": "Deposit & compute"
    Outcome: Outcome
    "Overrides (rare)": "Overrides (rare)"
    Website: Website
    Strategy: Strategy
    Positions: Positions
    Degrees: Degrees
    Awards: Awards
    References: References
    Profiles: Profiles
  fields:
    id:            { label: "id", type: readonly, primary_key: true, section: Core, help: "The project's folder name, or for a repository the name of its workspace folder. Never set by a write: rename the folder or the folder's entry in the workspace file to change it." }
    tier:          { label: "Tier", type: select, foreign_key: vocab.tiers, required: true, section: Core, help: "The kind of project, one word of the tiers list: research, personal or software. A board takes projects by their tier and, on the research boards, by your role and the stage. The project is shown with a finding when the key is missing or is not a word of the list." }
    stage:         { label: "Stage", type: select, foreign_key: vocab.stages, required: true, section: Core, help: "Where the project stands, one word of the stages list: an idea (nascent, scoping), work in flight (de-risking, exploring, in-prep, building, submit-ready, submitted, revision), or done (accepted, for a paper accepted and to appear, published, released, failed, stopped). The stage sets the category on the board, the Focus lane, the countdown and the in-flight counts; the folder the project is in decides neither the tier nor the stage." }
    form:          { label: "Form", type: select, foreign_key: vocab.forms, section: Core, help: "The form of the output, one word of the forms list: journal, conference, thesis, abstract, poster or tech-report. Leave it empty for a project with no such output; a software project is its tier." }
    short:         { label: "Short handle", type: text, display: 1, section: Core, help: "A short name for the card and the lists, such as bttd or raw-pls." }
    title:         { label: "Title", type: text, display: 2, section: Core, help: "The full title of the project or paper." }
    "status.chips": { label: "Status chips", type: chips, foreign_key: vocab.chips, section: Core, help: "The chips shown on the card, picked from the chips list: a situation such as blocked (external), parked (not being worked) or numbers still to run. Blocked and parked put the card on the Focus board's Blocked and Backburner lanes whatever its stage. A stage word belongs in Stage and a form in Form." }
    "status.line": { label: "Status line", type: text, section: Core, help: "One short line a reader takes in at a glance, such as the page count and where it stands." }
    pin:           { label: "Pin to top", type: checkbox, section: Core, help: "Tick to keep the card at the top of its board. Search and filters still hide it when it does not match." }
    venue:         { label: "Venue", type: select, foreign_key: venues, section: Core, help: "The venue the project is aimed at or published in, picked from the venues list by its id." }
    links:         { label: "Links", type: tags, section: Core, help: "Web addresses or paths that belong to the project, one per entry." }
    tags:          { label: "Tags", type: tags, section: Core, help: "Words the project is found by, one per entry, such as the language of a software project. The board search reads them." }
    year:          { label: "Year", type: text, section: Core, help: "The year of the paper or of the project, as a whole number." }
    eli5:          { label: "ELI5", type: textarea, section: Content, help: "The project in two plain sentences for a reader outside the field." }
    next:          { label: "Next", type: textarea, section: Content, help: "The next action on the project, the first thing to do when it is picked up again." }
    latest:        { label: "Latest", type: textarea, section: Content, help: "What changed most recently in the project, in a sentence or two." }
    results:       { label: "Results", type: lines, section: Content, help: "One headline result per line, each one a result you can claim." }
    ideas:         { label: "Ideas", type: lines, section: Content, help: "One avenue to try per line." }
    domain:        { label: "Domain", type: select, foreign_key: domains, section: Connections, help: "The research domain the project belongs to, picked from the domains list." }
    pillars:       { label: "Pillars", type: chips, foreign_key: pillars, section: Connections, help: "The research lines this project belongs to, picked from the pillars list." }
    funding:       { label: "Funding", type: chips, foreign_key: funding, section: Connections, help: "The grants that fund this project, picked from the funding list; pick as many as apply." }
    lead:          { label: "Lead", type: chips, foreign_key: people, section: Connections, help: "The person or people who lead the project, several for co-first authors, picked from the people list; pick as many as apply. A project naming you here is on your lead boards (Projects, Archive); one naming no lead is a finding." }
    collaborators: { label: "Collaborators", type: chips, foreign_key: people, section: Connections, help: "The people who work on this project, picked from the people list; pick as many as apply. A project naming you here, and not as lead or supervisor, is on the Coauthor board." }
    supervisors:   { label: "Supervisors", type: chips, foreign_key: people, section: Connections, help: "The people who supervise the work, listed last among the authors, picked from the people list; pick as many as apply. A project naming you here, and not as lead, is on the Supervision board." }
    "waiting-on":  { label: "Waiting on", type: tags, foreign_key: [people, projects], section: Connections, help: "Who or what this project is waiting for: a person from the people list or another project, one per entry." }
    related:       { label: "Related projects", type: chips, foreign_key: projects, section: Connections, help: "Other projects this one builds on or feeds, picked from the project list." }
    datasets:      { label: "Datasets", type: chips, foreign_key: data, section: Connections, help: "The datasets this project uses, picked from the data list." }
    deadline:      { label: "Deadline", type: date, section: Dates, help: "The day the next deadline falls on; it shows on the Focus radar until the project's stage meets it, such as submitted. Text that is not a date shows as open work." }
    followup:      { label: "Follow-ups", type: keymap, section: Dates, help: "Notes of things to do later, each with what to do, the date before which it stays hidden, whether it is done and the people it names as lead, supervisors and collaborators; an open note shows in the Follow-ups group on the Focus board. Add, change, mark done and delete them on the project's card; this form does not change them." }
    snooze:        { label: "Snooze until", type: date, section: Dates, help: "Pick a date to keep this project off the ticker until then; clear it to bring the project back." }
    "code_availability.status": { label: "Code deposit", type: select, options: [none, review-anon, deposited], section: "Deposit & compute", help: "Whether the code's GitHub repository is not made, private for anonymous review or public. The Deposit view's Push writes it; the Zenodo deposit has its own, Zenodo status." }
    "code_availability.date": { label: "Deposit date", type: date, section: "Deposit & compute", help: "The date the code's GitHub repository was pushed. The Deposit view's Push fills it in; the Zenodo deposit has its own, Zenodo date." }
    "code_availability.url": { label: "Deposit URL", type: text, section: "Deposit & compute", help: "The web address of the deposit." }
    "code_availability.doi": { label: "Deposit DOI", type: text, section: "Deposit & compute", help: "The DOI the deposit was given." }
    "code_availability.repo": { label: "Repo name", type: text, section: "Deposit & compute", help: "The public repository name, in lowercase words joined by dashes, for example cirrhosis-competing-risks." }
    "code_availability.description": { label: "Repo description", type: textarea, section: "Deposit & compute", help: "The description of the public repository." }
    "code_availability.homepage": { label: "Repo homepage", type: text, section: "Deposit & compute", help: "The web address the repository points to as its homepage." }
    "code_availability.topics": { label: "Repo topics", type: tags, section: "Deposit & compute", help: "The GitHub topics of the repository, one per entry." }
    "code_availability.visibility": { label: "Repo visibility", type: select, options: [public, private], section: "Deposit & compute", help: "Whether the repository is public or private." }
    "code_availability.anonymize": { label: "Anonymize", type: rows, fields: [term, as], section: "Deposit & compute", help: "The words For review takes out of the anonymous Zenodo copy of code/, one row each: a term, matched without regard to case and letter for letter, and what it becomes (as), Anonymous when as is empty. It is replaced in every path and text file, the title and the description, the longest term first; a binary or compressed file holding a term stops the upload." }
    "code_availability.review_link": { label: "Review link", type: readonly, section: "Deposit & compute", help: "The Zenodo share link reviewers open the anonymous copy's files with. For review writes it." }
    "code_availability.zenodo_status": { label: "Zenodo status", type: select, options: [none, review-anon, deposited], section: "Deposit & compute", help: "Whether the code is on Zenodo: not deposited, deposited for anonymous review with its files open by the review link, or published with its real files and authors. The Deposit view's For review and Publish write it; a deposit made outside oculus is recorded here, or left empty beside its DOI for For review to read." }
    "code_availability.zenodo_date": { label: "Zenodo date", type: date, section: "Deposit & compute", help: "The date the Zenodo deposit was last sent. For review and Publish fill it in." }
    "repository.url": { label: "Remote URL", type: text, section: "Deposit & compute", help: "The address of the project's repository on its remote. Clone fetches it into a folder the reader picks." }
    "repository.visibility": { label: "Remote visibility", type: select, options: [public, private], section: "Deposit & compute", help: "Whether the repository on the remote is public or private." }
    "repository.description": { label: "Remote description", type: textarea, section: "Deposit & compute", help: "The description of the repository on the remote." }
    "repository.homepage": { label: "Remote homepage", type: text, section: "Deposit & compute", help: "The web address the repository on the remote points to as its homepage." }
    "repository.topics": { label: "Remote topics", type: tags, section: "Deposit & compute", help: "The topics of the repository on the remote, one per entry." }
    "repository.date": { label: "Remote created", type: date, section: "Deposit & compute", help: "The date the repository was created on the remote." }
    compute:       { label: "Compute", type: chips, foreign_key: resources, section: "Deposit & compute", help: "The clusters, machines and storage the project runs on, picked from the resources list." }
    "reproduced.date": { label: "Reproduced (date)", type: date, section: "Deposit & compute", help: "The date the whole pipeline was last run again from the raw data to regenerate the reported numbers." }
    "reproduced.note": { label: "Reproduced (note)", type: textarea, section: "Deposit & compute", help: "What was run again, and anything a rerun needs, such as a GPU cluster or credentialed data." }
    outcome:       { label: "Outcome (citation / why-not)", type: textarea, section: Outcome, help: "How the project ended, as a citation for a published project or the reason for one that was stopped. Any project may carry it." }
    doi:           { label: "DOI", type: text, section: Outcome, help: "The DOI of the published paper. Any project may carry it." }
    paths:         { label: "Path overrides", type: keymap, section: "Overrides (rare)", help: "Where a document is kept when it is not in its usual place. Change these only when a document has moved. It also holds cluster, the folder on the cluster that holds the project's code for Submit; its default is ~/projects/<id>." }
    subtasks:      { label: "Subtasks", type: keymap, section: Dates, help: "A checklist of lines, each with what to do, a deadline, whether it is done and a snooze date. Add and tick them on the project's card; this form does not change them." }
    "publication.authors": { label: "Authors", type: text, section: Website, help: "The authors of the paper as the website prints them, one text with the names separated by commas. A manifest that carries a publication record is listed in the website's publications; its title, year, section, your place among the authors, the words around the venue and the Code link are taken from the rest of the manifest." }
    "publication.book": { label: "Printed venue", type: text, section: Website, help: "The venue as the website prints it, such as the journal's or the conference's full name." }
    "publication.program": { label: "Research lines", type: tags, section: Website, help: "The research lines the paper belongs to, keys of programs: of the website's own file (website.files.site); a key the file lacks is a finding." }
    "publication.url": { label: "Paper address", type: text, section: Website, help: "The address the paper's title links to on the website; empty for none." }
    "publication.links": { label: "Paper links", type: keymap, section: Website, help: "The paper's other links, rows of a name and an address, in the order the website prints them, such as Preprint and Supplementary. The Code link is added after them from the code deposit: the DOI's address once the Zenodo status is deposited; under a deposited Code deposit, the DOI's address when a DOI is set, else the Deposit URL; a DOI under anonymous review on Zenodo is never linked. This form does not change them." }
    "publication.abstract": { label: "Abstract", type: textarea, section: Website, help: "The abstract the website shows under the paper; empty for none." }
    "publication.pub_last": { label: "Mark", type: text, section: Website, help: "A mark printed after the authors, such as Spotlight." }
    "publication.hide": { label: "Hidden", type: checkbox, section: Website, help: "Tick to keep the paper off the website while it stays in the file; the website writes the value as it is held." }
    "publication.rank": { label: "Place", type: text, section: Website, help: "The place of the entry in its website section, lowest first, as a whole number." }
    "cv.title": { label: "CV title", type: text, section: Website, help: "The title the CV's projects list the project with, when it is not the manifest's title. A manifest that carries a cv record is listed in the CV's projects." }
    "cv.url": { label: "CV address", type: text, section: Website, help: "The address the CV links the project to; empty for none." }
    "cv.duration": { label: "CV period", type: text, section: Website, help: "The period of the project as the CV prints it, such as Jan. 2015 - Current." }
    "cv.about": { label: "CV text", type: textarea, section: Website, help: "The text the CV prints under the project." }
    "cv.role": { label: "CV role", type: text, section: Website, help: "Your role in the project as the CV prints it." }
    "cv.min": { label: "Left out of the short CV", type: checkbox, section: Website, help: "Tick to leave the project out of the short CV." }
    "cv.hide": { label: "Hidden on the CV", type: checkbox, section: Website, help: "Tick to keep the project off the CV while it stays in the file." }
    "cv.rank": { label: "CV place", type: text, section: Website, help: "The place of the row in the CV's projects, lowest first, as a whole number." }

# The fields a hub adds to the project form of its own projects, set in the hub's .oculus/config.yml; oculus adds none. A row is a field of `manifest_schema` with `field:`, the key of project.yml it adds, beside its `label`, `type`, `section`, `help` and, where its widget takes them, `foreign_key`, `options` and `required`. The field is drawn after oculus's fields of its section, in the hub's order, and is a known key of that hub's manifests only. A row with no field, a row naming a field the form already has or an earlier row names, a section the form lacks or a widget the form does not draw, a row its shape refuses otherwise, and a row whose `foreign_key` names no collection of the hub, `projects` or vocab list are each a finding, and the row is left out. For example:
#   manifest_fields:
#     - { field: grant_id, label: Grant, type: text, section: Core, help: "The grant number." }
manifest_fields: []

# The help line of each map a dotted field lies in (`status` of `status.chips`), which the YAML editor shows for the map. A map without a line and a line for no such map are findings.
groups:
  status: "Where the project stands: the chips shown on its card and the one line read at a glance."
  code_availability: "The deposit of the project's code: whether and where it is deposited, the public repository it is deposited in, and its Zenodo record with the words its anonymous copy leaves out."
  repository: "The project's repository on its remote: its address, visibility, description, homepage, topics and the date it was created."
  reproduced: "The last run of the whole pipeline again from the raw data: its date and what it needed."
  publication: "The entry the website's publications list the paper with: the authors, the venue, the research lines, the links, the abstract and the entry's place in its section."
  cv: "The row the CV's projects list the project with: its title, address, period, text, role and place, and whether the short CV or the whole CV leaves it out."
