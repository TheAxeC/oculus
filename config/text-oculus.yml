# ===========================================================================
# text-oculus.yml
# oculus's own groups of the UI-string catalog. The catalog is the one `text:` key spread over two
# files: text.yml holds the groups that arrived with the cockpit's copy, this file holds the groups
# oculus added, and loadConfig() folds both into one map of groups (a group defined in both is a
# finding). Every source file stays under 1000 lines, which is why there are two. A key is read as
# t("group.key") wherever it is drawn; a key a component names and no file holds fails
# tests/keys.test.ts.
# ===========================================================================

text:
  app:                         # oculus's own group: the strings the cockpit has no place for, the document title among them.
    title: "oculus"
    socket: "Socket: {0}"
    socket_connecting: "connecting"
    socket_open: "open"
    socket_closed: "closed"
    version: "Snapshot version {0}"
    waiting: "Waiting for the first snapshot"
    projects: "Projects: {0}"
    venues: "Venues: {0}"
    datasets: "Datasets: {0}"
    programs: "Pillars: {0}"
    domains: "Domains: {0}"
    funding: "Funding schemes: {0}"
    collections: "Collections: {0}"
    sessions: "Sessions: {0}, {1} live"
    git: "Workspaces with git state: {0}"
    pane_path: "Pane at {0}"
    tabs: "Tabs: {0}"
    title_waiting: "oculus ({0} waiting)"

  notify:                      # the hook push of DESIGN.md's "Sessions": routes/api/hook and the two chips SessionList draws.
    stop: "Session finished"
    permission_chip: "waiting on you"
    idle_chip: "idle"

  ui:                          # oculus's primitives: the strings a domain-blind component needs, and no more.
    sash: "Resize"
    close_tab: "Close tab"
    close_glyph: "dismiss"     # a name in `glyphs:`, not a character: the close control's icon.
    unknown_view: "Unknown view: {0}"
    rail: "Views"
    theme: "Theme"
    theme_glyph: "darkmode"
    crt: "CRT overlay: scanlines and vignette, cosmetic only"
    # the rest of the appearance controls at the foot of the rail. The theme list itself is data
    # rather than strings, and lives in appearance.yml as { name, class, label }.
    title: "Theme: {0} - hover for the picker (light, dark, and the terminal palettes)"
    crt_on: "▚ crt"
    crt_title: "CRT overlay: scanlines + vignette. Cosmetic only."
    unicode: "◇ unicode"
    unicode_title: "Keep the real glyphs on a terminal theme instead of their ASCII stand-ins."
    wallpaper: "▨ wallpaper"
    wallpaper_title: "Wallpaper behind the panels - and the slight transparency that goes with it"
    accent_title: "Accent colour - used for state (active tab, selection, focus). Same as :accent"
    accent_reset: "back to the theme's own accent"
    panel: "Panel"
    arrange_sessions: "Arrange for sessions"
    arrange_restore: "Back to my own arrangement"
    dock_right: "Panel on the right"
    dock_bottom: "Panel along the bottom"
    dock_hidden: "Panel hidden"
    dock_glyph: "cards"
    docs: "Docs"              # the rail section of `bookmarks:` (layout.yml): one button per local document.
    pane_menu: "Pane"
    pane_menu_glyph: "list"    # a name in `glyphs:`: the opener at the right of a tab strip.
    pane_close: "Close pane"
    pane_maximise: "Maximise pane"
    pane_restore: "Restore panes"
    move_to_panel: "Move tab to the panel"
    move_to_main: "Move tab to the main area"
    split_right: "Split tab to the right"
    split_down: "Split tab downwards"
    drag_hint: "Moving {0}"
    confirm_stop: "Confirm"    # the second press of a two-press control: the one that actually acts.
    row_menu: "Row actions"    # the opener of a Menu sitting on one row of a list.

  views:                       # oculus's views: one label per registered view, and the glyph name it is drawn with.
    status: "Status"
    status_glyph: "now"
    findings: "Findings"
    findings_glyph: "warn"
    findings_none: "No findings: every id resolves and every status is in the vocabulary."
    gallery: "Gallery"
    gallery_glyph: "cards"
    # The one project board, registered three times over three tier sets. The words are the `tabs:`
    # entries of layout.yml, which is what the cockpit's three tabs are called.
    projects: "Projects"
    projects_glyph: "focus"
    archive: "Archive"
    archive_glyph: "archived"
    coauthor: "Coauthor"
    coauthor_glyph: "author"
    # One project as its own tab, opened from the title of a card. Registered once, opened once per
    # project: two projects are two instances of this one view.
    project: "Project"
    project_glyph: "folder"
    editor: "Editor"
    editor_glyph: "edit"
    # A local HTML file under one of the `roots:` of sources.yml, opened as its own tab from the rail's
    # Docs section. Registered once, opened once per bookmark.
    document: "Document"
    document_glyph: "paper"
    # The collection files of sources.yml, one registration each over the one Collection view. The
    # words are the file's own `title:`; the key is the collection key, so a collection added there
    # needs its two keys added here and nowhere else.
    statements: "Statements"
    statements_glyph: "draft"
    events: "Talks & Events"
    events_glyph: "events"
    education: "Education & Service"
    education_glyph: "teaching"
    applications: "Applications"
    applications_glyph: "inbox"
    collaborations: "Collaborations"
    collaborations_glyph: "collab"
    tasks: "Tasks & Service"
    tasks_glyph: "tasks"
    code: "Code"
    code_glyph: "code"

  gallery:                     # the living style sheet: every primitive with sample data, in every theme.
    title: "Gallery"
    toolbar: "Gallery controls"
    form: "Chip form"
    form_outline: "Outline"
    form_filled: "Filled"
    form_both: "Both"
    search: "Filter the table"
    reset: "Reset"
    reset_glyph: "refresh"
    cards: "Cards"
    card_plain: "Plain card"
    card_tone: "Toned card"
    card_pinned: "Pinned card"
    card_body: "The body is a snippet, so a card carries whatever the view puts in it."
    card_footer: "The footer is a snippet too, under a hairline."
    chips: "Chips"
    meters: "Meters"
    meter: "Share of {0}"
    table: "Table"
    col_tone: "Tone"
    col_chip: "Chip"
    col_count: "Chips"
    empty: "Empty state"
    empty_message: "Nothing matches the filter."
    empty_glyph: "circle_empty"

  collection:                  # oculus: one collection file as its own tab - the cards are drawn from the file's own schema.
    toolbar: "Collection controls"
    search: "Filter the entries"
    status: "Filter by status"
    empty: "No entry matches the filter."

  project:                     # oculus: one project as its own tab - its card, its documents, its sessions.
    documents: "Documents"
    sessions: "Sessions"
    no_documents: "This project has none of the four Markdown documents."
    no_sessions: "No session has worked in this folder."
    none: "No project chosen. Open a project from the title of its card."
    none_glyph: "folder"
    unknown: "The snapshot holds no project with the id {0}."
    doc_loading: "loading the document ..."
    doc_failed: "the document was not read: {0}"

  document:                    # oculus: one local HTML file as its own tab, in an iframe over api/file.
    toolbar: "Document controls"
    open_outside: "Open in a browser tab"
    none: "No document chosen. Open one from the Docs section of the rail."
    none_glyph: "paper"

  editor:                      # the project.yml edit form: the words round the widgets manifest-schema.yml describes.
    title: "Manifest"
    toolbar: "Manifest editor"
    none: "No project chosen. Open the editor from a project card."
    none_glyph: "edit"
    unknown: "The snapshot holds no project with the id {0}."
    save: "Save"
    save_glyph: "check"
    revert: "Revert"
    revert_glyph: "note_back"
    saving: "saving"
    dirty: "{0} changed"
    clean: "nothing changed"
    saved: "saved {0}"
    saved_none: "nothing to save"
    refused: "{0}: {1}"
    failed: "not saved: {0}"
    empty_choice: "(none)"
    search: "filter"
    remove: "click to remove"
    remove_glyph: "dismiss"
    no_choices: "no choices"
    not_in_model: "the snapshot does not carry this field, so it opens empty; saving it writes what is typed"
