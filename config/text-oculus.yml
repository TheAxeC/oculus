# ===========================================================================
# text-oculus.yml
# oculus's own groups of the UI-string catalog. The catalog is the one `text:` key spread over two
# files: text.yml holds the groups that arrived with the cockpit's copy, this file holds the groups
# oculus added, and loadConfig() folds both into one map of groups (a group defined in both is a
# finding). Every source file stays under 1000 lines, which is why there are two. A key is read as
# t("group.key") wherever it is drawn; a key a component names and no file holds fails
# tests/keys.test.ts.
# ===========================================================================

