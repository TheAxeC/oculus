    message_prompt: "Write the commit message for the staged diff on stdin. One line of subject: capitalised, imperative, no trailing full stop. Then a blank line. Then one bullet per change, each starting with '- ' and an imperative verb. Plain ASCII, no markdown headings, no code fences, no quotes around the message, nothing but the message itself. Name no tool, no model and no assistant anywhere in it, and add no trailer of any kind."
