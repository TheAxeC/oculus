# Oculus text owned by server responses and status lines.
text:
    notify:
        idle_chip: idle
        permission_chip: waiting on you
        stop: Session finished
    server:
        chat:
            chat_focus_note: FOCUS - answer specifically about project `{0}` ({1}). Your working directory is the project's own folder `{2}` (absolute); read its files for depth.
            chat_index_note: The portfolio index is the file {0}; read it first.
            chat_instruction: You are an assistant embedded in Axel Faes' PRIVATE, local-only research hub (oculus). The hub root is `{0}`; every folder in the portfolio index is relative to this absolute path. Your working directory is `{1}`; for a project chat this is the project's own folder, also named in the focus note. The portfolio index file named below is your authoritative INDEX (every project's id, status, venue, headline results, and folder paths) - it IS real; never doubt it or claim you have no source. Answer surface questions from it directly. For DEPTH (methods, full results, dead-ends, manuscript text, code), READ the project's own files with your read tools. Resolve its index folder against the absolute hub root before reading its README.md, code/README.md, manuscript/ and code/; use those absolute paths from any working directory. Cite what you read (project id + file). Be concise. The data is PRIVATE (dead-ends, unpublished numbers) - fine to discuss here, but NEVER suggest writing up a null or negative result. Do not read human-only files named NOTES.md or DIARY.md. If neither the index nor the files say, say so.
            chat_name: Chat {0}
            chat_name_focus: '{0}'
            seed_focus: "Ask about {0}: methods, results, what's next..."
            seed_portfolio: Ask about the portfolio, e.g. "what's blocked?", "summarise a project". Runs on your Claude Code / Max plan; I remember this conversation.
        commands:
            held_file: '{0} is already a command in .oculus/commands.yml of this repository, so it cannot be saved under that name'
            held_found: '{0} is already a command found in this repository, so it cannot be saved under that name'
        config_key:
            local: local.yml is the machine's own file and is not written from here
            no_entry: The options catalog has no option of that name in a tracked config file
            not_single: This option is a list or a family, so it is not set one key at a time
            not_boolean: This option takes true or false
            not_number: This option takes a finite number
            not_whole: This option takes a whole number
            not_program: This option takes a program name, with no slash and no white space
            not_extension: This option takes an extension with its dot, such as .pdf
            not_bundle_id: This option takes the bundle id of an application, such as com.apple.Preview
            not_text: This option takes text
            not_choice: 'This option takes one of: {0}'
            not_in_source: 'This option takes one of the items of the list {0}'
            no_list_for: 'The field {0} of this record names no list for {1}, so this field is left out'
            not_words: This option takes a list of words
            not_numbers: This option takes a list of numbers
            wrong_slots: 'This option takes exactly {0} items: {1}'
            parked_added: This list only drops items; an item is added from the Audit view
            number_range: 'This option takes a number from {0} to {1}'
            number_min: 'This option takes a number of at least {0}'
            number_max: 'This option takes a number of at most {0}'
            not_glyph: This option takes a glyph name of config/catalogs/glyphs.yml
            not_hue: This option takes a hue name of the palette
            not_colour: This option takes a colour of the palette that is a hue
            not_hub_path: This option takes a path inside the hub, written relative to it, with no .. and no backslash
            no_folder: 'This option takes a folder of the hub, and {0} is not one'
            no_file: 'This option takes a file of the hub, and {0} is not one'
            not_a_path: This option takes an absolute path or one that starts with ~/
            not_parsed: The file does not parse
            not_in_file: The file does not hold this key as a plain or quoted value
            not_kept: The edit would change more than this one value, so the file is left as it is
        deck_edit:
            changed: 'The file {0} changed on disk while you were working. Read the deck again and make the change again.'
            file_large: 'The file {0} is too large to outline'
            has_deck: 'The folder {0} already holds a present.yml'
            image_empty: 'The image {0} holds no bytes'
            image_large: 'The image {0} is larger than {1} MB'
            image_name: 'The name {0} cannot be given to an image file'
            image_type: 'The file {0} is not a PNG, JPEG, GIF, WebP or SVG image'
            new_slide_heading: New slide
            no_deck: There is no deck at that path that oculus can read
            no_file: 'The file {0} is not there'
            no_folder: 'The folder {0} is not in the folders oculus serves'
            no_slide: 'The deck has no slide {0}'
            not_a_deck: That path is not a present.yml
            not_kept: The deck files would not keep the change, so they were left as they were
            not_markdown: 'The file {0} is not a Markdown file'
            not_own: 'The slide {0} is not in a file of this deck'
            outside: That path is outside the folders oculus serves
            title_empty: A presentation needs a title
        deck_slides:
            changed: The group's slides list changed on disk while you were working. Read the deck again and make the change again.
            no_group: 'The deck has no group named {0}'
            not_a_deck: That path is not a present.yml
            not_found_by: 'The deck {0} is not one that the group {1} finds, so it cannot join it'
            not_kept: The deck file did not keep the new lists, so it was left as it was
            order_changed: The order of the deck changed on disk while you were working. Read the deck again and make the change again.
            order_not_a_permutation: The new order must hold the same entries as the order the file holds
            outside: That deck is outside the folders oculus serves
            repeated: A deck is listed twice in the group
            unknown_name: 'No deck named {0} belongs to the group'
        debug:
            bad_action: action must be launch, approve, continue, next, stepIn, stepOut, finishFrame, frame, evaluate, breakpoints, functions, watch or stop, with the fields that action takes
            bad_header: rite_dap sent a message with no usable Content-Length header
            bad_lines: lines must be whole numbers from 1
            bad_path: path must be an absolute path under a root the file browser serves
            default_name: Debug the open file
            ended_meanwhile: The debug session ended before the evaluation was answered
            exit_code: rite_dap exited with code {0}
            field_problem: '{0} {1}'
            finished: The debug session ended
            launch_line: 'rite_dap {0} in {1}'
            no_configuration: 'launch.yml has no configuration named {0}'
            no_expression: Type an expression to evaluate
            no_frame: No frame {0} in this pause
            no_session: No debug session is running
            not_json: rite_dap sent a message that is not JSON
            not_message: rite_dap sent a message that is neither a response nor an event of the debug protocol
            not_paused: No debug session is paused
            not_rite: 'Only a .rite file that exists can be debugged: {0}'
            partial: rite_dap stopped in the middle of a message
            process: rite_dap {0} (pid {1})
            request_failed: 'rite_dap refused a request: {0}'
            running: 'A debug session is running: stop it first'
            signal: rite_dap ended with signal {0}
            start_failed: "rite_dap could not be started: {0}. Set rite_dap_bin in config/local.yml to the adapter's path."
            stopped: The debug session was stopped
            too_many_lines: lines must hold at most 10,000 numbers
            unserved: '{0} is under no root the file browser serves, so it cannot be debugged'
        config_value:
            local: local.yml is the machine's own file and is not written from here
            no_entry: The options catalog has no list or family of that name in a tracked config file
            own_write: The rail and the arrangements are set from the rail editor and the pages, not from here
            single: This option is one value, so it is set one key at a time
            not_parsed: The file does not parse
            not_in_file: The file does not hold this key as a list or a map written in place
            changed: The setting changed in the file since it was read, so nothing was written
            reserved: 'A key named {0} cannot be written'
            not_strings: This option takes a list of text
            wrong_list: This setting is a list of records in the file, so it takes a list
            wrong_map: This setting is a map in the file, so it takes a map
            bad_record: 'Entry {0} is not a record of named fields'
            bad_field: 'Entry {0} has a field {1} that this setting does not describe'
            wants_list: 'Entry {0} must be a list of records, as every entry of this setting is'
            wants_record: 'Entry {0} must be one record, not a list'
            wants_scalar: 'Entry {0} must be one value or a list of values, not a record'
            wants_value: 'Entry {0} must be one value, not a list or a record'
            wants_records: This field takes a list of records
            field_problem: 'Entry {0}, field {1}: {2}'
            unsupported: The way this value is written in the file cannot be edited in place, so the file is left as it is
            not_kept: The edit would change more than this value, so the file is left as it is
        export:
            agent: 'Agent: {0}'
            assistant: Agent
            error: error
            folder: 'Folder: {0}'
            ok: ok
            running: running
            session: 'Session: {0}'
            started: 'Started: {0}'
            tool: '{0}: {1} ({2})'
            user: You
        fork:
            name: fork of {0}
        git:
            cancelled: '{0} was stopped by Cancel'
            exit_status: '{0} stopped with exit status {1} and gave no reason'
            kind_cherry_pick: cherry-pick
            kind_merge: merge
            kind_rebase: rebase
            left_in_progress: '{0}; the {1} is left in progress'
            program_gh: The gh command
            program_git: Git
            signal: '{0} was ended by the signal {1}'
            timed_out: '{0} did not finish within {1} seconds, so it was stopped'
            too_much_output: '{0} wrote more than {1} MB of output, so it was stopped'
        latex:
            name: latex {0} {1}/{2}
        start:
            already_running: oculus is already running; its window is brought to the front
            handler_failed: 'oculus: the server handler {0} could not be loaded: {1}'
            port_in_use: 'oculus: port {0} is in use'
        task:
            name: 'Task: {0}'
            seed_deadline: 'Deadline: {0}'
            seed_file: 'Written in {0}; read that file for its context.'
            seed_note: 'Note: {0}'
            seed_part_of: 'Part of: {0}'
            seed_subtasks: 'Open subtasks: {0}'
            seed_title: 'Task: {0}'
