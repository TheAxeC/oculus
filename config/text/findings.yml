# Oculus text owned by the data layer's findings: one sentence per problem the readers, the validation rules and the schema check report.
text:
    findings:
        file:
            does_not_parse: 'does not parse: {0}'
            not_a_map: is not a map of keys
            list_not_a_list: entry list {0} is not a list
            list_missing: entry list {0} is missing
            entry_not_a_map: entry is not a map of keys
        collections:
            file_missing: collection file does not exist
            key_read_twice: collection key {0} is already read from {1}
        registries:
            file_missing: registry file does not exist
            entry_no_id: entry has no string {0}
        feeds:
            cannot_read: 'cannot be read: {0}'
        roots:
            not_a_list: roots is not a list
            not_a_map: a root is not a map of key and dir
            no_key: a root has no key
            no_dir: the root names no dir
            repeated_key: two roots carry this key
            relative: 'the dir {0} is relative; a root is absolute or starts with ~/'
            missing_dir: 'no directory at {0}; this root serves nothing'
            hub_not_boolean: hub is not true or false; the root is read as a plain root
            hub_reserved_key: a hub root cannot be keyed hub or engine, or hold a colon; the root is read as a plain root
            hub_is_first: the root is, lies inside or holds the first hub; it is read as a plain root
            hub_same_dir: an earlier hub root names the same directory; this root is read as a plain root
            hub_nested: the root lies inside or holds the directory of an earlier hub root; it is read as a plain root
            tier_key: "a roots entry takes no tier; the repository's project.yml names its own tier"
            project_reserved_key: a root that holds a project needs a key that is not hub or engine and holds no colon, slash or space, since the key is the project's id; the root is no project
            project_is_first: the root is, lies inside or holds the first hub, so its .oculus/project.yml is not read as a project
            project_same_dir: an earlier root that holds a project names the same directory; this root is no project
            project_in_hub: the root is, lies inside or holds the directory of a hub root, so its .oculus/project.yml is not read as a project
        hubs:
            id_prefix: 'the id {0} begins with {1}:, the key of a hub root, so it cannot be told from a record of that hub'
        docs:
            missing: document does not exist
        rail:
            not_a_list: rail is not a list of buttons
            shape: a rail button is not a map of label, glyph and page; it is not drawn
            label: the rail button for {0} has no label; it is not drawn
            glyph: the rail button for {0} names no glyph; it is not drawn
            glyph_unknown: the rail button for {0} names a glyph glyphs.yml does not hold; it is not drawn
            page: a rail button names no page; it is not drawn
            page_unknown: the rail button for {0} names a page arrangements does not hold; it is not drawn
            repeated: a second rail button names the page {0}; only the first is drawn
        appearance:
            glyph: the theme {0} names no glyph; it is offered with its words alone
            glyph_unknown: the theme {0} names a glyph glyphs.yml does not hold; it is offered with its words alone
            repeated: a second theme row names {0}; only the first is offered
            code_theme: code_theme is {0}, which is neither tokens, a VS Code theme nor the id of a Shiki theme; the editor colours code from the tokens instead
        manifests:
            id_not_folder: id {0} is not the folder name {1}
            scan_missing: scan directory does not exist
            id_twice: 'the id {0} is held by {1}; this project.yml in {2} is not read'
            not_file: project.yml is not a regular file and is not read
            too_large: project.yml is larger than {0} bytes and is not read
            scan_not_a_list: scan is not a list of folders
            scan_no_dir: 'scan entry {0} is not a map with a dir; it is not read'
            scan_key: 'scan entry {0} has the key {1}; a scan entry holds dir and optional alone, and the key is not read'
            new_project_dir_not_a_map: new_project_dir is not a map of tier to folder; no folder is used
            new_project_dir_tier: 'new_project_dir names {0}, which is none of {1}; the entry is not used'
            new_project_dir_folder: new_project_dir has no folder for {0}; the entry is not used
            new_project_dir_outside: 'the folder {1} of new_project_dir for {0} is not a scan folder and lies under none; the entry is not used'
        deck:
            path_outside: '{0} is outside {1}'
            figure_missing: figure {0} is not in {1}/
            equation_image: "equation {0} names an image; a slide's equation is LaTeX"
            name_twice: 'group {0} finds two decks named {1} ({2}); neither is placed under that name'
            slides_twice: group {0} lists {1} twice; it is placed once
            slide_missing: group {0} names {1}, which matches no deck
            discover_conflict: 'deck {0} is found by the discovering groups {1} and named by none; it is in neither'
            kind_unknown: unknown slide kind {0}; the slide is not drawn
            find_not_a_map: group {0} has a find that is not a map; the group finds nothing
            find_no_folders: group {0} has a find with no folders; the group finds nothing
            groups_not_a_map: groups is not a map; no group is read
            group_not_a_map: group {0} is not a map and is not read
            sort_unknown: group {0} sorts by {1}, which is not folder or title; folder is used
            order_shape: an order entry is not a slide file, a slides group, a summary or a grid; it is not placed
            domain_unknown: 'project {0} names the domain {1}, which is not in the domains of .oculus/config/catalogs/vocab.yml in the hub (of config/catalogs/vocab.yml when the hub sets none); its slides are drawn in the neutral tone'
            no_file: '{0} holds no present.yml'
            unreadable: present.yml does not parse
            not_a_map: present.yml is not a map
            no_order: order is empty; the deck draws no slides
            order_file_missing: '{0} is not in {1}'
            front_matter: the front matter of {0} does not parse; its lines stay in the slide
            file_empty: '{0} holds no slide'
            count_unknown: a count of group {0}, which the deck does not define, stays as written
            legend_unknown: legend names group {0}, which the deck does not define
            order_group_unknown: order names group {0}, which the deck does not define
            cycle: deck {0} holds itself through its groups; the repeat is not placed
            folder_missing: deck folder {0} is not in {1}
        config:
            directory_missing: config directory does not exist
            hub_file_unknown: 'this file is not one the hub config layer takes (sources.yml, layout.yml, behavior.yml and catalogs/vocab.yml); it is not read'
            hub_local: local.yml is the machine's own file and is never read from the hub config layer
            hub_key_unknown: 'key {0} is not one the hub config layer sets; it is not applied'
            hub_key_not_map: '{0} must be a map holding keys the hub config layer sets; it is not applied'
            defined_twice: key {0} is already defined in {1}; {2} wins
            text_not_a_map: 'text catalog: {0} is not a map'
            glyph_no_icon: glyph {0} has no icon
            shape_unknown: 'key {0} is not a key this file takes'
            shape_type: '{0} must be {1}'
            shape_value: '{0} must be one of {1}'
            shape_form: '{0} is not written in the form this key takes'
            shape_other: '{0} is not a value this key takes'
            glyph_not_ascii: glyph {0} has no stand-in of one to three printable ASCII characters
            icon_not_glyph: '{0} is not a name in config/catalogs/glyphs.yml'
            icon_not_shipped: the icon package ships no {0}.svg
            skip_permissions_retired: '{0} is not read; a schedule in the update tray runs unattended through its Run unattended choice'
            setting_default: '{0} must be {1}; the default is used'
            setting_empty: '{0} must not be empty; the default is used'
            setting_block: '{0} must be a map; each of its keys takes its default'
            setting_family: '{0} must be a map; none of its entries is read'
            setting_entry: '{0} must be {1}; the entry is not read'
            setting_repeat: '{0} holds the name {1} more than once; the first is read and the others are not'
            setting_unnamed: '{0} has no name; the row is not read'
            setting_field: '{0} must be {1}; the field is not read'
            local_row: '{0} must be {1}; the row is not read'
            local_repeat: '{0} repeats the label of an earlier row; the row is not read'
            local_unparsed: does not parse; every key takes its default
            local_not_a_map: is not a map of keys; every key takes its default
            local_unreadable: 'could not be read ({0}); every key takes its default'
            editor_unknown_language: '{0} is not a language the editor colours; its record is not read'
            editor_unknown_field: '{0} is not a field of a language record; it is not read'
            editor_not_a_map: '{0} is not a map; it is not read'
            languages_not_a_map: languages is not a map of language name to a list of endings; every file opens as plain text
            language_unknown: language {0} is not one the editor colours; its endings are not read
            language_not_a_list: language {0} is not a list of endings; its endings are not read
            language_ending: language {0} lists {1}, which is not a file name or an extension with one dot; the entry is not read
            language_empty: language {0} lists an empty file name
            language_claimed: ending {0} is listed under {1} and under {2}; {1} keeps it
            latex_editing_row: '{0} of catalogs/latex.yml has a row that cannot be used (an empty prefix, body, name or source, or a chord that is not one key naming a command); the row is left out'
            latex_unimath_row: 'latex_unimath of catalogs/unimath.yml has a row that cannot be used (a command that is not a name of letters, or an empty detail) or is not a list; the row is left out'
            nesting_not_a_map: patterns is not a map of parent name to the names nested under it; no file is nested
            nesting_key: pattern {0} has no usable parent name (empty, or holding a slash); the pattern is not read
            nesting_value: pattern {0} does not name its nested files as a list of non-empty texts; the pattern is not read
        options:
            control: control {0} is not one of the controls; the option is drawn as a text box
            control_missing: the option names no control; it is drawn as a text box
            source: the list {0} is not one the Settings view can draw; the option is drawn as a text box
            no_values: a choice or multi with no options or from; the option is drawn as a text box
            no_help: the entry or field has no help line; a field is drawn as a text box
            no_fields: a records field names no fields; it is drawn as a text box
            range: min is above max; the option is drawn as a text box
            slots: slots is not a list of words; the option is drawn as a text box
            heading_missing: the option names no heading; it is listed under Without a heading
            heading_unknown: the heading {0} is not one the Settings view lists; the option is listed under Without a heading
            whole: whole is not true; the option is drawn as a text box
            form: 'the form {0} is not one of program, extension, bundle_id; the option is drawn as a text box'
        words:
            boolean: true or false
            number: a number
            whole: a whole number
            whole_range: 'a whole number from {0} to {1}'
            whole_min: 'a whole number of at least {0}'
            whole_max: 'a whole number of at most {0}'
            range: 'a number from {0} to {1}'
            range_min: 'a number of at least {0}'
            range_max: 'a number of at most {0}'
            list_items: 'a list in which each item is {0}'
            text: text
            form_program: a program name with no slash or white space
            form_program_list: a list of program names with no slash or white space
            form_extension: an extension with its dot
            form_bundle_id: the bundle id of an application
            words: a list of words
            numbers: a list of numbers
            strings: a list of texts
            records: a list of maps
            choice: 'one of {0}'
            source: 'one of the items of the list {0}'
            glyph: a glyph name of config/catalogs/glyphs.yml
            hue: a hue name of the palette
            colour: a colour of the palette that is a hue
            path: an absolute path or one that starts with ~/
            hub_path: a path inside the hub, written relative to it
            slots: 'a list of exactly {0} items'
        shape:
            is_null: 'null'
            is_list: a list
            is_map: a map
            is_other: a {0}
        schema:
            not_declared: 'key {0} is not declared by the schema of this file'
            required: 'key {0} is required'
            required_when: 'key {0} is required while {1}'
            only_when: 'key {0} is allowed only while {1}'
            no_key: '{0} is {1}, which is not a key of {2}'
            not_allowed: '{0} is {1}, which is not one of {2}'
            not_a_date: '{0} is {1}, which is not a day written YYYY-MM-DD'
            not_form: '{0} is {1}, which does not match the form {2}'
            below_min: '{0} is {1}, which is below {2}'
            above_max: '{0} is {1}, which is above {2}'
            type: '{0} must be {1}, not {2}'
            invalid: '{0} does not fit the schema of this file'
            not_compiled: 'the schema {0} cannot be compiled, so this file is not checked against it'
            duplicate_key: 'two entries share the key {0}'
            bad_from: 'the field {0} takes its keys from {1}, which is no registry, projects or vocab list'
            bad_when: 'the field {0} is conditioned on {1}, which is no field of its record'
            bad_map: 'the field {0} has map set but is not a records field'
            is_list: a list
            is_map: a map
            is_text: a text
            is_number: a number
            is_flag: true or false
            or: or
            snooze_help: A day, or true, until which the entry is kept off the ticker; oculus writes it when an entry is snoozed.
            subtasks_help: A checklist of lines, each with what to do, a deadline, whether it is done and a snooze day; oculus writes it from the card.
        validate:
            key_renamed: 'key {0} is now {1}: write the tags under {1}:'
            bad_cluster: 'paths.cluster must be ~/ or / followed by folder names of letters, digits, . _ and -, not {0}'
            related_itself: 'related names the project itself: {0}'
            folder_shared: '{0} projects share the folder name {1}, so their ids collide'
            waiting_on_itself: 'waiting-on names the project itself: {0}'
            status_not_in_vocab: status {0} is not one of the status vocabulary
            schema_malformed: schema {0} is not a list of maps naming a field and a type
            identity_empty: has no {0}
            identity_shared: two entries share the {0} {1}
            affiliation_retired: 'affiliation is read as a one-entry affiliations list; write affiliations'
            self_not_one: '{0} people entries carry self: true, and exactly one may'
            resource_reserved: 'key {0} is reserved, so the entry is left out'
            funding_no_statement: funding entry {0} is {1} and has no statement
            theme_labels_retired: 'theme_labels is not read; the labels are data_themes in .oculus/config/catalogs/vocab.yml in the hub, or in config/catalogs/vocab.yml when the hub sets none'
        apps:
            name_empty: the name is missing or empty, so the folder is not an app
            name_shape: 'the name {0} must start with a lowercase letter and hold only lowercase letters, digits and hyphens, 40 characters at most, so the folder is not an app'
            name_not_folder: 'the name {0} is not the folder name {1}, so the folder is not an app'
            key_missing: 'the key {0} is missing, so the folder is not an app'
            key_unknown: 'the key {0} is not one this oculus reads, so the folder is not an app'
            title_shape: the title must be 1 to 40 characters with no control character, so the folder is not an app
            description_shape: the description must be text of 200 characters at most, so the folder is not an app
            bridge_unknown: 'bridge {0} is not a version this oculus reads, which is 1, so the folder is not an app'
            entry_shape: 'the entry {0} must be a relative path of names that do not start with a dot, ending in .html, so the folder is not an app'
            entry_missing: 'the entry {0} is not a file of the app, so the folder is not an app'
            list_repeated: '{1} names {0} twice, so the folder is not an app'
            list_shape: '{0} must be a list of names, so the folder is not an app'
            file_unreadable: 'the file {0} cannot be read, so the folder is not an app'
            channel_unknown: 'reads names {0}, which is no channel an app can read, so the folder is not an app'
            channel_closed: 'reads names {0}, which is closed to {1}: it carries {2}, so the folder is not an app'
            write_unknown: 'writes names {0}, which is no write an app can ask for, so the folder is not an app'
            write_closed: 'writes names {0}, which is closed to every app, so the folder is not an app'
            connect_shape: "connects names {0}, which is not an https origin, or an http origin of localhost or 127.0.0.1 on a port other than oculus's own, with no user name, path, query or wildcard, so the folder is not an app"
            too_large: 'the folder holds more than {0} files or {1} MB, so the folder is not an app'
            glyph_unknown: 'the glyph {0} is no glyph an app can use, so the app is drawn with the default glyph'
            folder_outside: 'the apps folder resolves to {0}, which lies outside the root, so none of its apps is offered'
            repeated: '{0} is already read as an earlier apps folder or app folder, so it is left out'
            apps_dir_not_folder: 'apps_dir names {0}, which is not a folder, so there are no machine apps'
            host_shape: 'the host {0} must be a relative path of names that do not start with a dot, ending in .js or .mjs, so the folder is not an app'
            host_missing: 'the host {0} is not a file of the app, so the folder is not an app'
            files_root_app: 'files lists folders to read, which only a machine app may name: a root app reads its own root, so the folder is not an app'
            files_engine: "files names {0}, which is oculus's own configuration folder and is closed to every app, so the folder is not an app"
            files_shape: 'files names {0}, which is not a root key, or a root key and a path of names that do not start with a dot, so the folder is not an app'
            files_closed: 'files names {0}, which a folder of closed_paths closes, so the folder is not an app'
            files_private: "files names {0}, which lies in a folder of this machine's own state or secrets and is closed to every app, so the folder is not an app"
            secrets_value: 'secrets must be true or left out, not {0}, so the folder is not an app'
            activation_no_host: 'activation names events for a host, and the app names no host, so the folder is not an app'
            event_unknown: 'activation names {0}, which is no event of the host (onTab, onStartupFinished, onCommand:<id>, onLanguage:<id>, onView:<id> or workspaceContains:<glob>), so the folder is not an app'
            event_empty: 'activation names {0}, which has no id or glob after its colon or an id with white space, so the folder is not an app'
            event_glob: 'activation names {0}, whose glob starts with a slash or holds a .. segment, so the folder is not an app'
            event_command: 'activation names {0}, which is no command the app declares in contributes.commands, so the folder is not an app'
            event_view: 'activation names {0}, which is no view the app declares in contributes.views, so the folder is not an app'
            contributes_shape: '{0} is missing, or holds a value of another kind than VS Code gives it, so the folder is not an app'
            contributes_id: "{0} must start with the app's name and a dot ({1}), so the folder is not an app"
            contributes_reserved: "{0} is in the {1} namespace, which is oculus's own, so the folder is not an app"
            contributes_repeated: '{0} names {1}, which the app declares twice, so the folder is not an app'
            contributes_when: '{0} holds the clause {1}, which is not a when clause, so the folder is not an app'
            contributes_key: "{0} holds the key {1}, which spells no key of VS Code's key syntax, so the folder is not an app"
            contributes_icon: '{0} holds the icon {1}, which is neither $(name) of a glyph oculus draws nor a file of the app, so the folder is not an app'
            contributes_file: '{0} names {1}, which is not a file of the app of the kind the key takes, so the folder is not an app'
            contributes_container: '{0} names the container {1}, which the app does not declare and which is not explorer, so the folder is not an app'
            contributes_tree_entry: '{0} names an entry, which only a view of type webview takes, so the folder is not an app'
            contributes_setting_kind: '{0} sets a bound or a list of values that its type does not take, so the folder is not an app'
            contributes_default: '{0} has the default {1}, which breaks its own type, list of values or bounds, so the folder is not an app'
            contributes_command_unknown: '{0} names the command {1}, which the app does not declare in contributes.commands, so the folder is not an app'
            contributes_menu_dropped: 'menus names {0}, which is no menu oculus draws, so its entries are left out'
            contributes_submenu_dropped: '{0} is a submenu, which oculus does not draw, so the entry is left out'
            contributes_container_dropped: 'viewsContainers names {0}, which is neither activitybar nor panel, so its entries are left out'
            key_oculus: 'the key {0} of the command {1} is a key {2} takes, so the app does not bind it'
            key_app: 'the key {0} of the command {1} is bound by {2}, which comes before it in the Views list under the same condition, so this app does not bind it'
            id_taken: 'the app {0} declares the id {1}, which {2} declares too and comes before it in the Views list, so the folder is not an app'
            setting_undeclared: 'app_settings holds {0}, which no approved app declares as a setting, so the value is not used'
            setting_type: 'app_settings holds a value for {0} of the app {1} that is not of the type the app declares, so the app reads its default'
            setting_enum: 'app_settings holds a value for {0} of the app {1} that is not one of the values the app declares, so the app reads its default'
            setting_minimum: 'app_settings holds a value for {0} of the app {1} below the least the app declares, so the app reads its default'
            setting_maximum: 'app_settings holds a value for {0} of the app {1} above the most the app declares, so the app reads its default'
            theme_unreadable: 'the colour theme {0} names {1}, which is not a theme file ({2}), so the theme is not offered'
            theme_include: 'the colour theme {0} names {1}, whose include {2} is not a file of the app or closes a cycle, so the theme is not offered'
            icon_theme_unreadable: 'the icon theme {0} names {1}, which is not an icon theme file ({2}), so the theme is not offered'
            icon_theme_unavailable: 'file_icons names {0}, which no approved and enabled app offers, so the file icons of Seti are drawn'
            depends_name: 'depends names {0}, which does not start with a lowercase letter and hold only lowercase letters, digits and hyphens, 40 characters at most, so the folder is not an app'
            depends_self: 'depends names {0}, the app itself, so the folder is not an app'
            state_unread: '{0}, so every app is disabled until the file is put right'
            closed_paths_shape: '{0} in {1} must be a list of folder paths, each relative to a root with no empty, dot or dot-led name, so an entry that is not is left out and, while the key is missing or no list, no app can open a file'
            who_every: every app
            who_root: a root app
            carries:
                apps: the address key of every approved app
                pty: whatever a terminal printed, secrets included
                processes: "the machine's process table: program names, arguments and folders"
                app_hosts: the output and process ids of the hosts of every app
                app_messages: what the host of an app sent to its pages
                app_shell: what the host of an app registered in oculus and the questions it asks the reader
                inbox: mail subjects, senders and previews of the message text
                calendar: event titles, times, places and links
                sessions: titles, prompts, paths and events taken from session transcripts
                usage: account labels and limits
