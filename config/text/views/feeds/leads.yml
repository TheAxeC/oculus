# Oculus text owned by the leads view.
text:
    leads:
        action:
            applied: applied
            applied_tip: mark the lead applied and open Applications beside the leads with an entry filled from this lead
            applied_hub_tip: pick the hub whose Applications takes an entry filled from this lead, open it beside the leads and mark the lead applied
            applied_none: no status of this hub's lead_statuses carries lead_applied, or more than one does, so there is no word to mark the lead applied with
            decline: decline
            decline_tip: decline this lead (off the radar, kept in the file)
            decline_none: no status of this hub's lead_statuses carries lead_declined, or more than one does, so there is no word to decline the lead with
            no_applications: No hub of the workspace holds an Applications collection, so no application can be opened.
            hub_no_applications: 'The hub {0} holds no Applications collection, so no application can be opened in it.'
            delete_lead_tip: delete this lead (removes the entry)
            delete_lead_ask: Delete this lead? Its entry is removed from the file.
            reopen: reopen
            reopen_tip: reopen (back to the radar)
            reopen_none: no status of this hub's lead_statuses carries default_lead, or more than one does, so there is no word to reopen the lead with
        add: + add lead
        add_tip: add a position lead
        declined: declined {0}
        empty: No live leads; run Scout from the Update tray.
        exp_note: '| {0} expired (hidden)'
        expired: expired
        expired_sec: Expired / actioned ({0}) - hidden
        filters: Lead filters
        fit_none: '-'
        hide_declined: Hide declined ({0})
        intro: Academic openings - auto-scouted (BE/NL/LU). {0} live{1} | fit chip = strong / moderate / reach.
        no_deadline: no deadline
        no_file: No leads file configured.
        posting: posting
        log_all: show all {0} lines
        log_fewer: show fewer lines
        runlog: Run log
        search: Search leads | institution | focus ...
        show_declined: Show declined ({0})
        toolbar: Lead actions
    views:
        leads: Position Leads
        leads_glyph: scout
