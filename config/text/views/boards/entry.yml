# Oculus text owned by the entry view, the tab one entry of a collection or of the leads or Lit Watch
# feed opens as. The view is opened from the title of that entry's card, so its words name what the
# reader came from: the card, what refers to the entry, and, for an entry whose link names a
# folder, the folder's documents and files and the sessions working in the folder.
text:
    views:
        entry: Entry
        entry_glyph: cards
    entry:
        toolbar: Entry controls
        none: This tab was opened for no entry. Press the title of a card to open its page.
        unknown: 'The file of {0} holds no entry with the key {1}. If it was deleted, Undo in History brings it back and this page shows it again.'
        no_schema: 'This file has no schema: list that reads, so this entry has no editor. Add one to the file to edit it.'
        no_folder: This entry's link names no folder of the hub, so there are no documents, files or sessions to show.
        reading: Reading the folder ...
        open_collection: 'Show in {0}'
        open_collection_tip: 'Open {0} and scroll to this entry'
        open_workbench: Open Workbench
        open_workbench_tip: 'Open a workbench for {0}'
        delete_tip: 'Delete {0}'
        documents: Documents
        no_documents: The folder holds no Markdown file.
        doc_loading: loading the document ...
        doc_failed: 'the document was not read: {0}'
        files: 'Files ({0})'
        sessions: Sessions
        no_sessions: No session has worked in this folder.
        none_glyph: folder
