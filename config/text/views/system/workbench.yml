    settings:
        desc_agents: 'The composer of a new agent session: per agent, the models, efforts and permission modes it offers, each with the words it shows and the flag it passes, and each list with its default.'
        desc_appearance: "The UI theme list with the glyph each theme is offered under, the theme in force, the text size, the icons, brackets and monospace font of the terminal themes, the wallpaper behind the panels and whether it shows, the CRT overlay, the code theme of the editors, the terminal text size and the terminal's cursor style, cursor blinking, Option key and copy on selection."
        desc_behavior: "Thresholds, horizons and cadences: read limits, the `focus:` settings (the Focus horizons, the `refresh_stale_days` thresholds of the refresh strip, the Command Center's categories and sources, the statuses the Focus columns count as open), the context window, the Live HPC settings, the audit's mute list, the audit's checks of the hub's conventions (`audit:`, the files and headings a project must hold, the folders a stage is kept under and the website's feed), the source editor's `editor.paint_limit_kb`, `editor.tab_size`, `editor.insert_spaces`, `editor.word_wrap`, `editor.minimap`, `editor.render_whitespace`, `editor.sticky_scroll` and the per-language `editor.languages` records, the Files view's `files.confirm_delete` (true asks before a delete to the Trash) and `files.file_icon_at_arrow` (true sets a file's icon where its sibling folders' arrows sit), the application `open.program_ext` names for each extension that may open, git (the commit-message model and the auto fetch period `git.autofetch_minutes`), chat and the status bar's hidden items, Do Not Disturb and repository."
        desc_config: "The settings of this hub, kept in its .oculus/config.yml: the scan folders, the files of its records, collections and feeds, the picture folders, where its bookmarks, schedules and apps live, the cluster its jobs run on, the conventions its audit holds its projects to, the values of its apps' settings, its words and colours and the fields it adds to the project form. A word list there is laid over oculus's word by word, a category by its key, and a lane, role, funding stage, venue category, venue tier or radar bucket list replaces oculus's whole; any other value replaces the engine's value of the same key whole. The domains and theme words are kept in the hub's registry files."
        desc_cpp_schema: "The keys a repository's .oculus/cpp.yml may hold, each with its words and the values it takes, which the editor completes and checks."
        desc_deck_schema: "The keys a deck's present.yml may hold, each with its words, which the editor completes and checks."
        desc_file_nesting: 'The files the Files view draws under another file when File Nesting is on: per parent name, the names nested under it, as VS Code lists them by default.'
        desc_glyphs: 'The glyph vocabulary: each name with the ASCII stand-in, one to three characters, that a terminal theme draws in place of its icon.'
        desc_icons: 'The line icon each glyph name is drawn as, one row per name in the glyph vocabulary.'
        desc_latex: 'What the LaTeX editing aids read: the notice of the project the tables follow, the @ suggestions, the keys of the formatting chords and the math symbol groups the TeX view lists.'
        desc_layout: "How things are arranged: the rail's pages and the arrangements each starts as, the view catalogue's groups, the hub documents, the board chrome, the boards and their counts, and the live badges."
        desc_local: "This machine's own values, kept in the .oculus/local.yml of each hub of the workspace, read on their own and never merged into the configuration: the port, the user name and key file of each cluster, the Claude command, the program an address is opened with, the account folders, the calendar accounts, the mail accounts and where the machine-local state is kept. The cluster, account, calendar and mail lists join over every hub's file; every other value is read from the primary hub's file."
        desc_manifest_schema: 'The project.yml edit form as data: its sections, its fields, the widget each field is edited by, where a widget takes its choices from, and the rule the editor checks each field by.'
        desc_present: 'What every deck the Present view draws starts from: the hue each tag class of a project slide wears.'
        desc_sources: "What the portfolio reads: the scan paths, the registry and collection files, the feeds, where the bookmarks, the schedules and the apps live, and the roots a local file is served from (the folders of the default workspace, which the Files view's Add Folder to Workspace and Remove Folder from Workspace write, keeping the file's comments), and the language each file name opens in."
        desc_text: 'The words of the interface this workspace replaces, by the dotted key of the text catalog in config/text/, laid over the display language and over English.'
        desc_unimath: 'The Unicode math symbols the LaTeX completion offers after a backslash while latex.unimath_symbols is true: per command, its glyph (and the package that defines it) and its words.'
        desc_vocab: "Words and their colours: the palette, the statuses, types and tiers with the flags that say what each word does, the categories, the focus lanes, the venue tiers and the radar buckets. A hub lays its own words over these in its .oculus/config.yml, and its records are drawn in them. The research domains and the venue and dataset theme words are each hub's own, in its registry files."
