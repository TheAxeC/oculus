# Oculus text owned by the Audit section of the Findings view, the scan behind it included: a
# finding's message is the words the reader sees, so it is a catalog entry like every other. A
# finding's signature is over its scope, place, kind, catalog key and arguments, never the sentence,
# so rewording a message here keeps every mute.
text:
    audit:
        title: Audit
        search: 'Search findings ...'
        none_match: No finding matches the search.
        sec_todo: Open items (TODO / VERIFY)
        sec_data: Missing data
        sec_conform: Hub conventions
        sec_manifest: Manifest guardrails
        sec_readability: Readability
        sec_publink: Website
        muted: Muted
        mute: mute
        mute_glyph: dismiss
        mute_tip: Park this finding. It stays true and moves to the muted section.
        unmute: un-mute
        unmute_glyph: refresh
        unmute_tip: Show this finding with the open ones again.
        failed_invalid: The mute was not saved. The signature or the configuration file was not one the write could take.
        failed_file: 'The open workspace file could not be read or written on this machine.'
        failed_network: The mute did not reach the server.
        failed_other: The mute was not saved.
        open_place_tip: Open {0}
        msg_markers:
            one: 'one open marker, "{1}"'
            other: '{0} open markers, the first "{1}"'
        msg_entry_marker: 'open marker: "{0}"'
        msg_no_venue: at the stage {0}, which carries a venue, but no venue
