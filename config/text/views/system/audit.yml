# Oculus text owned by the audit view, the scan behind it included: a finding's message is the words
# the reader sees, so it is a catalog entry like every other. A finding's signature is over its scope,
# place, kind, catalog key and arguments, never the sentence, so rewording a message here keeps every
# mute.
