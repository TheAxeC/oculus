    views:
        audit: Audit
        audit_glyph: flag
    audit:
        title: Audit
        toolbar: Audit controls
        search: 'Search findings ...'
        empty: "Nothing open: no markers, no data gaps or missing sections, no missing required files, no status chip or project folder out of place, no readability warnings and no website file that differs from what the hub's files give."
