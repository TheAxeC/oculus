# Oculus text owned by the config view: one card per file of the engine's config folder.
text:
    config:
        desc_agents: 'The composer of a new agent session: per agent, the models, efforts and permission modes it offers, each with the words it shows and the flag it passes, and each list with its default.'
        desc_appearance: "The UI theme list with the glyph each theme is offered under, the wallpaper behind the panels, the Memories wall's folder, the CRT default, the code theme of the editors and the terminal text size."
        desc_behavior: "Thresholds, horizons and cadences: read limits, stale days, the context window, the Live HPC settings, the audit's waiting statuses and mute list, the source editor's `editor.paint_limit_kb`, the update tasks' `tasks.skip_permissions`, the application `open.program_ext` names for each extension that may open, git and chat."
        desc_glyphs: 'The glyph vocabulary: each name with the ASCII stand-in, one to three characters, that a terminal theme draws in place of its icon.'
        desc_icons: 'The line icon each glyph name is drawn as, one row per name in the glyph vocabulary.'
        desc_layout: "How things are arranged: the rail's pages and the arrangements each starts as, the view catalogue's groups, the hub documents, the board chrome, the tab rollups and the live badges."
        desc_local: "This machine's own values, read on their own and never merged into the configuration: the hub path, the port, the ssh alias of the cluster, the Claude command, the program an address is opened with, the account folders, the calendar accounts, the mail accounts and where the machine-local state is kept."
        desc_manifest_schema: 'The project.yml edit form as data: its sections, its fields, the widget each field is edited by, and where a widget takes its choices from.'
        desc_meta: 'The tool identity: the title and the subtitle the window carries.'
        desc_present: 'The public deck the Present view draws: the deck slides, the domain themes, the tag tones and the order.'
        desc_sources: 'What the portfolio reads: the scan paths, the registry and collection files, the feeds, and the roots a local file is served from.'
        desc_vocab: 'Words and their colours: the palette, the research domains, the status legend, the focus lanes, the venue tiers, the venue and dataset theme words and the radar buckets.'
        failed: 'This file could not be read: {0}'
        intro: "The files the configuration is merged from, in the config folder of the engine. Each one is read on every load, and an edit saved here reaches the page as soon as it lands. The machine-local values, the hub path, the port and the account folders, live in local.yml of the same folder, which is this machine's own: it is read on its own, it is not merged with the rest, and it is not tracked."
        lines: lines
        loading: 'Reading...'
        local_tag: This machine
        none: 'No configuration file was read. The config folder of the engine answered nothing.'
        none_glyph: settings
    views:
        config: Config
        config_glyph: settings
