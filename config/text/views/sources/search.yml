# Oculus text owned by the Search view: the query row, the count line and the results grouped by file.
text:
    search:
        toolbar: Search
        placeholder: What to find
        root: Where to look
        root_all: Every root
        word: word
        word_title: Match whole words only, which is how an identifier is found without its neighbours
        case: case
