# Oculus text owned by the pillars view.
text:
    pillars:
        archival: Archival
        archival_blurb: Dead-ends and paused work (no-go / dropped / disproved / abandoned / paused), kept for provenance and excluded from pillar membership.
        in_flight: in flight
        intro: "The research pillars, and any <b>provisional</b> line below them, from the file the <code>pillars</code> entry of the hub's collections list names. Each shows its <b>in-flight</b> projects against its total and the <b>venue-tier</b> spread of its in-flight work; <b>orphans</b> are projects that map to no pillar, provisional line or off-pillar line. A project joins a pillar through its <code>pillar:</code> method tag."
        no_orphans: No orphans
        no_orphans_blurb: Every project maps to a pillar or an off-pillar line.
        not_active: '{0} not active'
        offpillar_h: Off-pillar / archival
        offpillar_note: Deliberately outside the current programme, kept as an explicit marker so this work files here rather than reading as an orphan.
        orphans: Orphans
        orphans_blurb: Real work with <b>no</b> <code>pillar:</code> tag yet; everything should map to a pillar or an off-pillar line. Tag it, or (for in-flight work) make the portfolio-fit call. (Off-pillar-by-design lines are below.)
        project: project
        projects: projects
        provisional_h: Provisional line
        provisional_note: 'A candidate pillar: a line that has not been promoted to a pillar yet, drawn apart so it is seen without counting as one. Its promotion trigger is in its entry of the pillars file.'
        total: total
        untagged: '{0} untagged'
    views:
        pillars: Pillars
        pillars_glyph: pillar
