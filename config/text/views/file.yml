# Oculus text owned by the file view: one file of a root that an editor cannot show.
text:
    file:
        bookmark: Bookmark this file
        bookmark_failed: 'The bookmark could not be written: {0}'
        bookmark_glyph: star
        download: Download the file
        image: '{0}'
        loading: Reading...
        none: No file chosen. Open one from the Files view.
        none_glyph: paper
        open_outside: Open in a browser tab
        other: 'This window does not draw a {0} file. It is {1} on disk.'
        other_glyph: paper
        toolbar: File controls
        truncated: This file is longer than the window draws; its first 2 MB are shown.
        unbookmark: Take this bookmark out
    views:
        file: File
        file_glyph: page
