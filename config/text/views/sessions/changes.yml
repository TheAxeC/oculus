# Oculus text owned by the changes view.
text:
    git:
        branch_new: New branch
        branch_new_confirm: Create {0} and check it out?
        branch_new_create: create
        branch_new_label: Name for the new branch
        branch_switch_confirm: Check out {0}?
        branch_switch_detail: The working tree must be clean; a dirty tree is refused.
        amend_confirm: Amend the last commit on {0}?
        amend_detail: What is staged joins the last commit, and the message in the box replaces its message.
        amend_keep: What is staged joins the last commit, which keeps its message.
        amend_none: This repository has no commit to amend yet.
        busy: Working
        commit: commit
        commit_amend: Commit (Amend)
        commit_confirm: Commit {0} staged paths on {1}?
        commit_detail: The message is committed as it stands in the box.
        commit_empty: Write a commit message first.
        commit_label: Commit message
        commit_more: More ways to commit
        commit_none: Nothing is staged, so there is nothing to commit.
        commit_push: Commit and Push
        commit_push_confirm: Commit {0} staged paths on {1} and push to {2}?
        commit_sync: Commit and Sync
        commit_sync_confirm: Commit {0} staged paths on {1} and sync with {2}?
        commit_title: Commit what is staged (Ctrl+Enter)
        commit_unmerged: '{0} files are still in conflict; resolve them before committing.'
        discard: discard
        discard_all: Discard All Changes
        discard_all_confirm: Throw away the changes to {0} paths?
        discard_all_detail: Every tracked path goes back to what is staged, or to what is committed when nothing is. Untracked files are kept. There is no undo.
        discard_confirm: Throw away the change to {0}?
        discard_detail: The worktree goes back to what is staged, or to what is committed when nothing is. There is no undo.
        discard_title: Throw away the worktree change to this path
        done: Done.
        message_prompt: "Write the commit message for the staged diff on stdin. One line of subject: capitalised, imperative, no trailing full stop. Then a blank line. Then one bullet per change, each starting with '- ' and an imperative verb. Plain ASCII, no markdown headings, no code fences, no quotes around the message, nothing but the message itself. Name no tool, no model and no assistant anywhere in it, and add no trailer of any kind."
        push: push
        push_confirm: Push {0} to {1}?
        push_detail: '{0} commits go to the upstream. Nothing is forced.'
        push_none: This branch has no upstream, so there is nowhere to push it.
        push_pending: The upstream is still being looked up.
        push_title: Push {0} to {1}
        stage: stage
        stage_all: Stage All Changes
        stage_all_untracked: Stage All Untracked
        stage_title: Stage this path
        suggest: suggest
        suggest_pending: reading the staged diff
        suggest_title: Write a message from the staged diff
        unstage: unstage
        unstage_all: Unstage All Changes
        unstage_title: Take this path back out of the index
