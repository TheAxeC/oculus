# Oculus text owned by the memories view.
text:
    views:
        memories: Memories
        memories_glyph: memories
    memories:
        title: Memories
        toolbar: Memories controls
        add: add photo
        add_tip: Add a picture to the wall. JPEG and PNG.
        empty: 'No pictures on the wall yet. Add one, or drop a JPEG or PNG into the memories folder of a hub (.oculus/memories unless the option memories_dir names another).'
        empty_glyph: circle_empty
        open: 'Enlarge {0} ({1})'
        tile: 'Memory {0} ({1})'
        close: Close
        close_outside: Close the picture
        close_glyph: dismiss
        lightbox: 'The enlarged picture {0} ({1})'
        failed: '{0} was not added: {1}'
        failed_many: '{0} pictures were not added.'
        failed_name: The wall takes a JPEG or a PNG, named without a folder in front of it.
        failed_data: 'The file is not a JPEG or a PNG the wall can read, or it is larger than {0} MB.'
        failed_file: The picture could not be written into the folder on this machine.
        failed_taken: A picture called that is already on the wall; call the file something else and add it again.
        failed_network: The picture did not reach the server.
        failed_other: The picture was not added.
        reading: The file could not be read from this machine.
        read_failed: 'The wall could not be read: {0}'
        read_name_repeated: the server named the same picture twice
        read_not_a_list: the server did not answer with a list of pictures
        read_without_name: the server answered with a picture that has no name
