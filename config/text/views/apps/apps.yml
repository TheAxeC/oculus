# Oculus text owned by the apps: the catalogue entry, the approval panel, the bridge's refusals and the words each channel and write an app may declare is shown in.
text:
    apps:
        label: Apps
        glyph: app_view
        unapproved_mark: This app is not approved
        editing_mark: This app stays approved while its files change
        disabled_mark: This app is disabled
        add_glyph: app
        approve_title: Approve this app
        approve_question: 'This app is a folder of web files that runs inside oculus. It runs only after you approve it, and it asks again whenever its files change. It can:'
        approve: Approve
        keep_approved: Keep approved while I edit
        revoke: Revoke
        open_folder: Open the app's folder
        reload: Reload the app
        folder_unshown: 'The folder of this app, {0}, is inside no root the file browser shows.'
        name_line: 'Name: {0}'
        folder_line: 'Folder: {0}'
        size_line: '{0} files, {1}'
        size_kb: '{0} KB'
        size_mb: '{0} MB'
        reads_none: Read nothing from oculus.
        writes_none: Write nothing to oculus.
        connects: 'Reach {0} on the internet.'
        connects_none: Reach no address outside this machine.
        host_line: 'Run a program on this machine, with your rights, which can read and write your files and reach any address. The program is the file {0}.'
        files_line: 'Read the files in {0}.'
        secrets_line: Store secrets in the keyring of this machine.
        depends_line: 'Start the programs of these apps first: {0}.'
        send_line: 'What it reads from your files can be sent to {0}.'
        back: Back to the app
        store_machine: 'Keep its own data in {0}.'
        store_root: 'Keep its own data in {0}, a file of the root that git tracks unless the root ignores .oculus/app-data/.'
        read:
            portfolio: Read the portfolio, with every project, person, venue and funding entry.
            feeds: Read the feeds.
            git: Read the state of every repository, with branches, status and commit subjects.
            hpc: Read the job queue of the cluster.
            audit: Read the audit findings.
            config: Read the configuration, with this machine's name and address.
            files: Be told when a file under a root or the bookmarks changed.
            inbox: Read the subjects, senders and message previews of your mail.
            calendar: Read the titles, times, places and links of your calendar events.
            sessions: Read the titles, prompts, paths and events of your Claude sessions.
            usage: Read the labels and limits of your accounts.
        read_root:
            git: Read the state of the repository of its own root.
            files: Be told when a file under its own root changed.
        write:
            manifest: Edit a project's manifest.
            entry: Edit an entry of a collection.
            subtask: Change a subtask of a project or an entry.
            subtask-add: Add a subtask to a project or an entry.
            host: Edit a host of a project.
            new-entry: Add an entry to a collection.
            reorder: Reorder the entries of a collection.
            delete-entry: Delete an entry of a collection, asking you first.
            feed-field: Edit a field of a feed item.
            feed-delete: Delete a feed item, asking you first.
            lead-add: Add a lead.
            radar-add: Add a paper to the radar.
            linkedin-idea: Move a LinkedIn idea, asking you first.
            linkedin-post: Move a LinkedIn post, asking you first.
            new-idea: Create an idea project, asking you first.
        ask:
            delete-entry: delete an entry of a collection
            feed-delete: delete a feed item
            new-idea: create an idea project
            linkedin-idea: move a LinkedIn idea
            linkedin-post: move a LinkedIn post
        changed: This app changed since you approved it. Read what it asks for again and approve it to run it.
        load_failed: The app did not answer in time.
        approve_failed: 'The approval was not saved: {0}'
        changed_meanwhile: The app changed while you read it, so it was not approved. Read what it asks for now.
        refused_read: 'The app {0} asked to read {1}, which its manifest does not list.'
        refused_write: 'The app {0} asked to write {1}, which its manifest does not list or which no app may write.'
        refused_open: 'The app {0} asked to open something it may not open.'
        refused_not_json: not_json
        confirm_write: 'The app {0} asks to {1}: {2}'
        confirm_open_url: 'The app {0} asks to open this address in a new browser tab. The address can carry what the app has read.'
        disabled_line: This app is disabled, so it reads, writes and runs nothing.
        enable: Enable
        host_ended_code: 'The program of this app ended with exit code {0}.'
        host_ended_signal: 'The program of this app was ended by the signal {0}.'
        restart: Restart
        host_wait_approval: The program of this app waits for you to approve its changed files.
        host_wait_dependency: 'The program of this app waits for the app {0}, which cannot run.'
        host_wait_missing: 'The program of this app waits for the app {0}, which is not installed.'
        host_wait_cycle: The program of this app does not start, because the apps it needs and itself need each other first.
        host_stopped_by: 'The program of this app was stopped because the approval of the app {0} was revoked.'
        review: Approve
        menu_disable: Disable
        menu_disable_workspace: Disable (Workspace)
        menu_enable: Enable
        menu_enable_workspace: Enable (Workspace)
        menu_remove: Remove
        menu_add: Add app from folder
        manage_failed: 'The app was not changed: {0}'
        disable_dependents: 'These enabled apps need {0}: {1}. Disable them too?'
        remove_question: 'Remove {0}?'
        remove_secrets: 'Its folder {0} and its data file move to the Trash, and the {1} secrets it holds are deleted from the keyring.'
        remove_secrets_unknown: 'Its folder {0} and its data file move to the Trash. The secrets it holds could not be counted and will not be deleted.'
        remove_dependents: ' These enabled apps need it and are disabled too: {0}.'
        remove_confirm: Remove
        remove_failed: 'The app was not removed: {0}'
        remove_secrets_kept: 'The secrets of {0} could not be deleted from the keyring.'
        add_unsupported: The folder panel is not available here. Use Add as App on a folder in the Files view.
        add_panel_failed: The folder panel could not be used.
        add_panel_busy: The folder panel is already open.
        add_done: '{0} was added. It asks for your approval before it runs.'
        add_failed: 'The app was not added: {0}'
        add_not_folder: the chosen item is not a folder
        add_no_manifest: the folder holds no app.yml
        add_name: the folder name is not an app name (a letter, then letters, digits and hyphens, at most 40)
        add_exists: an item with that name is already in the apps folder
        add_inside: the folder is inside the apps folder
        add_holds: the folder holds the apps folder
        add_too_large: the folder holds more files or bytes than an app may
        add_copy: the folder could not be copied
        rate: 'The app {0} sent calls faster than oculus lets an app send them, so some were refused.'
