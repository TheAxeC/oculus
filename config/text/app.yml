        keys:
            hint: press ? or Esc to close
            rows: "1-9 | show the rail's page of that place;;Ctrl+1-9 | switch tab in the focused pane;;Ctrl+] / Ctrl+[ | next / previous tab in the focused pane;;arrows | along the rail or a tab strip, when one holds the focus;;Home / End | first / last control of the rail or a tab strip;;Delete | close the focused tab;;f1-f3 | open a view of the Focus page's group;;m1-m5 | open a view of the Sessions page's group;;p1-p4 | open a view of the Projects page's group;;e1-e6 | open a view of the Incoming page's group;;s1-s8 | open a view of the Explorer page's group;;c1-c6 | open a view of the Academic Life page's group;;l1-l3 | open a view of the Pillars page's group;;r1-r4 | open a view of the References page's group;;t1 | open a view of the Present page's group;;y1-y9 | open a view of the System page's group;;h1-h9 | open the manual, the Memories wall, a hub document or a guide, the Help page's group;;j / k | move the card cursor left / right;;J / K | carry the card under the cursor left / right;;i / o | move the card cursor up / down a row;;Enter | expand the card under the cursor, open the file an Audit finding names or the project of a Focus lane card, and move into the first field of a Settings card;;/ | focus this board's search;;Cmd-Shift-F | open the Search view and put the cursor in its query box;;Cmd-Shift-H | open the Search view with the replace row shown and put the cursor in its replace box;;Cmd+Shift+B | run the default build of the repository holding the open file (Ctrl off macOS);;Cmd+Alt+T | run the default test of that repository (Ctrl off macOS);;Cmd+Alt+B / C / V | build, clean and view the PDF of the LaTeX root in front (Ctrl+Alt off macOS);;Cmd+Alt+J | show the caret's line on the PDF page;;Cmd+Alt+M | open Math Preview;;Cmd+Alt+X | show the TeX view;;Cmd+Alt+[ / ] | promote / demote the sections in the selection;;Cmd+Shift+M | show the Problems view, or hide it when it is the one on screen (Ctrl+Shift+M off macOS);;F8 | go to the next problem, across files;;Shift+F8 | go to the previous problem;;F5 | start debugging the .rite file or a launch.yml configuration, or continue while paused;;Shift+F5 | stop debugging, behind its confirmation;;Cmd+Shift+F5 | restart debugging (Ctrl+Shift+F5 off macOS);;F9 | toggle a breakpoint at the caret of a .rite source tab;;F10 | step over;;F11 | step into;;Shift+F11 | step out;;Cmd+L, then a letter | wrap the selection in a LaTeX text command;;Ctrl+Shift+M, then a letter | wrap the selection in a LaTeX math command;;g g | top of page;;G | bottom of page;;n | start a new agent session: the composer in the page's Terminal tab (a new one when it has none), in that tab's folder;;Cmd-K | jump palette;;Cmd+P | find a file by name (Ctrl+P off macOS);;Cmd+Shift+P or F1 | command line (Ctrl+Shift+P off macOS);;: | command line;;Esc | clear the cursor"
