# ===========================================================================
# options/behavior.yml
# Every option of defaults/behavior.yml described once, the field records of a reader row its options name, and a help line for each group of its dotted options, in the shape the head of options/appearance.yml describes. loadConfig() reads it into the merged map's `options`, `option_descriptions` and `option_groups` under behavior.yml.
# ===========================================================================

options:
    read_limits:
        heading: boards
        section: Audit checks
        help: "Soft limits, in characters, for the audit's readability warnings. A manifest field longer than its limit earns a finding, and a field with no limit here is not checked. A workspace file's settings: overrides a field's limit, adds one for a field with none, and takes one of oculus's out with <field>: null."
        fields:
            key:
                help: the manifest field, status.line, next, latest or eli5, or results for each entry of the results list
                control: choice
                options: [status.line, next, latest, eli5, results]
            value:
                help: the most characters the field may hold before it earns a finding
                control: number
    audit_ignore:
        heading: boards
        section: Audit checks
        help: The finding signatures the reader has parked, each the twelve hex characters the Audit view's mute control writes here. A parked finding stays true and is drawn in the muted section.
        control: parked
    audit.required_files:
        heading: boards
        section: Audit checks
        help: The files the audit asks a project of the hub to hold, one row a file. A row requires its file of a project when every key it names holds; a row naming no stages, folder or folders requires it of every project. A missing required file is a finding of the Hub conventions section. A project of a workspace repository is held to the rows that name no folders, and a project of a tier research_audit.skip_tiers names to none. Empty asks for no file. This is a setting of the hub, kept in its .oculus/config.yml.
        fields:
            file:
                help: the path of the file, relative to the project's folder
                control: text
            stages:
                help: the stages whose projects the row holds, held against the project's stage; a project with no stage meets a block that names only not_words or not_flags
                control: words
                from: project_stages
            folder:
                help: a folder, relative to the project's folder, that the project must hold for the row to hold
                control: text
            folders:
                help: the folders of the hub, relative to it, under one of which the project must lie for the row to hold
                control: list
    audit.required_sections:
        heading: boards
        section: Audit checks
        help: The headings the audit asks a file of a project to hold while a manifest key has a value, one row a heading. The key is a dotted path of project.yml as written there; a list with an item, a text that is not empty, a number and true are a value, and false, a map and an empty value are none. A line of the file holds the heading when, trimmed, it is the heading or starts with the heading and a space, so `## Data + reproduction` holds `## Data` and `## Database` does not. A missing file or heading is a finding of the Missing data section. A project of a workspace repository is held to the rows that name no folders. Empty asks for no heading. This is a setting of the hub, kept in its .oculus/config.yml.
        fields:
            file:
                help: the path of the file, relative to the project's folder
                control: text
            heading:
                help: the heading line the file must hold, with its hashes
                control: text
            key:
                help: the dotted key of project.yml whose value asks for the heading
                control: text
            folders:
                help: the folders of the hub, relative to it, under one of which the project must lie for the row to hold
                control: list
    audit.stage_folders:
        heading: boards
        section: Audit checks
        help: The folders a project of the hub at a stage is kept under, one row a set of stages. A project read from the hub's own folders whose stage meets the row's stages and that lies under none of its folders is a finding of the Manifest guardrails section; a folder is matched by whole path segments, so projects/archive/published-old is not under projects/archive/published. A project of a workspace repository is held to no row. Empty asks for no folder. This is a setting of the hub, kept in its .oculus/config.yml.
        fields:
            stages:
                help: the stages the row holds, held against the project's stage
                control: words
                from: project_stages
            folders:
                help: the folders of the hub, relative to it, one of which a project at those stages lies under
                control: list
    website.folder:
        heading: sources
        section: Website
        help: "The folder of the website, relative to the hub, whose three generated files, the paths website.files.cv, website.files.papers and website.files.industry give, the Career view's Write the website writes from the hub's files and the audit compares with what the hub's files give. Empty writes nothing and checks nothing, and a folder that is not there is a finding of the audit. This is a setting of the primary hub, kept in its .oculus/config.yml."
        control: folder
        empty: true
        allow_missing: true
    website.cv:
        heading: sources
        section: Website
        help: "The command Write the website runs in the website's folder once the three files are written, such as the program that builds the CV from them, as a task terminal of the Processes view. The first run of a command text asks to be approved, as a project command does. Empty runs nothing. This is a setting of the primary hub, kept in its .oculus/config.yml."
        control: text
    website.files.site:
        heading: sources
        section: Website
        help: "The website's own file, a path relative to the website's folder, whose programs: are the research lines a paper may name. A missing file holds none. A path that is empty, is absolute, leaves the folder or names the file of another key of website.files stops Write the website and is a finding of the audit. This is a setting of the primary hub, kept in its .oculus/config.yml."
        control: text
        empty: true
    website.files.cv:
        heading: sources
        section: Website
        help: "The CV's file, a path relative to the website's folder, which Write the website writes from the hub's files and the audit compares with what they give. A path that is empty, is absolute, leaves the folder or names the file of another key of website.files stops Write the website and is a finding of the audit. This is a setting of the primary hub, kept in its .oculus/config.yml."
        control: text
        empty: true
    website.files.papers:
        heading: sources
        section: Website
        help: "The publications' file, a path relative to the website's folder, which Write the website writes from the hub's files and the audit compares with what they give. A path that is empty, is absolute, leaves the folder or names the file of another key of website.files stops Write the website and is a finding of the audit. This is a setting of the primary hub, kept in its .oculus/config.yml."
        control: text
        empty: true
    website.files.industry:
        heading: sources
        section: Website
        help: "The employer CVs' file, a path relative to the website's folder, which Write the website writes from the hub's files and the audit compares with what they give. A path that is empty, is absolute, leaves the folder or names the file of another key of website.files stops Write the website and is a finding of the audit. This is a setting of the primary hub, kept in its .oculus/config.yml."
        control: text
        empty: true
    website.kinds:
        heading: sources
        section: Website
        help: "The sections of the website's publications, in the order the file lists them, and the papers each takes. A manifest that carries a publication record goes to the section of the first row whose stages hold its stage and whose forms hold its form; a row without stages or without forms places no condition on that side. A manifest no row takes gives no entry and a finding of the audit. This is a setting of the primary hub, kept in its .oculus/config.yml."
        fields:
            kind:
                help: the key of the section of the publications file the row's papers go to
                control: text
            stages:
                help: the stages the row holds, compared with the project's stage as written
                control: multi
                from: project_stages
                empty: true
            forms:
                help: the forms the row holds, compared with the project's form as written
                control: multi
                from: project_forms
                empty: true
            order:
                help: whether an entry of the row says the user's place among the authors, first, senior or coauthor, read from the manifest's lead, supervisors and collaborators
                control: toggle
                empty: true
            pub_pre:
                help: the words the website prints before the venue of an entry of the row; a row without it writes no pub_pre
                control: text
                empty: true
            pub_post:
                help: the words the website prints after the venue of an entry of the row; a row without it writes no pub_post
                control: text
                empty: true
    focus.sections:
        heading: boards
        section: Focus board
        help: "The sections the Focus board draws, in drawing order: command_center, tasks, quick_add, awaiting (the awaiting box), band (the Funding, Jobs and Teaching columns) and lanes (the Focus lanes, with the message of a board with no project). A section not listed is not drawn, and the line saying what a quick add did is drawn after quick_add, or at the top of the board without it. A word that is no section and a section listed twice are findings, and the rest is drawn once each; a value that is no list is a finding, and every section is drawn in this list's order."
        control: multi
        options: [command_center, tasks, quick_add, awaiting, band, lanes]
    focus.stale_lag_days:
        heading: boards
        section: Audit checks
        help: How many days a project's manifest `updated` date may trail the newest content of the project before the audit and the Focus board call the manifest behind.
        control: number
    context_window:
        heading: sessions
        section: Session meter
        help: The token window the session detail meter measures the last turn against, unless the transcript names its own window. A value that is not above zero leaves the meter without a window.
        control: number
    usage_tiers:
        heading: sessions
        section: Usage figures
        help: "The words shown for the subscription tier ids that the supported command-line agents report. A workspace file's settings: overrides the words of a tier id, adds a tier id, and takes one of oculus's out with <tier id>: null."
        fields:
            key:
                help: a tier id as the agent reports it
                control: text
                from: usage_tiers
            value: the words shown for that tier
    usage_refresh_min:
        heading: sessions
        section: Usage figures
        help: Minutes between refreshes of each account's cached usage figures, which hidden usage sessions make. The Usage view reads the same number as its cadence.
        control: number
        min: 1
        max: 35791
    usage_refresh_model:
        heading: sessions
        section: Usage figures
        help: The model the hidden usage sessions are started with, passed to the Claude command line as --model.
        control: choice
        from: models
    focus.refresh_stale_days.litwatch:
        heading: boards
        section: Thresholds and horizons
        help: Days after which the Focus refresh strip prompts to refresh the literature radar, counted from meta.last_run of the radar file. A radar that has never run is prompted for while this key is present. Removing the key stops the prompt for this feed.
        control: number
    focus.refresh_stale_days.inbox:
        heading: boards
        section: Thresholds and horizons
        help: Days after which the Focus refresh strip prompts to triage the inbox again, counted from the run date the triage skill writes at the top of triage.json under mail_dir. A note that the page's triage action writes keeps that date, so it does not reset the count, and with no run date there is no prompt. Removing the key stops the prompt for this feed.
        control: number
    focus.refresh_stale_days.scout:
        heading: boards
        section: Thresholds and horizons
        help: Days after which the Focus refresh strip prompts to run the position scout again, counted from the newest meta.log date of the leads file. A scout that has never run gives no prompt. Removing the key stops the prompt for this feed.
        control: number
    focus.deadline_horizon_days:
        heading: boards
        section: Thresholds and horizons
        help: How many days ahead the Command Center lists a dated item, among them a project's submission deadline, a funding scheme's deadline, a conference call with an exact date, and the dated entries of talks, teaching and positions. The tasks file's entries are lines of the Tasks section whatever their date.
        control: number
    focus.leads_horizon_days:
        heading: boards
        section: Thresholds and horizons
        help: How many days ahead the week's ticker lists the deadline of an open position lead from the leads file.
        control: number
    focus.conf_horizon_months:
        heading: boards
        section: Thresholds and horizons
        help: How many whole months ahead the week's ticker lists a conference call that has a usual month but no exact date. 1 lists this month and the next.
        control: number
    focus.venue_conc_warn:
        heading: boards
        section: Thresholds and horizons
        help: The number of in-flight papers aimed at one venue at which the Focus board raises its venue load line and a project board's Venue button marks the venue.
        control: number
    focus.linkedin_cadence_days:
        heading: boards
        section: Thresholds and horizons
        help: Days since the newest LinkedIn post beyond which the Focus board raises its LinkedIn line and the LinkedIn rail entry shows its red mark.
        control: number
    file_index.enabled:
        heading: boards
        section: File finder
        help: Whether project cards list the project's files. false turns the file finder off.
        control: toggle
    file_index.max_per_project:
        heading: boards
        section: File finder
        help: How many files the finder lists for one project, the newest first. A value that is not a number above zero means 400.
        control: number
    file_index.ext:
        heading: boards
        section: File finder
        help: The extensions, each with its dot, of the files the finder lists, compared in lower case. An empty list means the built-in list of common document and code extensions.
        control: list
    slurm.resource:
        heading: cluster
        section: Slurm
        help: "The clusters the Live HPC poller queries, each the key of a cluster entry of the resources registry, in the order the HPC view draws them. A cluster entry's host is the ssh alias, the DNS name or the address ssh connects to, and the user name and the key file are this machine's, a row of clusters: in local.yml. This is a setting of the hub, kept in the hub's .oculus/config.yml and read from the primary hub alone. The empty list sets no cluster, and the HPC view says so and polls nothing. A value that is not a list is a finding and no cluster is polled, a key named twice is a finding and polled once, mac, which names this Mac, is a finding and is not polled, and a key that names no cluster with a host shows why in the HPC view."
        control: multi
        from: clusters
    clusters.key_type:
        heading: cluster
        section: Cluster keys
        help: "The type of the key Account setup makes for a cluster with ssh-keygen: ed25519, ecdsa or rsa. Oculus ships ed25519; the primary hub's .oculus/config.yml may set another, and a hub other than the primary that sets it has a finding. Set empty, it makes no key, and Account setup says that the type is missing and where it is set."
        control: choice
        options: [ed25519, ecdsa, rsa]
        empty: no key type
    clusters.key_file:
        heading: cluster
        section: Cluster keys
        help: "The path of the key file Account setup makes for a cluster, in which {type} stands for clusters.key_type and {resource} for the cluster's key, such as ~/.ssh/id_{type}_{resource}. The path, with ~/ standing for the home folder, must lie under the home folder and its last part must be letters, digits, dots, dashes and underscores, else Make key refuses it. Oculus ships ~/.ssh/id_{type}_{resource}; the primary hub's .oculus/config.yml may set another, and a hub other than the primary that sets it has a finding. Set empty, it makes no key, and Account setup says that the path is missing and where it is set."
        control: text
    connections.failures:
        heading: cluster
        section: Connections
        help: "The rows that tell a failed connection apart, read in order: the first row whose match a line of ssh's or git's error output holds names the failure with its kind and its fix, in the section of the cluster on the HPC view and on the repository in Source Control. A row's for names the connections it reads, cluster for the ssh of a cluster's poll and git for a fetch, and a row without it reads both; a word outside the two is a finding naming the row, and the row is not read. A failure no row matches is shown as ssh or git wrote it. Oculus ships rows for a cluster key refused, an unknown host, no route to the cluster, a host key not trusted, a git sign-in refused and a git key refused. The primary hub's .oculus/config.yml lays its rows over these by kind: a row of a shipped kind replaces it in its place, { kind: x, removed: true } takes it out, and a new row is read before the shipped ones, so the hub's own error text is matched first. A hub other than the primary that sets it has a finding."
        fields:
            kind:
                help: the words that name the failure
                control: text
            for:
                help: the connections whose error output the row reads, cluster for the ssh of a cluster's poll and git for a fetch; a row without it reads both, and an empty list is a finding and the row is not read
                control: multi
                options: [cluster, git]
                empty: true
            match:
                help: a text that a line of the error output holds, compared as written
                control: text
            fix:
                help: the words of the failure's fix
                control: text
    sign_in:
        heading: calendar
        section: Sign in
        help: "The providers a reader signs in with, one row each: google and microsoft for the mail and the calendars, read by those keys, and a git host, any row with a credential_address, for git. Every address is an https address as the provider gives it; {tenant} stands for a Microsoft account's directory and {id} for a message's id in mail_link. A row whose key repeats an earlier row's, or whose address is no https address, is a finding and is not read; a credential_address that is no https origin is a finding and the row is no git host. With no row for a provider, or a row missing the address a step needs, Connect, the refresh and Account setup say which key and field are missing. Oculus ships the rows of Google, Microsoft and GitHub. The primary hub's .oculus/config.yml lays its rows over these by key: a row of a shipped key replaces it in its place, { key: x, removed: true } takes it out, and a new row comes after the shipped ones. A hub other than the primary that sets it has a finding."
        key: key
        fields:
            key:
                help: the provider's key, google, microsoft or a git host's own, lowercase letters, digits, dashes and underscores
                control: text
                form: row_key
            name:
                help: the provider's name, as Account setup shows it
                control: text
                empty: true
            authorize:
                help: the address a reader's consent is asked at
                control: text
                form: https_address
                empty: true
            token:
                help: the address a token is asked and refreshed at
                control: text
                form: https_address
                empty: true
            device_code:
                help: the address a git host's device code is asked at
                control: text
                form: https_address
                empty: true
            user:
                help: the address the signed-in user's login is read from
                control: text
                form: https_address
                empty: true
            calendar:
                help: the address the calendars are read from
                control: text
                form: https_address
                empty: true
            mail:
                help: the address the mail is read from
                control: text
                form: https_address
                empty: true
            mail_link:
                help: the address a message opens at, {id} standing for the message's id
                control: text
                form: https_address
                empty: true
            calendar_scope:
                help: the scopes the calendar is read with, separated by spaces
                control: text
                empty: true
            mail_scope:
                help: the scopes the mail is read and sent with, separated by spaces
                control: text
                empty: true
            git_scope:
                help: the scopes a git host's token is asked with, separated by spaces
                control: text
                empty: true
            credential_address:
                help: the origin git asks credentials for, the scheme, the host and an optional port, which makes the row a git host
                control: text
                form: https_origin
                empty: true
            register:
                help: the page where the reader registers the OAuth App a git host signs in with
                control: text
                form: https_address
                empty: true
    recover.node_download:
        heading: cluster
        section: Recover
        help: "The https address of the folder Node.js's releases are downloaded from, which Recover's cluster side fetches the build for the cluster from, such as https://nodejs.org/dist/. Oculus ships https://nodejs.org/dist/; the primary hub's .oculus/config.yml may set another, and a hub other than the primary that sets it has a finding. When it is empty, Recover on a cluster says that it is missing and where it is set."
        control: text
        form: https_address
        empty: true
    slurm.days:
        heading: cluster
        section: Slurm
        help: How many days back the Live HPC poll asks the scheduler's accounting for finished jobs, and for the job working directories of the log prewarm.
        control: number
        min: 0
        max: 3650
        whole: true
    slurm.poll_min:
        heading: cluster
        section: Slurm
        help: Minutes between two Live HPC polls of the job queue.
        control: number
        min: 1
        max: 35791
    slurm.quota_min:
        heading: cluster
        section: Slurm
        help: Minutes between two reads of the cluster's disk quota.
        control: number
        min: 1
        max: 35791
    slurm.prewarm:
        heading: cluster
        section: Slurm
        help: Whether the poller resolves the log paths of finished jobs behind the page, so that opening a log is quick. false defers that resolution.
        control: toggle
    processes.patterns:
        heading: terminal
        section: Processes
        help: The program names the Processes view lists beside oculus's own terminals. A name matches a process whose program, or whose first argument, has that file name.
        control: list
        form: program
    chat.model:
        heading: sessions
        section: In-page chat
        help: The model an in-page chat session is started with, passed to the Claude command line. Empty leaves the choice to the command line.
        control: choice
        from: models
        empty: the command line chooses the model
    calendar.poll_min:
        heading: calendar
        section: Calendar reads
        help: Minutes between two reads of the calendar accounts.
        control: number
        min: 1
        max: 35791
    calendar.days_back:
        heading: calendar
        section: Calendar reads
        help: How many days before now the calendar window opens.
        control: number
        min: 0
        max: 3650
        whole: true
    calendar.days_ahead:
        heading: calendar
        section: Calendar reads
        help: How many days after now the calendar window closes.
        control: number
        min: 0
        max: 3650
        whole: true
    mail.poll_min:
        heading: calendar
        section: Mail reads
        help: Minutes between two reads of the inbox plate.
        control: number
        min: 1
        max: 35791
    mail.per_signal:
        heading: calendar
        section: Mail reads
        help: How many threads each of the plate's three signals is read at most.
        control: number
        min: 1
        max: 500
        whole: true
    editor.paint_limit_kb:
        heading: editor
        section: Source editor
        help: Size in kilobytes above which the source editor opens a file as plaintext. The editor colours a file by running its grammar over the text in the page as it is typed, and the read-only code window, painted once, colours every size.
        control: number
        min: 1
    editor.tab_size:
        heading: editor
        section: Source editor
        help: The width of one step of indentation, from 1 to 8, VS Code's editor.tabSize. A file that indents with spaces keeps the step it is written with; this is the width for a file with no indented line and for a file indented with tabs. A language's record in editor.languages, or a repository's .oculus/settings.yml, overrides it.
        control: number
        min: 1
        max: 8
        whole: true
    editor.insert_spaces:
        heading: editor
        section: Source editor
        help: Whether a file with no indented line is indented with spaces (true) or a tab (false), VS Code's editor.insertSpaces. A file that already indents keeps its own. A language's record in editor.languages, or a repository's .oculus/settings.yml, overrides it.
        control: toggle
    editor.word_wrap:
        heading: editor
        section: Source editor
        help: How the editor wraps a long line, VS Code's editor.wordWrap. off never wraps, on wraps at the width of the editor, wordWrapColumn wraps at column 80, and bounded wraps at the smaller of the editor's width and column 80. Alt+Z in a source tab switches the wrap of that tab. A language's record in editor.languages, or a repository's .oculus/settings.yml, overrides it.
        control: choice
        options: ['off', 'on', wordWrapColumn, bounded]
    editor.minimap:
        heading: editor
        section: Source editor
        help: Whether the source editor draws the minimap, the overview of the file at its right edge, VS Code's editor.minimap.enabled. The diff editor draws its minimap as Monaco does.
        control: toggle
    editor.render_whitespace:
        heading: editor
        section: Source editor
        help: Which spaces and tabs the editor draws as marks, VS Code's editor.renderWhitespace. none draws none, boundary draws all but single spaces between words, selection draws them inside a selection, trailing draws the ones at the end of a line, and all draws every one.
        control: choice
        options: [none, boundary, selection, trailing, all]
    editor.sticky_scroll:
        heading: editor
        section: Source editor
        help: Whether the editor keeps the headings and blocks that contain the first visible line at the top of the view, VS Code's editor.stickyScroll.enabled. The structure comes from the headings of a Markdown or LaTeX file, from the language service of TypeScript, JavaScript, JSON, CSS, SCSS, Less and HTML, from the symbols pyright, clangd and yaml-language-server answer for a Python, C, C++ or YAML file they serve, and from the braces of Java, Dart, R and Rite, and of C and C++ while no language server serves the file.
        control: toggle
    editor.suggest_details:
        heading: editor
        section: Source editor
        help: Whether the suggest list opens with its side panel of descriptions shown. Ctrl+Space or Cmd+I while the list shows closes or opens the panel and writes that choice to this key, for every editor of every page.
        control: toggle
    editor.autosave:
        heading: editor
        section: Source editor
        help: 'off: An editor with changes is never automatically saved. after_delay: An editor with changes is automatically saved after the configured editor.autosave_delay_ms. on_focus_change: An editor with changes is automatically saved when the editor loses focus, and every such editor is saved when the page loses focus.'
        control: choice
        options: ['off', after_delay, on_focus_change]
    editor.autosave_delay_ms:
        heading: editor
        section: Source editor
        help: Controls the delay in milliseconds after which an editor with unsaved changes is saved automatically. Only applies when editor.autosave is set to after_delay.
        control: number
        min: 0
        whole: true
    editor.trim_trailing_whitespace:
        heading: editor
        section: Source editor
        help: When enabled, will trim trailing whitespace when saving a file.
        control: toggle
    editor.final_newline:
        heading: editor
        section: Source editor
        help: When enabled, a save ends a last line of text with one line ending and takes off the empty lines after the last line that holds any character.
        control: toggle
    editor.opacity:
        heading: editor
        section: Source editor
        help: How solid the editor stays over the wallpaper, from 0 to 1 (1 is opaque), applied as a whole percentage. It covers a Source tab's editor and its read-only code window, the files of the Diff view and the Merge view. Leaving the key out, as the defaults do, takes wallpaper.panel_opacity. It counts only while a wallpaper shows; a diff drawn inside another view, as the Deposit view draws one, and an editor inside a free float take that view's or that float's share instead.
        control: number
        min: 0
        max: 1
    editor.languages:
        heading: editor
        section: Source editor
        help: "The editor options of a language, by the editor's language name, as VS Code's per-language settings give them. A record sets any of the fields below for the files of that language and overrides the global key of the same name; a repository's .oculus/settings.yml has a languages key of the same records that overrides these for the files of that repository. A language the editor does not colour, a field not listed and a value outside its words or range are not read and are listed in the Findings view. A workspace file's settings: overrides a language's record, adds one for a language with none, and takes one of oculus's out with <language>: null."
        fields:
            key:
                help: the language's name as the editor and the status bar show it
                control: choice
                from: languages
            tab_size:
                help: the width of one step of indentation, a whole number from 1 to 8
                control: number
                min: 1
                max: 8
                whole: true
            insert_spaces:
                help: true indents a file with no indented line with spaces, false with a tab
                control: toggle
            word_wrap:
                help: off, on, wordWrapColumn or bounded
                control: choice
                options: ['off', 'on', wordWrapColumn, bounded]
            rulers:
                help: the columns that draw a vertical line, a list of whole numbers
                control: list
                items: number
                min: 1
                whole: true
            format_on_save:
                help: true formats the document with the language server before each save, false saves it as typed; a language whose server does not format, Python among them, saves as typed either way
                control: toggle
            trim_trailing_whitespace:
                help: When enabled, will trim trailing whitespace when saving a file.
                control: toggle
            final_newline:
                help: When enabled, a save ends a last line of text with one line ending and takes off the empty lines after the last line that holds any character.
                control: toggle
    latex.auto_build:
        heading: editor
        section: LaTeX
        help: When a main file is built without being asked. on_file_change builds it when any file it includes changes on disk, whoever wrote the file (the editor, an agent, git), for the main files of the open LaTeX tabs and of the PDFs they build. on_save builds the main file the saved file belongs to when the file is saved in the editor. never builds only when asked. A build is in the background, and its errors and warnings reach the editor as markers when it ends.
        control: choice
        options: [on_file_change, on_save, never]
    latex.auto_build_interval_ms:
        heading: editor
        section: LaTeX
        help: The shortest time, in milliseconds, between the starts of two automatic builds of one main file. A change that comes while a build runs gives one build after it.
        control: number
        min: 1
        whole: true
    latex.recipe_default:
        heading: editor
        section: LaTeX
        help: The recipe a build uses when the file names none and the reader asked for none. first is the first recipe of latex.recipes and last_used is the one the reader last asked for with Build with Recipe.
        control: choice
        options: [first, last_used]
    latex.out_dir:
        heading: editor
        section: LaTeX
        help: The folder a build writes the PDF, the log and the SyncTeX file to. %DIR% is the main file's own folder; any other value is a folder resolved from the main file's folder, which must stay under the served root.
        control: text
    latex.aux_dir:
        heading: editor
        section: LaTeX
        help: The folder a build writes its auxiliary files to. %OUTDIR% is the output folder; any other value is resolved as latex.out_dir is.
        control: text
    latex.clean_and_retry:
        heading: editor
        section: LaTeX
        help: true cleans the auxiliary files and builds once more after a build that ended in an error, as LaTeX Workshop does; a build the reader stopped is not retried.
        control: toggle
    latex.auto_clean:
        heading: editor
        section: LaTeX
        help: Whether Clean runs after a build, by how the build ended. never does not clean; on_failed, on_succeeded and on_built clean after a failed build, a successful one, or either.
        control: choice
        options: [never, on_failed, on_succeeded, on_built]
    latex.synctex_path:
        heading: editor
        section: LaTeX
        help: Where the synctex program is, which finds the PDF position of a source line and the source line of a PDF click. Empty finds it on PATH.
        control: path
        empty: true
    latex.reverse_synctex:
        heading: editor
        section: LaTeX
        help: The click on a page of the PDF that opens the source at that place. ctrl_click is Cmd, or Ctrl, and a click; double_click is a double click. Any other click selects text and follows links.
        control: choice
        options: [ctrl_click, double_click]
    latex.texcount_autorun:
        heading: editor
        section: LaTeX
        help: on_save counts the words of the main file after each save of a LaTeX file, so the status bar's tooltip has the number; never counts only when asked.
        control: choice
        options: [never, on_save]
    latex.context_menu:
        heading: editor
        section: LaTeX
        help: true adds Build and SyncTeX from Cursor to the editor's right-click menu of a LaTeX file.
        control: toggle
    latex.unimath_symbols:
        heading: editor
        section: LaTeX
        help: Offer the Unicode math symbols in LaTeX completion, each with its glyph.
        control: toggle
    latex.includegraphics_preview:
        heading: editor
        section: LaTeX
        help: 'Show the picture beside a file suggested inside \includegraphics.'
        control: toggle
    latex.recipes:
        heading: editor
        section: LaTeX
        help: "The recipes a build can run, each a name and the tools it chains in order. A recipe whose name an earlier recipe took, one with no name, one that names no tool and one that names a tool latex.tools does not hold is not read and is listed in the Findings view. A workspace file's settings: overrides a recipe by its name, adds a recipe with a new name, and takes one of oculus's out with { name: <recipe>, removed: true }; the recipes it names come first, in its order."
        key: name
        fields:
            name: the name the build asks for, which a % !LW recipe = <name> comment also names
            tools:
                help: the names of the tools the recipe runs one after the other
                control: list
    latex.tools:
        heading: editor
        section: LaTeX
        help: "The tools recipes chain, each a program and its arguments. An argument may hold the placeholders %DOC%, %DOC_EXT%, %DOCFILE%, %DOCFILE_EXT%, %DIR%, %OUTDIR% and %AUXDIR%. A tool whose name an earlier tool took, or that has no name or no program, is not read and is listed in the Findings view. A workspace file's settings: overrides a tool by its name, adds a tool with a new name, and takes one of oculus's out with { name: <tool>, removed: true }; the tools it names come first, in its order."
        key: name
        fields:
            name: the name recipes call the tool by
            command: the program, found on PATH
            args:
                help: the arguments, one per item
                control: list
    latex.formatter:
        heading: editor
        section: LaTeX
        help: The program Format Document runs on a .tex file, as LaTeX Workshop's latex-workshop.formatting.latex offers them. latexindent comes with TeX Live and MacTeX, tex-fmt and badness are installed on their own. none formats nothing and says so. The program reads the text and writes the formatted text back, with no shell and a 20 second limit.
        control: choice
        options: [none, latexindent, tex-fmt, badness]
    latex.latexindent_path:
        heading: editor
        section: LaTeX
        help: Where latexindent is, when latex.formatter is latexindent. Empty finds it on PATH.
        control: path
        empty: true
    latex.tex_fmt_path:
        heading: editor
        section: LaTeX
        help: Where tex-fmt is, when latex.formatter is tex-fmt. Empty finds it on PATH.
        control: path
        empty: true
    latex.badness_path:
        heading: editor
        section: LaTeX
        help: Where badness is, when latex.formatter is badness. Empty finds it on PATH.
        control: path
        empty: true
    latex.texlab_path:
        heading: editor
        section: LaTeX
        help: 'The texlab program the LaTeX language server runs. Empty: texlab on the PATH oculus was started with.'
        control: path
        empty: true
    lint.chktex:
        heading: editor
        section: Linting
        help: true runs ChkTeX on a .tex or .latex file when it is saved and when a tab of it with no unsaved text opens, and shows its findings in the editor and the Problems view.
        control: toggle
    lint.ruff:
        heading: editor
        section: Linting
        help: true runs Ruff on a .py or .pyi file when it is saved and when a tab of it with no unsaved text opens, and shows its findings in the editor and the Problems view.
        control: toggle
    lint.eslint:
        heading: editor
        section: Linting
        help: true runs the ESLint of the repository on a TypeScript, JavaScript or Svelte file under an eslint.config.* file, after the configuration is approved in the palette (:eslint-config), and shows its findings in the editor and the Problems view.
        control: toggle
    lint.shellcheck:
        heading: editor
        section: Linting
        help: true runs ShellCheck on a .sh, .bash or .slurm file when it is saved and when a tab of it with no unsaved text opens, and shows its findings in the editor and the Problems view.
        control: toggle
    lint.writing:
        heading: editor
        section: Linting
        help: true marks, in a Markdown or YAML file and in the comments of a code file, each character the hub's writing rules ban (em and en dashes, curly quotes, the ellipsis, arrows, the non-breaking space) and each Markdown paragraph broken across lines, in the editor and the Problems view, with a quick fix where the fix is exact. It runs no program.
        control: toggle
    lint.chktex_path:
        heading: editor
        section: Linting
        help: 'Where ChkTeX is: an absolute path or one that starts with ~. Empty: ChkTeX on the PATH oculus was started with. A named path that cannot be used is reported as not found, and the PATH is not tried in its place.'
        control: path
        empty: true
    lint.ruff_path:
        heading: editor
        section: Linting
        help: 'Where Ruff is: an absolute path or one that starts with ~. Empty: Ruff on the PATH oculus was started with. A named path that cannot be used is reported as not found, and the PATH is not tried in its place.'
        control: path
        empty: true
    lint.shellcheck_path:
        heading: editor
        section: Linting
        help: 'Where ShellCheck is: an absolute path or one that starts with ~. Empty: ShellCheck on the PATH oculus was started with. A named path that cannot be used is reported as not found, and the PATH is not tried in its place.'
        control: path
        empty: true
    lint.chktex_args:
        heading: editor
        section: Linting
        help: The arguments ChkTeX runs with, as LaTeX Workshop's latex-workshop.linting.chktex.exec.args offers them. oculus adds the output format, -I0 and the .chktexrc it finds beside the file or in the root.
        control: list
    lint.writing_skip:
        heading: editor
        section: Linting
        help: The globs of the files the writing rules leave alone, matched against the path from the file's root (a glob without a slash also matches a file name). A skipped file has no marks and no linter item. A file named glyphs.yml is skipped whatever this holds. This is a setting of the hub, kept in its .oculus/config.yml.
        control: list
    lint.writing_glyphs:
        heading: editor
        section: Linting
        help: The globs of the files that draw arrows as icons. The writing rules mark every banned character in them but arrows. This is a setting of the hub, kept in its .oculus/config.yml.
        control: list
    writes.timeout_seconds:
        heading: editor
        section: Saving
        help: Seconds a save waits for the server's answer before it is given up and its form says so. A value that is not above zero makes a save wait as long as the request does.
        control: number
    notes.autosave_ms:
        heading: editor
        section: Notes
        help: Milliseconds a note of a hub's notes folder waits after the last keystroke before its tab saves it, whatever editor.autosave says. Closing the tab inside the wait saves first.
        control: number
    changes.keep:
        heading: editor
        section: Change log
        help: How many changes the change log holds. Every write that changed something is recorded in ~/.oculus/changes.jsonl, or where the changes key of local.yml puts it, and the file is rewritten down to this number once it has grown past twice it.
        control: number
        min: 1
        whole: true
    files.confirm_delete:
        heading: editor
        section: Files
        help: Whether moving a file or folder to the Trash in the Files view asks first, as VS Code's explorer.confirmDelete. A permanent delete always asks. The question's "Do not ask me again" box writes false here.
        control: toggle
    files.file_icon_at_arrow:
        heading: editor
        section: Files
        help: Whether a file's row in the Files view drops the empty slot of a folder's arrow, so the file's icon sits where its sibling folders' arrows sit. false lines its icon up with its sibling folders' icons, as VS Code's Explorer does.
        control: toggle
    git.message_model:
        heading: editor
        section: Git
        help: The model the Changes section of the Session view asks for a suggested commit message. Empty uses the command line's own default model.
        control: choice
        from: models
        empty: the command line's own default model
    git.autofetch_minutes:
        heading: editor
        section: Git
        help: Minutes between two automatic git fetch --prune of every repository oculus shows that has a remote, as VS Code's auto fetch. 0, the default, fetches only when Fetch is pressed; nothing else reaches a remote unasked. It is read again within a minute of a change.
        control: number
        min: 0
        max: 35791
        whole: true
    deposit.zenodo.address:
        heading: editor
        section: Deposit
        help: "The https address every call of the Deposit view's For review and Publish is built from, Zenodo's API; a share link is this address with its trailing /api taken off, then /records/<id>?token=<token>. Oculus ships the address of Zenodo's own API. Each hub's .oculus/config.yml may set its own for its own projects, such as the API address of Zenodo's sandbox, and keeps the shipped auth and timeout_s unless it sets them too."
        control: text
        form: https_address
    deposit.zenodo.timeout_s:
        heading: editor
        section: Deposit
        help: The seconds one upload of a project's zip to Zenodo is given before it is given up. Every other Zenodo call keeps the reader's own limit.
        control: number
        min: 1
        max: 86400
        whole: true
    deposit.zenodo.auth:
        heading: editor
        section: Deposit
        help: "The token every Zenodo call carries, read from the downloads row an entry names in the primary hub's .oculus/local.yml and sent in the entry's header after its prefix, to the address of deposit.zenodo.address and nowhere else. Oculus ships one entry, the Authorization header, the prefix Bearer and the row zenodo; with that row missing, For review and Publish are off and say where it is set. No reader row of literature.sources, recover.sources or venues.browser is handed the row it names."
        fields:
            header:
                help: the header the token is sent in
                control: text
            prefix:
                help: the text sent before the token
                control: text
                empty: true
            row:
                help: the service of the downloads row the token is read from
                control: text
            required:
                help: For review and Publish are off without the downloads row
                control: toggle
                empty: true
            help:
                help: the sentence that says where the token is made, shown while the row is missing
                control: text
                empty: true
    search.max_hits:
        heading: editor
        section: Search
        help: How many hits one answer of the Search view carries before it says it was cut.
        control: number
        min: 1
        whole: true
    search.timeout_s:
        heading: editor
        section: Search
        help: Seconds one root's ripgrep search, or its list of file names, is given.
        control: number
        min: 1
    search.max_names:
        heading: editor
        section: Search
        help: How many file names the palette's file mode lists in all before it says the list was cut.
        control: number
        min: 1
        whole: true
    literature.timeout_s:
        heading: editor
        section: Literature search
        help: Seconds one source of the Literature search is given to answer a request. A source that has not answered by then shows that it gave no answer in time.
        control: number
        min: 1
        max: 120
        whole: true
    literature.per_source:
        heading: editor
        section: Literature search
        help: How many hits one page of the Literature search asks of each source. A source takes at most the `paging.max` of its row of `literature.sources`, so a larger page is cut to what the source takes.
        control: number
        min: 1
        max: 100
        whole: true
    literature.cache_min:
        heading: editor
        section: Literature search
        help: Minutes the server keeps a source's answer for the same request, so a search run again, or a source switched off and on, is not asked a second time. 0 keeps nothing.
        control: number
        min: 0
        max: 1440
        whole: true
    literature.sources:
        heading: editor
        section: Literature search
        help: "The sources the Literature search asks, in the order it lists them, each a reader row: the address it is asked at, the parameters each term of the form is sent as, how its answers page, and the records and fields a hit is read from. Oculus ships the rows of OpenAlex, Semantic Scholar, Crossref, PubMed, Europe PMC, arXiv, Web of Science and Scopus. The primary hub's .oculus/config.yml lays its rows over these by key: a row of a shipped key replaces it in its place, { key: x, removed: true } takes it out, and a new row comes after the shipped ones; a hub other than the primary that sets it has a finding. A row with a key the reader does not take, or without a key its format needs, is a finding of the file."
        sparse: true
        fields:
            key:
                help: the source's id, which a hit names its source by, unique in the list
                control: text
            name:
                help: the words the search's source list and every line about the source show
                control: text
            format:
                help: how an answer is read, json, xml, html (by CSS selectors), text or none
                control: choice
                options: [json, xml, html, text, none]
            address:
                help: 'the https: address asked, with {name} holes filled from the terms and the entry, each encoded for its part, and the operations {hole|quote}, {hole|plain}, {hole|series} and {hole|path}'
                control: text
            query:
                help: each term of the form (words, doi, years, type, open_access, venue, author, min_cited; issn and id for the lookups) to how it is sent; a term the row does not map is not sent
                fields:
                    key:
                        help: the term
                        control: choice
                        options:
                            - words
                            - doi
                            - years
                            - type
                            - open_access
                            - venue
                            - author
                            - min_cited
                            - issn
                            - id
                    value:
                        help: how the term is sent
                        holds: record
                        fields:
                            param: the parameter the term is sent in
                            text: 'the value sent, with the holes {words}, {doi}, {from}, {to}, {value}, {from-1}, {to+1} and {value-1}'
                            address: the address a lookup by this term is asked at instead of the row's
                            match: the pattern whose capture is the value sent; a value that does not fit sits the search out
                            per_word:
                                help: send one text per word or quoted phrase
                                control: toggle
                            params:
                                help: the parameters sent with the term alone, beside its parameter or with its lookup
                                fields:
                                    key: the parameter
                                    value: its value
                            headers:
                                help: the headers a lookup alone is sent with
                                fields:
                                    key: the header
                                    value: its value
                            missing:
                                help: none reads a 404 answer as no hit
                                control: choice
                                options: [none]
                            records:
                                help: where a lookup's answer holds its records, a path or a record of its path and how it is read
                                described_by: reader_records
                            fields:
                                help: the fields a lookup's records are read by
                                described_by: reader_fields
                            format:
                                help: how a lookup's answer is read
                                control: choice
                                options: [json, xml, html, text, none]
                            by: the hit field a lookup by id takes its id from
            join:
                help: each parameter that several terms fill to the text their values are joined by
                fields:
                    key: the parameter
                    value: the text between the values
            skip_when:
                help: the terms the source cannot send, so a search holding one sits this source out with no request
                control: multi
                options: [words, doi, years, type, open_access, venue, author, min_cited, issn, id]
            types:
                help: each type of the form to the value the source takes for it
                fields:
                    key: the type of the form
                    value: the source's value
            types_only:
                help: a type the row's types do not name sits the search out
                control: toggle
            filters:
                help: the filters the browser offers, each a label and the parameters it sends, {value} the value picked
                fields:
                    label: the words the filter is offered under
                    params:
                        help: the parameters the filter sends
                        fields:
                            key: the parameter
                            value: its value, with {value}
            sorts:
                help: the sort orders offered, each a label and the parameters it sends
                fields:
                    label: the words the order is offered under
                    params:
                        help: the parameters the order sends
                        fields:
                            key: the parameter
                            value: its value
            paging:
                help: how the answers page, total the count of hits
                described_by: reader_paging
            params:
                help: the parameters every request is sent with
                fields:
                    key: the parameter
                    value: its value, with holes
            headers:
                help: the headers every request is sent with
                fields:
                    key: the header
                    value: its value, with holes
            method:
                help: post sends the request as a POST with the body
                control: choice
                options: [post]
            body:
                help: the JSON body of a POST, each key to its value with holes
                described_by: reader_body
            records:
                help: where an answer holds its records, a path or `.` for the answer, a CSS selector for html, or a record of its path and how it is read
                described_by: reader_records
            fields:
                help: the fields a hit is read by, each a path (`[]` a list, `[name=value]` the element whose field has that value), a CSS selector with attr for html, or a record of the path and its operation
                described_by: reader_fields
            then:
                help: the follow-up requests, each with its own address, format, records and fields, and one of ids (the ids of the request before, joined by commas), for_each (one request per record) or recurse
                described_by: reader_step
            pace:
                help: the gap between two requests to the source
                holds: record
                fields:
                    gap:
                        help: the milliseconds between two requests
                        control: number
                        min: 0
                        whole: true
                    gap_with_key:
                        help: the milliseconds between two requests while the row's key is set
                        control: number
                        min: 0
                        whole: true
            wait:
                help: the headers a 429 answer's wait is read from
                holds: record
                fields:
                    retry_after: the header of the seconds to wait
                    reset: the header of the time the limit resets
                    remaining: the header of the requests left; the reset is read only when it says 0
            auth:
                help: the secrets the requests carry, each read from the downloads row it names in the machine's local.yml
                fields:
                    header: the header the secret is sent in
                    param: the parameter the secret is sent in
                    basic:
                        help: send the downloads row's user and secret as Basic
                        control: toggle
                    row: the service of the downloads row the secret is read from
                    prefix: the text sent before the secret
                    required:
                        help: the source is off without its downloads row
                        control: toggle
                    help: the sentence that says where the secret is made, drawn when the source is off without it
            contact: the parameter literature.mailto of local.yml is sent as
            expect:
                help: the element of an html answer the row's pages hold, which a page that lacks it refuses
                holds: record
                fields:
                    select: the CSS selector
                    holds: a text its value must hold
            none_when: a path whose presence in an answer means no hits
            holes:
                help: each hole of the addresses to the term or entry field it is filled from
                fields:
                    key: the hole
                    value: the field
            given:
                help: each field a hit is given whatever the answer, to its value
                fields:
                    key: the field
                    value: the value
    literature.prefer.fields:
        heading: editor
        section: Literature search
        help: The order of the sources, by their key, that a paper found by several takes its title, venue, year, date and type from. Read from the primary hub's .oculus/config.yml.
        control: list
    literature.prefer.abstract:
        heading: editor
        section: Literature search
        help: The order of the sources, by their key, that a paper found by several takes its abstract from.
        control: list
    literature.prefer.pdf:
        heading: editor
        section: Literature search
        help: The sources, by their key and in order, whose open PDF a paper shows; a source not listed gives none.
        control: list
    recover.sources:
        heading: sources
        section: Recover
        help: "The reader rows Recover lists a dataset's files with, each the kind a dataset source of this hub names as its key: the address its files are listed at, the records and fields a file's name, size, checksum and address are read from, its whole-set download, and the address that says whether a set needs a credential. Oculus ships the rows of DANDI, figshare, GEO, Hugging Face, Kaggle, PhysioNet, the Stanford Digital Repository, Synapse, TCIA, a plain address and Zenodo. Each hub's own .oculus/config.yml lays its rows over these by key, for its own datasets: a row of a shipped key replaces it in its place, { key: x, removed: true } takes it out, and a new row comes after the shipped ones. A source of a kind no row names says so and sends no request."
        sparse: true
        fields:
            key:
                help: the kind a dataset source names, unique in the list
                control: text
            name:
                help: the words every line about the source shows
                control: text
            format:
                help: how an answer is read, json, xml, html (by CSS selectors), text or none (the files are the entry's own)
                control: choice
                options: [json, xml, html, text, none]
            address:
                help: "the https: address asked, with {name} holes filled from the dataset source's fields, each encoded for its part, and {hole|path} for a hole of several segments"
                control: text
            params:
                help: the parameters every request is sent with
                fields:
                    key: the parameter
                    value: its value, with holes
            headers:
                help: the headers every request is sent with
                fields:
                    key: the header
                    value: its value, with holes
            method:
                help: post sends the request as a POST with the body
                control: choice
                options: [post]
            body:
                help: the JSON body of a POST, each key to its value with holes
                described_by: reader_body
            paging:
                help: how the listing pages, total the count of records
                described_by: reader_paging
            records:
                help: where an answer holds its files, a path, a CSS selector for html, or a record of its path and how it is read
                described_by: reader_records
            for_each: the entry field whose values each fill the hole of that name, one request per value
            fields:
                help: the fields a file is read by (name, size, checksum, url), each a path, a CSS selector with attr, or a record of the path and its operation
                described_by: reader_fields
            then:
                help: the follow-up requests, each with its own address, format, records and fields, and one of ids, for_each (one request per record) or recurse (the folders below, down to max_depth)
                described_by: reader_step
            pace:
                help: the gap between two downloads
                holds: record
                fields:
                    gap:
                        help: the milliseconds between two requests
                        control: number
                        min: 0
                        whole: true
                    field: the entry field that gives the gap between downloads
            wait:
                help: the headers a 429 answer's wait is read from
                holds: record
                fields:
                    retry_after: the header of the seconds to wait
                    reset: the header of the time the limit resets
                    remaining: the header of the requests left
            auth:
                help: the credentials the requests and the downloads carry, each read from the downloads row it names in the machine's local.yml
                fields:
                    header: the header the secret is sent in
                    param: the parameter the secret is sent in
                    basic:
                        help: send the downloads row's user and secret as Basic
                        control: toggle
                    row: the service of the downloads row the secret is read from
                    prefix: the text sent before the secret, such as Bearer and a space
                    required:
                        help: the source needs its downloads row, and is missing with nothing asked without it
                        control: toggle
                    help: the sentence that says where the secret is made, drawn where Recover asks for it
            archive:
                help: the whole-set download
                holds: record
                fields:
                    address: the address of the download
                    name: the file's name; without one, the last part of the address the probe ends at
                    match: the pattern that name must fit
                    when: the entry field that, set true, makes the download the listing
            access:
                help: the address asked first without the credential, to say whether a set is open (2xx), needs one (401 or 403) or cannot be reached
                holds: record
                fields:
                    address: the address, with holes
            pick:
                help: the entry field whose values pick the files listed
                holds: record
                fields:
                    field: the entry field
                    by: the file field it is compared with, the name by default
                    glob:
                        help: the values are glob patterns
                        control: toggle
            clash: the record field a repeated file name is put under
            expect:
                help: the element of an html answer the row's pages hold, which a page that lacks it refuses
                holds: record
                fields:
                    select: the CSS selector
                    holds: a text its value must hold
            holes:
                help: each hole of the addresses to the entry field it is filled from
                fields:
                    key: the hole
                    value: the field
            given:
                help: each field a file is given whatever the answer, to its value
                fields:
                    key: the field
                    value: the value
    venues.browser:
        heading: sources
        section: Journal browser
        help: "The journal browser the hub's venues are searched in and read from: one reader row, its address, the parameters a search by words and a lookup by ISSN are sent as, its filters, sort orders and page sizes, and the selectors a hit's title, ISSN, publisher, fee and open-access status are read by. Read from each hub's own .oculus/config.yml. With none, the hub shows no browser and no venue card offers Read from the browser."
        sparse: true
        holds: record
        fields:
            key:
                help: the browser's id
                control: text
            name:
                help: the words the browser view and its lines show
                control: text
            format:
                help: how an answer is read, json, xml, html (by CSS selectors) or text
                control: choice
                options: [json, xml, html, text, none]
            address:
                help: 'the https: address asked, with {name} holes'
                control: text
            query:
                help: words, the search by words, and issn, the lookup by ISSN, each to how it is sent
                fields:
                    key:
                        help: the term
                        control: choice
                        options: [words, issn]
                    value:
                        help: how the term is sent
                        holds: record
                        fields:
                            param: the parameter the term is sent in
                            text: the value sent, with the hole {value}
                            address: the address a lookup is asked at instead of the row's
                            match: the pattern whose capture is the value sent
                            params:
                                help: the parameters the term alone is sent with
                                fields:
                                    key: the parameter
                                    value: its value
            filters:
                help: the filters the browser offers, each a label and the parameters it sends, {value} the value picked
                fields:
                    label: the words the filter is offered under
                    params:
                        help: the parameters the filter sends
                        fields:
                            key: the parameter
                            value: its value, with {value}
            sorts:
                help: the sort orders offered, each a label and the parameters it sends
                fields:
                    label: the words the order is offered under
                    params:
                        help: the parameters the order sends
                        fields:
                            key: the parameter
                            value: its value
            paging:
                help: how the hits page, sizes the page sizes the view offers and total the count of hits
                described_by: reader_paging
            params:
                help: the parameters every request is sent with
                fields:
                    key: the parameter
                    value: its value
            records:
                help: where an answer holds its hits, a path, a CSS selector for html, or a record of the selector
                described_by: reader_records
            fields:
                help: the fields a hit is read by (name, issn, publisher, fee, open_access), each a path, a CSS selector with attr, or a record of the selector and its operation
                described_by: reader_fields
            pace:
                help: the gap between two requests
                holds: record
                fields:
                    gap:
                        help: the milliseconds between two requests
                        control: number
                        min: 0
                        whole: true
            expect:
                help: the element of an html answer the row's pages hold, which a page that lacks it refuses
                holds: record
                fields:
                    select: the CSS selector
                    holds: a text its value must hold
    links:
        heading: sources
        section: Links
        help: "The addresses every page link is built from: a paper's page by its DOI or by a source's own id, a search by a paper's title and a lint rule's page, each a key and an https: address with {id} and holes filled from the hit's fields. Oculus ships the rows doi, arxiv, arxiv_pdf, pubmed, europepmc, scholar and shellcheck. The primary hub's .oculus/config.yml lays its rows over these by key: a row of a shipped key replaces it in its place, { key: x, removed: true } takes it out, and a new row comes after the shipped ones. A link whose row is missing is not drawn."
        sparse: true
        fields:
            key:
                help: the link's id, which the readers ask for it by, unique in the list
                control: text
            address:
                help: "the https: address, with {id} and the holes a hit's fields fill"
                control: text
    open.program_ext:
        heading: editor
        section: Opening in programs
        help: "The extensions a file may carry to be handed to a program on this machine, each with the bundle id of the one application it opens in on macOS; on Linux the desktop's own program for the type opens it and the bundle id is not used. A file of any other extension, and a listed file with an execute bit, marked as a Finder alias on macOS or ending .desktop on Linux, is refused, and a folder is shown in Finder on macOS and opened in the file manager on Linux. Read again at every request. A workspace file's settings: overrides the application of an extension, adds an extension, and takes one of oculus's out with <extension>: null."
        fields:
            key:
                help: an extension with its dot, compared in lower case
                control: text
                form: extension
            value:
                help: the bundle id of the application that opens it
                control: text
                form: bundle_id
                from: bundle_ids
    apps.connect_timeout_s:
        heading: apps
        section: App limits
        help: Seconds an app's frame is given to complete the bridge handshake before it is drawn as failed to load.
        control: number
        min: 1
        max: 2147483
        whole: true
    apps.state_max_kb:
        heading: apps
        section: App limits
        help: Kilobytes of one tab's saved state that an app's `setState` accepts.
        control: number
        min: 1
        whole: true
    apps.store_max_kb:
        heading: apps
        section: App limits
        help: Kilobytes of an app's store that `setStore` accepts and `getStore` reads.
        control: number
        min: 1
        whole: true
    apps.writes_per_min:
        heading: apps
        section: App limits
        help: How many writes, `setStore` included, one frame or one host may send in a minute; a host's store updates, a secret's stores and deletes and a custom editor's saves count here.
        control: number
        min: 1
        whole: true
    apps.opens_per_min:
        heading: apps
        section: App limits
        help: How many calls of `open`, `commands.run`, `commands.execute` and `createPanel` one frame may send in a minute, and of `executeCommand` one host.
        control: number
        min: 1
        whole: true
    apps.messages_per_min:
        heading: apps
        section: App limits
        help: How many calls of `sendToPage` and of the `ui` calls (messages, quick pick, input box, progress) one host or frame may make in a minute.
        control: number
        min: 1
        whole: true
    apps.keys_per_s:
        heading: apps
        section: App limits
        help: How many key events per second the page takes from one frame.
        control: number
        min: 1
        whole: true
    apps.max_files:
        heading: apps
        section: App limits
        help: How many files an app's folder may hold before the app is refused.
        control: number
        min: 1
        whole: true
    apps.max_mb:
        heading: apps
        section: App limits
        help: How many megabytes an app's files may total before the app is refused, and the most a custom editor reads or saves in one file.
        control: number
        min: 1
        whole: true
    apps.host_output_kb:
        heading: apps
        section: App limits
        help: How many kilobytes of a host's output are kept, beside the last 1000 lines.
        control: number
        min: 1
        whole: true
    apps.host_stop_seconds:
        heading: apps
        section: App limits
        help: How many seconds a host's `deactivate` is given to settle before the host is sent SIGTERM.
        control: number
        min: 1
        whole: true
    apps.scan_entries:
        heading: apps
        section: App limits
        help: How many entries per root a `workspaceContains` look and a `readDirectory` read at most.
        control: number
        min: 1
        whole: true
    apps.closed_paths:
        heading: apps
        section: Closed folders
        help: The folders, each relative to a root and applied to every root, that an app's `open({ file })` and custom editor never reach, compared by segment and without regard to letter case. A key that is missing or is not a list of folder paths closes every file.
        control: list
    status_bar.hidden:
        heading: appearance
        section: Status bar
        help: The status bar items hidden from the bar, each by the id the bar gives it. The bar's right-click menu hides an item and shows it again.
        control: list
    status_bar.quiet:
        heading: appearance
        section: Status bar
        help: Whether Do Not Disturb is on, so a notification goes into the notification list and shows no toast. The Do Not Disturb button of the notification list switches it.
        control: toggle
    status_bar.repository:
        heading: appearance
        section: Status bar
        help: The repository the reader last chose in the status bar's repository item, by the root the git channel names it with. Empty is none chosen.
        control: text
descriptions:
    reader_value:
        help: 'a value read from an answer: a path (`[]` a list, `[name=value]` the element whose field has that value), a CSS selector for html, a text with {name} holes, or a record of where it is read and the operation applied to it'
        control: text
        holds: record
        fields:
            path: the path the value is read at
            select: the CSS selector of an html answer, whose element's text is read without attr
            attr: the attribute the selector's element is read by
            value:
                help: a fixed value, a text with holes, a number or true or false
                control: scalar
            op:
                help: the operation applied to what is read
                control: choice
                options:
                    - inverted_index
                    - strip
                    - first_byte_size
                    - join
                    - date
                    - https
                    - first
                    - last
                    - match
                    - exists
                    - link
                    - split
                    - resolve
            each:
                help: the value read on each element of a list
                described_by: reader_value
            map:
                help: each value the field gives to the texts read as it, compared without case
                holds: lists
                fields:
                    key: the value the field gives
                    value:
                        help: the texts read as it
                        control: list
            kind:
                help: the checksum kind of the value
                control: choice
                options: [sha256, md5, sha1]
            else:
                help: the value read when this one reads nothing
                described_by: reader_value
            prefix: the text strip takes off, or link and https put before the value
            suffix: the text put after the value
            by: the text join and split take
            parts:
                help: the fields join reads, in order
                control: list
            pattern: the pattern match reads
            all:
                help: match gives every match as a list
                control: toggle
            link: the links row link builds the address by
            id: the field or record path link fills the row's {id} with; without it, the value read at path
            host: the host whose http address https reads as https
            markup:
                help: keep an XML element's inner markup as its text
                control: toggle
    reader_fields:
        help: the fields a record is read by, each the name its value is kept under to the value read
        fields:
            key: the field
            value:
                help: the field's value
                described_by: reader_value
    reader_records:
        help: where an answer holds its records, a path or `.` for the answer, a CSS selector for html, or a record of its path and how it is read
        control: text
        holds: record
        fields:
            path: the path of the records
            select: the CSS selector of an html answer's records
            field: the entry field whose items are the records, for a row of format none
            op:
                help: checksum_file reads a line per file of a digest and a name
                control: choice
                options: [checksum_file]
            kind:
                help: the checksum kind of the digests checksum_file reads
                control: choice
                options: [sha256, md5, sha1]
            absent:
                help: none reads a missing path as no records
                control: choice
                options: [none]
            where:
                help: the fields a record must equal to be kept
                fields:
                    key: the field
                    value: the value
            unless:
                help: the fields a record must not equal to be kept
                fields:
                    key: the field
                    value: the value
            first:
                help: keep the first record alone, and refuse an answer with none
                control: toggle
            refuse_when: a path whose value in any record refuses the answer
    reader_paging:
        help: how the answers page
        holds: record
        fields:
            kind:
                help: offset, page (numbered from first), cursor (read from the answer), next (the address the answer names) or link (the Link header's next address)
                control: choice
                options: [offset, page, cursor, next, link]
            param: the parameter the offset, the page or the cursor is sent in
            first:
                help: the number of the first page
                control: number
                min: 0
                whole: true
            size: the parameter of the page size
            sizes:
                help: the page sizes offered, the first a listing's
                control: list
                items: number
            max:
                help: the most records one page holds; a larger page is cut to it
                control: number
                min: 1
                whole: true
            total:
                help: the value of the answer's count
                described_by: reader_value
            from: the path of the answer's cursor or next address
            in:
                help: body sends the cursor in the body
                control: choice
                options: [body]
            start: the first cursor
    reader_body:
        help: the JSON body of a POST, each key to its value with holes, or to a list of them
        holds: lists
        fields:
            key: the key of the body
            value: its value
    reader_step:
        help: the follow-up requests, each with its own address, format, records and fields, and one of ids (the ids of the request before, joined by commas), for_each (one request per record) or recurse (the folders below, down to max_depth)
        sparse: true
        fields:
            address: the address asked, with holes
            format:
                help: how the answer is read
                control: choice
                options: [json, xml, html, text, none]
            method:
                help: post sends the request as a POST with the body
                control: choice
                options: [post]
            body:
                help: the JSON body of a POST
                described_by: reader_body
            params:
                help: the parameters the request is sent with
                fields:
                    key: the parameter
                    value: its value, with holes
            headers:
                help: the headers the request is sent with
                fields:
                    key: the header
                    value: its value, with holes
            paging:
                help: how the request's answers page
                described_by: reader_paging
            records:
                help: where the answer holds its records
                described_by: reader_records
            fields:
                help: the fields its records are read by
                described_by: reader_fields
            ids: the record field whose values are joined by commas into the request
            for_each: the record field whose value fills the hole of that name, one request per record
            order_by: the path in each record that holds the id it was asked for, so the records keep the order of the ids
            when:
                help: the fields a record must equal to be taken
                fields:
                    key: the field
                    value: the value
            unless:
                help: the fields a record must not equal to be taken
                fields:
                    key: the field
                    value: the value
            recurse:
                help: a request asked again with each folder record's id, down to max_depth folders
                holds: record
                fields:
                    when:
                        help: the fields a folder record equals
                        fields:
                            key: the field
                            value: the value
                    id: the field of a folder's id
                    folder: the field of a folder's name, added to the names below it
                    max_depth:
                        help: the deepest folder followed; one below it refuses the listing
                        control: number
                        min: 0
                        whole: true
            then:
                help: the requests that follow this one
                described_by: reader_step
groups:
    audit: "The conventions the audit holds the hub's projects to, each off until the hub sets it in its .oculus/config.yml: the files a project must hold, the headings a file must hold while a manifest key has a value, and the folders a project at a stage is kept under."
    website: "The website the hub's files are written into: its folder, the command run in it once the files are written, the sections of its publications and the paths of its four files."
    website.files: "The website's four files, each a path relative to its folder: its own file and the three the hub's files are written into."
    focus: The Focus board and its command center, how far ahead each kind of date is listed, when a feed or a manifest counts as stale, and which statuses count as open or sent.
    focus.refresh_stale_days: The days after which the Focus refresh strip prompts to refresh a feed, one key for each feed it prompts for.
    file_index: The file finder of the project cards, whether it runs, how many files it lists for a project and which extensions it lists.
    slurm: The Live HPC poller, the clusters it queries, how often it reads the job queue and the disk quota, how far back it reads finished jobs and whether it resolves their logs ahead of time.
    clusters: The key Account setup makes for a cluster, its type and the path it is written to.
    connections: The rows that tell a failed ssh or git connection apart, each with the words naming the failure and its fix.
    recover: Recover, the address its cluster side downloads Node.js from, and the reader rows a hub's dataset files are listed and fetched with.
    processes: The Processes view and the programs it lists beside oculus's own terminals.
    chat: The in-page chat sessions and the model they start with.
    calendar: The reads of the calendar accounts, how often they run and the window of days they read.
    mail: The reads of the inbox plate, how often they run and how many threads each of its signals takes.
    editor: The source editor, its indentation, wrapping, minimap, whitespace marks, sticky scroll, suggest panel, autosave and save clean-up, each language's own options, and the size above which a file opens as plain text.
    latex: LaTeX builds and editing, when a build runs, the recipes and tools it chains, where it writes, what follows it, SyncTeX, word counts, the formatter, the language server and the completion.
    lint: The linters run on a saved file, which ones run, where their programs are, the arguments ChkTeX takes, and the files the writing rules leave alone or let draw arrows.
    writes: Saving from a form, and how long a save waits for the server's answer.
    notes: The notes of a hub's notes folder, and how soon a note is saved after the last keystroke.
    changes: The change log of every write, and how many changes it keeps.
    files: The Files view, whether a move to the Trash asks first, and where a file's icon sits beside its sibling folders' arrows.
    git: Git in oculus, the model a suggested commit message is asked of, and how often every repository with a remote is fetched.
    deposit: The deposit of a project's code beside its GitHub repository.
    deposit.zenodo: The Zenodo deposit of the Deposit view, the address its calls go to, how long one upload is given and the token it signs in with.
    search: The Search view and the palette's file mode, how many hits and file names an answer carries, and how long one root is searched.
    literature: The Literature search, how long a source is given, how many hits a page asks of each source, how long an answer is kept, the reader rows of its sources and the order a merged paper takes its fields from them.
    literature.prefer: The order of the sources a paper found by several takes its fields, its abstract and its open PDF from.
    venues: The journal browser, the reader row a hub's venues are searched in and read from.
    open: Handing a file to a program on this machine, which extensions may be handed over and the application each opens in.
    apps: The apps, the limits on what an app's frame and host may send, store, read and hold, and the folders an app never reaches.
    status_bar: The status bar at the foot of the window, the items hidden from it, whether notifications stay quiet, and the repository its repository item shows.
