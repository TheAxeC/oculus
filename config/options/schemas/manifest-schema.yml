# ===========================================================================
# options/schemas/manifest-schema.yml
# The fields a hub adds to the project form, `manifest_fields` of schemas/manifest-schema.yml, described once. loadConfig() reads it into the merged map under `options`, named schemas/manifest-schema.yml, the entry carrying as its `default` the value schemas/manifest-schema.yml holds (oculus adds no field). The shape of an entry is the one the head of options/appearance.yml gives.
# A hub sets `manifest_fields` in its own .oculus/config.yml. Each row adds its field to the project form of that hub's projects, after oculus's fields of its section, in the hub's order, and makes it a known key of that hub's manifests. A row naming a field oculus's form has, a section the form lacks, a type the form does not draw, no field, or a field an earlier row names is a finding naming the hub's file and the row's key, and the row is left out.
# ===========================================================================

options:
    manifest_fields:
        heading: boards
        section: Project form
        help: 'The fields this hub adds to the project form of its own projects, each a key of project.yml with the words, widget and section it is drawn with.'
        fields:
            field: the key of project.yml the row adds, which no field of oculus's form holds
            label: the words the field is drawn with
            type:
                help: the widget the field is edited by
                control: choice
                options:
                    [readonly, text, textarea, lines, select, chips, tags, date, checkbox, keymap]
            section: the section of the project form the field is drawn in
            help: the help line the form shows for the field
            from: the list a select or chips field takes its choices from, as a field of manifest_schema names it
            options:
                help: the words a select or chips field offers
                control: list
            required:
                help: on makes a project.yml without the field a finding
                control: toggle

groups: {}
