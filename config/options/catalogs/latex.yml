# ===========================================================================
# options/catalogs/latex.yml
# The LaTeX editing tables of catalogs/latex.yml described once. loadConfig() reads it into the merged map under `options`, named catalogs/latex.yml, the entry carrying as its `default` the value catalogs/latex.yml holds. The shape of an entry is the one the head of options/appearance.yml gives.
# The workspace sets this catalog in its file's settings:, under the key the catalog holds in the merged config, and lays its value over oculus's by shape (src/lib/data/sources/config/merge/in-place.ts): a section the workspace names (notice, at, environments, chords, symbols) replaces oculus's section whole in oculus's place, and `<section>: null` takes one out. A finding about a value the workspace set names the workspace file and settings.latex_editing.
# ===========================================================================

options:
    latex_editing:
        heading: editor
        section: LaTeX
        help: 'What the LaTeX editing aids read, by section: the notice of the project the tables follow, the @ suggestions (at), the environments, the keys of the formatting chords (chords) and the math symbol groups the TeX view lists (symbols). A section changed here is set whole, and the sections left as oculus ships them are not written.'
        holds: record
        fields:
            notice:
                help: the notice of the project the tables follow
                control: long
            at:
                help: the @ suggestions, each typed as its prefix and inserting its body
                fields:
                    prefix: the text typed, @ and one character
                    body: the snippet inserted, with its tab stops
                    description: the words the suggestion is listed with
            environments:
                help: the environments \begin offers
                fields:
                    name: the name of the environment
                    arguments: the arguments inserted after its name, with their tab stops
            chords:
                help: the keys of the formatting chords
                holds: record
                fields:
                    text:
                        help: in text, each key and the command the chord wraps the selection in
                        fields:
                            key: the key of the chord
                            value: the command, without its backslash
                    math:
                        help: in math, each key and the command the chord wraps the selection in
                        fields:
                            key: the key of the chord
                            value: the command, without its backslash
            symbols:
                help: the math symbol groups the TeX view lists
                fields:
                    name: the name of the group
                    items:
                        help: the symbols of the group
                        fields:
                            name: the name of the symbol
                            source: the LaTeX the symbol is drawn from
                            insert: the text inserted
                            keywords: the words a search finds the symbol by

groups: {}
