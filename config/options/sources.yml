# ===========================================================================
# options/sources.yml
# Every option of defaults/sources.yml described once, in the shape the head of options/appearance.yml describes. sources.yml has no dotted options, so `groups:` is empty. loadConfig() reads it into the merged map's `options` and `option_groups` under sources.yml.
# ===========================================================================

options:
    portfolio_deck:
        heading: sources
        section: Portfolio deck
        help: The folder, relative to the hub, of the portfolio deck, the deck the Present view opens when a pane names none. It holds a present.yml and the Markdown slide files. A folder that is not there leaves the Present view with nothing to draw and says so.
        control: folder
    scan:
        heading: sources
        section: Project scan
        help: Where to find projects, with paths relative to the hub. A project is any folder that holds a project.yml, at any depth under the rule's dir; the walk stops at a project and does not enter a dot folder, node_modules or a symbolic link, and a project's tier and stage are the manifest's own tier and stage lines, not the folder's. A rule with no dir is a finding, so is a key other than dir and optional, and a folder that is not there is a finding unless the rule is optional.
        fields:
            dir:
                help: the folder scanned, relative to the hub
                control: folder
                allow_missing: optional
            optional:
                help: true when a hub without the folder reports nothing
                control: toggle
    new_project_dir:
        heading: sources
        section: Project scan
        help: The folder a new project is made in, for each tier. The New project form of a board offers it in its Folder field, and an app's new-project write with no folder uses it. A folder must be a scan folder or lie under one, so the project is read once made; an entry for a word that is not a tier, or one that names a folder outside the scan, is a finding. A tier with no entry has no folder to offer and its form asks for one. This is a setting of the hub kept in the hub's .oculus/config.yml; the engine's map is empty.
        fields:
            key:
                help: the tier the folder is for, a word of tiers in vocab.yml
                control: choice
                from: tiers
            value:
                help: the folder new projects of the tier are made in, relative to the hub
                control: folder
                allow_missing: optional
    languages:
        heading: editor
        section: File languages
        help: "The language each file opens in, for its colours, its comment keys and the status bar. A file's language is the first match of its whole name lowercased, then of its extension lowercased, so a file called CMakeLists.txt is CMake before its .txt is read; a file no entry matches opens as plain text, a dotfile such as .bashrc included, since it has no extension. A language the editor does not colour is refused, and so is an entry that is not an extension with its dot or a file name without a slash; two languages that claim one ending keep the first in the file. A workspace file's settings: overrides the endings of a language, adds a language, and takes one of oculus's out with <language>: null."
        holds: lists
        fields:
            key:
                help: the language's name as the editor and the status bar show it
                control: choice
                from: languages
            value:
                help: the extensions (with their dot) and whole file names of that language
                control: list
    collections:
        heading: sources
        section: Collections
        help: "The hub's record files, each from one YAML file. An entry needs a key and a file, and two entries with one key are a finding, the first file being the one read. An entry's registry says which registry or feed its file is, and its flags which features read it, so the key is the hub's own word: a registry or feed no entry names is read from oculus's entry of it, and one an entry names whose file is not there is a finding. The files of the datasets, venues, pillars, domains, leads and radar registries are drawn by the Data, Venues, Pillars, Domains, Position Leads and Lit Watch views; every other entry also becomes a collection view, a generic card list, placed by its group and order and named by its label and glyph. A domain's card colour, its label and whether it expects a dataset are its entry's color, title and expects_datasets in the domains registry, and the theme words are the options of the themes field of the venues and datasets registries. An entry of a file is found by its primary key, the one field of the file's schema flagged primary_key: true, or for a file with no schema the field its entry names as primary_key; a file with neither, or with both, is a finding, and its entries are drawn but take no edit, Add or remove."
        fields:
            key: the collection's key, which the view uses and a schema field's foreign_key names the collection by
            primary_key:
                help: the field an entry of a file with no schema is found by, such as title for a leads file a scout writes; beside a schema that flags its own primary key it is a finding and the file's writes are refused
                control: text
            file:
                help: the YAML file of the collection, relative to the hub
                control: file
            registry:
                help: 'the registry or feed the file is: datasets, venues, pillars, domains, funding, people, organisations, resources, literature, leads or radar; one word on two entries is a finding and the first is the registry'
                control: choice
                options:
                    [
                        datasets,
                        venues,
                        pillars,
                        domains,
                        funding,
                        people,
                        organisations,
                        resources,
                        literature,
                        leads,
                        radar
                    ]
            band_positions:
                help: the Focus band's positions column stacks the file's entries by the stages of position_stages
                control: toggle
            band_teaching:
                help: the Focus band's teaching column stacks the file's entries by the stages of teaching_stages
                control: toggle
            awaiting:
                help: the Awaiting box lists the file's entries whose status carries deadline_met
                control: toggle
            open_badge:
                help: the file's view counts its entries a stage of position_stages holds and draws them as a green badge
                control: toggle
            lead_applications:
                help: a lead's applied press writes the application into this file; on two entries the first is read
                control: toggle
            dissemination:
                help: Disseminated in on a project card lists the file's entries that name the project
                control: toggle
            dissemination_skip:
                help: 'the entries Disseminated in leaves out: an entry is left out when each field this names holds its value or one of its values, such as { role: attend }'
                holds: lists
                fields:
                    key: the field of the file's entries
                    value: the value the field holds, or one of a list of values
            tasks:
                help: Add Task, Start Agent on a task card, the task hub list and the task lines read this file; on two entries the first is read
                control: toggle
            sort:
                help: "the fields of the file's schema the cards of the file's card list are sorted by, in their order, after the pinned cards come first: the status field in the order of its options, a date field oldest first, a period field newest first, any other field alphabetically, a missing value last, then the file's order; a field the schema does not name is a finding; with none the cards go by their title"
                control: list
            ticker:
                help: 'the lines of the file: its dated entries in the command center, and every line of the file flagged tasks in the Tasks section; with none the file gives no lines'
                holds: record
                fields:
                    category:
                        help: the word of ticker_categories the lines carry, which decides their command center group, glyph and words; the lines of the file flagged tasks are Tasks lines and take only their glyph from it
                        control: choice
                        from: ticker_categories
                    undated:
                        help: an entry of the file with no date is a task line
                        control: toggle
            group:
                help: the group of the view catalogue the file's view sits in, a rail page or a nav_groups key
                control: choice
                from: catalogue_groups
            order:
                help: the place of the file's view in its group
                control: number
                whole: true
            label:
                help: the dotted key of the text-catalog word the file's view is named by; with none, the file's title
                control: text
            glyph:
                help: the dotted key of the text-catalog word holding the glyph the file's view draws
                control: text
            about:
                help: the dotted key of the text-catalog word of the file's line in Make Folder a Hub
                control: text
    chat_context:
        heading: sources
        section: Collections
        help: The keys of the hub's collections list whose files the index of a portfolio chat and of a project chat holds for this hub, in this order, after the hub's project manifests. A word that names no key of the hub's collections list adds nothing.
        control: multi
        from: collections
    feed_registries:
        heading: sources
        section: Collections
        help: The registry words of the hub's collections list whose files are feeds, each read by its feed view and no collection. leads is the Position Leads view's feed and radar the Lit Watch view's, the only two feeds oculus draws; a registry the list leaves out is read as a collection. A word that is neither is a finding and is not read; a word given twice is a finding and is read once; a value that is no list of words is a finding and the default, no feed, is read in its place. This is a setting of the hub, kept in its .oculus/config.yml.
        control: multi
        options: [leads, radar]
    leads_run_word:
        heading: sources
        section: Collections
        help: The word a line of the leads feed's meta.log holds after its leading date when the line records a run of the position scout, such as scout, matched in any case. The newest such date is the scout's last run, which the update tray and the Focus board show. Empty reads no run, so the scout has no last run and the Focus board's refresh strip leaves it out. This is a setting of the hub, kept in its .oculus/config.yml.
        control: text
        empty: true
    update_tasks:
        heading: sources
        section: Update tasks
        help: The update tasks the update tray offers for this hub, in the tray's order. A row's task names its file, .oculus/tasks/<task>.md, and the row is offered while the hub holds that file; its label and note are what the tray's row shows, its view is the view a notice of its run opens, and last_run says where the tray reads its last run from. A row with an empty label, note or view, a view no view of oculus's has, a last_run outside the four, or a task that is empty, repeats an earlier row's or is not lowercase letters, digits and dashes starting with a letter, is a finding and is not offered; a value that is no list is a finding and the default, no task, is read in its place. This is a setting of the hub, kept in its .oculus/config.yml; a change reaches the tray at once.
        fields:
            task:
                help: the name of the task's file under .oculus/tasks/, without .md
                control: text
                form: task_name
            label:
                help: the words of the task's row in the tray
                control: text
            note:
                help: the line under the task's label in the tray
                control: text
            view:
                help: the view a notice of the task's run opens
                control: choice
                from: views
            last_run:
                help: "where the tray reads the task's last run from: radar (the hub's radar feed), scout (its leads feed), linkedin (the last post of its LinkedIn folder) or inbox (the machine's inbox notes); a row without it shows no last run"
                control: choice
                options: [radar, scout, linkedin, inbox]
                empty: true
    project_docs:
        heading: sources
        section: Project scan
        help: The documents a project card marks a project for, in the card's order, each a file inside the project folder and the short label the card shows for it. A row whose file is empty, absolute or holds .., whose label is empty, or whose file or label repeats an earlier row's is a finding and is not read; a value that is no list is a finding and the shipped rows are read in its place. New project writes its README under the name of the first .md row that sits in the project folder itself, and no README when no row does. This is a setting of the hub, kept in its .oculus/config.yml.
        fields:
            name:
                help: the document's path inside the project folder, written relative to it
                control: text
                form: inner_path
            label:
                help: the short label the project card shows for the document
                control: text
    code_dir:
        heading: sources
        section: Project scan
        help: The folder of a project that holds its code, written relative to the project folder. The deposit mirrors it, an HPC submit sends a job's code from it, a project chat is told to read it, and the project card draws its deposit control for a project whose folder holds it. Inside it the portfolio's audit reads only the documents of project_docs and the files the hub's audit setting requires, and a change to any other file in it rebuilds nothing. This is a setting of the hub, kept in its .oculus/config.yml.
        control: text
        form: inner_path
    deck_dir:
        heading: sources
        section: Project scan
        help: The folder of a project that holds its deck, written relative to the project folder; the Present view and the portfolio read the project's slides from the present.yml in it. This is a setting of the hub, kept in its .oculus/config.yml.
        control: text
        form: inner_path
    linkedin_dir:
        heading: sources
        section: Registry and feed files
        help: The folder of the LinkedIn posts pipeline on the website, where a numbered file is posted and a file whose name starts with linkedin_idea_prefix is an idea. Empty names no folder, and the LinkedIn view says so. This is a setting of the hub, kept in the hub's .oculus/config.yml.
        control: folder
        empty: true
    linkedin_idea_prefix:
        heading: sources
        section: Registry and feed files
        help: The start of a file name in the LinkedIn folder that marks the file as an idea not yet posted, such as xx-. The LinkedIn view's new idea is written under it, and Mark posted renames such a file to the next number with the rest of its name kept. Empty marks no file as an idea, and a new idea is refused. This is a setting of the hub, kept in the hub's .oculus/config.yml.
        control: text
        form: file_name
        empty: true
    career_file:
        heading: sources
        section: Registry and feed files
        help: "The career file: the goal, the next milestone with its day and the order of work, and the positions, degrees, awards, references and employer CV profiles the website's CV is written from, all shown in the Career view and edited in its editor. The per-scheme statements surface on the Funding tab."
        control: file
    memories_dir:
        heading: sources
        section: Folders
        help: The folder of this hub's photo wall, relative to the hub and inside it. Every .jpg, .jpeg, .png and .webp in it is a tile of the Memories view, and the view's add control puts new pictures in the primary hub's folder, else in the first hub's when the workspace has no primary. A value outside the hub is a finding and the standard folder is used. This is a setting of the hub, kept in its .oculus/config.yml.
        control: folder
        allow_missing: true
    wallpaper_dir:
        heading: sources
        section: Folders
        help: The folder of this hub's wallpaper images, relative to the hub and inside it. The wallpaper.image key names one of them as the hub's name and the file's name joined by a slash, and the picker in the Settings view lists every hub's folder. A value outside the hub is a finding and the standard folder is used. This is a setting of the hub, kept in its .oculus/config.yml.
        control: folder
        allow_missing: true
    secrets_dir:
        heading: sources
        section: Folders
        help: The folder of this hub that holds its secrets, such as tokens and keys, written relative to the hub. No file in it is given to a language server or changed by one, no app reaches it, no library file is looked for in it and the writing rules never fix a file in it. Empty names no such folder. This is a setting of the hub, kept in its .oculus/config.yml.
        control: text
        form: inner_path
        empty: true
    notes_dir:
        heading: sources
        section: Folders
        help: The folder of this hub that holds its notes, written relative to the hub. Every .md file in it or in a folder under it is a note of the Notes section, read for Backlinks, Tags and the Notes Graph; its order.json keeps the order of the notes and its attachments folder what is pasted into one. A search reads it even inside a folder whose name starts with a dot. Oculus ships .oculus/notes. This is a setting of the hub, kept in its .oculus/config.yml.
        control: text
        form: inner_path
    bookmarks:
        heading: sources
        section: Saved files
        help: Where the reader's own bookmarks live. A value of ~ or one starting with ~/ is under the home folder, an absolute value is used as it is, and any other value is resolved against the primary hub's folder. This is a setting of the hub, read from the primary hub's .oculus/config.yml; a change is read again at once.
        control: text
    schedules:
        heading: sources
        section: Saved files
        help: Where the schedules live, the entries the update tray's Schedules section lists and a reader may write by hand. A value of ~ or one starting with ~/ is under the home folder, an absolute value is used as it is, and any other value is resolved against the primary hub's folder. This is a setting of the hub, read from the primary hub's .oculus/config.yml; a change is read again at once.
        control: text
    apps_dir:
        heading: apps
        section: Apps folder
        help: Where the machine's apps live, one folder of web files per app. The hub's owner writes the shipped folder, and a git pull into the hub writes it too; an app kept approved stays approved through a change to any of its files but app.yml, a pulled change included, while the server runs. A value of ~ or one starting with ~/ is under the home folder, an absolute value is used as it is, and any other value is resolved against the primary hub's folder. This is a setting of the hub, read from the primary hub's .oculus/config.yml; a change is read again at once.
        control: text
    repository_scan_depth:
        heading: sources
        section: Folders
        help: How many folder levels below each folder of the open workspace the Repositories view looks for repositories, so a folder of clones lists each clone. 0 lists only the folders themselves. A change is read again at once.
        control: number
        min: 0
        max: 3
        whole: true
groups: {}
