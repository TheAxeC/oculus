# The line icon each glyph name is drawn as. One row per name in the `glyphs:` map of config/glyphs.yml.

# A value is a file name in the icon package, `<name>.svg` under lucide-static/icons, and the server
# refuses a row that names no such file. The vocabulary and this map are checked against each other
# at config load, so a glyph name added there without a row here is reported rather than drawn blank.
# The ASCII stand-ins of config/glyphs.yml are what a terminal theme draws instead; nothing here.
icons:
    # controls + actions
    refresh: refresh-cw
    biennial: repeat
    expand: plus-circle
    collapse: minus-circle
    darkmode: contrast
    theme_base: sun-moon
    theme_rice: square-terminal
    crt: scan-line
    wallpaper: image
    unicode: type
    launch: external-link
    copy: copy
    goto: corner-down-right
    note_back: undo-2
    current_month: calendar-check
    spark_blocks: chart-column
    arrow_to: arrow-right
    bullet: dot
    edit: pencil
    star: star
    draft: pen-line
    chat: message-square
    clear: eraser
    dismiss: x
    cmd: command
    cards: layout-grid
    list: list
    disclosure: chevron-down
    now: play
    # status + markers
    check: check
    done: check-circle
    fail: x
    cross: x-circle
    bang: alert-circle
    warn: alert-triangle
    overdue: ban
    attention: alert-octagon
    flag: flag
    pin: pin
    lock: lock
    question: help-circle
    reply: reply
    info: info
    # tab / section icons
    focus: target
    data: database
    venue: diamond
    funding: banknote
    pillar: layers
    code: code
    changes: git-branch
    repositories: folder-git-2
    diff: file-diff
    published: package
    archived: archive
    litwatch: telescope
    scout: graduation-cap
    audit: search
    teaching: school
    followup: bell
    paper: file-text
    events: calendar
    calendar: calendar-days
    collab: handshake
    agents: bot
    hpc: server
    terminal: terminal
    detail: clipboard-list
    compass: compass
    editor: square-pen
    settings: settings
    note: sticky-note
    live: zap
    inbox: inbox
    memories: images
    linkedin: pen-tool
    coin: coins
    author: user
    folder: folder
    link: link
    journals: newspaper
    conference: mic
    book: book
    page: file
    poster: presentation
    section: section
    applications: files
    venue_dist: library
    refresh_live: refresh-ccw
    # state dots / shapes
    grip: grip-vertical
    active: map-pin
    idea: lightbulb
    stale: hourglass
    deadline: alarm-clock
    timing: timer
    spark: sparkles
    circle_empty: circle
    circle_filled: circle-dot
    square_filled: square
    # radar / status colours - a line icon carries shape and not colour, so a coloured dot is a
    # circle and the hue comes from the tone the chip around it already paints.
    red: circle
    purple: circle
    green: circle
    brown: circle
    yellow: circle
    blue: circle
    orange: circle
    white: circle
    black: circle
    orange_square: square
    green_square: square
    cross_box: square-x
    trash: trash-2
    fire: flame
    checkbox_on: square-check
    checkbox_off: square
    email: mail
    tasks: list-checks
    snooze: moon
    sent: send
    writing: signature
    x_mark: x
    # the three things a terminal pane runs
    terminal_claude: sparkle
    terminal_codex: diamond
    terminal_shell: terminal
