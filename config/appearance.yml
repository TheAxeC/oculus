# ===========================================================================
# appearance.yml
# oculus's own configuration - what the chrome looks like: the UI theme picker's list, the wallpaper
# behind the panels, the CRT overlay's default, and the terminal grid's text size. Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# The UI themes, in picker order. `name` is what the appearance store saves and what `themes.css`
# is written against; `class` is the string that lands on <body> (empty = the default light chrome);
# `label` is the words the picker shows, glyph and all - this file is config, so the glyph is data.
# A name here needs a block in src/lib/themes/themes.css unless it is light or dark, which :root and
# the .dark block already carry. The contrast gate walks this list, so a new theme is measured the
# moment it is added.
themes:
  - { name: light,        class: "",                   label: "◐ light" }
  - { name: dark,         class: "dark",               label: "◐ dark" }
  - { name: vscode-dark-modern,  class: "vscode-dark-modern",  label: "vscode dark modern" }
  - { name: vscode-light-modern, class: "vscode-light-modern", label: "vscode light modern" }
  - { name: mocha,        class: "rice mocha",         label: "◆ mocha" }
  - { name: gruvbox,      class: "rice gruvbox",       label: "◆ gruvbox" }
  - { name: nord,         class: "rice nord",          label: "◆ nord" }
  - { name: synthwave,    class: "rice synthwave",     label: "◆ synthwave '84" }
  - { name: tokyoneon,    class: "rice tokyoneon",     label: "◆ tokyo neon" }
  - { name: tokyonight,   class: "rice tokyonight",    label: "◆ tokyo night" }
  - { name: rosepine,     class: "rice rosepine",      label: "◆ rose pine" }
  - { name: everforest,   class: "rice everforest",    label: "◆ everforest" }
  - { name: dracula,      class: "rice dracula",       label: "◆ dracula" }
  - { name: kanagawa,     class: "rice kanagawa",      label: "◆ kanagawa" }
  - { name: solarized,    class: "rice solarized",     label: "◆ solarized" }
  - { name: latte,        class: "rice latte",         label: "◆ latte (light)" }
  - { name: gruvboxlight, class: "rice gruvboxlight",  label: "◆ gruvbox light" }


# === Terminal ===============================================================
# The terminal grid paints its own text and cannot inherit the page's size. `font_px` is CSS pixels; leave the key out to follow the theme's `--fs-md` token instead.
terminal:
  font_px: 12.5


# === Wallpaper ==============================================================
# The images live in `tools/cockpit/assets/wallpaper/` (in the repo, so the tool is self-contained).
# No image there = no backdrop, and none of these settings apply. `dir:` is read relative to the hub
# and can point elsewhere inside it; the default keeps everything in the repo. /api/wallpaper serves
# the chosen file's own bytes, so there is no downscale step and no size setting.
wallpaper:
  file: "wallhaven-83"       # name the image to use (full name or any unique part of it). Empty = use `pick:` below
  pick: first    # `first` = the first image in the folder | `random` = a different one each build
  dim: 0.72      # 0 = raw image, 1 = fully hidden. Busy images want 0.7-0.85
  blur: 0        # px of blur on the IMAGE itself. 0 = sharp; raise it only if the picture is busy
  themes: rice   # `rice` = terminal themes only | `all` = light and dark too
  panel_opacity: 0.76   # how solid the windows stay over the image (1 = opaque, 0.8 = see-through)
  popover_opacity: 0.97  # dropdowns (Collections / More / theme) - they float OVER a panel, so at
                           # `panel_opacity` you read them through two translucent layers. Unset =
                           # three quarters of the way from `panel_opacity` to solid.
  panel_blur: 2         # px of backdrop blur behind each window (keeps text crisp without smearing the image)


# The CRT overlay (scanlines and vignette, cosmetic only): what a browser that has never been told
# otherwise starts on. The rail's toggle writes the viewer's own choice into the appearance store.
crt:
  default: false
