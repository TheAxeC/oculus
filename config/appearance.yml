# ===========================================================================
# appearance.yml
# oculus's own configuration - what the chrome looks like: the UI theme picker's list, the wallpaper
# behind the panels, the CRT overlay's default, the code theme of the editors, and the terminal grid's text size, cursor and Option key. Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# The UI themes in picker order. `name` is saved, `class` lands on <body>, `glyph` is the glyph name drawn before the words, and `label` is the words shown.
themes:
  - { name: light,        class: "",                   glyph: theme_base, label: "light" }
  - { name: dark,         class: "dark",               glyph: theme_base, label: "dark" }
  - { name: vscode-dark-modern,  class: "vscode-dark-modern",  glyph: theme_base, label: "vscode dark modern" }
  - { name: vscode-light-modern, class: "vscode-light-modern", glyph: theme_base, label: "vscode light modern" }
  - { name: vscode-light-2026, class: "vscode-light-2026", glyph: theme_base, label: "vscode light 2026" }
  - { name: vscode-light-plus, class: "vscode-light-plus", glyph: theme_base, label: "vscode light+" }
  - { name: vscode-light-visual-studio, class: "vscode-light-visual-studio", glyph: theme_base, label: "vscode light (visual studio)" }
  - { name: vscode-quiet-light, class: "vscode-quiet-light", glyph: theme_base, label: "vscode quiet light" }
  - { name: vscode-solarized-light, class: "vscode-solarized-light", glyph: theme_base, label: "vscode solarized light" }
  - { name: vscode-abyss, class: "vscode-abyss", glyph: theme_base, label: "vscode abyss" }
  - { name: vscode-dark-2026, class: "vscode-dark-2026", glyph: theme_base, label: "vscode dark 2026" }
  - { name: vscode-dark-plus, class: "vscode-dark-plus", glyph: theme_base, label: "vscode dark+" }
  - { name: vscode-dark-visual-studio, class: "vscode-dark-visual-studio", glyph: theme_base, label: "vscode dark (visual studio)" }
  - { name: vscode-kimbie-dark, class: "vscode-kimbie-dark", glyph: theme_base, label: "vscode kimbie dark" }
  - { name: vscode-monokai, class: "vscode-monokai", glyph: theme_base, label: "vscode monokai" }
  - { name: vscode-monokai-dimmed, class: "vscode-monokai-dimmed", glyph: theme_base, label: "vscode monokai dimmed" }
  - { name: vscode-red, class: "vscode-red", glyph: theme_base, label: "vscode red" }
  - { name: vscode-solarized-dark, class: "vscode-solarized-dark", glyph: theme_base, label: "vscode solarized dark" }
  - { name: vscode-tomorrow-night-blue, class: "vscode-tomorrow-night-blue", glyph: theme_base, label: "vscode tomorrow night blue" }
  - { name: vscode-dark-high-contrast, class: "vscode-dark-high-contrast", glyph: theme_base, label: "vscode dark high contrast" }
  - { name: vscode-light-high-contrast, class: "vscode-light-high-contrast", glyph: theme_base, label: "vscode light high contrast" }
  - { name: mocha,        class: "rice mocha",         glyph: theme_rice, label: "mocha" }
  - { name: gruvbox,      class: "rice gruvbox",       glyph: theme_rice, label: "gruvbox" }
  - { name: nord,         class: "rice nord",          glyph: theme_rice, label: "nord" }
  - { name: synthwave,    class: "rice synthwave",     glyph: theme_rice, label: "synthwave '84" }
  - { name: tokyoneon,    class: "rice tokyoneon",     glyph: theme_rice, label: "tokyo neon" }
  - { name: tokyonight,   class: "rice tokyonight",    glyph: theme_rice, label: "tokyo night" }
  - { name: rosepine,     class: "rice rosepine",      glyph: theme_rice, label: "rose pine" }
  - { name: everforest,   class: "rice everforest",    glyph: theme_rice, label: "everforest" }
  - { name: dracula,      class: "rice dracula",       glyph: theme_rice, label: "dracula" }
  - { name: kanagawa,     class: "rice kanagawa",      glyph: theme_rice, label: "kanagawa" }
  - { name: solarized,    class: "rice solarized",     glyph: theme_rice, label: "solarized" }
  - { name: latte,        class: "rice latte",         glyph: theme_rice, label: "latte (light)" }
  - { name: gruvboxlight, class: "rice gruvboxlight",  glyph: theme_rice, label: "gruvbox light" }


# === Terminal ===============================================================
# The terminal grid paints its own text and cannot inherit the page's size. `font_px` is CSS pixels; leave the key out to follow the theme's `--fs-md` token instead.
terminal:
  font_px: 12.5
  mac_option_is_meta: false   # true makes Option send Meta on macOS, so Option+B and Option+F move by word; false types the characters Option makes
  copy_on_selection: false    # true copies a selection to the clipboard as soon as it is made
  cursor_style: block         # block | line | underline (line is a thin bar)
  cursor_blinking: false      # true makes the cursor blink


# === Wallpaper ==============================================================
# `dir` is relative to the hub and must remain inside it. No image means no backdrop.
wallpaper:
  dir: tools/oculus/assets/wallpaper
  file: "wallhaven-83"       # name the image to use (full name or any unique part of it). Empty = use `pick:` below
  pick: first    # `first` = the first image in the folder | `random` = a different one each build
  dim: 0.72      # 0 = raw image, 1 = fully hidden. Busy images want 0.7-0.85
  blur: 0        # px of blur on the IMAGE itself. 0 = sharp; raise it only if the picture is busy
  themes: rice   # `rice` = terminal themes only | `all` = light and dark too
  panel_opacity: 0.76   # how solid the windows stay over the image (1 = opaque, 0.8 = see-through)
  popover_opacity: 0.97  # dropdowns (Collections / More / theme) - they float OVER a panel, so at
                           # `panel_opacity` you read them through two translucent layers. Unset =
                           # three quarters of the way from `panel_opacity` to solid.
  panel_blur: 2         # px of backdrop blur behind each window (keeps text crisp without smearing the image)


# === Memories ===============================================================
# The photo wall's folder, the same shape as `wallpaper:` above: `dir` is relative to the hub and must remain inside it. Every .jpg / .jpeg / .png / .webp in it is a tile, and the wall's own control adds one.
memories:
  dir: tools/oculus/assets/memories


# The CRT overlay (scanlines and vignette, cosmetic only): what a browser that has never been told
# otherwise starts on. The CRT row under This browser in the Settings view writes the viewer's own
# choice into the appearance store, and the `crt.default` row of this file sets the value below.
crt:
  default: false


# === Code theme =============================================================
# How the editors colour code. `tokens` takes the syntax colours from the UI theme's own code tokens. The class name of any of the 19 VS Code themes (such as `vscode-dark-2026`, `vscode-light-modern`) takes that theme's TextMate rules under any UI theme, and any id of Shiki's bundled themes (such as `dark-plus`, `github-light`, `nord`) takes that theme's syntax colours; in both the editor's background and chrome stay on the UI theme. The Code theme row under This browser in the Settings view writes the viewer's own choice into the appearance store, as its CRT row does, and the `code_theme` row of this file sets the value below.
code_theme: tokens


# === Pane strip =============================================================
# What the top row of every pane draws, as VS Code's workbench.editor.showTabs and workbench.editor.editorActionsLocation do. The strip menu's Tab Bar and Editor Actions Position submenus write these two keys.
# `multiple` draws every tab, `single` draws the active tab alone, `none` draws no tab and leaves a title row that holds the actions.
show_tabs: multiple
# `strip` draws Split Right and the `...` pane menu at the right of the row, `hidden` draws neither (the pane menu stays reachable by a right click on the strip or on an empty pane).
editor_actions: strip
# `true` wraps the tabs of a pane onto more rows instead of scrolling the one row; it applies only while `show_tabs` is `multiple`, as VS Code's workbench.editor.wrapTabs.
wrap_tabs: false
