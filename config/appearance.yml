# ===========================================================================
# appearance.yml
# oculus's own configuration - what the chrome looks like: the UI theme picker's list, the wallpaper
# behind the panels, the CRT overlay's default, and the terminal grid's text size. Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# The UI themes in picker order. `name` is saved, `class` lands on <body>, and `label` is shown.
themes:
  - { name: light,        class: "",                   label: "{G.theme_base} light" }
  - { name: dark,         class: "dark",               label: "{G.theme_base} dark" }
  - { name: vscode-dark-modern,  class: "vscode-dark-modern",  label: "{G.theme_base} vscode dark modern" }
  - { name: vscode-light-modern, class: "vscode-light-modern", label: "{G.theme_base} vscode light modern" }
  - { name: mocha,        class: "rice mocha",         label: "{G.theme_rice} mocha" }
  - { name: gruvbox,      class: "rice gruvbox",       label: "{G.theme_rice} gruvbox" }
  - { name: nord,         class: "rice nord",          label: "{G.theme_rice} nord" }
  - { name: synthwave,    class: "rice synthwave",     label: "{G.theme_rice} synthwave '84" }
  - { name: tokyoneon,    class: "rice tokyoneon",     label: "{G.theme_rice} tokyo neon" }
  - { name: tokyonight,   class: "rice tokyonight",    label: "{G.theme_rice} tokyo night" }
  - { name: rosepine,     class: "rice rosepine",      label: "{G.theme_rice} rose pine" }
  - { name: everforest,   class: "rice everforest",    label: "{G.theme_rice} everforest" }
  - { name: dracula,      class: "rice dracula",       label: "{G.theme_rice} dracula" }
  - { name: kanagawa,     class: "rice kanagawa",      label: "{G.theme_rice} kanagawa" }
  - { name: solarized,    class: "rice solarized",     label: "{G.theme_rice} solarized" }
  - { name: latte,        class: "rice latte",         label: "{G.theme_rice} latte (light)" }
  - { name: gruvboxlight, class: "rice gruvboxlight",  label: "{G.theme_rice} gruvbox light" }


# === Terminal ===============================================================
# The terminal grid paints its own text and cannot inherit the page's size. `font_px` is CSS pixels; leave the key out to follow the theme's `--fs-md` token instead.
terminal:
  font_px: 12.5


# === Wallpaper ==============================================================
# `dir` is relative to the hub and must remain inside it. No image means no backdrop.
wallpaper:
  dir: tools/oculus/assets/wallpaper
  file: "wallhaven-83"       # name the image to use (full name or any unique part of it). Empty = use `pick:` below
  pick: first    # `first` = the first image in the folder | `random` = a different one each build
  dim: 0.72      # 0 = raw image, 1 = fully hidden. Busy images want 0.7-0.85
  blur: 0        # px of blur on the IMAGE itself. 0 = sharp; raise it only if the picture is busy
  themes: rice   # `rice` = terminal themes only | `all` = light and dark too
  panel_opacity: 0.76   # how solid the windows stay over the image (1 = opaque, 0.8 = see-through)
  popover_opacity: 0.97  # dropdowns (Collections / More / theme) - they float OVER a panel, so at
                           # `panel_opacity` you read them through two translucent layers. Unset =
                           # three quarters of the way from `panel_opacity` to solid.
  panel_blur: 2         # px of backdrop blur behind each window (keeps text crisp without smearing the image)


# === Memories ===============================================================
# The photo wall's folder, the same shape as `wallpaper:` above: `dir` is relative to the hub and must remain inside it. Every .jpg / .jpeg / .png / .webp in it is a tile, and the wall's own control adds one.
memories:
  dir: tools/oculus/assets/memories


# The CRT overlay (scanlines and vignette, cosmetic only): what a browser that has never been told
# otherwise starts on. The Settings view's CRT toggle writes the viewer's own choice into the
# appearance store.
crt:
  default: false
