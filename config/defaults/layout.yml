# ===========================================================================
# layout.yml
# oculus's shipped arrangement of things: the rail's pages and what each page starts as, the view catalogue's groups, the project boards, the views that draw a count, and which title a surface draws.
# loadConfig() merges it with the other files of config/defaults/; a workspace file's `settings:` sets a key over the value here, and the options of config/options/layout.yml describe every key. Nothing writes this file.
# ===========================================================================


# The rail: one button per page, drawn in this order, the digits 1 to 9 showing the first nine. `label` is the button's words, `glyph` a name in config/catalogs/glyphs.yml, and `page` a key of `arrangements:` below, which is what the page is first made from and what the saved page stays tied to, so a button renamed keeps its page. A page key named twice, or naming no arrangement, draws no second button and is a finding. Each page is also a group of the view catalogue, which lists the page's views and documents under the button's `label`, so a button renamed renames its group: `chord` is the group's one-letter keyboard prefix, the letter then a digit for the entry's place in the group, its views first and its documents after them, and `group_glyph` the glyph of the group's heading, one no view of the group carries, so the heading does not read as one of its entries. A page with no `chord` is counted under `direct_chord`, and one with no `group_glyph` takes the glyph of its first view; a chord that is not one lowercase letter, or a group glyph glyphs.yml does not hold, is a finding and is not used. The Settings view edits this list.
rail:
  - { label: "Focus", glyph: compass, page: focus, chord: f, group_glyph: focus }
  - { label: "Projects", glyph: paper, page: projects, chord: p, group_glyph: paper }
  - { label: "Incoming", glyph: email, page: incoming, chord: e, group_glyph: email }
  - { label: "Sessions", glyph: live, page: sessions, chord: m, group_glyph: live }
  - { label: "Explorer", glyph: folder, page: explorer, chord: s, group_glyph: folder }
  - { label: "Academic Life", glyph: scout, page: academic, chord: c, group_glyph: scout }
  - { label: "Pillars", glyph: pillar, page: pillars, chord: l, group_glyph: book }
  - { label: "Registries", glyph: venue, page: registries, chord: r, group_glyph: venue_dist }
  - { label: "Literature", glyph: journals, page: literature, chord: b, group_glyph: journals }
  - { label: "Present", glyph: poster, page: present, chord: t, group_glyph: conference }
  - { label: "Apps", glyph: app, page: apps, chord: a, group_glyph: app }
  - { label: "Help", glyph: question, page: help, chord: h, group_glyph: page }
  - { label: "System", glyph: sliders, page: views, chord: y, group_glyph: settings }


# The view catalogue's groups that are no rail page, listed after the groups of the rail pages: the float of `floats:` below, so the catalogue lists the float's views under Float. A view names its group and position in its registration, a document of `docs:` below names its group (a rail page or a key here), and a document of oculus's own folder that a page's arrangement shows as a tab is listed in that page's group by the label the tab carries, after the group's views and before its `docs:` documents. A group with no registered views is not listed. `glyph` and `chord` are as a rail entry's `group_glyph` and `chord`.
nav_groups:
  float: { label: "Float", glyph: split_right, chord: w }


# The one-letter prefix that reaches, by number, the views of the catalogue's groups that name no `chord` and the views no group holds: the letter, then a digit for the view's place among them. A value that is not one lowercase letter means no such prefix, and those views are reached from the catalogue alone.
direct_chord: v


# What each rail page is first made from, by the key its `rail:` entry names, and what Reset gives it back. After that first press the page is the one the reader arranged, kept in the saved layout. An arrangement carries `root`, the page's one tree. A node is `{ kind: split, dir, sizes, children }` or `{ kind: pane, view }`, where `view` is one view id or a list of them (the tabs of that pane), and a tab of the list may be `{ view, state }` to open it in a state of its own, as the sessions page's Files tab follows the selected session with `state: { follow: true }`. A tab written `{ view, pinned: true }` or `{ view, state, pinned: true }` starts pinned: it comes first in its pane, draws a pin where its close control is, and Close All, Close Others and Cmd+W leave it open; every tab of the shipped arrangements is pinned, so a stray press does not close the tabs a page starts with. A `pinned:` of any other value makes the arrangement not add up. `view: []` is an empty pane, the one a view opened for something (a project, a document, a file) lands in. It is the layout tree with the instance ids left out, since those are minted fresh when the page is made. An arrangement that does not add up makes no page. A document of `docs:` whose `group` is the page's key is added to the page when it is made, as a pinned `doc` tab after the first tab of the page's first pane, and a page already saved is given each such document it lacks, once, pinned with the pane's pinned tabs.
arrangements:
  focus:
    root:
      kind: pane
      view:
        - { view: focus, pinned: true }
  sessions:
    root:
      kind: split
      dir: row
      sizes: [0.7, 0.3]
      children:
        - kind: split
          dir: row
          sizes: [0.28, 0.72]
          children:
            - kind: pane
              view:
                - { view: session-list, pinned: true }
            - kind: split
              dir: col
              sizes: [0.6, 0.4]
              children:
                - kind: pane
                  view:
                    - { view: terminal, pinned: true }
                - kind: pane
                  view:
                    - { view: transcript, pinned: true }
                    - { view: timeline, pinned: true }
        - kind: pane
          view:
            - { view: session-detail, pinned: true }
            - { view: files, state: { follow: true }, pinned: true }
  projects:
    root:
      kind: pane
      view:
        - { view: projects, pinned: true }
        - { view: coauthor, pinned: true }
        - { view: archive, pinned: true }
        - { view: personal, pinned: true }
        - { view: software, pinned: true }
  incoming:
    root:
      kind: split
      dir: row
      sizes: [0.6, 0.4]
      children:
        - kind: pane
          view:
            - { view: inbox, pinned: true }
            - { view: leads, pinned: true }
            - { view: linkedin, pinned: true }
        - kind: pane
          view:
            - { view: calendar, pinned: true }
  explorer:
    root:
      kind: split
      dir: row
      sizes: [0.4, 0.6]
      children:
        - kind: pane
          view:
            - { view: files, pinned: true }
            - { view: repositories, pinned: true }
            - { view: search, pinned: true }
            - { view: references, pinned: true }
            - { view: latex, pinned: true }
            - { view: problems, pinned: true }
        - { kind: pane, view: [] }
  academic:
    root:
      kind: pane
      view:
        - { view: funding, pinned: true }
        - { view: events, pinned: true }
        - { view: education, pinned: true }
        - { view: applications, pinned: true }
        - { view: joint-work, pinned: true }
        - { view: tasks, pinned: true }
        - { view: memories, pinned: true }
  pillars:
    root:
      kind: pane
      view:
        - { view: pillars, pinned: true }
        - { view: domains, pinned: true }
        - { view: map, pinned: true }
  registries:
    root:
      kind: pane
      view:
        - { view: venues, pinned: true }
        - { view: data, pinned: true }
        - { view: statements, pinned: true }
        - { view: people, pinned: true }
        - { view: organisations, pinned: true }
        - { view: resources, pinned: true }
  literature:
    root:
      kind: split
      dir: row
      sizes: [0.6, 0.4]
      children:
        - kind: pane
          view:
            - { view: literature-search, pinned: true }
            - { view: radar, pinned: true }
        - kind: pane
          view:
            - { view: literature, pinned: true }
  present:
    root:
      kind: pane
      view:
        - { view: present, pinned: true }
  help:
    root:
      kind: pane
      view:
        - { view: help, pinned: true }
        - { view: keys, pinned: true }
        - { view: doc, state: { id: engine:docs/apps.md, path: docs/apps.md, engine: true, label: "Apps guide" }, pinned: true }
        - { view: doc, state: { id: engine:docs/templates.md, path: docs/templates.md, engine: true, label: "Templates" }, pinned: true }
        - { view: doc, state: { id: engine:docs/data-map.md, path: docs/data-map.md, engine: true, label: "Data map" }, pinned: true }
        - { view: doc, state: { id: engine:docs/palette.md, path: docs/palette.md, engine: true, label: "Palette" }, pinned: true }
  views:
    root:
      kind: split
      dir: row
      sizes: [0.5, 0.5]
      children:
        - kind: pane
          view:
            - { view: settings, pinned: true }
            - { view: account-setup, pinned: true }
        - kind: split
          dir: col
          sizes: [0.5, 0.5]
          children:
            - kind: pane
              view:
                - { view: catalogue, pinned: true }
                - { view: pages, pinned: true }
                - { view: processes, pinned: true }
            - kind: pane
              view:
                - { view: status, pinned: true }
                - { view: findings, pinned: true }
                - { view: audit, pinned: true }
                - { view: history, pinned: true }
                - { view: gallery, pinned: true }
  apps:
    root:
      kind: split
      dir: row
      sizes: [0.4, 0.6]
      children:
        - kind: pane
          view:
            - { view: apps, pinned: true }
        - { kind: pane, view: [] }


# The arrangement every workbench page is made from, and what Reset layout gives it back: a page that belongs to one folder (a project, a funding or education entry or any folder), made when that folder is opened as a workbench. It has the shape of one entry of `arrangements:` above, `root` and its tree, and each tab is given the folder when the page is made: Files rooted at it, Search, Problems, Repositories and the sessions list limited to it, LaTeX pointed at it, and Deposit set to the project the page was opened for. A page whose project has no deposit (no `code/` folder and a `code_availability` naming neither a `repo` nor a `url`), and a page opened for no project, is made without the Deposit tab. The first tab of a pane is the one shown. `view: []` is the empty pane a project, an entry, a session or a file opens in. It is not a key of `arrangements:`, so no `rail:` entry can name it and the Settings view does not offer it as a rail page.
workbench:
  root:
    kind: split
    dir: row
    sizes: [0.4, 0.6]
    children:
      - kind: pane
        view:
          - { view: files, pinned: true }
          - { view: search, pinned: true }
          - { view: repositories, pinned: true }
          - { view: deposit, pinned: true }
          - { view: latex, pinned: true }
          - { view: problems, pinned: true }
          - { view: session-list, pinned: true }
      - { kind: pane, view: [] }


# The floats a workspace with no saved layout starts with, and Reset all pages gives back: panes over every page, each one a pane of tabs (`view` is one view id or a list of them, as in an arrangement's pane) placed either docked on an edge of the window, `{ view, dock: left | right | bottom, size }` where `size` is the fraction of the window's width (its height for `bottom`) from 0.1 to 0.6, or free, `{ view, x, y, w, h }` in fractions of the window with `x + w` and `y + h` at most 1 and `w` and `h` at least 0.1. One float may be docked on an edge; of two on one edge the first stays. After that first load the floats are the reader's own, kept in the saved layout beside the pages. An entry that does not add up is left out and the rest kept.
floats:
  - { view: [hpc, usage, workbenches], dock: right, size: 0.2 }


# The project boards, by view id, in the order a project's tier is looked up in: a project opened from anywhere lands on the first board whose `tier` is its own, and on the first board when none is. Each board shows the projects of its `tier`, a word of `tiers` in config/catalogs/vocab.yml. `columns` are the columns of its list mode, each the `cell` it draws (title, authors, venue, status, focus, next, domain, pillar or funding) under the heading `label`, the cell's name when it has none. `search` is the placeholder of its search box. `label_mode` is how it names a project when it opens: `short` draws a manifest's `short:` and the full title where there is none, `full` always the full title, any other value counts as short, and the board's Aa toggle overrides it for the viewer; the full title is always on hover. `groups` are the board's groups of cards, used by the board's filter (the category facet, its dot in the group's colour), a card's group and the board's tab count, which draws each group's count in the group's colour beside the board's card count; a card lands in the first group whose `keys` hold its `stage:` (a word of `stages`), its `form:` (a word of `forms`) or one of its `status.chips` (words of `chips`), and a card no group catches is in none. A key here that is no board view is never shown.
boards:
  projects:
    tier: projects
    columns:
      - { cell: title,   label: Project }
      - { cell: authors, label: Authors }
      - { cell: venue,   label: Venue }
      - { cell: status,  label: Status }
      - { cell: focus,   label: Focus }
      - { cell: next,    label: Next }
    search: "Search title | eli5 | results | ideas | doc text ..."
    label_mode: short
    groups:
      - { label: "in progress", keys: [de-risking, exploring, in-prep, building, running, active, submit-ready, submitted, revision, accepted], color: "#16a34a" }
      - { label: idea,          keys: [idea, nascent, scoping], color: "#7c5cff" }
      - { label: paused,        keys: [paused],                 color: "#9ca3af" }
  coauthor:
    tier: coauthor
    columns:
      - { cell: title,   label: Paper }
      - { cell: authors, label: Authors }
      - { cell: venue,   label: Venue }
      - { cell: domain,  label: Domain }
      - { cell: pillar,  label: Pillar }
      - { cell: funding, label: Funding }
    search: "Search coauthor | title | eli5 | outcome | doc text ..."
    label_mode: short
    groups:
      - { label: "in progress", keys: [de-risking, exploring, in-prep, building, running, active, submit-ready, submitted, revision, accepted], color: "#16a34a" }
      - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
      - { label: outputs,       keys: [abstract, poster, tech-report],                   color: "#0ea5e9" }
      - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }
  archive:
    tier: archive
    columns:
      - { cell: title,   label: Paper }
      - { cell: authors, label: Authors }
      - { cell: venue,   label: Venue }
      - { cell: domain,  label: Domain }
      - { cell: pillar,  label: Pillar }
      - { cell: funding, label: Funding }
    search: "Search archive | title | eli5 | outcome | doc text ..."
    label_mode: short
    groups:
      - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
      - { label: outputs,       keys: [thesis, abstract, poster, tech-report],           color: "#0ea5e9" }
      - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }
  personal:
    tier: personal
    columns:
      - { cell: title,   label: Project }
      - { cell: authors, label: Authors }
      - { cell: venue,   label: Venue }
      - { cell: status,  label: Status }
      - { cell: focus,   label: Focus }
      - { cell: next,    label: Next }
    search: "Search personal | title | eli5 | next | doc text ..."
    label_mode: short
    groups:
      - { label: building,      keys: [building],                                color: "#d4a017" }
      - { label: running,       keys: [running],                                 color: "#16a34a" }
      - { label: paused,        keys: [paused],                                  color: "#9ca3af" }
      - { label: finished,      keys: [finished],                                color: "#0ea5e9" }
      - { label: idea,          keys: [nascent, scoping, de-risking, exploring], color: "#7c5cff" }
  software:
    tier: software
    columns:
      - { cell: title,   label: Software }
      - { cell: authors, label: Authors }
      - { cell: venue,   label: Venue }
      - { cell: domain,  label: Domain }
      - { cell: pillar,  label: Pillar }
      - { cell: funding, label: Funding }
    search: "Search software | title | eli5 | tags | doc text ..."
    label_mode: short
    groups: []


# The views that draw a count, by view id, and where each count is drawn: `tab: true` draws it on the view's tabs and in the view catalogue, and `rail: true` adds it to the badge of the rail button of the page the view's tab is on, whose tooltip names the view with its count. A view with no row draws no count and gives the rail nothing. A board counts by its `groups` in `boards` above, and gives the rail the count of its first group in that group's colour, or its cards when it has no groups. A collection counts the entries whose status is one of `match`, compared trimmed and in lower case, says `label` on hover, and draws the colour of the first status of `match` in `statuses` of config/catalogs/vocab.yml, so `in-prep` on the Funding tab is the violet that `statuses` gives `in-prep`, unless `tone` (red, amber or green) sets an urgency class, used where a count means "act" rather than "here is how many"; a collection with no `match` counts nothing. Applications counts the applications open under `focus:` of config/defaults/behavior.yml or the open workspace file's `settings:`, in green. `days` is for Position Leads alone: it counts the open leads whose deadline falls from today through that many days ahead, in amber. The other views count what their tab shows: Inbox the threads awaiting an answer, Calendar today's events not ended, Repositories the changes, Problems, Findings and Audit their open rows, Processes the programs running, Live HPC its running and pending jobs, and the Session list the sessions needing input. A row whose id is no view that draws a count, a field other than these, a `days` on any row but `leads`, or a `tab` or `rail` that is not true or false is a finding of the config check. A hub's .oculus/config.yml may override `counts` whole.
counts:
  projects:     { tab: true, rail: true }
  coauthor:     { tab: true, rail: true }
  personal:     { tab: true, rail: true }
  archive:      { tab: true, rail: false }
  software:     { tab: true, rail: false }
  inbox:        { tab: true, rail: true }
  leads:        { days: 14, tab: true, rail: false }
  calendar:     { tab: true, rail: false }
  repositories: { tab: true, rail: true }
  problems:     { tab: true, rail: true }
  findings:     { tab: true, rail: true }
  audit:        { tab: true, rail: true }
  processes:    { tab: true, rail: false }
  hpc:          { tab: true, rail: false }
  session-list: { tab: true, rail: true }
  applications: { tab: true, rail: true }
  funding:      { match: [in-prep, submitted], label: undecided, tab: true, rail: true }
  education:    { match: [ongoing], label: ongoing, tab: true, rail: true }
  joint-work:   { match: [exploring], label: exploring, tab: true, rail: true }
  tasks:        { match: [todo, doing], label: open, tone: amber, tab: true, rail: true }
  events:       { match: [upcoming], label: upcoming, tab: true, rail: true }


# Project-title label mode of the surfaces that are no board: `short` = a manifest's `short:` if set, else the full title (no id is ever shown); `full` = always the full title. The full title is always on hover. A board's label mode is its `label_mode` in `boards` above.
focus_label_mode: short      # Focus board cards and the week's ticker lines

map_label_mode: short        # Map tab nodes


# Documents of the hub: one entry inside its group in the view catalogue, listed after the group's views, opening the `doc` view over api/docs, and a tab of the page its group names (see `arrangements` above). `path` is relative to the hub, `group` is the `page` of a `rail:` entry or a key of `nav_groups` above, and `label` is the tab's words. A path with no file there draws the view's own missing line. The engine lists none: a hub lists its documents in .oculus/config.yml, and this key is the hub list's `docs`.
docs: []
