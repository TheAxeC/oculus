# ===========================================================================
# sources.yml
# oculus's own configuration of what the portfolio reads: where the projects are, which registry, collection, document and feed file each surface is built from, and where a hub keeps its pictures. The folders files are served from are the folders of the open workspace. Which files open for editing is no key: the file's own first bytes say whether it is text, and its mode on this machine says whether it can be written. loadConfig() merges it with the other files of config/defaults/, and every key here is a top-level key of the merged map; the options of config/options/sources.yml describe every key. Nothing writes this file.
# The keys from scan to apps_dir are the hub list: a hub's own .oculus/config.yml replaces any of them whole, and the values here are oculus's defaults: the scan folders of a research hub's usual layout, and each collection's file and the career file under `.oculus/data/`, in the folder of its kind (research, pillars, literature, people, academic). This file is the one table of those default paths: oculus reads a registry or feed a hub's own list leaves out, and the Literature file, from here (a hub's own folders, its website among them, are set in its own settings file).
# It also holds the map from a file name to the language the editor colours it in (languages).
# ===========================================================================


# Where to find projects: each `dir` is relative to the hub root. A project is any folder that holds a `project.yml` at its top or a `.oculus/project.yml`, at any depth under the `dir`; the walk stops at a project and does not enter a dot folder, `node_modules` or a symbolic link. The project's tier and stage are the manifest's own `tier` and `stage` lines, and its id is the folder's name.
scan:
  - { dir: projects/ideas }
  - { dir: side-projects, optional: true }   # optional; a hub without the folder reports nothing
  - { dir: projects/active }
  - { dir: projects/manuscripts }
  - { dir: projects/software, optional: true }   # optional; a hub without the folder reports nothing
  - { dir: projects/coauthor }
  - { dir: projects/archive }


# The folder a new project is made in, for each tier. The engine names none: a hub sets `new_project_dir` in its .oculus/config.yml, a map from a tier (a word of `tiers` in config/catalogs/vocab.yml: research, personal or software) to a folder that is a scan folder or lies under one. A tier with no entry has no folder to offer, and a new project of it needs the folder given.
new_project_dir: {}


# The portfolio deck: the folder, relative to the hub, whose present.yml and Markdown slides the Present view opens when a pane names no deck. A project's deck is its own present/ folder and a custom deck is any folder, so this key names the one deck that belongs to the hub as a whole.
portfolio_deck: deck


# The hub's data files, one entry each: a `key` the file is named by in the hub and a `file`, its path from the hub root. Each entry's fields say what its file is and which features read it, so a hub keys its files as it likes:
# - `registry:` the registry or feed the file is: `datasets` the dataset registry (the Data view, provenance and a recovery recipe per dataset; the projects that use a dataset come from the manifests' `datasets:`, and the file lists its records under `datasets:`), `venues` the venue catalogue, `pillars` the pillars registry (membership computed from the manifests' `pillars:`), `domains` the domains registry (projects grouped by the manifests' `domain:`), `funding` the funding registry, `people` the people registry (one entry per human the hub names, whose `affiliations:` are keys of the organisations file; the key `self` of the primary hub's .oculus/local.yml names the user's own entry), `organisations` the organisations registry (what a person's `affiliations:` and a funding entry's `funder:` point at), `resources` the resources registry (the clusters, machines and storage that a project's `compute:` and the `slurm.resource` key name by key), `literature` the Literature collection, `leads` the position scout's leads and `radar` the literature scout's accumulated radar, which its refresh deduplicates by URL. The datasets, venues, pillars, domains, leads and radar files are drawn by the Data, Venues, Pillars, Domains, Position Leads and Lit Watch views and get no card list; leads and radar are feeds and no collection. One registry word on two entries is a finding, and the first entry is the registry.
# - the flags, each `true` or absent: `band_positions` and `band_teaching` the Focus band's positions and teaching columns, `awaiting` the Awaiting box's applications, `open_badge` the open count and green badge of the view, `lead_applications` where a lead's applied press writes, `dissemination` Disseminated in on a project card (`dissemination_skip:` a condition on an entry's fields that leaves it out), `tasks` Add Task, Start Agent on a task card, the task hub list and the task lines, and `joint_work` a person's joint work, the relation rows, the cross-links and the referrers. `lead_applications` and `tasks` name one file: on two entries the first is read and the second is a finding.
# - `ticker:` `{ category, undated }`: the word of `ticker_categories` (config/catalogs/vocab.yml) the command center's lines of the file carry, and `undated: true` when an undated entry is open work, a task line. The ticker of the funding, leads and venues registries gives the category of their own lines.
# - `primary_key:` the field an entry of a file with no `schema:` is found by, such as `title` for a leads or radar file a scout writes with no schema. A file with a schema flags its primary key there with `primary_key: true`, and an entry's `primary_key:` beside that flag is a finding and the file's writes are refused. The entries below carry none, since they describe no file.
# - `group:` and `order:` where the file's view sits in the view catalogue, a rail page or a `nav_groups` key, and `label:`, `glyph:` and `about:` the dotted keys of the words of its name, its glyph and its line in Make Folder a Hub. A view with no label is named by its file's `title:` and one with no glyph draws `views.collection_glyph`; one with no group sits in the group of the rail entry carrying `unplaced_collections: true` in layout.yml, after that group's placed collection views.
# A hub that names no entry of a registry or feed reads oculus's entry of it, the one below, and it is reported as unnamed; a file a hub lists that is not there is a finding. A hub that names no list and holds a `.oculus/data/` folder reports a missing file of this list as a finding, as it does a file it names. The domains registry gives each domain its card colour (`color`) and label (`title`) and says which domains expect a dataset (`expects_datasets`); the `themes` field of the venues and datasets registries lists the theme words as its options. A key listed twice uses its first entry and is a finding, and a plain collection keyed by the id of one of those six views is a finding and gets no card list. The schema is the file's own `schema:` block: the field flagged `primary_key: true` is the one an entry is found by and a reference stores, a field's `display:` rank says what a reference to the entry shows, and a field's `foreign_key:` names the collection its values are entries of. The links between files are in docs/data-map.md, the Data map tab of the Help page. Make Folder a Hub writes the ticked entries as they stand below. Every entry has a page with an editor built from the schema, where it is edited and deleted, Add asks the new entry's primary key and the fields the schema marks required and opens that page, and an entry's card menu also sets its status and its deadline and adds a subtask or a follow-up to it. Edit in File opens the file at the entry.
collections:
  - { key: data, file: ".oculus/data/research/data.yml", registry: datasets, about: files.make_collection_line_data }
  - { key: venues, file: ".oculus/data/research/venues.yml", registry: venues, ticker: { category: conference }, about: files.make_collection_line_venues }
  - { key: pillars, file: ".oculus/data/pillars/pillars.yml", registry: pillars, about: files.make_collection_line_pillars }
  - { key: domains, file: ".oculus/data/pillars/domains.yml", registry: domains, about: files.make_collection_line_domains }
  - { key: statements, file: ".oculus/data/research/statements.yml", group: registries, order: 3, label: views.statements, glyph: views.statements_glyph, about: files.make_collection_line_statements }
  - { key: people, file: ".oculus/data/people/people.yml", registry: people, group: registries, order: 4, label: views.people, glyph: views.people_glyph, about: files.make_collection_line_people }
  - { key: organisations, file: ".oculus/data/people/organisations.yml", registry: organisations, group: registries, order: 5, label: views.organisations, glyph: views.organisations_glyph, about: files.make_collection_line_organisations }
  - { key: resources, file: ".oculus/data/research/resources.yml", registry: resources, group: registries, order: 6, label: views.resources, glyph: views.resources_glyph, about: files.make_collection_line_resources }
  - { key: funding, file: ".oculus/data/academic/funding.yml", registry: funding, ticker: { category: funding }, group: academic, order: 0, label: views.funding, glyph: views.funding_glyph, about: files.make_collection_line_funding }
  - { key: events, file: ".oculus/data/academic/events.yml", dissemination: true, dissemination_skip: { role: attend }, ticker: { category: event }, group: academic, order: 1, label: views.events, glyph: views.events_glyph, about: files.make_collection_line_events }
  - { key: education, file: ".oculus/data/academic/education.yml", band_teaching: true, dissemination: true, ticker: { category: teaching }, group: academic, order: 2, label: views.education, glyph: views.education_glyph, about: files.make_collection_line_education }
  - { key: applications, file: ".oculus/data/academic/applications.yml", band_positions: true, awaiting: true, open_badge: true, lead_applications: true, dissemination: true, ticker: { category: position }, group: academic, order: 3, label: views.applications, glyph: views.applications_glyph, about: files.make_collection_line_applications }
  - { key: joint-work, file: ".oculus/data/academic/joint-work.yml", joint_work: true, ticker: { category: collab }, group: academic, order: 4, label: views.joint-work, glyph: views.joint-work_glyph, about: files.make_collection_line_joint_work }
  - { key: tasks, file: ".oculus/data/academic/tasks.yml", tasks: true, ticker: { category: task, undated: true }, group: academic, order: 5, label: views.tasks, glyph: views.tasks_glyph, about: files.make_collection_line_tasks }
  - { key: literature, file: ".oculus/data/literature/literature.yml", registry: literature, group: literature, order: 2, label: views.literature, glyph: views.literature_glyph, about: files.make_collection_line_literature }
  - { key: leads, file: ".oculus/data/academic/leads.yml", registry: leads, ticker: { category: position }, about: files.make_collection_line_leads }
  - { key: radar, file: ".oculus/data/literature/radar.yml", registry: radar, about: files.make_collection_line_radar }

# The keys of the hub's `collections:` list whose files the index of a portfolio chat and of a project chat holds for this hub, in this order, after the hub's project manifests. A word that names no key of the hub's own list adds nothing.
chat_context: [funding, events, education, applications, joint-work, tasks]


# The career file holds the goal, the next milestone and its day, the situation and the order of work, which the Focus board's Career banner draws. A funding entry's `statement:` shows on the Funding view.
career_file: .oculus/data/academic/career.yml


# The folder of the LinkedIn posts pipeline. oculus names none: a hub sets it in its .oculus/config.yml, relative to the hub, and empty names no folder.
linkedin_dir: ''


# The folder of this hub's photo wall, relative to the hub and inside it. Every .jpg, .jpeg, .png and .webp in it or in a folder under it (a folder whose name starts with a dot aside) is a tile of the Memories view, and the view's add control puts new pictures in the primary hub's folder, else in the first hub's when the workspace has no primary. A value outside the hub is a finding and the folder below is used.
memories_dir: .oculus/memories

# The folder of this hub's wallpaper images, relative to the hub and inside it. Its pictures are read with those of every folder under it, a folder whose name starts with a dot aside. The `wallpaper.image` key of the primary hub's .oculus/config.yml names one of them as `<hub name>/<file path>`, the path relative to this folder, so a picture in a folder under it is named with its folders; the picker in the Settings view lists every hub's folder. A value outside the hub is a finding and the folder below is used.
wallpaper_dir: .oculus/wallpaper

# Where the reader's own bookmarks, the schedules and the machine's apps live, each relative to the primary hub, under the home folder for a value of ~ or one starting with ~/, or an absolute path. A hub sets them in its .oculus/config.yml, and the primary hub's file is the one read.
bookmarks: .oculus/bookmarks.yml
schedules: .oculus/schedules.yml
apps_dir: .oculus/apps

# How many folder levels below each folder of the open workspace the Repositories view looks for repositories, 0 to 3.
repository_scan_depth: 1


# The language each file name opens in, which the editor, the code window and the status bar colour and name it by. One language per line, the editor's own lowercase name, then the endings it claims: an entry that starts with a dot is an extension (.py), any other entry is a whole file name compared lowercased (makefile, cmakelists.txt). A whole name is matched before an extension, and a file no entry matches, a dotfile included, opens as plain text. A language the editor does not colour is refused, and an ending two languages claim belongs to the first one listed.
languages:
  bash:          [.sh, .bash, .zsh, .slurm]
  bibtex:        [.bib]
  css:           [.css]
  diff:          [.diff, .patch]
  ini:           [.ini, .toml]
  javascript:    [.js, .jsx, .mjs, .cjs, .javascript]
  json:          [.json, .jsonc, .json5, .ipynb]
  julia:         [.jl, .julia]
  latex:         [.tex, .latex, .sty, .cls, .rnw, .jnw, .pnw]
  lisp:          [.lisp, .el, .scm]
  makefile:      [.mk, .mak, .make, .makefile, makefile]
  markdown:      [.md, .markdown, .mkdown, .mkd]
  matlab:        [.m, .matlab]
  ocaml:         [.ml, .mli, .ocaml]
  python:        [.py, .pyi, .gyp, .ipython, .python]
  r:             [.r]
  typescript:    [.ts, .tsx, .mts, .cts, .typescript]
  xml:           [.xml, .html, .xhtml, .rss, .atom, .xjb, .xsd, .xsl, .plist, .wsf, .svg]
  yaml:          [.yml, .yaml]
  plaintext:     [.txt, .text, .plaintext]
  c:             [.c, .i]
  cpp:           [.cpp, .cc, .cxx, .c++, .hpp, .hh, .hxx, .h++, .h, .ii, .ino, .inl, .ipp, .tpp]
  cmake:         [.cmake, cmakelists.txt]
  lua:           [.lua]
  ruby:          [.rb, .rbi, .rake, .gemspec, .podspec, .ru, gemfile, rakefile, podfile, vagrantfile]
  scss:          [.scss]
  java:          [.java, .jav]
  dart:          [.dart]
  fortran:       [.f90, .f95, .f03, .f08]
  fortran-fixed: [.f, .for, .f77]
  jinja:         [.jinja, .jinja2, .j2]
  svelte:        [.svelte]
  rite:          [.rite]
