# The theme drawn: a name of `themes` above, or the saved name of a colour theme an approved app offers. Empty draws the first theme of the list, and the app's dark theme in the desktop app.
theme: ''

# The size of the page's text, a multiplier of the theme's own sizes from 0.7 to 1.6 in tenths.
text_size: 1

# The look of the terminal themes (the themes whose class holds `rice`): `icons` keeps the icons instead of their ASCII stand-ins, `brackets` draws buttons, chips and tags in brackets, and `monospace` draws the interface in the monospace font.
rice:
  icons: false
  brackets: true
  monospace: true


# === Terminal ===============================================================
# The terminal grid paints its own text and cannot inherit the page's size. `font_px` is CSS pixels; leave the key out to follow the theme's `--fs-md` token instead.
terminal:
  font_px: 12.5
  mac_option_is_meta: false   # true makes Option send Meta on macOS, so Option+B and Option+F move by word; false types the characters Option makes
  copy_on_selection: false    # true copies a selection to the clipboard as soon as it is made
  cursor_style: block         # block | line | underline (line is a thin bar)
  cursor_blinking: false      # true makes the cursor blink


# === Look ===================================================================
# How the wallpaper and the panels over it are drawn. Which image is the wallpaper is the `wallpaper.image` key of the primary hub's own .oculus/config.yml (a hub name and a file name joined by a slash, `random`, or empty for none), set from the picker under the wallpaper rows of the Settings view; the folder each hub keeps its wallpaper images in is `wallpaper_dir` of its .oculus/config.yml. `show` is `shown`, `hidden`, or empty for the theme's answer.
wallpaper:
  show: ''
  image: ''
  dim: 0.6      # 0 = raw image, 1 = fully hidden. Busy images want 0.7-0.85
  blur: 0        # px of blur on the IMAGE itself. 0 = sharp; raise it only if the picture is busy
  themes: all   # `rice` = terminal themes only | `all` = light and dark too
  panel_opacity: 0.8   # how solid the windows stay over the image (1 = opaque, 0.8 = see-through)
  popover_opacity: 0.97  # dropdowns (Collections / More / theme) - they float OVER a panel, so at
                           # `panel_opacity` you read them through two translucent layers. Unset =
                           # three quarters of the way from `panel_opacity` to solid.
  panel_blur: 0         # px of backdrop blur behind each window (keeps text crisp without smearing the image)


# The CRT overlay (scanlines and vignette, cosmetic only): whether it is drawn over the page.
crt:
  on: false


# === Code theme =============================================================
# How the editors colour code. `tokens` takes the syntax colours from the UI theme's own code tokens. The class name of any of the 19 VS Code themes (such as `vscode-dark-2026`, `vscode-light-modern`) takes that theme's TextMate rules under any UI theme, and any id of Shiki's bundled themes (such as `dark-plus`, `github-light`, `nord`) takes that theme's syntax colours; in both the editor's background and chrome stay on the UI theme.
code_theme: tokens


# === File icons =============================================================
# The file icon theme: `seti` draws the icons of VS Code's default theme, and the saved name of an icon theme an approved, enabled app offers (`<app view id>/<id>`, which the File Icon Theme row of the Settings view and `:file-icons` in Cmd-K write) draws that theme's icons in the Files view, the tabs, Cmd-K and the diff headers. A value naming no such theme is reported as a finding and read as `seti`.
file_icons: seti


# === Pane strip =============================================================
# What the top row of every pane draws, as VS Code's workbench.editor.showTabs and workbench.editor.editorActionsLocation do. The strip menu's Tab Bar and Editor Actions Position submenus write these two keys.
# `multiple` draws every tab, `single` draws the active tab alone, `none` draws no tab and no row, but a title row with the lock mark while the pane is locked.
show_tabs: multiple
# `strip` draws Split Right and the `...` pane menu at the right of the row, or with `show_tabs: none` in the window's title bar strip for the active pane, `hidden` draws neither (the pane menu stays reachable by a right click on the strip or on an empty pane).
editor_actions: strip
# `true` wraps the tabs of a pane onto more rows instead of scrolling the one row; it applies only while `show_tabs` is `multiple`, as VS Code's workbench.editor.wrapTabs.
wrap_tabs: false
