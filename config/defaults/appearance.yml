# The theme drawn: a name of `themes` above, or the saved name of a colour theme an approved, enabled app offers, which the page draws from its first paint. Empty draws the first theme of the list, and the theme `app_theme` names in the desktop app; so does an app's theme whose app is not approved and enabled or whose file does not resolve.
theme: ''

# The theme a page in the desktop app's window starts on, and the one whose colours fill the window before its page paints, when `theme` names no theme it can draw: a name of `themes` above, or the saved name of a colour theme an approved, enabled app offers.
app_theme: vscode-dark-modern

# The size of the page's text, a multiplier of the theme's own sizes from 0.7 to 1.6 in tenths.
text_size: 1

# The display language every word of the interface is drawn in: `en`, oculus's own words of config/text/, or the languageId of a display language an approved, enabled app contributes by its `localizations`. A word the language lacks is drawn in English.
locale: en

# The look of the terminal themes (the themes whose class holds `rice`): `icons` keeps the icons instead of their ASCII stand-ins, `brackets` draws buttons, chips and tags in brackets, and `monospace` draws the interface in the monospace font.
rice:
  icons: false
  brackets: true
  monospace: true


# === Terminal ===============================================================
# The terminal grid paints its own text and cannot inherit the page's size. `font_px` is CSS pixels; leave the key out to follow the theme's `--fs-md` token instead.
terminal:
  font_px: 12.5
  mac_option_is_meta: false   # true makes Option send Meta on macOS, so Option+B and Option+F move by word; false types the characters Option makes
  copy_on_selection: false    # true copies a selection to the clipboard as soon as it is made
  cursor_style: block         # block | line | underline (line is a thin bar)
  cursor_blinking: false      # true makes the cursor blink
  # opacity: 0.8              # how solid the Terminal view stays over the wallpaper, 0 to 1; left out, it is wallpaper.panel_opacity


# === Look ===================================================================
# How the wallpaper and the panels over it are drawn. Which image is the wallpaper is the `wallpaper.image` key of the primary hub's own .oculus/config.yml (a hub name and a file name joined by a slash, `random`, or empty for none), set from the picker under the wallpaper rows of the Settings view; the folder each hub keeps its wallpaper images in is `wallpaper_dir` of its .oculus/config.yml. `show` is `shown`, `hidden`, or empty for the theme's answer.
wallpaper:
  show: ''
  image: ''
  dim: 0.6      # 0 = raw image, 1 = fully hidden. Busy images want 0.7-0.85
  blur: 0        # px of blur on the IMAGE itself. 0 = sharp; raise it only if the picture is busy
  themes: all   # `rice` = terminal themes only | `all` = light and dark too
  panel_opacity: 0.8   # how solid the windows stay over the image (1 = opaque, 0.8 = see-through)
  popover_opacity: 0.97  # dropdowns (Collections / More / theme) - they float OVER a panel, so at
                           # `panel_opacity` you read them through two translucent layers. Unset =
                           # three quarters of the way from `panel_opacity` to solid.
  panel_blur: 0         # px of backdrop blur behind each window (keeps text crisp without smearing the image)


# The CRT overlay (scanlines and vignette, cosmetic only): whether it is drawn over the page.
crt:
  on: false


# === Code theme =============================================================
# How the editors colour code. `tokens` takes the syntax colours from the UI theme's own code tokens. The class of a VS Code theme, a row of `code_themes.vscode` below (such as `vscode-dark-2026`, `vscode-light-modern`), takes that theme's TextMate rules under any UI theme, and the id of a Shiki theme, a row of `code_themes.shiki` below (such as `github-light`, `nord`), takes that theme's syntax colours; in both the editor's background and chrome stay on the UI theme.
code_theme: tokens

# The two lists of the choice of `code_theme`, in the order the choice lists them, each row's `label` the words shown and `group` the words of the heading the row is drawn under. `vscode` is the VS Code code themes, each row's `class` the value `code_theme` saves and the key of the theme's TextMate rules in src/lib/themes/vscode-rules.json. `shiki` is the themes Shiki bundles, each row's `id` the value `code_theme` saves and the id of the Shiki theme; a Shiki theme with no row is not offered, and six rows carry "(Shiki)" since a VS Code row of the same theme stands beside them (tests/data/helpers/code-theme-pairs.test.ts compares the pairs).
