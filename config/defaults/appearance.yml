# === File icons =============================================================
# The file icon theme: `seti` draws the icons of VS Code's default theme, and the saved name of an icon theme an approved, enabled app offers (`<app view id>/<id>`, which the File Icon Theme row of the Settings view and `:file-icons` in Cmd-K write) draws that theme's icons in the Files view, the tabs, Cmd-K and the diff headers. A value naming no such theme is reported as a finding and read as `seti`.
file_icons: seti


# === Pane strip =============================================================
# What the top row of every pane draws, as VS Code's workbench.editor.showTabs and workbench.editor.editorActionsLocation do. The strip menu's Tab Bar and Editor Actions Position submenus write these two keys.
# `multiple` draws every tab, `single` draws the active tab alone, `none` draws no tab and no row, but a title row with the lock mark while the pane is locked.
show_tabs: multiple
# `strip` draws Split Right and the `...` pane menu at the right of the row, or with `show_tabs: none` in the window's title bar strip for the active pane, `hidden` draws neither (the pane menu stays reachable by a right click on the strip or on an empty pane).
editor_actions: strip
# `true` wraps the tabs of a pane onto more rows instead of scrolling the one row; it applies only while `show_tabs` is `multiple`, as VS Code's workbench.editor.wrapTabs.
wrap_tabs: false
