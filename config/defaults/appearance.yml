# ===========================================================================
# appearance.yml
# oculus's shipped values of what the chrome looks like: the UI theme picker's list and the theme drawn, the page's text size, the glyphs and the look of the terminal themes, the wallpaper behind the panels, the CRT overlay, the code theme of the editors, and the terminal grid's text size, cursor and Option key. loadConfig() merges it with the other files of config/defaults/; a workspace file's `settings:` sets a key over the value here, and the options of config/options/appearance.yml describe every key. Nothing writes this file.
# ===========================================================================


# The UI themes in picker order. `name` is saved, `class` lands on <body>, `glyph` is the glyph name drawn before the words, and `label` is the words shown.
themes:
