# ===========================================================================
# appearance.yml
# oculus's shipped values of what the chrome looks like: the UI theme list, the theme drawn and the theme a desktop window starts on, the page's text size, the display language, the glyphs and the look of the terminal themes, the wallpaper behind the panels, the CRT overlay, the code theme of the editors and the lists that shape its choice, and the terminal grid's text size, cursor and Option key. loadConfig() merges it with the other files of config/defaults/; a workspace file's `settings:` sets a key over the value here, and the options of config/options/appearance.yml describe every key. Nothing writes this file.
# ===========================================================================


# The UI themes, in the order the Settings view's choice and `:theme` in Cmd-K list them. `name` is saved, `class` lands on <body>, `glyph` is the glyph name drawn before the words, `label` is the words shown, and `group` is the words of the heading the row is drawn under in both lists.
