# ===========================================================================
# behavior.yml
# oculus's shipped thresholds, horizons and behaviours: the soft limits an audit warns on, the conventions it holds a hub's projects to (off until the hub sets them), how long before a feed counts as stale, how far ahead each kind of date is shown, the cadences of the pollers, the editor, LaTeX, the linters, the apps' limits and the status bar. The source roots and the editor language of each file extension live in sources.yml. loadConfig() merges it with the other files of config/defaults/; a workspace file's `settings:` sets a key over the value here, a hub's .oculus/config.yml sets the keys of the hub list (`slurm.resource`, `clusters.key_type`, `clusters.key_file`, `connections.failures`, `sign_in`, `recover.node_download`, `lint.writing_skip`, `lint.writing_glyphs`, `audit` and `app_settings`), and the options of config/options/behavior.yml describe every key. Nothing writes this file.
# ===========================================================================


# Manifest readability soft-limits (chars) for the audit warnings.
read_limits: { status.line: 220, next: 300, latest: 200, eli5: 360, results: 300 }


# The session detail meter measures the last turn against this token window unless the transcript names one.
context_window: 1000000

# Labels for subscription tier identifiers reported by supported command-line agents.
usage_tiers:
  default_claude_max_20x: "Max 20x"
  default_claude_max_5x: "Max 5x"
  default_claude_pro: "Pro"
  prolite: "Plus"

# Hidden usage sessions refresh each account's cached figures on this cadence and model.
usage_refresh_min: 10
usage_refresh_model: "haiku"

# Audit findings the reader has parked. Each entry is a finding's signature, the twelve hex characters the Audit view's mute control writes here; the finding stays true and is drawn in the muted section.
audit_ignore: []

# The conventions the audit holds a hub's projects to, each a setting of the hub kept in its .oculus/config.yml, and each off here: the files a project must hold (required_files), the headings a file must hold when a manifest key has a value (required_sections) and the folders a project at a stage is kept under (stage_folders).
audit:
  required_files: []
  required_sections: []
  stage_folders: []

# The website the primary hub's files are written into, a setting of that hub kept in its .oculus/config.yml and off here: its folder relative to the hub (folder), the command run in that folder once the files are written (cv), the sections of its publications with the papers each takes (kinds), and its four files, each a path relative to its folder (files): the website's own file (site) and the three the hub's files are written into (cv, papers, industry).
website:
  folder: ''
  cv: ''
  kinds: []
  files:
    site: _data/website.yml
    cv: _data/data.yml
    papers: _data/publications.yml
    industry: _data/industry.yml


# === The Focus board =========================================================
# The sections it draws, its horizons, thresholds and cadences; the statuses its band and its Awaiting box read are the words of catalogs/vocab.yml.
focus:
  # The sections the Focus board draws, in drawing order, each one of command_center, tasks, quick_add, awaiting, band and lanes; a section not listed is not drawn. The line saying what a quick add did is drawn after quick_add, or at the top of the board without it, and the message of a board with no project is part of lanes.
  sections: [command_center, tasks, quick_add, awaiting, band, lanes]

  # A manifest is stale when its `updated` date trails the newest project content by this many days.
  stale_lag_days: 1

  # The Focus refresh strip prompts for live feeds older than these numbers of days. A feed not listed here is never prompted for.
  refresh_stale_days:
    litwatch: 14  # the Lit Watch update task (meta.last_run in the radar file)
    inbox: 2  # the Inbox update task (the triage notes under `mail_dir`)
    scout: 7  # the Scout update task (newest meta.log date in the leads file)

  # Look-ahead windows for each deadline class on the Focus strip.
  deadline_horizon_days: 90  # your project-manifest `deadline:` + talks / teaching (default 90)
  leads_horizon_days: 21  # academic-position-lead deadlines from the leads file (default 21)
  conf_horizon_months: 1  # venues.yml conference deadlines, in whole months ahead (default 1 = this/next)

  venue_conc_warn: 4  # "venue load" Focus nudge when >= N in-flight papers target one venue
  linkedin_cadence_days: 30   # nudge/red badge when it's been longer than this since the last post


# === Per-project file finder ================================================
# Project cards index the newest matching files up to `max_per_project`; `enabled: false` disables it.
file_index:
  enabled: true
  max_per_project: 400
  ext: [".pdf", ".tex", ".bib", ".md", ".yml", ".yaml", ".py", ".sh", ".slurm", ".ipynb",
        ".csv", ".json", ".png", ".jpg", ".svg", ".txt", ".docx", ".xlsx", ".pptx"]


# === Served mode: live SLURM poller and in-page chat =========================
# Live HPC polling cadences are minutes. `prewarm: false` defers finished-job log resolution.
# `resource` lists the keys of the cluster entries of the hub's resources registry the poller queries, each entry's `host` the ssh alias, DNS name or address it connects to; the empty list means the hub names no cluster and nothing is polled. A hub sets it in .oculus/config.yml.
slurm:
  resource: []
  days: 3
  poll_min: 20
  quota_min: 60
  prewarm: true

# The key Account setup makes for a cluster: the type ssh-keygen makes and the path of the key file, in which {type} stands for the type and {resource} for the cluster's key. A hub's .oculus/config.yml may set either in its place, and with either empty Account setup says which is missing.
clusters:
  key_type: ed25519
  key_file: ~/.ssh/id_{type}_{resource}

# The rows that tell a failed ssh or git connection apart, read in order, the first that matches telling the failure: each a text a line of the error output holds (`match`), the connections it is read for (`for`), the words naming the failure (`kind`) and the words of its fix. A hub's .oculus/config.yml lays its rows over these by `kind`: a row of a kind named here replaces it in its place, `{ kind: x, removed: true }` takes it out, and a new row is read before these, so the hub's own error text is matched first.
connections:
  failures:
    - { kind: Key refused, for: [cluster], match: 'Permission denied (publickey)', fix: Put the key on the cluster in Account setup }
    - { kind: Unknown host, for: [cluster], match: Could not resolve hostname, fix: Check the host of the cluster entry in the resources registry and that this machine is on the cluster's network }
    - { kind: No route to the cluster, for: [cluster], match: No route to host, fix: Connect this machine to the cluster's network }
    - { kind: Host key not trusted, for: [cluster], match: Host key verification failed, fix: Read and confirm the cluster's host key in Account setup }
    - { kind: Git sign-in refused, for: [git], match: Authentication failed, fix: Sign in to the git host again in Account setup }
    - { kind: Git key refused, for: [git], match: 'Permission denied (publickey)', fix: "Add this machine's ssh key to the git host, or use its https address and sign in in Account setup" }

# The providers a reader signs in with, each with its addresses and scopes: Google and Microsoft for the mail and the calendars, and GitHub for git. A hub's .oculus/config.yml lays its rows over these by `key`: a row of a key named here replaces it in its place, `{ key: x, removed: true }` takes it out, and a new row comes after these.
sign_in:
  - key: google
    name: Google
    authorize: https://accounts.google.com/o/oauth2/v2/auth
    token: https://oauth2.googleapis.com/token
    calendar: https://www.googleapis.com/calendar/v3
    mail: https://www.googleapis.com/gmail/v1/users/me
    mail_link: 'https://mail.google.com/mail/u/0/#inbox/{id}'
    calendar_scope: https://www.googleapis.com/auth/calendar.readonly
    mail_scope: https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.send
  - key: microsoft
    name: Microsoft
    authorize: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
    token: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
    calendar: https://graph.microsoft.com/v1.0
    mail: https://graph.microsoft.com/v1.0
    calendar_scope: Calendars.Read offline_access
    mail_scope: Mail.ReadWrite Mail.Send offline_access
  - key: github
    name: GitHub
    device_code: https://github.com/login/device/code
    token: https://github.com/login/oauth/access_token
    user: https://api.github.com/user
    register: https://github.com/settings/applications/new
    git_scope: repo
    credential_address: https://github.com

# Recover. `node_download` is where its cluster side downloads Node.js from, the folder of its releases. `sources` are the reader rows it lists a dataset's files with, one per `kind` a dataset source of the hub names, and a source of a kind no row names says so and sends no request. A hub's .oculus/config.yml may set `node_download` in its place, and lays its `sources` rows over these by `key`: a row of a key named here replaces it in its place, `{ key: x, removed: true }` takes it out, and a new row comes after these.
recover:
  node_download: https://nodejs.org/dist/
  sources:
    - key: dandi
      name: DANDI
      format: json
      address: 'https://api.dandiarchive.org/api/dandisets/{dandiset}/versions/{version}/assets/'
      paging: { kind: next, from: next, size: page_size, sizes: [100] }
      records: { path: results, refuse_when: zarr }
      fields:
        name: { path: path, op: last }
        size: size
        url: 'https://api.dandiarchive.org/api/assets/{asset_id}/download/'
      pick: { field: assets, by: path }
      then:
        - address: 'https://api.dandiarchive.org/api/dandisets/{dandiset}/versions/{version}/assets/{asset_id}/'
          for_each: asset_id
          fields: { checksum: { path: 'digest.dandi:sha2-256', kind: sha256 } }
    - key: figshare
      name: figshare
      format: json
      address: 'https://api.figshare.com/v2/collections/{collection}/articles'
      holes: { article: '^\d+$' }
      given: { article: id }
      paging: { kind: page, param: page, first: 1, size: page_size, sizes: [100] }
      records: .
      clash: id
      pick: { field: files }
      then:
        - address: 'https://api.figshare.com/v2/articles/{id}'
          for_each: id
          records: files
          fields:
            name: name
            size: size
            checksum: { path: computed_md5, kind: md5 }
            url: download_url
    - key: geo
      name: GEO
      format: html
      address: 'https://ftp.ncbi.nlm.nih.gov/geo/series/{accession|series}/{accession}/suppl/'
      holes: { accession: '^GSE\d+$' }
      expect: { select: title, holds: Index of }
      records: { select: 'pre a:not([href^="/"]):not([href*="?"])' }
      fields:
        name: { attr: href, op: last }
        url: { attr: href, op: resolve }
        size: { op: first_byte_size }
      pick: { field: files }
    - key: huggingface
      name: Hugging Face
      format: json
      address: 'https://huggingface.co/api/datasets/{repo|path}/tree/main?recursive=true&limit=100'
      holes: { repo: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$' }
      paging: { kind: link }
      records: { path: ., where: { type: file } }
      fields:
        name: path
        size: size
        checksum: { path: lfs.oid, kind: sha256 }
        url: 'https://huggingface.co/datasets/{repo|path}/resolve/main/{path|path}'
      pick: { field: patterns, glob: true }
    - key: kaggle
      name: Kaggle
      format: json
      address: 'https://www.kaggle.com/api/v1/datasets/list/{dataset|path}'
      holes: { dataset: '^[A-Za-z0-9][A-Za-z0-9_-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$' }
      auth:
        - basic: true
          row: kaggle
          required: true
          help: The `user` is your Kaggle user name and the `secret` the key of an API token made under Settings on kaggle.com.
      access: { address: 'https://www.kaggle.com/api/v1/datasets/list/{dataset|path}' }
      records: datasetFiles
      archive:
        address: 'https://www.kaggle.com/api/v1/datasets/download/{dataset|path}'
        name: '{dataset|last}.zip'
    - key: physionet
      name: PhysioNet
      format: text
      address: 'https://physionet.org/files/{project}/{version}/SHA256SUMS.txt'
      auth:
        - basic: true
          row: physionet
          help: The `user` and `secret` are your PhysioNet login, on an account with access to this set.
      access: { address: 'https://physionet.org/files/{project}/{version}/SHA256SUMS.txt' }
      pace: { field: throttle }
      records: { op: checksum_file, kind: sha256 }
      fields:
        name: name
        checksum: { path: digest, kind: sha256 }
        url: 'https://physionet.org/files/{project}/{version}/{name|path}'
        size: { op: first_byte_size }
      pick: { field: files }
      archive:
        address: 'https://physionet.org/content/{project}/get-zip/{version}/'
        match: '\.zip$'
        when: archive
    - key: stanford
      name: Stanford Digital Repository
      format: json
      address: 'https://purl.stanford.edu/{druid}.json'
      holes: { druid: '^[a-z]{2}\d{3}[a-z]{2}\d{4}$' }
      records: 'structural.contains[].structural.contains[]'
      fields:
        name: filename
        size: size
        checksum:
          path: 'hasMessageDigests[type=sha1].digest'
          kind: sha1
          else: { path: 'hasMessageDigests[type=md5].digest', kind: md5 }
        url: 'https://stacks.stanford.edu/file/druid:{druid}/{filename|path}'
      pick: { field: files }
    - key: synapse
      name: Synapse
      format: json
      address: 'https://repo-prod.prod.sagebase.org/repo/v1/entity/{ids}'
      for_each: ids
      holes: { ids: '^syn\d+$' }
      auth:
        - header: Authorization
          prefix: 'Bearer '
          row: synapse
          required: true
          help: The `secret` is a personal access token made under Account Settings on synapse.org.
      access: { address: https://repo-prod.prod.sagebase.org/repo/v1/userProfile }
      then:
        - address: 'https://repo-prod.prod.sagebase.org/repo/v1/entity/{id}/filehandles'
          for_each: id
          when: { concreteType: org.sagebionetworks.repo.model.FileEntity }
          records:
            path: list
            unless: { concreteType: org.sagebionetworks.repo.model.file.PreviewFileHandle }
            first: true
          fields:
            name: '{folders}{fileName}'
            size: contentSize
            checksum: { path: contentMd5, kind: md5 }
            url: 'https://repo-prod.prod.sagebase.org/repo/v1/entity/{id}/file'
        - address: https://repo-prod.prod.sagebase.org/repo/v1/entity/children
          for_each: id
          unless: { concreteType: org.sagebionetworks.repo.model.FileEntity }
          method: post
          body: { parentId: '{id}', includeTypes: [file, folder] }
          paging: { kind: cursor, param: nextPageToken, in: body, from: nextPageToken }
          records: page
          recurse:
            when: { type: org.sagebionetworks.repo.model.Folder }
            id: id
            folder: name
            max_depth: 8
          then:
            - address: 'https://repo-prod.prod.sagebase.org/repo/v1/entity/{id}/filehandles'
              for_each: id
              when: { type: org.sagebionetworks.repo.model.FileEntity }
              records:
                path: list
                unless:
                  concreteType: org.sagebionetworks.repo.model.file.PreviewFileHandle
                first: true
              fields:
                name: '{folders}{fileName}'
                size: contentSize
                checksum: { path: contentMd5, kind: md5 }
                url: 'https://repo-prod.prod.sagebase.org/repo/v1/entity/{id}/file'
    - key: tcia
      name: TCIA
      format: json
      address: 'https://services.cancerimagingarchive.net/nbia-api/services/v1/getSeries?Collection={collection}&format=json'
      records: .
      fields:
        name: '{SeriesInstanceUID}.zip'
        url: 'https://services.cancerimagingarchive.net/nbia-api/services/v1/getImage?SeriesInstanceUID={SeriesInstanceUID}'
      pick: { field: series, by: SeriesInstanceUID }
    - key: url
      name: Address
      format: none
      records: { field: urls }
      fields:
        name: { path: name, else: { path: url, op: last } }
        size: { op: first_byte_size }
        checksum: { path: sha256, kind: sha256, else: { path: md5, kind: md5 } }
        url: url
    - key: zenodo
      name: Zenodo
      format: json
      address: 'https://zenodo.org/api/records/{record}'
      records: files
      fields:
        name: key
        size: size
        checksum: { path: checksum, op: strip, prefix: 'md5:', kind: md5 }
        url: links.self
      pick: { field: files }

# The Processes view lists the local processes whose program is one of these names, beside oculus's own terminals.
processes:
  patterns: [python3, codex, claude, node, latexmk]

chat:
  model: "opus"

# The read-only calendar connector: the poll cadence in minutes and the calendar window in days.
calendar:
  poll_min: 15
  days_back: 31
  days_ahead: 62


# === Mail connector =========================================================
# How often the inbox plate is read, and how many threads each of the three plate signals is read.
mail:
  poll_min: 10
  per_signal: 25


# === The source editor ======================================================
# The editor colours a file by running its grammar over the text in the page as it is typed, so a file larger than this many kilobytes opens as plaintext instead; the read-only code window, painted once, colours every size.
# The other keys are VS Code's editor settings of the same names (editor.tabSize, editor.insertSpaces, editor.wordWrap, editor.minimap.enabled, editor.renderWhitespace, editor.stickyScroll.enabled); suggest_details is whether the suggest list opens with its panel of descriptions shown, which toggling the panel writes; autosave, autosave_delay_ms, trim_trailing_whitespace and final_newline are VS Code's files.autoSave, files.autoSaveDelay, files.trimTrailingWhitespace and files.insertFinalNewline; languages holds the records VS Code's per-language settings give, by the editor's language name, and a repository's .oculus/settings.yml overrides them for its files.
editor:
  paint_limit_kb: 20480
  tab_size: 4
  insert_spaces: true
  word_wrap: 'off'
  minimap: true
  render_whitespace: selection
  sticky_scroll: true
  suggest_details: true
  autosave: 'off'
  autosave_delay_ms: 1000
  trim_trailing_whitespace: false
  final_newline: false
  # opacity: 0.8   # how solid the editor stays over the wallpaper, 0 to 1; left out, it is wallpaper.panel_opacity
  languages:
    makefile: { insert_spaces: false }
    markdown: { word_wrap: 'on' }
    yaml: { tab_size: 2 }


# === LaTeX ==================================================================
# What a build runs and when it runs, as LaTeX Workshop's latex.* settings read. A recipe is a named chain of tools and a tool is a program with its arguments; a build runs the chain as one task terminal in the main file's folder, each tool one command joined with && (a tool whose program is not on PATH refuses the build before any terminal starts). The placeholders %DOC% (the main file's path without its extension), %DOC_EXT% (with it), %DOCFILE% and %DOCFILE_EXT% (its name without and with the extension), %DIR% (its folder), %OUTDIR% and %AUXDIR% (the two folders below) are filled in per main file.
# recipe_default: first builds with the first recipe, last_used with the one the reader last asked for. A % !TEX program = xelatex or lualatex comment, or a % !LW recipe = <name> comment, picks the recipe of a file whichever of the two is set.
# out_dir and aux_dir: where the PDF and the auxiliary files go; %DIR% is the main file's own folder, any other value is a folder under the served root, resolved from the main file's folder.
# auto_build: on_file_change builds a main file when any file it includes changes on disk, whoever wrote it; on_save builds when a file of it is saved in the editor; never builds only when asked. auto_build_interval_ms is the shortest time between two automatic builds of one main file. clean_and_retry cleans and builds once more a build that ended in an error. auto_clean runs Clean after a build: never, on_failed, on_succeeded or on_built.
# synctex_path is where the synctex program is (empty finds it on PATH); reverse_synctex is the click that opens the source from the PDF: ctrl_click (Cmd or Ctrl and a click) or double_click. texcount_autorun: on_save counts the words of the main file after each save of a LaTeX file; context_menu adds Build and SyncTeX to the editor's right-click menu.
# formatter is the program Format Document runs on a .tex file: none, latexindent, tex-fmt or badness. Each *_path names where that program is; empty finds it on PATH.
# texlab_path is the texlab program the LaTeX language server runs (an absolute path or one that starts with ~); empty finds texlab on the PATH oculus was started with. A change reaches a running texlab at its next start. unimath_symbols offers the Unicode math symbols of LaTeX Workshop in completion after a backslash, each with its glyph; includegraphics_preview shows the picture beside a file suggested inside \includegraphics.
latex:
  recipe_default: first
  out_dir: "%DIR%"
  aux_dir: "%OUTDIR%"
  auto_build: on_file_change
  auto_build_interval_ms: 1000
  clean_and_retry: true
  auto_clean: never
  synctex_path: ''
  reverse_synctex: ctrl_click
  texcount_autorun: never
  context_menu: false
  unimath_symbols: false
  includegraphics_preview: true
  formatter: none
  latexindent_path: ''
  tex_fmt_path: ''
  badness_path: ''
  texlab_path: ''
  recipes:
    - { name: latexmk, tools: [latexmk] }
    - { name: latexmk (latexmkrc), tools: [latexmk_rconly] }
    - { name: latexmk (lualatex), tools: [lualatexmk] }
    - { name: latexmk (xelatex), tools: [xelatexmk] }
    - { name: pdflatex -> bibtex -> pdflatex * 2, tools: [pdflatex, bibtex, pdflatex, pdflatex] }
    - { name: Compile Rnw files, tools: [rnw2tex, latexmk] }
    - { name: Compile Jnw files, tools: [jnw2tex, latexmk] }
    - { name: Compile Pnw files, tools: [pnw2tex, latexmk] }
    - { name: tectonic, tools: [tectonic] }
  tools:
    - { name: latexmk, command: latexmk, args: [-synctex=1, -interaction=nonstopmode, -file-line-error, -pdf, "-outdir=%OUTDIR%", "-auxdir=%AUXDIR%", "%DOC%"] }
    - { name: lualatexmk, command: latexmk, args: [-synctex=1, -interaction=nonstopmode, -file-line-error, -lualatex, "-outdir=%OUTDIR%", "-auxdir=%AUXDIR%", "%DOC%"] }
    - { name: xelatexmk, command: latexmk, args: [-synctex=1, -interaction=nonstopmode, -file-line-error, -xelatex, "-outdir=%OUTDIR%", "-auxdir=%AUXDIR%", "%DOC%"] }
    - { name: latexmk_rconly, command: latexmk, args: ["%DOC%"] }
    - { name: pdflatex, command: pdflatex, args: [-synctex=1, -interaction=nonstopmode, -file-line-error, "%DOC%"] }
    - { name: bibtex, command: bibtex, args: ["%DOCFILE%"] }
    - { name: rnw2tex, command: Rscript, args: [-e, "knitr::opts_knit$set(concordance = TRUE); knitr::knit('%DOCFILE_EXT%')"] }
    - { name: jnw2tex, command: julia, args: [-e, "using Weave; weave(\"%DOC_EXT%\", doctype=\"tex\")"] }
    - { name: pnw2tex, command: pweave, args: [-f, tex, "%DOC_EXT%"] }
    - { name: tectonic, command: tectonic, args: [--synctex, --keep-logs, --print, "%DOC%.tex"] }


# === Linters ================================================================
# The linters oculus runs on a source tab's file when it is saved and when a tab of a file with no unsaved text opens: ChkTeX for .tex and .latex files, Ruff for .py and .pyi, ESLint for TypeScript, JavaScript and Svelte files under an eslint.config.* file, ShellCheck for .sh, .bash and .slurm, and the writing rules of the hub for Markdown and YAML files and for the comments of code files. The writing rules run no program: they mark each character the hub bans (em and en dashes, curly quotes, the ellipsis, arrows, the non-breaking space) and each Markdown paragraph broken across lines. Their findings are marks in the editor and rows of the Problems view. Each switch is true or false.
# chktex_path, ruff_path and shellcheck_path name the program: an absolute path or one that starts with ~; empty finds it on the PATH oculus was started with. A named path that cannot be used is reported as not found, and the PATH is not tried in its place. ESLint is the one the repository holds, and only after its eslint.config.* files are approved in the palette (:eslint-config).
# chktex_args are the arguments ChkTeX runs with, LaTeX Workshop's by default; oculus adds the output format, -I0 and a .chktexrc found beside the file or in the root.
# writing_skip lists the globs of the files the writing rules leave alone, matched against the path from the file's root, such as vendored trees, received text and generated files. A file named glyphs.yml is skipped whatever the list holds. Empty here: the files are a hub's own, so a hub sets the list in its .oculus/config.yml.
# writing_glyphs lists the globs of the files that draw arrows as icons, where the writing rules mark every banned character but arrows. Empty here, and set by a hub like writing_skip.
lint:
  chktex: true
  ruff: true
  eslint: true
  shellcheck: true
  writing: true
  chktex_path: ''
  ruff_path: ''
  shellcheck_path: ''
  chktex_args: [-wall, -n22, -n30, -e16, -q]
  writing_skip: []
  writing_glyphs: []


# === Writes =================================================================
# How long a save waits for the server's answer before it is given up and its form says so, in seconds.
writes:
  timeout_seconds: 30


# === Notes ==================================================================
# How long a note of a hub's `.oculus/notes/` waits after the last keystroke before its source tab saves it, in milliseconds, whatever `editor.autosave` says. The save is the source tab's own, with its base, its history copy and its conflict rules, and closing the tab inside the wait saves first. A note renamed or moved while its tab holds unsaved text is followed by the tab, so the save writes to the new path; a note moved to the Trash closes its tab and its unsaved text is dropped, so no file appears at the old path.
notes:
  autosave_ms: 800


# === The change log =========================================================
# Every write that changed something is recorded in ~/.oculus/changes.jsonl, or wherever local.yml's `changes` key puts it. `keep` is how many changes the file holds; it is rewritten down to that number, or the few more that keep the last act whole, once it has grown past twice it.
changes:
  keep: 500


# === The Files view =========================================================
# Whether moving a file or folder to the Trash asks first, as VS Code's explorer.confirmDelete. A permanent delete always asks. The question's "Do not ask me again" box writes false here. file_icon_at_arrow: whether a file's row drops the empty slot of a folder's arrow, so its icon sits where its sibling folders' arrows sit; false lines its icon up with theirs, as VS Code's Explorer does.
files:
  confirm_delete: true
  file_icon_at_arrow: true


# === The git panel ==========================================================
# The Changes section of the Session view asks this model for a suggested commit message. Empty uses the command-line default.
# The minutes between two automatic fetches of every repository with a remote, 0 for none.
git:
  message_model: ""
  autofetch_minutes: 0

# === The Zenodo deposit =====================================================
# The Deposit view's For review and Publish send a project's code/ to Zenodo through this row: `address` is the base of every call, `timeout_s` the seconds one upload is given (every other call keeps the reader's limit), and `auth` reads the token from the downloads row it names in the primary hub's .oculus/local.yml. A hub's .oculus/config.yml lays its own fields over these one by one, so a hub that sets only `address` (Zenodo's sandbox) keeps this `auth` and `timeout_s`.
deposit:
  zenodo:
    address: https://zenodo.org/api
    timeout_s: 600
    auth:
      - header: Authorization
        prefix: 'Bearer '
        row: zenodo
        required: true
        help: The `secret` is a personal access token made on Zenodo under Applications, Personal access tokens, with the scopes deposit:write and deposit:actions.


# === Search across files ====================================================
# The Search view runs ripgrep over one served root or all of them. `max_hits` is how many hits one answer carries before it says it was cut; `timeout_s` is how long one root's search is given, and the same time is given to one root's list of file names; `max_names` is how many file names the palette's file mode lists in all before it says the list was cut.
search:
  max_hits: 500
  timeout_s: 10
  max_names: 100000

# === Literature search ======================================================
# The Literature search view asks every source toggled on for one page of hits. `timeout_s` is how many seconds one source is given; `per_source` is how many hits one page asks of each source; `cache_min` is how many minutes an answer is kept for the same request, 0 for none. `sources` are the reader rows of the sources, each the address, the parameters and the fields one source is read by, and `prefer` the order the merge of a paper found by several sources takes a field from them, the sources in the order of `sources` where it names none. Both are read from the primary hub: its .oculus/config.yml lays its `sources` rows over these by `key` (a row of a key named here replaces it in its place, `{ key: x, removed: true }` takes it out, and a new row comes after these) and may set `prefer` in its place.
literature:
  timeout_s: 20
  per_source: 25
  cache_min: 30
  sources:
    - key: openalex
      name: OpenAlex
      format: json
      address: https://api.openalex.org/works
      query:
        words: { param: filter, text: 'title_and_abstract.search:{words|spaced}' }
        doi: { param: filter, text: 'doi:{doi}' }
        years: { param: filter, text: 'publication_year:{from}-{to}' }
        type: { param: filter, text: 'type:{value}' }
        open_access: { param: filter, text: 'is_oa:true' }
        min_cited: { param: filter, text: 'cited_by_count:>{value-1}' }
        author: { param: filter, text: 'raw_author_name.search:{value|spaced}' }
      join: { filter: ',' }
      types:
        article: article
        review: review
        preprint: preprint
        conference: conference-paper
        book: book
        chapter: book-chapter
      paging: { kind: page, param: page, first: 1, size: per-page, total: meta.count }
      params:
        select: id,doi,display_name,publication_year,publication_date,type,cited_by_count,open_access,best_oa_location,primary_location,authorships,ids,abstract_inverted_index,locations
      wait: { reset: x-ratelimit-reset, remaining: x-ratelimit-remaining }
      auth:
        - param: api_key
          row: openalex
          help: The `secret` is an OpenAlex API key, made under Settings on openalex.org. Without it OpenAlex allows about 100 searches a day.
      contact: mailto
      records: results
      fields:
        id: id
        doi: doi
        pmid: { path: ids.pmid, op: match, pattern: '(\d+)/?$' }
        arxiv:
          path: 'locations[].landing_page_url'
          op: match
          pattern: 'arxiv\.org/(?:abs|pdf)/(.+)$'
        title: display_name
        authors: 'authorships[].author.display_name'
        venue: primary_location.source.display_name
        year: publication_year
        date: publication_date
        type: type
        abstract: { path: abstract_inverted_index, op: inverted_index }
        cites: cited_by_count
        oa: open_access.is_oa
        pdf: best_oa_location.pdf_url
        url: { path: primary_location.landing_page_url, op: https, else: id }
    - key: semantic_scholar
      name: Semantic Scholar
      format: json
      address: https://api.semanticscholar.org/graph/v1/paper/search
      query:
        words: { param: query }
        doi:
          address: 'https://api.semanticscholar.org/graph/v1/paper/DOI:{doi|path}'
          params:
            fields: title,abstract,year,venue,authors,externalIds,citationCount,isOpenAccess,openAccessPdf,publicationTypes,publicationDate,journal,url,citationStyles
          missing: none
        id:
          address: 'https://api.semanticscholar.org/graph/v1/paper/{id}'
          params: { fields: citationStyles }
          fields: { bibtex: citationStyles.bibtex }
        years: { param: year, text: '{from}-{to}' }
        type: { param: publicationTypes }
        open_access: { param: openAccessPdf, text: '' }
        min_cited: { param: minCitationCount }
        venue: { param: venue }
      types:
        review: Review
        article: JournalArticle
        conference: Conference
        book: Book
        chapter: BookSection
      paging: { kind: offset, param: offset, size: limit, total: total }
      params:
        fields: title,abstract,year,venue,authors,externalIds,citationCount,isOpenAccess,openAccessPdf,publicationTypes,publicationDate,journal,url,citationStyles
      pace: { gap: 1000 }
      wait: { retry_after: retry-after }
      auth:
        - header: x-api-key
          row: semantic_scholar
          help: The `secret` is a Semantic Scholar API key, asked for on semanticscholar.org/product/api. Without it Semantic Scholar often answers that too many requests were made.
      records: data
      fields:
        id: paperId
        doi: externalIds.DOI
        pmid: externalIds.PubMed
        arxiv: externalIds.ArXiv
        title: title
        authors: 'authors[].name'
        venue: { path: journal.name, else: venue }
        year: year
        date: publicationDate
        type: publicationTypes
        abstract: abstract
        cites: citationCount
        oa: isOpenAccess
        pdf: openAccessPdf.url
        url: url
        bibtex: citationStyles.bibtex
    - key: crossref
      name: Crossref
      format: json
      address: https://api.crossref.org/works
      query:
        words: { param: query.bibliographic }
        doi:
          address: 'https://api.crossref.org/works/{doi|path}'
          records: message
          missing: none
        years: { param: filter, text: 'from-pub-date:{from},until-pub-date:{to}' }
        type: { param: filter, text: 'type:{value}' }
        author: { param: query.author }
        venue: { param: query.container-title }
      join: { filter: ',' }
      types:
        article: journal-article
        preprint: posted-content
        conference: proceedings-article
        book: book
        chapter: book-chapter
      paging: { kind: offset, param: offset, size: rows, total: message.total-results }
      params:
        select: DOI,title,author,published,type,is-referenced-by-count,container-title,abstract,link,license
      pace: { gap: 1000 }
      wait: { retry_after: retry-after }
      contact: mailto
      records: message.items
      fields:
        id: DOI
        doi: DOI
        title: title.0
        authors:
          path: 'author[]'
          each: { path: name, else: { op: join, parts: [given, family] } }
        venue: container-title.0
        date: { path: published.date-parts.0, op: date }
        type: type
        abstract: abstract
        cites: is-referenced-by-count
        url: { op: link, link: doi, id: DOI }
    - key: pubmed
      name: PubMed
      format: json
      address: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi
      query:
        words: { param: term }
        doi: { param: term, text: '{doi}[doi]' }
        years: { param: term, text: '{from}:{to}[dp]' }
        type: { param: term, text: '{value}[pt]' }
        open_access: { param: term, text: 'free full text[sb]' }
        venue: { param: term, text: '"{value|quote}"[ta]' }
        author: { param: term, text: '{value|bare}[au]' }
      join: { term: ' AND ' }
      types:
        review: review
        preprint: preprint
        article: journal article
      paging: { kind: offset, param: retstart, size: retmax, total: esearchresult.count }
      params: { db: pubmed, retmode: json, sort: relevance, tool: oculus }
      pace: { gap: 340, gap_with_key: 100 }
      wait: { retry_after: retry-after }
      auth:
        - param: api_key
          row: ncbi
          help: The `secret` is an NCBI API key, made under Account Settings on ncbi.nlm.nih.gov. It lets PubMed answer more requests a second.
      contact: email
      records: esearchresult.idlist
      then:
        - address: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi
          params: { db: pubmed, id: '{ids}', retmode: xml, tool: oculus }
          ids: .
          order_by: MedlineCitation.PMID
          format: xml
          records: { path: 'PubmedArticleSet.PubmedArticle[]', absent: none }
          fields:
            id: MedlineCitation.PMID
            doi: 'PubmedData.ArticleIdList.ArticleId[@IdType=doi]'
            pmid: MedlineCitation.PMID
            title: { path: MedlineCitation.Article.ArticleTitle, markup: true }
            authors:
              path: 'MedlineCitation.Article.AuthorList.Author[]'
              each:
                path: CollectiveName
                else: { op: join, parts: [ForeName, LastName] }
            venue: MedlineCitation.Article.Journal.Title
            date:
              path: MedlineCitation.Article.Journal.JournalIssue.PubDate
              op: date
              parts: [Year, Month, Day]
              else:
                path: MedlineCitation.Article.Journal.JournalIssue.PubDate.MedlineDate
                op: match
                pattern: '\d{4}'
            type: 'MedlineCitation.Article.PublicationTypeList.PublicationType[]'
            abstract:
              path: 'MedlineCitation.Article.Abstract.AbstractText[]'
              op: join
              by: ' '
              markup: true
            url: { op: link, link: pubmed, id: MedlineCitation.PMID }
    - key: europe_pmc
      name: Europe PMC
      format: json
      address: https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&resultType=core
      query:
        words: { param: query, text: 'TITLE_ABS:({words})' }
        doi: { param: query, text: 'DOI:"{doi}"' }
        years: { param: query, text: 'PUB_YEAR:[{from} TO {to}]' }
        type: { param: query, text: '{value}' }
        open_access: { param: query, text: 'OPEN_ACCESS:y' }
        venue: { param: query, text: 'JOURNAL:"{value|quote}"' }
        author: { param: query, text: 'AUTH:"{value|quote}"' }
      join: { query: ' AND ' }
      types:
        article: 'PUB_TYPE:"journal article"'
        review: 'PUB_TYPE:"review"'
        preprint: 'SRC:PPR'
      paging:
        kind: cursor
        param: cursorMark
        start: '*'
        from: nextCursorMark
        size: pageSize
        total: hitCount
      wait: { retry_after: retry-after }
      records: resultList.result
      fields:
        id: { value: '{source}:{id}', else: 'MED:{id}' }
        doi: doi
        pmid: { path: pmid, else: '[source=MED].id' }
        title: title
        authors: { path: authorString, op: split, suffix: '.', pattern: ',\s*' }
        venue: journalInfo.journal.title
        year: pubYear
        date: firstPublicationDate
        type:
          path: source
          map: { preprint: [PPR] }
          else:
            path: pubTypeList.pubType
            map: { review: [review], article: [journal article, research-article] }
        abstract: abstractText
        cites: citedByCount
        oa: { path: isOpenAccess, map: { 'true': ['Y'] } }
        pdf: 'fullTextUrlList.fullTextUrl[documentStyle=pdf][availabilityCode=OA].url'
        url: { path: id, op: link, link: europepmc }
    - key: arxiv
      name: arXiv
      format: xml
      address: https://export.arxiv.org/api/query
      query:
        words: { param: search_query, text: 'all:{words}', per_word: true }
        doi: { param: id_list, match: '^10\.48550/arxiv\.(.+)$' }
        years: { param: search_query, text: 'submittedDate:[{from}01010000 TO {to}12312359]' }
        author: { param: search_query, text: 'au:{value|phrase}' }
        id:
          address: 'https://doi.org/10.48550/arXiv.{id|path}'
          headers: { accept: application/x-bibtex }
          format: text
          fields: { bibtex: . }
          by: arxiv
      join: { search_query: ' AND ' }
      skip_when: [venue, min_cited]
      types: { preprint: '' }
      types_only: true
      paging:
        kind: offset
        param: start
        size: max_results
        total: 'feed.opensearch:totalResults'
      params: { sortBy: relevance, sortOrder: descending }
      pace: { gap: 3000 }
      wait: { retry_after: retry-after }
      records: { path: 'feed.entry[]', absent: none }
      fields:
        id: { path: id, op: match, pattern: '/abs/(.+?)(?:v\d+)?$' }
        arxiv: { path: id, op: match, pattern: '/abs/(.+?)(?:v\d+)?$' }
        doi: 'arxiv:doi'
        title: title
        authors: 'author[].name'
        date: published
        type: { value: preprint }
        abstract: summary
        oa: { value: true }
        pdf: { op: link, link: arxiv_pdf, id: id }
        url: { op: link, link: arxiv, id: id }
    - key: wos
      name: Web of Science
      format: json
      address: https://api.clarivate.com/apis/wos-starter/v1/documents
      query:
        words: { param: q, text: 'TS=({words})' }
        doi: { param: q, text: 'DO=({doi})' }
        years: { param: q, text: 'PY={from}-{to}' }
        type: { param: q, text: 'DT=({value|phrase})' }
        venue: { param: q, text: 'SO=({value|plain})' }
        author: { param: q, text: 'AU=({value|plain})' }
      join: { q: ' AND ' }
      types:
        article: Article
        review: Review
        conference: Proceedings Paper
      paging: { kind: page, param: page, first: 1, size: limit, max: 50, total: metadata.total }
      params: { db: WOS, sortField: RS D }
      wait: { retry_after: retry-after }
      auth:
        - header: X-ApiKey
          row: wos
          required: true
          help: The `secret` is a Web of Science Starter API key, made on developer.clarivate.com.
      records: hits
      fields:
        id: uid
        doi: identifiers.doi
        pmid: identifiers.pmid
        title: title
        authors: 'names.authors[].displayName'
        venue: source.sourceTitle
        year: source.publishYear
        type: types.0
        cites: 'citations[db=WOS].count'
        url: links.record
    - key: scopus
      name: Scopus
      format: json
      address: https://api.elsevier.com/content/search/scopus
      query:
        words: { param: query, text: 'TITLE-ABS-KEY({words})' }
        doi: { param: query, text: 'DOI({doi})' }
        years: { param: query, text: 'PUBYEAR > {from-1} AND PUBYEAR < {to+1}' }
        type: { param: query, text: 'DOCTYPE({value})' }
        open_access: { param: query, text: 'OPENACCESS(1)' }
        venue: { param: query, text: 'SRCTITLE({value|plain})' }
        author: { param: query, text: 'AUTH({value|plain})' }
      join: { query: ' AND ' }
      types:
        article: ar
        review: re
        conference: cp
        book: bk
        chapter: ch
      paging:
        kind: offset
        param: start
        size: count
        max: 25
        total: 'search-results.opensearch:totalResults'
      params: { sort: relevancy }
      headers: { accept: application/json }
      wait: { retry_after: retry-after }
      auth:
        - header: X-ELS-APIKey
          row: scopus
          required: true
          help: The `secret` is an Elsevier API key, made on dev.elsevier.com.
        - header: X-ELS-Insttoken
          row: scopus-insttoken
          help: The `secret` is the Elsevier institutional token that goes with the Scopus key, sent when the key needs one.
      none_when: 'search-results.entry[].error'
      records: { path: 'search-results.entry[]', absent: none }
      fields:
        id: { path: eid, else: 'dc:identifier' }
        doi: 'prism:doi'
        pmid: pubmed-id
        title: 'dc:title'
        authors: { path: 'author[].authname', else: 'dc:creator' }
        venue: 'prism:publicationName'
        date: 'prism:coverDate'
        type: subtype
        abstract: 'dc:description'
        cites: citedby-count
        oa: openaccessFlag
        url: { path: 'link[@ref=scopus].@href', op: https, host: www.scopus.com }
  prefer:
    fields: []
    abstract: []
    pdf: []

# === The journal browser ====================================================
# The reader row of the journal browser a hub's venues are searched in and read from: one row, in each hub's own .oculus/config.yml, and none shipped, so a hub with no row shows no browser.
venues:
  browser: {}

# === Links ==================================================================
# The addresses a page link is built from, each a `key` and an `address` with `{id}`: a paper's page by its DOI, an abstract page by a preprint id, a lint rule's page. A link whose row is missing is not drawn. They are read from the primary hub, whose .oculus/config.yml lays its rows over these by `key`: a row of a key named here replaces it in its place, `{ key: x, removed: true }` takes it out, and a new row comes after these.
links:
  - { key: doi, address: 'https://doi.org/{id|path}' }
  - { key: arxiv, address: 'https://arxiv.org/abs/{id|path}' }
  - { key: arxiv_pdf, address: 'https://arxiv.org/pdf/{id|path}' }
  - { key: pubmed, address: 'https://pubmed.ncbi.nlm.nih.gov/{id}/' }
  - { key: europepmc, address: 'https://europepmc.org/article/{source}/{id}' }
  - key: scholar
    address: 'https://scholar.google.com/scholar?q={id}&as_ylo={from}&as_yhi={to}'
  - { key: shellcheck, address: 'https://www.shellcheck.net/wiki/{id}' }

# === Open in its program ====================================================
# Each extension a file may carry to be handed to a program on this machine, with the bundle id of the one application it opens in on macOS; on Linux the desktop's own program for the type opens it and the bundle id is not used. A file of any other extension, and a listed file with an execute bit, marked as a Finder alias on macOS or ending .desktop on Linux, is refused; a folder is shown in Finder on macOS and opened in the file manager on Linux. Read again at every request.
open:
  program_ext:
    ".docx": com.microsoft.Word
    ".doc": com.microsoft.Word
    ".xlsx": com.microsoft.Excel
    ".xls": com.microsoft.Excel
    ".pptx": com.microsoft.Powerpoint
    ".ppt": com.microsoft.Powerpoint
    ".rtf": com.apple.TextEdit
    ".pages": com.apple.iWork.Pages
    ".numbers": com.apple.iWork.Numbers
    ".key": com.apple.iWork.Keynote
    ".pdf": com.apple.Preview


# === Apps ===================================================================
# An app is a folder of web files that oculus finds while it runs and draws in a sandboxed frame once the reader has approved it. These are the limits an app's frame is held to and the folders `open` never reaches for an app.
apps:
  # Seconds a frame is given to complete the bridge handshake before it is drawn as failed to load.
  connect_timeout_s: 10
  # Kilobytes of one tab's saved state that `setState` accepts.
  state_max_kb: 64
  # Kilobytes of an app's store that `setStore` accepts and `getStore` reads.
  store_max_kb: 256
  # Writes, `setStore` included, that pass per frame or per host per minute; a host's store updates, a secret's stores and deletes and a custom editor's `document.save` count here.
  writes_per_min: 30
  # Calls of `open`, `commands.run`, `commands.execute` and `createPanel` that pass per frame per minute, and of `executeCommand` per host.
  opens_per_min: 30
  # Calls of `sendToPage` per host and of the `ui` calls (messages, quick pick, input box, progress) per host or frame that pass per minute.
  messages_per_min: 600
  # Key events per second the page takes from a frame.
  keys_per_s: 20
  # Files an app's folder may hold.
  max_files: 500
  # Megabytes an app's files may total, and the most a custom editor reads or saves in one file.
  max_mb: 20
  # Kilobytes of a host's output kept, beside the last 1000 lines.
  host_output_kb: 256
  # Seconds a host's `deactivate` is given to settle before the host is sent SIGTERM.
  host_stop_seconds: 5
  # Entries per root that a `workspaceContains` look and a `readDirectory` read at most.
  scan_entries: 10000
  # Folders, each relative to a root and applied to every root, that `open({ file })` and a custom editor's document never reach for an app, compared by segment and without regard to letter case. A key that is missing or is not a list of folder paths closes every file.
  closed_paths: [secrets]


# === The status bar =========================================================
# The items hidden from the bar (each by the id the bar gives it), whether Do Not Disturb keeps notifications from showing a toast, and the repository the reader last chose in the bar's repository item (by its root, empty for none). The bar's right-click menu, the Do Not Disturb button and the repository item write them.
status_bar:
  hidden: []
  quiet: false
  repository: ''

# The values of the settings that apps declare under `contributes.configuration`, as a map from the setting's whole key (`notes.width` is one key) to its value. The map is kept in a hub's own .oculus/config.yml, where `app_settings` is a key of the hub list; the apps read the map of the primary hub's .oculus/config.yml, and the Settings view writes into that file. A value outside its setting's type, `enum` or bounds, and a key no approved app declares, is a finding and the app reads its default. This file sets no map.
