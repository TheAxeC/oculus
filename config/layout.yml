# ===========================================================================
# layout.yml
# oculus's own configuration, how things are arranged: the rail's pages and what each page starts as, the view catalogue's groups, the board chrome, the tab-button rollups, the live count badges, and which title a surface draws.
# Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# The rail: one button per page, drawn in this order, the digits 1 to 9 showing the first nine. `label` is the button's words, `glyph` a name in config/catalogs/glyphs.yml, and `page` a key of `arrangements:` below, which is what the page is first made from and what the saved page stays tied to, so a button renamed keeps its page. A page key named twice, or naming no arrangement, draws no second button and is a finding. The Settings view edits this list.
rail:
  - { label: "Focus", glyph: compass, page: focus }
  - { label: "Projects", glyph: paper, page: projects }
  - { label: "Academic Life", glyph: scout, page: academic }
  - { label: "Pillars", glyph: pillar, page: pillars }
  - { label: "Feeds", glyph: litwatch, page: feeds }
  - { label: "References", glyph: venue, page: references }
  - { label: "Present", glyph: poster, page: present }
  - { label: "Explorer", glyph: folder, page: explorer }
  - { label: "Sessions", glyph: live, page: sessions }
  - { label: "Info/more", glyph: info, page: info }
  - { label: "Calendar", glyph: calendar, page: calendar }
  - { label: "Inbox", glyph: inbox, page: inbox }
  - { label: "Views and Settings", glyph: sliders, page: views }


# The view catalogue's groups, in the order the Views view lists them. A view names its group and position in its registration. A group with no registered views is not listed. A group holding more than four entries, its views and its documents together, is reached only by its `chord`; the others are counted under `direct_chord`. `glyph` is the group heading's glyph name, and `chord` is its optional one-letter keyboard prefix.
nav_groups:
  boards: { label: "Boards" }
  structure: { label: "Pillars", glyph: pillar }
  sessions: { label: "Sessions", glyph: live, chord: m }
  academic: { label: "Academic life", glyph: scout, chord: c }
  sources: { label: "Sources", glyph: folder, chord: s }
  feeds: { label: "Feeds", glyph: scout }
  personal: { label: "Personal" }
  system: { label: "System", glyph: audit, chord: y }


# The one-letter prefix that reaches the views of the catalogue's groups of four entries or fewer by number: the letter, then a digit for the view's place among them. The groups above name their own prefixes; a value that is not one lowercase letter means no such prefix, and those views are reached from the catalogue alone.
direct_chord: v


# What each rail page is first made from, by the key its `rail:` entry names. After that first press the page is the one the reader arranged, kept in the saved layout. An arrangement carries `root`, the page's one tree. A node is `{ kind: split, dir, sizes, children }` or `{ kind: pane, view }`, where `view` is one view id or a list of them (the tabs of that pane). It is the layout tree of DESIGN.md with the instance ids left out, since those are minted fresh when the page is made. An arrangement that does not add up makes no page.
arrangements:
  focus:
    root: { kind: pane, view: focus }
  projects:
    root: { kind: pane, view: [projects, coauthor, archive] }
  academic:
    root: { kind: pane, view: [funding, events, education, applications, joint-work, tasks] }
  pillars:
    root: { kind: pane, view: [pillars, domains, map] }
  feeds:
    root: { kind: pane, view: [radar, leads, linkedin] }
  references:
    root: { kind: pane, view: [venues, data, code, statements] }
  present:
    root: { kind: pane, view: present }
  explorer:
    root: { kind: pane, view: [files, repositories, search] }
  sessions:
    root:
      kind: split
      dir: row
      sizes: [0.7, 0.3]
      children:
        - kind: split
          dir: row
          sizes: [0.28, 0.72]
          children:
            - { kind: pane, view: session-list }
            - kind: split
              dir: col
              sizes: [0.6, 0.4]
              children:
                - { kind: pane, view: terminal }
                - { kind: pane, view: [transcript, timeline] }
        - { kind: pane, view: [session-detail, changes, agents] }
  info:
    root: { kind: pane, view: [status, findings, audit, history, usage, help] }
  calendar:
    root: { kind: pane, view: calendar }
  inbox:
    root: { kind: pane, view: inbox }
  views:
    root:
      kind: split
      dir: row
      sizes: [0.5, 0.5]
      children:
        - { kind: pane, view: catalogue }
        - kind: split
          dir: col
          sizes: [0.6, 0.4]
          children:
            - { kind: pane, view: settings }
            - { kind: pane, view: pages }


# Board (Projects / Archive / Coauthor) chrome: list-view column headers, the per-board search placeholder,
# and the synthetic "No funding" aggregate card. The column words map positionally to the fixed span classes.
board:
  cols_project: [Project, Authors, Venue, Status, Focus, Next]
  cols_archive: [Paper, Authors, Venue, Domain, Pillar, Funding]
  search:
    projects: "Search title | eli5 | results | ideas | doc text ..."
    archive:  "Search archive | title | eli5 | outcome | doc text ..."
    coauthor: "Search coauthor | title | eli5 | outcome | doc text ..."
  no_funding:
    label: "No funding"
    sub: "Projects with no grant attached - auto-aggregated."


# Tab-button count rollups: the little N|N|N split on the Archive/Coauthor tab buttons (like the projects
# active/manuscript/idea one). Each segment = a bucket of type/chip keys; buckets are mutually exclusive and
# cover every card (a card lands in the FIRST bucket whose keys its type or one of its chips matches).
tab_split: { active: green, manuscript: amber, idea: violet }

tab_rollup:
  projects:
    - { label: "in progress", keys: [active, manuscript], color: "#16a34a" }
    - { label: idea,          keys: [idea],               color: "#7c5cff" }
  archive:
    - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
    - { label: outputs,       keys: [thesis, abstract, poster, tech-report, software], color: "#0ea5e9" }
    - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }
  coauthor:
    - { label: "in progress", keys: [submitted, in-prep, exploring],                   color: "#16a34a" }
    - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
    - { label: outputs,       keys: [abstract, poster, tech-report, software],         color: "#0ea5e9" }
    - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }


# Live-count badges on collection nav tabs: `match` = the entry statuses that count, `label` = the tooltip word.
# The badge takes the colour of the STATUS it counts (vocab.yml `status_palette:`), so `in prep` on the
# Funding tab is the same violet as an in-prep chip on a card. Set `tone:` to force an urgency class
# (`red` / `amber` / `green`) instead - used where a count means "act", not "here is how many".
nav_live:
  joint-work: { match: [exploring], label: exploring }
  funding:        { match: [in-prep, "in prep", submitted], label: undecided }
  education:      { match: [ongoing], label: ongoing }
  tasks:          { match: [todo, doing], label: open, tone: amber }


# Project-title label mode per surface - `short` = a manifest's `short:` if set, else the full title (NO id is
# ever shown); `full` = always the full title. Projects + Archive also have a live Aa toggle in the UI that
# overrides their default below (persisted per browser). The full title is always on hover.
focus_label_mode: short      # Focus board cards and the "This week" ticker

project_label_mode: short    # Projects tab cards / list rows (live Aa toggle overrides)

archive_label_mode: short    # Archive tab cards / list rows (live Aa toggle overrides)

map_label_mode: short        # Map tab nodes


# Hub documents in the view catalogue: one entry inside its group, listed after the group's views, opening the `doc` view over api/docs. `path` is relative to the research hub, `group` is a key of `nav_groups` above, and `label` is the tab's words. A path with no file there draws the view's own missing line.
docs:
  - { label: "Research approach", path: RESEARCH-APPROACH.md, group: personal }
  - { label: "Agent approach",    path: AGENT-APPROACH.md,    group: personal }
  - { label: "HPC how-to",        path: HPC-UTwente-howto.md, group: system }
