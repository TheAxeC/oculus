# ===========================================================================
# layout.yml
# oculus's own configuration - how things are arranged: the rail's groups, the board chrome, the
# tab-button rollups, the live count badges, and which title a surface draws.
# Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# The rail's groups: each group = { label, keys, glyph? } is drawn as a heading over the views it names,
# in the order listed here; a view no group names trails at the end, and a group naming no registered
# view is not drawn. A key is a view id; the ids under "Academic life", "Sources" and "Personal" are
# views a later step registers. The heading sits in a 52 px strip, so a label drawn there is eight
# letters at most; a group holding more than four registered views is drawn instead as one button with
# the list beside it, and its label is that button's tooltip rather than a heading. `glyph` is a name in
# glyphs.yml and is what that one button carries; a group drawn that way without one carries its first
# view's glyph.
nav_groups:
  boards:
    - { label: "Boards",        keys: [focus, projects, coauthor, archive, programs, domains, map] }
  sessions:
    - { label: "Sessions",      glyph: chat,  keys: [session-list, session-detail, terminal, transcript, timeline, changes, agents] }
  collections:
    - { label: "Academic life", glyph: scout, keys: [funding, events, education, applications, collaborations, tasks] }
    - { label: "Sources",       keys: [venues, data, code, statements] }
  feeds:
    - { label: "Feeds",         glyph: scout, keys: [radar, leads, inbox, linkedin] }
  more:
    - { label: "Personal",      keys: [approach, agent-approach, memories] }
    - { label: "System",        keys: [status, findings, gallery, hpc, help, audit, config] }


# Saved arrangements: a whole workbench written by hand, applied by a control in the rail's panel menu.
# A node is `{ kind: split, dir, sizes, children }` or `{ kind: pane, view }`, where `view` is one view
# id or a list of them (the tabs of that pane); `dock` and `panel_size` are the panel's, and default to
# right and 0.3. It is the layout tree of DESIGN.md with the instance ids left out, since those are
# minted fresh every time the arrangement is applied. An arrangement that does not add up is ignored.
arrangements:
  sessions:
    dock: right
    main:
      kind: split
      dir: row
      sizes: [0.28, 0.72]
      children:
        - { kind: pane, view: session-list }
        - kind: split
          dir: col
          sizes: [0.6, 0.4]
          children:
            - { kind: pane, view: terminal }
            - { kind: pane, view: [transcript, timeline] }
    panel:
      kind: pane
      view: [session-detail, changes, agents]


# Board (Projects / Archive / Coauthor) chrome: list-view column headers, the per-board search placeholder,
# and the synthetic "No funding" aggregate card. The column words map positionally to the fixed span classes.
board:
  cols_project: [Project, Authors, Venue, Status, Focus, Next]
  cols_archive: [Paper, Authors, Venue, Domain, Research line, Funding]
  search:
    projects: "Search title | eli5 | results | ideas | doc text ..."
    archive:  "Search archive | title | eli5 | outcome | doc text ..."
    coauthor: "Search coauthor | title | eli5 | outcome | doc text ..."
  no_funding:
    label: "No funding"
    sub: "Projects with no grant attached - auto-aggregated."


# Tab-button count rollups: the little N|N|N split on the Archive/Coauthor tab buttons (like the projects
# active/manuscript/idea one). Each segment = a bucket of type/chip keys; buckets are mutually exclusive and
# cover every card (a card lands in the FIRST bucket whose keys its type or one of its chips matches).
tab_rollup:
  projects:
    - { label: "in progress", keys: [active, manuscript], color: "#16a34a" }
    - { label: idea,          keys: [idea],               color: "#7c5cff" }
  archive:
    - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
    - { label: outputs,       keys: [thesis, abstract, poster, tech-report, software], color: "#0ea5e9" }
    - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }
  coauthor:
    - { label: "in progress", keys: [submitted, in-prep, exploring],                   color: "#16a34a" }
    - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
    - { label: outputs,       keys: [abstract, poster, tech-report, software],         color: "#0ea5e9" }
    - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }


# Live-count badges on collection nav tabs: `match` = the entry statuses that count, `label` = the tooltip word.
# The badge takes the colour of the STATUS it counts (vocab.yml `status_palette:`), so `in prep` on the
# Funding tab is the same violet as an in-prep chip on a card. Set `tone:` to force an urgency class
# (`red` / `amber` / `green`) instead - used where a count means "act", not "here is how many".
nav_live:
  collaborations: { match: [exploring], label: exploring }
  funding:        { match: [in-prep, "in prep", submitted], label: undecided }
  education:      { match: [ongoing], label: ongoing }
  tasks:          { match: [todo, doing], label: open, tone: amber }


# Project-title label mode per surface - `short` = a manifest's `short:` if set, else the full title (NO id is
# ever shown); `full` = always the full title. Projects + Archive also have a live Aa toggle in the UI that
# overrides their default below (persisted per browser). The full title is always on hover.
focus_label_mode: short      # 🎯 Focus board cards + "This week" ticker

project_label_mode: short    # Projects tab cards / list rows (live Aa toggle overrides)

archive_label_mode: short    # Archive tab cards / list rows (live Aa toggle overrides)

map_label_mode: short        # Map tab nodes


# Documents in the rail's Docs section - a local HTML file under one of `roots:` (sources.yml), opened as
# its own tab by the `document` view. `root` is a key of that list, `path` is relative to the root's dir.
bookmarks:
  - { label: "cathedra manual",    root: cathedra,    path: docs/user/manual.html }
  - { label: "game-engine manual", root: game-engine, path: docs/user/manual.html }
