# ===========================================================================
# layout.yml
# Part of the split cockpit config - merged by cockpit.config.load_config() (cockpit.yml + config/*.yml).
# ===========================================================================


# Where to find projects (paths relative to research/). A project is any subfolder that contains a
# project.yml; its tier/outcome comes from the LOCATION below (mirrored in the manifest). Folder == id.
scan:
  - { dir: projects/ideas,       type: idea,       tier: projects }
  - { dir: projects/active,      type: active,     tier: projects }
  - { dir: projects/manuscripts, type: manuscript, tier: projects }
  - { dir: projects/coauthor,    nested: true, tier: coauthor }   # nested; type (the outcome) read from each manifest
  - { dir: projects/archive,     nested: true, tier: archive }    # nested; type (the outcome) read from each manifest


# Top-bar tab order (moved out of page.py, 2026-07). `primary` = shown inline in the nav; `more` = under the
# "More" dropdown; every other registered tab (collections / registries) falls under "Collections". Keys
# match page.py's tab registry (`reg(key, ...)`). Add a new primary tab HERE, not in the Python.
nav:
  primary: [focus, projects, archive, coauthor, inbox, radar, leads, linkedin, slurm, sessions]
  more:    [approach, agents, memories, hpc, help, audit, config]

# Optional divider headers inside the Collections / More dropdowns - group related tabs so the long list reads
# clearly. Each group = { label, keys }; a key not in any group trails at the end (ungrouped). Order = groups
# render top-to-bottom in the order listed here (overrides the raw registration order within the dropdown).
nav_groups:
  collections:
    - { label: "Portfolio",     keys: [programs, domains, map] }
    - { label: "Academic life", keys: [funding, events, education, applications, collaborations, tasks] }
    - { label: "Reference",     keys: [venues, data, code, statements] }
  more:
    - { label: "Personal",    keys: [approach, agents, memories] }
    - { label: "System",      keys: [hpc, help, audit, config] }


# Top-bar tab LABELS (the words; order is `nav:` above, icons are `glyphs:`). Fixed-word tabs read their
# label here via T-style lookup in page.py; counts/rollups stay dynamic. docs:/collections:/indexes: carry
# their own `title:`, so they are not repeated here. Edit a tab's wording HERE, not in page.py.
tabs:
  focus:    { label: Focus }
  projects: { label: Projects }
  archive:  { label: Archive }
  coauthor: { label: Coauthor }
  map:      { label: Map }
  programs: { label: Pillars }
  domains:  { label: Domains }
  leads:    { label: Position Leads }
  linkedin: { label: LinkedIn }
  radar:    { label: Lit Watch }
  data:     { label: Data }
  venues:   { label: Venues }
  memories: { label: Memories }
  slurm:    { label: Live HPC }
  sessions: { label: Sessions }
  help:     { label: Help }
  audit:    { label: Audit }
  config:   { label: Config }


# Board (Projects / Archive / Coauthor) chrome: list-view column headers, the per-board search placeholder,
# and the synthetic "No funding" aggregate card. The column words map positionally to the fixed span classes.
board:
  cols_project: [Project, Authors, Venue, Status, Focus, Next]
  cols_archive: [Paper, Authors, Venue, Domain, Research line, Funding]
  search:
    projects: "Search title | eli5 | results | ideas | doc text ..."
    archive:  "Search archive | title | eli5 | outcome | doc text ..."
    coauthor: "Search coauthor | title | eli5 | outcome | doc text ..."
  no_funding:
    label: "No funding"
    sub: "Projects with no grant attached - auto-aggregated."


# Lit-Watch radar buckets: (key, glyph name, label, colour). New papers per project are classified into one
# of these; `glyph` is a `glyphs:` key. Edit a label/colour HERE (was hardcoded in config.py before 2026-07).
radar_buckets:
  - { key: preemption,    glyph: red,    label: "Pre-emption risk", color: "#dc2626" }
  - { key: idea,          glyph: purple, label: "Idea sparks",      color: "#7c5cff" }
  - { key: cite_baseline, glyph: green,  label: "Cite / baseline",  color: "#16a34a" }
  - { key: adjacent,      glyph: white,  label: "Adjacent",         color: "#94a3b8" }


# Interactive collection file map (collection key -> its YAML path, relative to research/). Drives the
# served edit forms + the radar/deadline scan. Add a new editable collection HERE.
coll_files:
  education:      education/education.yml
  events:        network/events.yml
  funding:       funding/funding.yml
  applications:  applications/applications.yml
  collaborations: network/collaborations.yml
  tasks:         tasks/tasks.yml


# Live-count badges on collection nav tabs: `match` = the entry statuses that count, `label` = the tooltip word.
# The badge takes the colour of the STATUS it counts (vocab.yml `status_palette:`), so `in prep` on the
# Funding tab is the same violet as an in-prep chip on a card. Set `tone:` to force an urgency class
# (`red` / `amber` / `green`) instead - used where a count means "act", not "here is how many".
nav_live:
  collaborations: { match: [exploring], label: exploring }
  funding:        { match: [in-prep, "in prep", submitted], label: undecided }
  education:      { match: [ongoing], label: ongoing }
  tasks:          { match: [todo, doing], label: open, tone: amber }


# Collection tabs - a generic card list from one YAML (entries: title/sub/status/date/meta/tags/related/link/url/note).
# Schema: README.md. Files are editable in served mode. `related:` ids cross-link to project cards.
collections:
  - { key: statements,     title: "Statements",         icon: "§", file: "registries/boilerplate.yml" }
  - { key: funding,        title: "Funding",            icon: "◈", file: "funding/funding.yml" }
  - { key: events,         title: "Talks & Events",     icon: "🗓", file: "network/events.yml" }
  - { key: education,      title: "Education & Service", icon: "🏫", file: "education/education.yml" }
  - { key: applications,   title: "Applications",       icon: "▤", file: "applications/applications.yml" }
  - { key: collaborations, title: "Collaborations",     icon: "🤝", file: "network/collaborations.yml" }
  - { key: tasks,          title: "Tasks & Service",    icon: "🧷", file: "tasks/tasks.yml" }
  - { key: code,           title: "Code",               icon: "💻", file: "registries/repos.yml" }


# Full-markdown tabs (each may concatenate several files; missing files flagged).
docs:
  - { key: inbox,     title: "📨 Inbox",  after_map: true, paths: ["feeds/inbox.yml"] }   # private email; tracked since 2026-08-10, never leaves this repo
  - { key: hpc,       title: "HPC - UTwente",   paths: ["HPC-UTwente-howto.md"] }
  - { key: approach,  title: "🧭 Research Approach", paths: ["RESEARCH-APPROACH.md"] }   # how I do research + how it differs (private strategy prose)
  - { key: agents,    title: "🧰 Agent Approach",    paths: ["AGENT-APPROACH.md"] }       # how I work with agents: modes, context budget, enforcement (private)


# Auto-index tabs - a searchable file listing from a folder scan (no curation, no YAML).
# Shape: { key, title, icon, dir, ext: [".pdf"] }. Keep this an explicit [] when empty; a bare
# "indexes:" parses as null and page.py iterates it directly.
# The Literature tab was dropped 2026-08-10 with the literature/ PDF library it scanned. The Lit
# Watch radar below is a DIFFERENT thing (research intel, feeds/literature-radar.yml) and stays.
indexes: []


# Programs registry -> the Programs tab (membership computed from manifests' `program:`). key must match.
programs_file: registries/programs.yml

# Domains tab (group projects by the `domain:` field -> application area). key matches a domain value.
domains_file: registries/domains.yml


# Dataset registry tab (Data) - provenance + recovery recipe per dataset (registries/data.yml).
# `used_by:` ids cross-link to project cards; the re-downloader (tools/data/redownload.py) reads the same file.
datasets_file: registries/data.yml


# Venue catalogue tab (Venues, in Collections) - journals + conferences (registries/venues.yml).
venues_file: registries/venues.yml


# Position Leads tab: the scout's YAML, rendered as cards (build.py leads_cards_html). Moved into the
# hub's feeds/ on 2026-09-10 (it was in the cockpit's own data/ from 2026-08-08, and before that a
# separate git clone at applications/academic-position-leads/).
# The search spec the scout reads sits beside the skill: .agents/skills/research-cockpit/position-leads-readme.md.
leads_file: feeds/position-leads.yml


# Lit Watch tab: the literature-scout radar (build.py radar_tab_html). New papers per active/manuscript
# project, classified pre-emption / cite-baseline / adjacent, plus cross-pollination idea sparks. Entries
# accumulate (/research-cockpit litwatch dedups by url + appends). Local tab only - no email/cron.
radar_file: feeds/literature-radar.yml

# Public website publications feed, cross-checked in the Audit tab (missing / leaked / wrong-section / untracked).
# Separate repo dir - if it is not checked out, the check is skipped silently.
publications_file: theaxec.github.io/_data/publications.yml

# LinkedIn tab: posts pipeline from the website (_linkedin/: numbered = posted, xx- = ideas).
linkedin_dir: theaxec.github.io/_linkedin

# Career tab: per-scheme `statement:` fields surface on the Funding tab; the strategy
# (order of work | hosts | eligibility | dropped) lives in CAREER.yml and surfaces on the Focus "Career strategy" panel.
career_file: CAREER.yml


# Repos to `git pull --ff-only` before each build (keeps embedded clones fresh). Best-effort: a
# non-repo / offline / diverged path just warns. Paths are relative to the research root.
# Empty since 2026-08-08: the only entry was the position-leads clone, now folded into data/. Add a
# path here if a future embedded clone needs refreshing before a build.
git_sync: []
