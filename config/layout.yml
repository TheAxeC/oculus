# ===========================================================================
# layout.yml
# oculus's own configuration, how things are arranged: the rail's pages and what each page starts as, the view catalogue's groups, the board chrome, the tab-button rollups, the live count badges, and which title a surface draws.
# Merged with the other config/*.yml by loadConfig().
# ===========================================================================


# The rail: one button per page, drawn in this order, the digits 1 to 9 showing the first nine. `label` is the button's words, `glyph` a name in config/catalogs/glyphs.yml, and `page` a key of `arrangements:` below, which is what the page is first made from and what the saved page stays tied to, so a button renamed keeps its page. A page key named twice, or naming no arrangement, draws no second button and is a finding. The Settings view edits this list.
rail:
  - { label: "Focus", glyph: compass, page: focus }
  - { label: "Sessions", glyph: live, page: sessions }
  - { label: "Projects", glyph: paper, page: projects }
  - { label: "Incoming", glyph: email, page: incoming }
  - { label: "Explorer", glyph: folder, page: explorer }
  - { label: "Academic Life", glyph: scout, page: academic }
  - { label: "Pillars", glyph: pillar, page: pillars }
  - { label: "References", glyph: venue, page: references }
  - { label: "Present", glyph: poster, page: present }
  - { label: "Help", glyph: question, page: help }
  - { label: "System", glyph: sliders, page: views }


# The view catalogue's groups, in the order the Views view lists them: every group is one rail page, keyed by the page's arrangement key and labelled with its button's words, so the catalogue lists each page's views under the page they sit on. A view names its group and position in its registration, and a document of `docs:` below names its group. A group with no registered views is not listed. `glyph` is the group heading's glyph name, one no view of the group carries, so the heading does not read as one of its entries, and `chord` its one-letter keyboard prefix: the letter, then a digit for the entry's place in the group, its views first and its documents after them. A group with no `chord` is counted under `direct_chord`.
nav_groups:
  focus: { label: "Focus", glyph: focus, chord: f }
  sessions: { label: "Sessions", glyph: live, chord: m }
  projects: { label: "Projects", glyph: paper, chord: p }
  incoming: { label: "Incoming", glyph: email, chord: e }
  explorer: { label: "Explorer", glyph: folder, chord: s }
  academic: { label: "Academic Life", glyph: scout, chord: c }
  pillars: { label: "Pillars", glyph: book, chord: l }
  references: { label: "References", glyph: venue_dist, chord: r }
  present: { label: "Present", glyph: conference, chord: t }
  help: { label: "Help", glyph: page, chord: h }
  views: { label: "System", glyph: settings, chord: y }


# The one-letter prefix that reaches, by number, the views of the catalogue's groups that name no `chord` and the views no group holds: the letter, then a digit for the view's place among them. A value that is not one lowercase letter means no such prefix, and those views are reached from the catalogue alone.
direct_chord: v


# What each rail page is first made from, by the key its `rail:` entry names, and what Reset gives it back. After that first press the page is the one the reader arranged, kept in the saved layout. An arrangement carries `root`, the page's one tree. A node is `{ kind: split, dir, sizes, children }` or `{ kind: pane, view }`, where `view` is one view id or a list of them (the tabs of that pane), and a tab of the list may be `{ view, state }` to open it in a state of its own, as the sessions page's Files tab follows the selected session with `state: { follow: true }`. `view: []` is an empty pane, the one a view opened for something (a project, a document, a file) lands in. It is the layout tree of DESIGN.md with the instance ids left out, since those are minted fresh when the page is made. An arrangement that does not add up makes no page.
arrangements:
  focus:
    root: { kind: pane, view: focus }
  sessions:
    root:
      kind: split
      dir: row
      sizes: [0.7, 0.3]
      children:
        - kind: split
          dir: row
          sizes: [0.28, 0.72]
          children:
            - { kind: pane, view: session-list }
            - kind: split
              dir: col
              sizes: [0.6, 0.4]
              children:
                - { kind: pane, view: terminal }
                - { kind: pane, view: [transcript, timeline] }
        - { kind: pane, view: [session-detail, changes, agents, { view: files, state: { follow: true } }] }
  projects:
    root: { kind: pane, view: [projects, coauthor, archive, personal] }
  incoming:
    root:
      kind: split
      dir: row
      sizes: [0.6, 0.4]
      children:
        - { kind: pane, view: [inbox, radar, leads, linkedin, literature] }
        - { kind: pane, view: calendar }
  explorer:
    root:
      kind: split
      dir: row
      sizes: [0.4, 0.6]
      children:
        - { kind: pane, view: [files, repositories, search] }
        - { kind: pane, view: [] }
  academic:
    root: { kind: pane, view: [funding, events, education, applications, joint-work, tasks] }
  pillars:
    root: { kind: pane, view: [pillars, domains, map] }
  references:
    root: { kind: pane, view: [venues, data, code, statements] }
  present:
    root: { kind: pane, view: present }
  help:
    root:
      kind: split
      dir: row
      sizes: [0.6, 0.4]
      children:
        - { kind: pane, view: [help, { view: doc, state: { id: docs/HPC-UTwente-howto.md, path: docs/HPC-UTwente-howto.md, label: "HPC how-to" } }, { view: doc, state: { id: docs/DATA-MAP.md, path: docs/DATA-MAP.md, label: "Data map" } }] }
        - { kind: pane, view: [{ view: doc, state: { id: docs/RESEARCH-APPROACH.md, path: docs/RESEARCH-APPROACH.md, label: "Research approach" } }, { view: doc, state: { id: docs/AGENT-APPROACH.md, path: docs/AGENT-APPROACH.md, label: "Agent approach" } }, memories] }
  views:
    root:
      kind: split
      dir: row
      sizes: [0.5, 0.5]
      children:
        - { kind: pane, view: [settings, account-setup] }
        - kind: split
          dir: col
          sizes: [0.5, 0.5]
          children:
            - { kind: pane, view: [catalogue, pages, processes] }
            - { kind: pane, view: [status, findings, audit, history, gallery] }


# The floats a browser with no saved layout starts with, and Reset all pages gives back: panes over every page, each one a pane of tabs (`view` is one view id or a list of them, as in an arrangement's pane) placed either docked on an edge of the window, `{ view, dock: left | right | bottom, size }` where `size` is the fraction of the window's width (its height for `bottom`) from 0.1 to 0.6, or free, `{ view, x, y, w, h }` in fractions of the window with `x + w` and `y + h` at most 1 and `w` and `h` at least 0.1. One float may be docked on an edge; of two on one edge the first stays. After that first load the floats are the reader's own, kept in the saved layout beside the pages. An entry that does not add up is left out and the rest kept.
floats:
  - { view: [hpc, usage], dock: right, size: 0.3 }


# Board (Projects / Archive / Coauthor) chrome: list-view column headers and the per-board search placeholder.
# The column words map positionally to the fixed span classes.
board:
  cols_project: [Project, Authors, Venue, Status, Focus, Next]
  cols_archive: [Paper, Authors, Venue, Domain, Pillar, Funding]
  search:
    projects: "Search title | eli5 | results | ideas | doc text ..."
    archive:  "Search archive | title | eli5 | outcome | doc text ..."
    coauthor: "Search coauthor | title | eli5 | outcome | doc text ..."


# Tab-button count rollups: the little N|N|N split on the Archive/Coauthor tab buttons (like the projects
# active/manuscript/idea one). Each segment = a bucket of type/chip keys; buckets are mutually exclusive and
# cover every card (a card lands in the FIRST bucket whose keys its type or one of its chips matches).
tab_split: { active: green, manuscript: amber, idea: violet }

tab_rollup:
  projects:
    - { label: "in progress", keys: [active, manuscript], color: "#16a34a" }
    - { label: idea,          keys: [idea],               color: "#7c5cff" }
  archive:
    - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
    - { label: outputs,       keys: [thesis, abstract, poster, tech-report, software], color: "#0ea5e9" }
    - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }
  coauthor:
    - { label: "in progress", keys: [submitted, in-prep, exploring],                   color: "#16a34a" }
    - { label: papers,        keys: [journal, conference],                             color: "#db2777" }
    - { label: outputs,       keys: [abstract, poster, tech-report, software],         color: "#0ea5e9" }
    - { label: dead-ends,     keys: [nogo, dropped, disproved, abandoned],             color: "#9ca3af" }


# Live-count badges on collection nav tabs: `match` = the entry statuses that count, `label` = the tooltip word.
# The badge takes the colour of the STATUS it counts (vocab.yml `status_palette:`), so `in prep` on the
# Funding tab is the same violet as an in-prep chip on a card. Set `tone:` to force an urgency class
# (`red` / `amber` / `green`) instead - used where a count means "act", not "here is how many".
nav_live:
  joint-work: { match: [exploring], label: exploring }
  funding:        { match: [in-prep, "in prep", submitted], label: undecided }
  education:      { match: [ongoing], label: ongoing }
  tasks:          { match: [todo, doing], label: open, tone: amber }


# Project-title label mode per surface - `short` = a manifest's `short:` if set, else the full title (NO id is
# ever shown); `full` = always the full title. Projects + Archive also have a live Aa toggle in the UI that
# overrides their default below (persisted per browser). The full title is always on hover.
focus_label_mode: short      # Focus board cards and the week's ticker lines

project_label_mode: short    # Projects tab cards / list rows (live Aa toggle overrides)

archive_label_mode: short    # Archive tab cards / list rows (live Aa toggle overrides)

map_label_mode: short        # Map tab nodes


# Hub documents in the view catalogue: one entry inside its group, listed after the group's views, opening the `doc` view over api/docs. `path` is relative to the research hub, `group` is a key of `nav_groups` above, and `label` is the tab's words. A path with no file there draws the view's own missing line.
docs:
  - { label: "Research approach", path: docs/RESEARCH-APPROACH.md, group: help }
  - { label: "Agent approach",    path: docs/AGENT-APPROACH.md,    group: help }
  - { label: "HPC how-to",        path: docs/HPC-UTwente-howto.md, group: help }
  - { label: "Data map",          path: docs/DATA-MAP.md,          group: help }
