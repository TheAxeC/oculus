# ===========================================================================
# sources.yml
# oculus's own configuration of what the portfolio reads: where the projects are, which registry, collection, document and feed file each surface is built from, and where a hub keeps its pictures. The folders files are served from are the folders of the open workspace. Which files open for editing is no key: the file's own first bytes say whether it is text, and its mode on this machine says whether it can be written. Merged with the other config/*.yml by loadConfig(); every key here is a top-level key of the merged map.
# The keys from scan to wallpaper_dir are the hub list: a hub's own .oculus/config/sources.yml replaces any of them whole, and the values here are the layout every research hub follows (the website folders are one hub's and are set in its layer).
# It also holds the map from a file name to the language the editor colours it in (languages).
# ===========================================================================


# Where to find projects: each `dir` is relative to the hub root. A project is any folder that holds a `project.yml` at its top or a `.oculus/project.yml`, at any depth under the `dir`; the walk stops at a project and does not enter a dot folder, `node_modules` or a symbolic link. The project's tier and type are the manifest's own `tier` and `type` lines, and its id is the folder's name. When a project lies deeper than one level, the first folder under the `dir` is its category.
scan:
  - { dir: projects/ideas }
  - { dir: side-projects, optional: true }   # optional; a hub without the folder reports nothing
  - { dir: projects/active }
  - { dir: projects/manuscripts }
  - { dir: projects/software, optional: true }   # optional; a hub without the folder reports nothing
  - { dir: projects/coauthor }
  - { dir: projects/archive }


# The folder a new project is made in, for each tier. The engine names none: a hub sets `new_project_dir` in its .oculus/config/sources.yml, a map from a tier (projects, coauthor, archive or personal) to a folder that is a scan folder or lies under one. A tier with no entry has no folder to offer, and a new project of it needs the folder given.
new_project_dir: {}


# The portfolio deck: the folder, relative to the hub, whose present.yml and Markdown slides the Present view opens when a pane names no deck. A project's deck is its own present/ folder and a custom deck is any folder, so this key names the one deck that belongs to the hub as a whole.
portfolio_deck: deck


# Venue catalogue: the Venues view, journals and conferences (registries/venues.yml).
venues_file: registries/venues.yml


# Dataset registry: the Data view, provenance and a recovery recipe per dataset (registries/data.yml). The projects that use a dataset come from the manifests' `datasets:`, and the re-downloader (tools/data/redownload.py) reads the same file.
datasets_file: registries/data.yml


# Pillars registry: the Pillars view, with membership computed from the manifests' `pillar:`, which names an entry's key.
pillars_file: registries/pillars.yml

# Domains registry: the Domains view, projects grouped by the manifests' `domain:`, which names an entry's key.
domains_file: registries/domains.yml


# People registry: one entry per human the hub names, also the People card list of the References page, where each person has a page and an editor. A project's `collaborators:` and `waiting-on:`, a joint-work entry's `person:` and the Person view all read a name from here. Exactly one entry carries `self: true`, the hub's owner, and `affiliations:` are keys of the organisations file below.
people_file: registries/people.yml

# Organisation registry, also the Organisations card list: the universities, hospitals, funders and companies that a person's `affiliations:` and a funding entry's `funder:` point at, so an organisation is named once.
organisations_file: registries/organisations.yml

# Resources registry, also the Resources card list: the clusters, machines and storage that a project's `compute:` and the `slurm.resource` of behavior.yml name by key.
resources_file: registries/resources.yml


# Collection views: one card list per key, from one YAML file each, except the keys data, venues, pillars and domains, whose views are Data, Venues, Pillars and Domains and not a card list. The schema is the file's own `schema:` block, and the links between files are in docs/DATA-MAP.md. Every entry has a page with an editor built from the schema, where it is edited and deleted, Add asks the new entry's name and opens that page, and an entry's status, deadline and date are also changed on its card. Edit in File opens the file at the entry.
collections:
  - { key: data,           file: "registries/data.yml" }
  - { key: venues,         file: "registries/venues.yml" }
  - { key: pillars,        file: "registries/pillars.yml" }
  - { key: domains,        file: "registries/domains.yml" }
  - { key: statements,     file: "registries/boilerplate.yml" }
  - { key: people,         file: "registries/people.yml" }
  - { key: organisations,  file: "registries/organisations.yml" }
  - { key: resources,      file: "registries/resources.yml" }
  - { key: funding,        file: "funding/funding.yml" }
  - { key: events,         file: "network/events.yml" }
  - { key: education,      file: "education/education.yml" }
  - { key: applications,   file: "applications/applications.yml" }
  - { key: joint-work,     file: "network/joint-work.yml" }
  - { key: tasks,          file: "tasks/tasks.yml" }


# Position Leads reads the scout's YAML as cards. Its search specification belongs to the research-cockpit skill.
leads_file: feeds/position-leads.yml


# Lit Watch reads the literature scout's accumulated radar. The refresh workflow deduplicates by URL and appends entries.
radar_file: feeds/literature-radar.yml

# Career strategy: the order of work, hosts, eligibility and dropped options live in registries/career.yml and are drawn by the Focus board's Career strategy panel. A funding entry's `statement:` shows on the Funding view.
career_file: registries/career.yml


# The folder of this hub's photo wall, relative to the hub and inside it. Every .jpg, .jpeg, .png and .webp in it is a tile of the Memories view, and the view's add control puts new pictures in the primary hub's folder, else in the first hub's when the workspace has no primary. A value outside the hub is a finding and the folder below is used.
memories_dir: .oculus/memories

# The folder of this hub's wallpaper images, relative to the hub and inside it. The `wallpaper.image` key of the primary hub's appearance.yml names one of them as `<hub name>/<file name>`, and the picker in the Settings view lists every hub's folder. A value outside the hub is a finding and the folder below is used.
wallpaper_dir: .oculus/wallpaper

# How many folder levels below each folder of the open workspace the Repositories view looks for repositories, 0 to 3.
repository_scan_depth: 1


# The language each file name opens in, which the editor, the code window and the status bar colour and name it by. One language per line, the editor's own lowercase name, then the endings it claims: an entry that starts with a dot is an extension (.py), any other entry is a whole file name compared lowercased (makefile, cmakelists.txt). A whole name is matched before an extension, and a file no entry matches, a dotfile included, opens as plain text. A language the editor does not colour is refused, and an ending two languages claim belongs to the first one listed.
languages:
  bash:          [.sh, .bash, .zsh, .slurm]
  bibtex:        [.bib]
  css:           [.css]
  diff:          [.diff, .patch]
  ini:           [.ini, .toml]
  javascript:    [.js, .jsx, .mjs, .cjs, .javascript]
  json:          [.json, .jsonc, .json5, .ipynb]
  julia:         [.jl, .julia]
  latex:         [.tex, .latex, .sty, .cls, .rnw, .jnw, .pnw]
  lisp:          [.lisp, .el, .scm]
  makefile:      [.mk, .mak, .make, .makefile, makefile]
  markdown:      [.md, .markdown, .mkdown, .mkd]
  matlab:        [.m, .matlab]
  ocaml:         [.ml, .mli, .ocaml]
  python:        [.py, .pyi, .gyp, .ipython, .python]
  r:             [.r]
  typescript:    [.ts, .tsx, .mts, .cts, .typescript]
  xml:           [.xml, .html, .xhtml, .rss, .atom, .xjb, .xsd, .xsl, .plist, .wsf, .svg]
  yaml:          [.yml, .yaml]
  plaintext:     [.txt, .text, .plaintext]
  c:             [.c, .i]
  cpp:           [.cpp, .cc, .cxx, .c++, .hpp, .hh, .hxx, .h++, .h, .ii, .ino, .inl, .ipp, .tpp]
  cmake:         [.cmake, cmakelists.txt]
  lua:           [.lua]
  ruby:          [.rb, .rbi, .rake, .gemspec, .podspec, .ru, gemfile, rakefile, podfile, vagrantfile]
  scss:          [.scss]
  java:          [.java, .jav]
  dart:          [.dart]
  fortran:       [.f90, .f95, .f03, .f08]
  fortran-fixed: [.f, .for, .f77]
  jinja:         [.jinja, .jinja2, .j2]
  svelte:        [.svelte]
  rite:          [.rite]
