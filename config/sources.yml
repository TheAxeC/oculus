# ===========================================================================
# sources.yml
# oculus's own configuration - what the portfolio reads: where the projects are, and which registry,
# collection, document and feed file each surface is built from, plus local roots and permitted text extensions. Merged with the other config/*.yml
# by loadConfig(); every key here is a top-level key of the merged map.
# ===========================================================================


# Where to find projects (paths relative to research/). A project is any subfolder that contains a
# project.yml; its tier/outcome comes from the LOCATION below (mirrored in the manifest). Folder == id.
scan:
  - { dir: projects/ideas,       type: idea,       tier: projects }
  - { dir: projects/active,      type: active,     tier: projects }
  - { dir: projects/manuscripts, type: manuscript, tier: projects }
  - { dir: projects/software,    type: software,   tier: software, optional: true }   # optional; a hub without the folder reports nothing
  - { dir: projects/coauthor,    nested: true, tier: coauthor }   # nested; type (the outcome) read from each manifest
  - { dir: projects/archive,     nested: true, tier: archive }    # nested; type (the outcome) read from each manifest


# Venue catalogue tab (Venues, in Collections) - journals + conferences (registries/venues.yml).
venues_file: registries/venues.yml


# Dataset registry tab (Data) - provenance + recovery recipe per dataset (registries/data.yml).
# `used_by:` ids cross-link to project cards; the re-downloader (tools/data/redownload.py) reads the same file.
datasets_file: registries/data.yml


# Programs registry -> the Programs tab (membership computed from manifests' `program:`). key must match.
programs_file: registries/programs.yml

# Domains tab (group projects by the `domain:` field -> application area). key matches a domain value.
domains_file: registries/domains.yml


# Collection tabs - a generic card list from one YAML (entries: title/sub/status/date/meta/tags/related/link/url/note).
# Schema: README.md. Files are editable in served mode. `related:` ids cross-link to project cards.
collections:
  - { key: data,           title: "Data",               file: "registries/data.yml" }
  - { key: venues,         title: "Venues",             file: "registries/venues.yml" }
  - { key: programs,       title: "Pillars",            file: "registries/programs.yml" }
  - { key: domains,        title: "Domains",            file: "registries/domains.yml" }
  - { key: statements,     title: "Statements",          icon: section, file: "registries/boilerplate.yml" }
  - { key: funding,        title: "Funding",             icon: funding, file: "funding/funding.yml" }
  - { key: events,         title: "Talks & Events",      icon: events, file: "network/events.yml" }
  - { key: education,      title: "Education & Service", icon: teaching, file: "education/education.yml" }
  - { key: applications,   title: "Applications",        icon: applications, file: "applications/applications.yml" }
  - { key: collaborations, title: "Collaborations",      icon: collab, file: "network/collaborations.yml" }
  - { key: tasks,          title: "Tasks & Service",     icon: tasks, file: "tasks/tasks.yml" }
  - { key: code,           title: "Code",                icon: code, file: "registries/repos.yml" }


# Inbox view: the private email triage feed, which never leaves this repo. The hub documents the rail offers are the `docs:` list of layout.yml, which names each one's group.
inbox_file: feeds/inbox.yml


# Auto-index tabs - a searchable file listing from a folder scan (no curation, no YAML).
# Shape: { key, title, icon, dir, ext: [".pdf"] }. Keep this an explicit [] when empty; a bare
# "indexes:" parses as null and page.py iterates it directly.
# Lit Watch reads research intelligence from feeds/literature-radar.yml; no PDF-library index is configured.
indexes: []


# Position Leads reads the scout's YAML as cards. Its search specification belongs to the research-cockpit skill.
leads_file: feeds/position-leads.yml


# Lit Watch reads the literature scout's accumulated radar. The refresh workflow deduplicates by URL and appends entries.
radar_file: feeds/literature-radar.yml

# Public website publications feed, cross-checked in the Audit tab (missing / leaked / wrong-section / untracked).
# Separate repo dir - if it is not checked out, the check is skipped silently.
publications_file: theaxec.github.io/_data/publications.yml

# LinkedIn tab: posts pipeline from the website (_linkedin/: numbered = posted, xx- = ideas).
linkedin_dir: theaxec.github.io/_linkedin

# Career tab: per-scheme `statement:` fields surface on the Funding tab; the strategy
# (order of work | hosts | eligibility | dropped) lives in CAREER.yml and surfaces on the Focus "Career strategy" panel.
career_file: CAREER.yml


# Text files the source tab may save, and the superset it may open (read-only unless editable).
editable_extensions: [".md", ".yml", ".yaml", ".tex", ".bib", ".txt"]
viewable_extensions: [".md", ".yml", ".yaml", ".tex", ".bib", ".txt", ".py", ".sh", ".slurm", ".json", ".csv", ".r", ".m", ".cpp", ".h", ".c", ".hpp", ".js", ".css", ".html", ".toml", ".cfg", ".ini", ".log"]


# Roots the server may serve local files from (api/file/<key>/<path>), one directory per key. A dir is
# absolute or starts with `~/`, which the server expands to the home directory, so this tracked file
# carries no user or machine path; a relative dir is a finding. Nothing outside a root is ever served:
# both ends are resolved through realpath and the file must sit inside the root, so a symlink pointing
# out of it serves nothing. A dir that is not on this machine is a finding on the Findings view and its
# root serves nothing. The bookmarks that open as tabs are the `bookmarks:` list in layout.yml, which
# names a root by its key here.
roots:
  - { key: cathedra,    dir: ~/workspace/cathedra }
  - { key: game-engine, dir: ~/workspace/game-engine }
