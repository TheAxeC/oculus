# ===========================================================================
# sources.yml
# oculus's own configuration - what the portfolio reads: where the projects are, and which registry,
# collection, document and feed file each surface is built from, plus the local roots files are served
# from. Which files open for editing is no key: the file's own first bytes say whether it is text, and
# its mode on this machine says whether it can be written. Merged with the other config/*.yml
# by loadConfig(); every key here is a top-level key of the merged map.
# It also holds the map from a file name to the language the editor colours it in (languages).
# ===========================================================================


# Where to find projects: each `dir` is relative to the hub root. A project is any subfolder that contains a project.yml; a flat rule gives every manifest its type, a nested rule reads the type from each manifest, and the folder name is the id.
scan:
  - { dir: projects/ideas,       type: idea,       tier: projects }
  - { dir: side-projects,        type: side-project, tier: personal, optional: true }   # the Personal board only; no research reader reads it
  - { dir: projects/active,      type: active,     tier: projects }
  - { dir: projects/manuscripts, type: manuscript, tier: projects }
  - { dir: projects/software,    type: software,   tier: software, optional: true }   # optional; a hub without the folder reports nothing
  - { dir: projects/coauthor,    nested: true, tier: coauthor }   # nested; type (the outcome) read from each manifest
  - { dir: projects/archive,     nested: true, tier: archive }    # nested; type (the outcome) read from each manifest


# The portfolio deck: the folder, relative to the hub, whose present.yml and Markdown slides the Present view opens when a pane names no deck. A project's deck is its own present/ folder and a custom deck is any folder, so this key names the one deck that belongs to the hub as a whole.
portfolio_deck: deck


# Venue catalogue: the Venues view, journals and conferences (registries/venues.yml).
venues_file: registries/venues.yml


# Dataset registry: the Data view, provenance and a recovery recipe per dataset (registries/data.yml). The projects that use a dataset come from the manifests' `datasets:`, and the re-downloader (tools/data/redownload.py) reads the same file.
datasets_file: registries/data.yml


# Pillars registry: the Pillars view, with membership computed from the manifests' `pillar:`, which names an entry's key.
pillars_file: registries/pillars.yml

# Domains registry: the Domains view, projects grouped by the manifests' `domain:`, which names an entry's key.
domains_file: registries/domains.yml


# People registry: one entry per human the hub names. A project's `collaborators:` and `waiting-on:`, a joint-work entry's `person:` and the Person view all read a name from here. Exactly one entry carries `self: true`, the hub's owner, and `affiliations:` are keys of the organisations file below.
people_file: registries/people.yml

# Organisation registry: the universities, hospitals, funders and companies that a person's `affiliations:` and a funding entry's `funder:` point at, so an organisation is named once.
organisations_file: registries/organisations.yml

# Resources registry: the clusters, machines and storage that a project's `compute:` and the `slurm.resource` of behavior.yml name by key.
resources_file: registries/resources.yml


# Collection views: one card list per key, from one YAML file each, except the keys data, venues, pillars and domains, whose views are Data, Venues, Pillars and Domains and not a card list. The schema is the file's own `schema:` block, and the links between files are in docs/DATA-MAP.md. An entry is added and edited in the file, which Add and Edit in File open, and its status, deadline and date are changed on its card.
collections:
  - { key: data,           file: "registries/data.yml" }
  - { key: venues,         file: "registries/venues.yml" }
  - { key: pillars,        file: "registries/pillars.yml" }
  - { key: domains,        file: "registries/domains.yml" }
  - { key: statements,     file: "registries/boilerplate.yml" }
  - { key: funding,        file: "funding/funding.yml" }
  - { key: events,         file: "network/events.yml" }
  - { key: education,      file: "education/education.yml" }
  - { key: applications,   file: "applications/applications.yml" }
  - { key: joint-work,     file: "network/joint-work.yml" }
  - { key: tasks,          file: "tasks/tasks.yml" }
  - { key: code,           file: "registries/repos.yml" }


# Position Leads reads the scout's YAML as cards. Its search specification belongs to the research-cockpit skill.
leads_file: feeds/position-leads.yml


# Lit Watch reads the literature scout's accumulated radar. The refresh workflow deduplicates by URL and appends entries.
radar_file: feeds/literature-radar.yml

# Public website publications feed, cross-checked in the Audit view (missing / leaked / wrong-section / untracked). It is a separate repository folder, and the check is skipped silently when it is not checked out.
publications_file: theaxec.github.io/_data/publications.yml

# LinkedIn view: the posts pipeline from the website (_linkedin/: numbered = posted, xx- = ideas).
linkedin_dir: theaxec.github.io/_linkedin

# Career strategy: the order of work, hosts, eligibility and dropped options live in registries/career.yml and are drawn by the Focus board's Career strategy panel. A funding entry's `statement:` shows on the Funding view.
career_file: registries/career.yml


# Roots the server may serve local files from (api/file/<key>/<path>), one directory per key. A dir is
# absolute or starts with `~/`, which the server expands to the home directory, so this tracked file
# carries no user or machine path; a relative dir is a finding. Nothing outside a root is ever served:
# both ends are resolved through realpath and the file must sit inside the root, so a symlink pointing
# out of it serves nothing. A dir that is not on this machine is a finding on the Findings view and its
# root serves nothing. The bookmarks that open as tabs are the entries of the reader's own
# ~/.oculus/bookmarks.yml, each naming a root by its key here.
roots:
  - { key: cathedra,    dir: ~/workspace/cathedra }
  - { key: game-engine, dir: ~/workspace/game-engine }
  - { key: ordo,        dir: ~/workspace/ordo }
  - { key: scotoma,     dir: ~/workspace/scotoma }
  - { key: officium,    dir: ~/workspace/officium }
  - { key: youtube-downloader, dir: ~/workspace/youtube-downloader }
# How many folder levels below each root the Repositories view looks for repositories, 0 to 3.
repository_scan_depth: 1


# The language each file name opens in, which the editor, the code window and the status bar colour and name it by. One language per line, the editor's own lowercase name, then the endings it claims: an entry that starts with a dot is an extension (.py), any other entry is a whole file name compared lowercased (makefile, cmakelists.txt). A whole name is matched before an extension, and a file no entry matches, a dotfile included, opens as plain text. A language the editor does not colour is refused, and an ending two languages claim belongs to the first one listed.
languages:
  bash:          [.sh, .bash, .zsh, .slurm]
  css:           [.css]
  diff:          [.diff, .patch]
  ini:           [.ini, .toml]
  javascript:    [.js, .jsx, .mjs, .cjs, .javascript]
  json:          [.json, .jsonc, .json5, .ipynb]
  julia:         [.jl, .julia]
  latex:         [.tex, .latex, .bib, .sty, .cls, .rnw, .jnw, .pnw]
  lisp:          [.lisp, .el, .scm]
  makefile:      [.mk, .mak, .make, .makefile, makefile]
  markdown:      [.md, .markdown, .mkdown, .mkd]
  matlab:        [.m, .matlab]
  ocaml:         [.ml, .mli, .ocaml]
  python:        [.py, .pyi, .gyp, .ipython, .python]
  r:             [.r]
  typescript:    [.ts, .tsx, .mts, .cts, .typescript]
  xml:           [.xml, .html, .xhtml, .rss, .atom, .xjb, .xsd, .xsl, .plist, .wsf, .svg]
  yaml:          [.yml, .yaml]
  plaintext:     [.txt, .text, .plaintext]
  c:             [.c, .i]
  cpp:           [.cpp, .cc, .cxx, .c++, .hpp, .hh, .hxx, .h++, .h, .ii, .ino, .inl, .ipp, .tpp]
  cmake:         [.cmake, cmakelists.txt]
  lua:           [.lua]
  ruby:          [.rb, .rbi, .rake, .gemspec, .podspec, .ru, gemfile, rakefile, podfile, vagrantfile]
  scss:          [.scss]
  java:          [.java, .jav]
  dart:          [.dart]
  fortran:       [.f90, .f95, .f03, .f08]
  fortran-fixed: [.f, .for, .f77]
  jinja:         [.jinja, .jinja2, .j2]
  svelte:        [.svelte]
  rite:          [.rite]
