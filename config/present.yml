                      project: 'BT-FNO, block-term neural operator',
                      mechanism: 'Mixture of block-term experts (MoBTE)',
                      headline: 'MoBTE -60% error vs CP (6-PDE)'
                  }
                - {
                      field: 'Methods',
                      color: '#ea580c',
                      project: 'BT Operator Theory, why it generalizes',
                      mechanism: 'Inductive-bias and generalization-gap account',
                      headline: 'Gen-gap CP .029 to BT .019 to MoBTE .012 (predicted)'
                  }
            foot: 'Spanning hepatology, privacy-preserving learning, cardiology and ML methods, unified by structured, interpretable tensor models.'
        summary2:
            title: 'The wider portfolio, at a glance'
            rows:
                - {
                      field: 'Brain',
                      color: '#7c3aed',
                      project: 'BTTD, source-reconstructed EEG',
                      mechanism: 'Lead-field-constrained sparse BTD',
                      headline: 'Time-course corr 0.93 | 13.4 mm focal'
                  }
                - {
                      field: 'Heart | ECG',
                      color: '#e2374d',
                      project: 'Dries, AF substrate in normal ECG',
                      mechanism: 'Supervised glass-box BTTR',
                      headline: '0.718 vs 0.631 clinical, p=0.002'
                  }
                - {
                      field: 'Heart | ECG',
                      color: '#e2374d',
                      project: 'Dongho, ECG representation benchmark',
                      mechanism: 'Chance-corrected ARI, 5 arms',
                      headline: 'Hand-crafted 0.71 vs foundation 0.19'
                  }
                - {
                      field: 'Immuno',
                      color: '#2563eb',
                      project: 'Federated multicellular tensor',
                      mechanism: 'Stacked-SVD = centralized',
