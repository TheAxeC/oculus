# Venue catalogue -> the Venues tab. A project points at one by `venue_id:`.
schema:
  - { field: id,       type: text, required: true }
  - { field: name,     type: text, required: true }
  - { field: tier,     type: select, options: [flagship, strong, specialist] }
  - { field: category, type: select, options: [journal, conference] }
entries:
  - id: jmlr
    name: Journal of Machine Learning Research
    tier: strong
    category: journal
  - id: tmlr
    name: Transactions on Machine Learning Research
    tier: specialist
    category: journal
  - id: neurips
    name: NeurIPS
    tier: flagship
    category: conference
  - id: iclr
    name: ICLR
    tier: flagship
    category: conference
  - id: kdd
    name: ACM SIGKDD
    tier: strong
    category: conference
