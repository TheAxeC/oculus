# Tasks & Service - standing to-dos, reviews, admin, service (FAKE example data). Dated tasks surface on the
# Focus "This week" ticker. Edit in served mode on the Tasks & Service tab.
title: Tasks & Service
intro: "Standing tasks: reviews, admin, service. A `deadline:` surfaces it on the Focus ticker; a `followup:` note goes to the Follow-ups group."
schema:
  - { field: title,    type: text,     required: true }
  - { field: status,   type: select,   options: [todo, doing, done, dropped], required: true }
  - { field: deadline, type: date }
  - { field: kind,     type: text,     help: "e.g. review / admin / service / teaching" }
  - { field: note,     type: textarea }
  - { field: tags,     type: tags }
  - { field: followup, type: text, help: "a standing reminder -> the Follow-ups group" }

entries:
  - title: "Review 2 papers for MLShift Workshop"
    status: doing
    deadline: "2026-07-30"
    kind: review
    tags: [review]

  - title: "Renew compute allocation"
    status: todo
    deadline: "2026-08-15"
    kind: admin

  - title: "Update the lab wiki onboarding page"
    status: todo
    kind: service
    followup: "after the new student starts in September"
