# People - one entry per human the hub names: a person a project's `lead:`, `collaborators:` or `waiting-on:` points at, a student whose supervision folder is under education/, and the user, whom the key `self` of the primary hub's `.oculus/local.yml` names. A person's facts live here and nowhere else, so a name is written once and every card, tag and map node that draws one reads it from this file.
# `affiliations:` are keys of .oculus/data/people/organisations.yml, never free strings, the primary first.

schema:
  - { field: key,          type: text,     primary_key: true, required: true, label: "Person key" }
  - { field: name,         type: text,     display: 1, required: true }
  - { field: affiliations, type: tags,     help: "organisations.yml keys, the primary first" }
  - { field: role,         type: text,     help: "what this person is to the hub" }
  - { field: orcid,        type: text }
  - { field: email,        type: text }
  - field: links
    type: records
    help: "The person's addresses on the web, one row each."
    fields:
      - { field: name,   type: text, required: true, help: "The name of the address, such as github or homepage." }
      - { field: url,    type: text, required: true, help: "The full address." }
      - { field: handle, type: text, help: "The account name a CV prints in place of the address, where it prints one." }
  - { field: work,         type: text,     help: "What the work with the person is about." }
  - { field: tags,         type: tags,     help: "Words that describe the person and the work with them." }
  - { field: note,         type: textarea, help: "Free notes on the person and the work with them." }
  - { field: folder,       type: text,     help: "hub-relative folder of a student's supervision files" }

entries:
