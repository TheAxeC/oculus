# People - one entry per human the hub names: a person a project's `lead:`, `collaborators:` or `waiting-on:` points at, a student whose supervision folder is under education/, and the user of a workspace that names them `self`. A person's facts live here and nowhere else, so a name is written once and every card, tag and map node that draws one reads it from this file.
# `affiliations:` are keys of .oculus/data/people/organisations.yml, never free strings, the primary first.

schema:
  - { field: key,          type: text,     required: true, label: "Person key" }
  - { field: name,         type: text,     required: true }
  - { field: affiliations, type: tags,     help: "organisations.yml keys, the primary first" }
  - { field: role,         type: text,     help: "what this person is to the hub" }
  - { field: orcid,        type: text }
  - { field: email,        type: text }
  - { field: links,        type: tags }
  - { field: folder,       type: text,     help: "hub-relative folder of a student's supervision files" }

entries:
  - key: "rivera-lab"
    name: "Ana Rivera"
    affiliations: ["northwood-university"]
    role: "co-supervisor (streaming systems)"

  - key: "chen-graph"
    name: "Wei Chen"
    affiliations: ["meridian-institute"]
    role: "co-author (graph transfer)"

  - key: "dana-example"
    name: "Dr. Dana Example"
    affiliations: ["northwood-university"]
    role: "principal investigator"

  - key: "b-coauthor"
    name: "B. Coauthor"
    role: "co-author (graph transfer, bandits and the toolkit)"

  - key: "c-senior"
    name: "C. Senior"
    role: "senior co-author (sparse attention, the early benchmark)"

  - key: "b-colleague"
    name: "B. Colleague"
    role: "lead of the spectral clustering collaboration"
