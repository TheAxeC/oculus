# Funding pipeline -> the Funding tab. One entry per application or funded programme.
# Each entry has a `key`, unique in this file, which a new entry needs; a manifest's `funding:` tag names it.
title: Funding
schema:
  - { field: key,       type: text, primary_key: true, required: true, section: Core, help: "funding: tag the projects use" }
  - { field: title,     type: text,   display: 1, required: true, section: Core }
  - { field: sub,       type: text,   section: Core, help: "Scheme | role | period" }
  - { field: status,    type: select, options: [in-prep, planned, submitted, awarded, rejected], required: true, section: Core }
  - { field: date,      type: text,   section: Dates, help: "Year or range" }
  - { field: deadline,  type: date, section: Dates }
  - { field: meta,      type: metalist, section: Core }
  - { field: tags,      type: tags, section: Core }
  - { field: note,      type: textarea, section: Content }
entries:
  - title: Early-Career Fellowship
    sub: "National science fund | personal grant | 3 years"
    status: in-prep
    date: "2026"
    deadline: "2026-10-01"
    meta:
      - { label: Scheme, value: "ECF - personal" }
      - { label: Host, value: "Example University" }
    tags: [fellowship, graphs]
    key: ecf
    note: "Interpretable transfer learning across graph domains. Two case studies."
  - key: open-data-infrastructure-grant
    title: Open-Data Infrastructure Grant
    sub: "Consortium | co-applicant | 2 years"
    status: rejected
    date: "2025"
    meta:
      - { label: Outcome, value: "not funded (resubmit 2026)" }
    tags: [infrastructure]
