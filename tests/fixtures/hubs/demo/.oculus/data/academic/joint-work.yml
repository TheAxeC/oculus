# Joint work - one entry per piece of work with one person, and the pipeline it is in. Who the person
# is lives in .oculus/data/people/people.yml; this file holds only the work, and `person:` names whom it is
# with. A project's `collaborators:` names people keys, not entries of this file.
# `related:` ids cross-link to the project cards the work feeds.
title: Joint work
intro: "The work I have going with each person, and where it stands. Who each person is lives in the people registry; status = exploring / active / completed."
# Form schema: field -> type / options / required / help. Drives the add/edit modal.
schema:
  - { field: key,    type: text,     help: "short slug for this piece of work" }
  - { field: title,  type: text,     required: true, help: "what the work is, not who it is with" }
  - { field: person, type: select,   from: people, required: true, help: "The person's key in the people registry." }
  - { field: status, type: select,   options: [exploring, active, completed], required: true }
  - { field: meta,   type: metalist }
  - { field: tags,   type: tags }
  - { field: note,   type: textarea }
  - { field: deadline, type: date }
  - { field: followup, type: text, help: "a standing reminder" }

entries:
  - key: "rivera-lab"
    title: "Streaming systems, the anomaly-detection benchmark"
    person: "rivera-lab"
    status: "active"
    meta:
      - { label: "Since", value: "2025" }
    tags: [streaming, systems]
    note: "Co-supervises the streaming-anomaly project; shared benchmark harness."

  - key: "chen-graph"
    title: "Graph learning, the transfer and bandits line"
    person: "chen-graph"
    status: "exploring"
    meta:
      - { label: "Topic", value: "graph transfer" }
    tags: [graphs, exploratory]
    note: "Early conversations about a joint workshop paper."
