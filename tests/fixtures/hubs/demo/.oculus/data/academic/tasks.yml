# Tasks - standing to-dos, reviews, admin, service (FAKE example data). Dated tasks surface on the
# Focus "This week" ticker. Edit in served mode on the Tasks tab.
# Each entry has a `key`, its short name, unique in this file; a write and Edit in File address the entry by it.
title: Tasks
schema:
  - { field: key, type: text, primary_key: true, required: true, section: Core, help: "The task's short name, unique in this file; a write and Edit in File address the entry by it." }
  - { field: title,    type: text,     display: 1, required: true, section: Core }
  - { field: status,   type: select,   options: [todo, doing, done, dropped], required: true, section: Core }
  - { field: deadline, type: date, section: Dates }
  - { field: kind,     type: text,     section: Core, help: "e.g. review / admin / service / teaching" }
  - { field: note,     type: textarea, section: Content }
  - { field: tags,     type: tags, section: Core }

entries:
  - key: review-2-papers-for-mlshift-workshop
    title: "Review 2 papers for MLShift Workshop"
    status: doing
    deadline: "2026-07-30"
    kind: review
    tags: [review]

  - key: renew-compute-allocation
    title: "Renew compute allocation"
    status: todo
    deadline: "2026-08-15"
    kind: admin

  - key: update-the-lab-wiki-onboarding-page
    title: "Update the lab wiki onboarding page"
    status: todo
    kind: service
    followup:
      - { do: after the new student starts in September }
