# Job applications -> the Applications tab.
# Each entry has a `key`, its short name, unique in this file; a write and Edit in File address the entry by it.
title: Applications
schema:
  - { field: key, type: text, primary_key: true, required: true, section: Core, help: "The application's short name, unique in this file; a write and Edit in File address the entry by it." }
  - { field: title,  type: text,   display: 1, required: true, section: Core }
  - { field: sub,    type: text, section: Core }
  - { field: status, type: select, options: [in-prep, applied, rejected, declined, withdrawn], section: Core }
  - { field: when,   type: period, section: Dates, help: "When you applied: a year, a month or a day." }
  - { field: url,    type: text, section: Core }
entries:
  - key: assistant-professor-ml
    title: Assistant Professor, ML
    sub: Example University
    status: applied
    when: "2026-02"
  - key: postdoc-graph-learning
    title: Postdoc, graph learning
    sub: Research Institute
    status: declined
    when: "2025-11"
